---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: |
          (?x)^(
            flux/manifests/.*/authentik-blueprint(-cleanup)?\.yaml|
            flux/manifests/.*/authentik/blueprints/.*\.yaml|
            helm/.*/templates/.*\.yaml|
            flux/manifests/.*/recyclarr\.yml|
            mkdocs\.yml
          )$
      - id: check-merge-conflict
      - id: detect-private-key
        # Vendored tenzir doc skills (.agents/skills) are upstream bytes
        # re-copied from the pinned upstream commit — decrypt_hpke.md ships
        # PEM-format prose (a literal private-key header as input-format
        # documentation). Byte-identity wins over the hook; gitleaks still
        # scans every vendored file.
        exclude: ^flux/manifests/03-services/observability/tenzir/\.agents/skills/
      # webui payload is byte-frozen (hash-verified syncs from scratch; the
      # vendored marked/purify pin upstream jsdelivr bytes that ship without
      # a trailing newline) — appending one breaks the sha pins in
      # test_dashboard.py. Same rationale as the .prettierignore exemption.
      - id: end-of-file-fixer
        # Vendored tenzir doc skills (.agents/skills) are upstream bytes
        # re-copied from the pinned upstream commit — appending a final
        # newline breaks byte-identity. Same discipline as the detection-rule
        # trees below.
        exclude: ^flux/manifests/04-apps/artificial-intelligence/prime-agent/agent/extensions/webui/|^flux/manifests/03-services/observability/tenzir/(detections/(sigma/sigmahq|yara/signature-base)|\.agents/skills/(tenzir|tenzir-ocsf))/
      - id: trailing-whitespace
        # Vendored detection rules are upstream bytes re-copied from pinned
        # submodules; reformatting breaks byte-identity with the gitlink.
        # Same for the vendored tenzir doc skills (.agents/skills).
        exclude: ^flux/manifests/03-services/observability/tenzir/(detections/(sigma/sigmahq|yara/signature-base)|\.agents/skills/(tenzir|tenzir-ocsf))/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.1.0

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
        exclude: |
          (?x)^(
            helm/.*/templates/.*\.yaml
          )$

  - repo: https://github.com/stackrox/kube-linter
    rev: v0.8.3
    hooks:
      - id: kube-linter
        files: ^flux/.*\.(yaml|yml)$
        # Directory lint so cross-object checks (e.g. ServiceAccount refs) see
        # the full set. Filename batches miss siblings and false-fail.
        args: ["--config", ".kube-linter.yaml", "flux/"]
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^\.cursor/hooks/.*\.py$
      - id: ruff-format
        files: ^\.cursor/hooks/.*\.py$

  - repo: local
    hooks:
      - id: context-links
        name: context links
        entry: python3 .agents/skills/reconcile-context/scripts/check_links.py
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|CLAUDE\.md|\.agents/.*\.md)$
        stages: [pre-commit, pre-push]
