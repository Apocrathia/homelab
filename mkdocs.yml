---
site_name: Homelab
site_url: https://apocrathia.gitlab.io/homelab/
site_description: Kubernetes cluster documentation and security metrics
site_author: Ian Young

repo_url: https://gitlab.com/Apocrathia/homelab
repo_name: Apocrathia/homelab

docs_dir: docs
site_dir: public
use_directory_urls: false

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Cluster Bootstrap: talos-README.md
      - Flux Setup: flux-README.md
      - Generic App Chart: helm-generic-app-README.md
  - Layers:
      - Bootstrap: flux-manifests-01-bootstrap-README.md
      - Infrastructure: flux-manifests-02-infrastructure-README.md
      - Services: flux-manifests-03-services-README.md
      - Apps: flux-manifests-04-apps-README.md
  - Security:
      - Overview: scorecard.md
      - Latest Results: scorecard-details.md
  - Reference:
      - Terraform: terraform-README.md
      - GitLab CI: gitlab-README.md
