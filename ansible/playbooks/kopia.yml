---
- name: Configure kopia backups
  hosts: kopia
  gather_facts: true
  become: true
  roles:
    - role: kopia
      # Shared repository: one repo password for the whole lab, hosts' own S3
      # user for the kopia bucket. Both from 1Password — nothing secret in Git.
      kopia_repo_password: "{{ lookup('community.general.onepassword', 'kopia-secrets', field='repo-password') }}"
      kopia_s3_access_key: "{{ lookup('community.general.onepassword', 'kopia-secrets', field='access-key-id') }}"
      kopia_s3_secret_key: "{{ lookup('community.general.onepassword', 'kopia-secrets', field='access-key-secret') }}"
