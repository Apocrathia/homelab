# Aggregator — import thinner playbooks. Prefer targeting a single playbook
# or `--limit` from CI when touching one host class.
- name: Site — common baseline
  ansible.builtin.import_playbook: common.yml

- name: Site — kopia backups
  ansible.builtin.import_playbook: kopia.yml

- name: Site — game host
  ansible.builtin.import_playbook: game.yml
