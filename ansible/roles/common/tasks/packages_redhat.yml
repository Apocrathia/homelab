---
- name: Install common packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present

- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  when: common_unattended_upgrades | bool

- name: Ensure dnf-automatic timer is enabled
  ansible.builtin.service:
    name: dnf-automatic.timer
    enabled: true
    state: started
  when: common_unattended_upgrades | bool
