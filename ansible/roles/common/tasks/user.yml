---
- name: Ensure primary user exists
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /bin/zsh
    groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
    append: true
    create_home: true
    state: present

- name: Ensure user .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ username }}/.ssh"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"

- name: Authorize GitHub user keys
  ansible.posix.authorized_key:
    user: "{{ username }}"
    key: "https://github.com/{{ github_username }}.keys"
    state: present
    exclusive: false
  when: common_fetch_github_keys | bool

- name: Allow passwordless sudo for primary user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ username }}"
    mode: "0440"
    owner: root
    group: root
    content: |
      {{ username }} ALL=(ALL) NOPASSWD:ALL
    validate: "visudo -cf %s"
  when: common_passwordless_sudo | bool

- name: Check for existing oh-my-zsh install
  ansible.builtin.stat:
    path: "/home/{{ username }}/.oh-my-zsh"
  register: common_omz_dir

- name: Install oh-my-zsh (clone-only; never touches an existing install)
  # Runs as root (play become): becoming an unprivileged user needs setfacl on
  # the host, which check-mode CI cannot bootstrap — clone then chown instead.
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "/home/{{ username }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false
  when:
    - common_manage_zsh | bool
    - not common_omz_dir.stat.exists

- name: Hand fresh oh-my-zsh clones to the primary user
  ansible.builtin.file:
    path: "/home/{{ username }}/.oh-my-zsh"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    recurse: true
  when:
    - common_manage_zsh | bool
    - not common_omz_dir.stat.exists

- name: Check for existing powerlevel10k install
  ansible.builtin.stat:
    path: "/home/{{ username }}/.oh-my-zsh/custom/themes/powerlevel10k"
  register: common_p10k_dir

- name: Install powerlevel10k (clone-only; never touches an existing install)
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "/home/{{ username }}/.oh-my-zsh/custom/themes/powerlevel10k"
    version: master
    depth: 1
    update: false
  when:
    - common_manage_zsh | bool
    - not common_p10k_dir.stat.exists

- name: Hand fresh powerlevel10k clones to the primary user
  ansible.builtin.file:
    path: "/home/{{ username }}/.oh-my-zsh/custom/themes/powerlevel10k"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    recurse: true
  when:
    - common_manage_zsh | bool
    - not common_p10k_dir.stat.exists

- name: Manage .zshrc (operator environment; personal bits in ~/.zshrc.local)
  ansible.builtin.copy:
    src: zshrc
    dest: "/home/{{ username }}/.zshrc"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
  when: common_manage_zsh | bool

- name: Seed .p10k.zsh (create-only; p10k configure re-runs stay local)
  ansible.builtin.copy:
    src: p10k
    dest: "/home/{{ username }}/.p10k.zsh"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    force: false
  when: common_manage_zsh | bool

- name: Ensure ansible service account exists
  ansible.builtin.user:
    name: "{{ common_ansible_account }}"
    shell: /bin/bash
    password_lock: true
    create_home: true
    state: present

- name: Ensure service account .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ common_ansible_account }}/.ssh"
    state: directory
    owner: "{{ common_ansible_account }}"
    group: "{{ common_ansible_account }}"
    mode: "0700"

- name: Authorize GitOps deploy key for service account
  ansible.posix.authorized_key:
    user: "{{ common_ansible_account }}"
    key: "{{ common_ansible_account_pubkey }}"
    path: "/home/{{ common_ansible_account }}/.ssh/authorized_keys"
    state: present
    exclusive: true

- name: Allow passwordless sudo for service account
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ common_ansible_account }}"
    mode: "0440"
    owner: root
    group: root
    content: |
      {{ common_ansible_account }} ALL=(ALL) NOPASSWD:ALL
    validate: "visudo -cf %s"
