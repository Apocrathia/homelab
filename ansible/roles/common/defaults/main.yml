---
# Overridable defaults; prefer inventory/group_vars for site-wide values.
common_unattended_upgrades: true
common_manage_hostname: true
common_manage_timezone: true
common_fetch_github_keys: true
# Humans keep passworded sudo; the ansible service account has its own
# NOPASSWD sudoers entry.
common_passwordless_sudo: false
# Automation service account: repo is the source of truth for its authorized
# key (exclusive), so an empty pubkey fails loudly rather than half-managing.
common_ansible_account: ansible
common_ansible_account_pubkey: ""
# Host-specific additions to common_packages (see host_vars/).
common_packages_extra: []
# Static L3 config (see tasks/network.yml). Empty = host keeps its current
# network management (typically installer DHCP).
common_network_interfaces: []
# DNS for hosts with static interfaces. Required when the list is non-empty.
common_network_dns:
  servers: []
  search: []
