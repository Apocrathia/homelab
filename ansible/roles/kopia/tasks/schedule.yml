---
# Snapshot runs as a one-shot systemd service on a timer — inspectable with
# journalctl and systemctl, no kopia daemon. Paths are explicit (bootstrap-
# safe: `--all` only lists sources with existing snapshots, so a fresh host
# would find nothing on its first run). Maintenance is owned elsewhere in the
# lab; hosts never run maintenance.
- name: Install kopia snapshot service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/kopia-snapshot.service
    mode: "0644"
    content: |
      [Unit]
      Description=Kopia snapshot run (this host's sources)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      EnvironmentFile=/etc/kopia/snapshot.env
      # systemd oneshot units run without HOME; kopia resolves its config from
      # HOME/.config/kopia and reports "repository is not connected" when it is
      # unset. Pin the config path explicitly.
      ExecStart=/usr/bin/kopia --config-file=/root/.config/kopia/repository.config snapshot create {{ kopia_backup_paths | join(' ') }}
      Nice=10
      IOSchedulingClass=idle
  register: kopia_snapshot_unit

- name: Install kopia snapshot timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/kopia-snapshot.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Nightly kopia snapshot run

      [Timer]
      OnCalendar={{ kopia_schedule_oncalendar }}
      RandomizedDelaySec={{ kopia_schedule_randomized_delay }}
      Persistent=true

      [Install]
      WantedBy=timers.target
  register: kopia_snapshot_timer_unit

- name: Enable and start kopia snapshot timer
  ansible.builtin.systemd_service:
    name: kopia-snapshot.timer
    enabled: true
    state: started
    daemon_reload: "{{ not ansible_check_mode }}"
  # In check mode the unit files are only reported, never written — the
  # service cannot be found yet, so skip the systemd call entirely.
  when: not ansible_check_mode
