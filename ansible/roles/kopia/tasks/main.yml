---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - kopia_repo_password | length > 0
      - kopia_s3_access_key | length > 0
      - kopia_s3_secret_key | length > 0
      - kopia_backup_paths | length > 0
    fail_msg: >-
      kopia role requires non-empty kopia_repo_password, kopia_s3_access_key,
      and kopia_s3_secret_key (playbook supplies via 1Password — a missing
      item field resolves to an empty string and must NOT reach kopia) and a
      non-empty kopia_backup_paths (host_vars).

- name: Install kopia
  ansible.builtin.import_tasks: install.yml
  tags:
    - kopia
    - packages

- name: Configure repository
  ansible.builtin.import_tasks: repository.yml
  tags:
    - kopia

- name: Configure backup policy
  ansible.builtin.import_tasks: policy.yml
  tags:
    - kopia

- name: Configure snapshot schedule
  ansible.builtin.import_tasks: schedule.yml
  tags:
    - kopia
