---
# Retention per source path. The shared repo's GLOBAL policy is owned
# elsewhere in the lab — hosts never touch --global.
- name: Set retention policy on backup paths
  ansible.builtin.command:
    cmd: >-
      kopia policy set {{ item }}
      --keep-daily {{ kopia_keep_daily }}
      --keep-weekly {{ kopia_keep_weekly }}
      --keep-monthly {{ kopia_keep_monthly }}
  when: not ansible_check_mode
  register: kopia_policy_paths
  changed_when: "'updated' in kopia_policy_paths.stdout or 'created' in kopia_policy_paths.stdout"
  loop: "{{ kopia_backup_paths }}"
  loop_control:
    label: "{{ item }}"
