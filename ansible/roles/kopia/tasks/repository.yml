---
# Shared-repository design: hosts connect to the SAME repository the rest of
# the lab uses. Runs as root; kopia keeps its config in /root/.config/kopia.
# Credentials pass via environment, never argv or files.
- name: Check for existing repository connection
  ansible.builtin.command:
    cmd: kopia repository status --json
  register: kopia_repo_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure /etc/kopia directory
  ansible.builtin.file:
    path: /etc/kopia
    state: directory
    owner: root
    group: root
    mode: "0700"

# kopia never persists the repo password in its config (by design): every
# invocation needs KOPIA_PASSWORD. The systemd snapshot service reads this
# file; 0600 root-only keeps it off the unit file (world-readable) and Git.
- name: Write kopia environment file for the snapshot service
  ansible.builtin.copy:
    dest: /etc/kopia/snapshot.env
    owner: root
    group: root
    mode: "0600"
    content: |
      KOPIA_PASSWORD={{ kopia_repo_password }}
  no_log: true

- name: Connect to the shared repository
  ansible.builtin.command:
    cmd: >-
      kopia repository connect s3
      --endpoint={{ kopia_s3_endpoint }}
      --region={{ kopia_s3_region }}
      --bucket={{ kopia_s3_bucket }}
      --disable-tls
  environment:
    KOPIA_PASSWORD: "{{ kopia_repo_password }}"
    AWS_ACCESS_KEY_ID: "{{ kopia_s3_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ kopia_s3_secret_key }}"
  register: kopia_repo_connect
  when:
    - kopia_repo_status.rc != 0
    - not ansible_check_mode
  changed_when: kopia_repo_connect.rc == 0
  no_log: true
