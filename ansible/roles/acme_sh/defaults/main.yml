---
# One domain per host (this role is single-site; nginx_site consumes the
# output). Empty fails loudly — see tasks.
acme_sh_domain: ""

# Issuer + account
acme_sh_account_email: ""
# acme.sh defaults to ZeroSSL since v3.0 — pin Let's Encrypt (operator rule).
acme_sh_server: letsencrypt

# DNS-01 provider (acme.sh dnsapi script name without dns_ prefix).
acme_sh_dns_provider: cf

# Cloudflare scoped API token. Never a default: CI injects it from the
# cloudflare-api-token 1Password item via ci/fetch_op_secrets.py
# (-e @op_secrets.json); local runs pass -e acme_sh_cf_token=...
acme_sh_cf_token: ""

# Where acme.sh lives
acme_sh_src: /usr/local/src/acme.sh
acme_sh_git_version: master

# Where certs land for the vhost to reference
acme_sh_cert_dir: /etc/ssl/ansible

# Reload command baked into the renewal (acme.sh re-runs install-cert with
# this on every renewal via its own cronjob)
acme_sh_reloadcmd: "service nginx reload"
