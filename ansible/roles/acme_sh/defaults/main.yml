---
# One domain per host (this role is single-site; nginx_site consumes the
# output). Empty fails loudly — see tasks.
acme_sh_domain: ""

# Extra SANs on the issued certificate (the cert file/key stay named
# after acme_sh_domain, the first -d; acme.sh remembers SANs at renew).
acme_sh_san_domains: []

# Issuer + account
acme_sh_account_email: ""
# acme.sh defaults to ZeroSSL since v3.0 — pin Let's Encrypt (operator rule).
acme_sh_server: letsencrypt

# DNS-01 provider (acme.sh dnsapi script name without the dns_ prefix;
# the role adds it: --dns dns_cf).

# Fixed sleep before CA validation, skipping acme.sh's public TXT check
# (cloudflare-dns.com DoH is blocked on this network — see tasks/main.yml).
acme_sh_dnssleep: 120
acme_sh_dns_provider: cf

# Cloudflare scoped API token. Never a default: CI injects it from the
# cloudflare-api-token 1Password item via ci/fetch_op_secrets.py
# (-e @op_secrets.json); local runs pass -e acme_sh_cf_token=...
acme_sh_cf_token: ""

# Where acme.sh lives
acme_sh_src: /usr/local/src/acme.sh
acme_sh_git_version: master

# Where certs land for the vhost to reference
acme_sh_cert_dir: /etc/ssl/ansible

# Reload command baked into the renewal (acme.sh re-runs install-cert with
# this on every renewal via its own cronjob). Guards on the nginx binary:
# on a first run the cert lands BEFORE nginx_site installs nginx, and the
# reload would fail the apply; renewals find nginx present and reload it.
acme_sh_reloadcmd: "[ -x /usr/sbin/nginx ] && service nginx reload || true"
