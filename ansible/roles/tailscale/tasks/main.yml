---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download Tailscale upstream GPG key (armored)
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.asc
    dest: /tmp/tailscale-archive-keyring.asc
    mode: "0644"

- name: Dearmor Tailscale GPG key into the keyring
  # deb822 Signed-By needs a binary (dearmored) keyring; saving the .asc
  # directly leaves apt unable to verify the repo signature
  # (NO_PUBKEY 458CA832957F5868). Runs every time: cheap, self-heals a
  # corrupt keyring (like the one the armored download left behind), and
  # picks up key rotations with the repo definition.
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /usr/share/keyrings/tailscale-archive-keyring.gpg /tmp/tailscale-archive-keyring.asc
  register: tailscale_dearmor
  changed_when: tailscale_dearmor.rc == 0

- name: Add Tailscale apt repo (deb822)
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/debian
    suites: [bookworm]
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

# Check mode: deb822_repository reports changed without writing the repo
# file, so the tailscale package is not yet visible to apt — skip rather
# than fail ("No package matching 'tailscale' is available").
# No cache_valid_time: earlier apt tasks in this play refresh the cache,
# which would make update_cache skip here even when the repo above just
# changed — the package list would never be fetched (relay diagnosis
# from the kopia session, confirmed by the 18:39 apply).
- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: not ansible_check_mode

# Check mode: the apt task above does not install tailscale, so the service
# does not exist yet on a fresh host — skip rather than fail.
- name: Enable tailscaled
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started
  when: not ansible_check_mode

# Read tasks always execute (check_mode: false) so their registers carry real
# data; they tolerate the binary being absent on a first run in --check (apt
# above did not install it), which reports rc != 0 rather than failing.
- name: Read current login status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  check_mode: false
  failed_when: false

- name: Parse login status
  ansible.builtin.set_fact:
    tailscale_state: >-
      {{ (tailscale_status.stdout | from_json).get('BackendState', '')
         if tailscale_status.rc == 0 else 'absent' }}
    tailscale_tags_current: >-
      {{ (((tailscale_status.stdout | from_json).get('Self') or {}).get('Tags') or [])
         if tailscale_status.rc == 0 else [] }}

- name: Read live preferences (DNS, routes) before the join check
  # CorpDNS is accept-dns: true means the tailnet controls resolv.conf.
  # A host joined earlier with the old default must re-run tailscale up
  # to hand DNS back to the LAN resolver (MagicDNS upstream cannot
  # resolve LAN-only names - broke kopia's storage endpoint).
  ansible.builtin.command:
    cmd: tailscale debug prefs
  register: tailscale_prefs_live
  changed_when: false
  check_mode: false
  failed_when: false

- name: Parse live accept-dns state
  ansible.builtin.set_fact:
    tailscale_accept_dns_live: >-
      {{ ((tailscale_prefs_live.stdout | from_json).get('CorpDNS') or false) | bool
         if tailscale_prefs_live.rc == 0 else false }}

- name: Fail loudly when the auth key is not provided
  # CI provides it via -e @op_secrets.json (ci/fetch_op_secrets.py) from the
  # tailscale-ansible-authkey 1Password item; local runs pass
  # -e tailscale_authkey=... Skipped in check mode so wiring can be validated
  # without secrets.
  ansible.builtin.fail:
    msg: >-
      tailscale_authkey is empty on {{ inventory_hostname }} —
      CI: is the tailscale-ansible-authkey item present in vault Secrets
      (see docs/plans/game-host-tailnet.md, operator steps)?
      Local: pass -e tailscale_authkey=...
  when:
    - not ansible_check_mode
    - (tailscale_authkey | default('')) | length == 0

- name: Join the tailnet when not logged in
  # Mutating: skipped in --check (tailscale up would fail against a binary
  # the check run never installed).
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ tailscale_authkey }}
      --advertise-tags={{ tailscale_tags | join(',') }}
      --hostname={{ inventory_hostname_short }}
      --accept-dns={{ 'true' if tailscale_accept_dns else 'false' }}
  register: tailscale_join
  changed_when: tailscale_join.rc == 0
  when:
    - not ansible_check_mode
    - tailscale_tags | length > 0
    - tailscale_state != 'Running'
      or tailscale_tags_current | difference(tailscale_tags) | length > 0
      or tailscale_accept_dns_live | bool != tailscale_accept_dns | bool
  no_log: true

- name: Read the host's tailnet IPv4 address
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  check_mode: false
  failed_when: false

- name: Record the tailnet address for downstream tasks
  ansible.builtin.set_fact:
    tailscale_host_ipv4: "{{ tailscale_ip.stdout_lines[0] | default('') }}"

- name: Fail when routes or exit node are advertised
  # A-prime architecture: zero LAN routes. Asserted on every run where the
  # daemon answers (skipped pre-join / in --check on a fresh host).
  # prefs JSON uses explicit nulls for absent values (AdvertiseRoutes: null),
  # so dict.get defaults never fire — coalesce with `or` before filtering.
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} advertises routes or an exit node —
      the tailnet must never carry LAN routes (A-prime decision).
  when:
    - tailscale_prefs_live.rc == 0
    - ((tailscale_prefs_live.stdout | from_json).get('AdvertiseRoutes') or []) | length > 0
      or ((tailscale_prefs_live.stdout | from_json).get('AdvertiseExitNode') or false) | bool
