---
# Ansible host GitOps — lint/syntax always; check/apply via 1Password Connect.
# Included from the repo root .gitlab-ci.yml (same pattern as fleet/).
#
# Triggers:
#   - MR touching ansible/** → validate (+ check if OP_CONNECT_TOKEN set)
#   - Push to default branch touching ansible/** → validate (+ apply if token set)
#
# Secrets (1Password item `ansible-secrets` in vault `Secrets`):
#   ansible_gitops_ed25519       — deploy private key (multiline text field)
#   ansible_gitops_known_hosts   — known_hosts blob (multiline text field)
#
# CI/CD variables:
#   OP_CONNECT_TOKEN — Connect API token (shared with tofu; vault must include Secrets)
#   OP_CONNECT_HOST  — optional override; default is in-cluster Connect Service
#
# Runner note: in-cluster Kubernetes executor is non-root — use pip/venv, no apt.
---
.ansible-base:
  image: python:3.12-bookworm
  needs: []
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    ANSIBLE_CONFIG: "$CI_PROJECT_DIR/ansible/ansible.cfg"
    ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR/ansible/collections"
    ANSIBLE_ROLES_PATH: "$CI_PROJECT_DIR/ansible/roles"
    # In-cluster Connect Service (runners are on the cluster). Same as tofu CI.
    OP_CONNECT_HOST: "http://onepassword-connect.onepassword-system.svc:8080"
  cache:
    key: "ansible-pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
      - ansible/collections
  before_script:
    - python -m venv "$CI_PROJECT_DIR/.venv"
    - source "$CI_PROJECT_DIR/.venv/bin/activate"
    - pip install --upgrade pip
    - pip install "ansible-core>=2.16,<2.19" "ansible-lint>=24.0.0,<26.0.0"
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible-galaxy collection install -r requirements.yml -p collections
    - ansible --version
    - ansible-lint --version

.ansible-ssh-setup:
  extends: .ansible-base
  before_script:
    # Duplicated from .ansible-base — avoid GitLab !reference (breaks check-yaml).
    - python -m venv "$CI_PROJECT_DIR/.venv"
    - source "$CI_PROJECT_DIR/.venv/bin/activate"
    - pip install --upgrade pip
    - pip install "ansible-core>=2.16,<2.19" "ansible-lint>=24.0.0,<26.0.0" "onepasswordconnectsdk>=2.0.0,<3.0.0"
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible-galaxy collection install -r requirements.yml -p collections
    - ansible --version
    - ansible-lint --version
    - |
      missing=""
      for var in OP_CONNECT_HOST OP_CONNECT_TOKEN; do
        eval "value=\${$var-}"
        if [ -z "$value" ]; then
          missing="${missing} ${var}"
        fi
      done
      if [ -n "$missing" ]; then
        echo "Missing required CI/CD variables:${missing}"
        echo "OP_CONNECT_* is 1Password Connect (same token as tofu; see ansible/README.md)"
        exit 1
      fi
    - python "$CI_PROJECT_DIR/ansible/ci/fetch_op_ssh.py"

ansible-validate:
  extends: .ansible-base
  stage: test
  script:
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible-playbook --syntax-check playbooks/site.yml
    - ansible-playbook --syntax-check playbooks/bootstrap.yml
    - ansible-playbook --syntax-check playbooks/common.yml
    - ansible-lint playbooks roles inventory
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ansible/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ansible/**/*

ansible-check:
  extends: .ansible-ssh-setup
  stage: deploy
  resource_group: ansible-gitops
  script:
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible-playbook --check --diff playbooks/site.yml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $OP_CONNECT_TOKEN
      changes:
        - ansible/**/*

ansible-apply:
  extends: .ansible-ssh-setup
  stage: deploy
  resource_group: ansible-gitops
  script:
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible-playbook playbooks/site.yml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule" && $OP_CONNECT_TOKEN
      changes:
        - ansible/**/*
