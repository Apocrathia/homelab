[defaults]
# ansible-core 2.24 removes top-level fact injection; references use
# ansible_facts["name"] and this flag proves no stragglers survive (a missed
# ref fails loudly in check/apply instead of silently skipping at 2.24).
inject_facts_as_vars = False
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
# CI / non-interactive: fail fast on unreachable instead of hanging forever
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
