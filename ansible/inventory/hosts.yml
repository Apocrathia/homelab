---
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/inventory.json
#
# Groups mirror purpose, not hypervisor. Fill ansible_host (or DNS that
# matches inventory_hostname) before CI apply can reach a host.
# unifi-os: UniFi OS Server (self-hosted). Static .3 per VLAN (see
# host_vars/unifi-os.yml); ansible_host is the Management address.
# unifi.apocrathia.com stays on the CK+ until the Track A cutover.
all:
  children:
    desktops:
      hosts:
        ians-gaming-pc:
          ansible_host: ians-gaming-pc.access.apocrathia.com
    servers:
      hosts:
        game:
          ansible_host: game.services.apocrathia.com
        unifi-os:
          # Static Management address (roles/common network tag). DNS still
          # points at the CK+ until the cutover; migrate with
          # -e ansible_host=<current lease> until the box is renumbered.
          ansible_host: 10.10.0.3
    # Purpose group (not deployment topology): hosts that run kopia backups.
    # Membership is the opt-in — the playbook targets this group so inventory
    # additions without host_vars never break site.yml.
    kopia:
      hosts:
        ians-gaming-pc:
          ansible_host: ians-gaming-pc.access.apocrathia.com
        game:
          ansible_host: game.services.apocrathia.com
        unifi-os:
          ansible_host: 10.10.0.3
