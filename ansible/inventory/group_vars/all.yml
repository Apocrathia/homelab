---
# Non-secret defaults for every managed host.
timezone: America/Denver
github_username: Apocrathia

# Primary login user created/managed by roles/common (user tag).
username: ianyoung

# CI/automation connects as the managed service account (deploy-key auth,
# NOPASSWD sudo — no become password). Provisioned by roles/common.
ansible_user: ansible

# Dedicated automation account (roles/common, user tag): locked password,
# deploy-key auth, NOPASSWD sudo.
common_ansible_account: ansible
common_ansible_account_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBIFitm0mvFG8mh2BWNzip5SBdrCkHN9hfxNj9ETlBRg ansible-gitops@homelab"

# Packages installed by roles/common (packages tag). Names must exist on both
# Debian (game) and Fedora (desktops); OS-specific bits live in packages_*.yml.
common_packages:
  - bat # cat replacement (operator shell environment, roles/common)
  - curl
  - git
  - htop
  - jq
  - nano
  - net-tools
  - podman
  - sudo
  - thefuck # command-fixer alias (operator shell environment, roles/common)
  - tmux
  - vim
  - zsh

# roles/hardening (devsec.hardening) site-policy overrides. The role is not
# wired to any playbook yet (first target: the unifi-os host when it comes
# online); these stage policy so any future assignment works out of the box.
# Nothing here uses chrooted SFTP; the devsec default (true) requires
# root-owned home dirs and would break plain scp/sftp.
sftp_chroot: false
# Forced ageing would silently expire existing account passwords (rotation
# here is manual via 1Password).
os_user_pw_ageing: false
