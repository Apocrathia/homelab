---
# kopia backup sources for game.services.apocrathia.com
kopia_backup_paths:
  - /etc
  - /home
  - /opt
  - /var/backups
  - /var/lib

# game.services.apocrathia.com — AMP controller + game instances.
# Web UI: https://game.services.apocrathia.com (443 via nginx, Let's Encrypt
# DNS-01 through Cloudflare; AMP bound to 127.0.0.1:8080 behind the proxy).
# game.apocrathia.com still resolves (tailnet static zone + LAN DNS) but is
# no longer the TLS identity: the cert and vhost serve the services name.

# nginx_site role
nginx_site_domain: game.services.apocrathia.com
nginx_site_upstream: "127.0.0.1:8080"
nginx_site_shared_webroot: /opt/cubecoders/amp/shared/WebRoot
# AMP-specific: tells the app it is behind an HTTPS proxy (AMP docs)
nginx_site_extra_headers: "proxy_set_header        X-AMP-Scheme $scheme;"

# acme_sh role (dependency of nginx_site)
acme_sh_domain: game.services.apocrathia.com
acme_sh_account_email: admin@apocrathia.com
# Token must have Zone:DNS:Edit on apocrathia.com (same item cert-manager's
# issuer uses). Delivered by CI from 1Password Connect — never in git.
acme_sh_reloadcmd: "[ -x /usr/sbin/nginx ] && service nginx reload || true"

# tailscale role
tailscale_tags: ["tag:game"]
