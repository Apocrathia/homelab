---
# Scan dependencies in MRs
scorecard:
  stage: verify
  image:
    name: alpine/k8s:1.35.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - flux/manifests/**/*
        - renovate.json
  variables:
    GITHUB_AUTH_TOKEN: ${SCORECARD_GITHUB_AUTH_TOKEN}
    GITLAB_AUTH_TOKEN: ${SCORECARD_GITLAB_AUTH_TOKEN}
    SCORECARD_MARKER: "<!-- openssf-scorecard -->"
    # renovate: datasource=github-releases depName=ossf/scorecard
    SCORECARD_VERSION: v5.4.0
  script:
    - |
      # Install scorecard to local bin (writable without root)
      echo "Installing scorecard ${SCORECARD_VERSION}..."
      mkdir -p /tmp/bin
      curl -sL "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION#v}_linux_amd64.tar.gz" | tar xz -C /tmp/bin
      export PATH="/tmp/bin:$PATH"

      echo "=== OpenSSF Scorecard Analysis ==="

      # Verify auth tokens are available (without exposing them)
      if [ -n "$GITHUB_AUTH_TOKEN" ]; then
        echo "GITHUB_AUTH_TOKEN: set (${#GITHUB_AUTH_TOKEN} chars)"
      else
        echo "WARNING: GITHUB_AUTH_TOKEN not set"
      fi
      if [ -n "$GITLAB_AUTH_TOKEN" ]; then
        echo "GITLAB_AUTH_TOKEN: set (${#GITLAB_AUTH_TOKEN} chars)"
      else
        echo "WARNING: GITLAB_AUTH_TOKEN not set"
      fi

      # Fetch target branch
      git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

      # Find changed YAML files
      CHANGED_FILES=$(git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD -- flux/manifests/ | grep -E '\.ya?ml$' || true)

      if [ -z "$CHANGED_FILES" ]; then
        echo "No manifest files changed"
        exit 0
      fi

      # Extract GitHub/GitLab repos from changed files
      # Excludes this repository to avoid self-scanning
      REPOS=$(for FILE in $CHANGED_FILES; do
        if [ -f "$FILE" ]; then
          # Extract from container images (ghcr.io/owner/repo:tag -> github.com/owner/repo)
          grep -oE 'ghcr\.io/[^/:\"]+/[^/:\"]+' "$FILE" 2>/dev/null | sed 's|ghcr\.io/|github.com/|' || true
          # Extract from chart URLs (github.com/owner/repo)
          grep -oE 'github\.com/[^/:\"]+/[^/:\"]+' "$FILE" 2>/dev/null || true
          # Extract from GitLab refs
          grep -oE 'gitlab\.com/[^/:\"]+/[^/:\"]+' "$FILE" 2>/dev/null || true
          # Extract from repository field in HelmRelease
          grep -A5 'spec:' "$FILE" 2>/dev/null | grep -oE 'https://github\.com/[^\"]+' | sed 's|https://||' || true
        fi
      done | sort -u | grep -v '^$' | grep -v 'Apocrathia/homelab' || true)

      echo "Found repositories to scan:"
      echo "$REPOS"

      if [ -z "$REPOS" ]; then
        echo "No scannable repositories found in changes"
        exit 0
      fi

      # Run scorecard against each repo
      RESULTS_FILE="/tmp/scorecard-results.md"
      FAILED_COUNT=0
      SUCCESS_COUNT=0

      : > "$RESULTS_FILE"

      for REPO in $REPOS; do
        echo "Scanning: $REPO"

        # Run scorecard with 90 second timeout per repo
        ERROR_FILE="/tmp/scorecard-error.txt"
        if OUTPUT=$(timeout 90 scorecard --repo="$REPO" --format=json 2>"$ERROR_FILE"); then
          SCORE=$(echo "$OUTPUT" | jq -r '.score // "N/A"')
          echo "  Score: $SCORE/10"

          # Extract all checks as a table
          CHECKS_TABLE=$(echo "$OUTPUT" | jq -r '
            .checks // []
            | sort_by(.name)
            | map("| \(.name) | \(if .score < 0 then "N/A" else "\(.score)/10" end) |")
            | .[]
          ')

          # Log all checks to pipeline output
          echo "  Checks:"
          echo "$OUTPUT" | jq -r '.checks // [] | sort_by(.name) | map("    \(.name): \(if .score < 0 then "N/A" else "\(.score)/10" end)") | .[]'

          {
            echo "<details>"
            echo "<summary><strong><a href=\"https://${REPO}\">${REPO}</a></strong> — ${SCORE}/10</summary>"
            echo ""
            echo "| Check | Score |"
            echo "|-------|-------|"
            echo "$CHECKS_TABLE"
            echo ""
            echo "</details>"
            echo ""
          } >> "$RESULTS_FILE"
          SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
        else
          EXIT_CODE=$?
          echo "  Error (exit $EXIT_CODE):"
          cat "$ERROR_FILE" | head -5

          {
            echo "<details>"
            if [ "$EXIT_CODE" -eq 124 ]; then
              echo "<summary><strong>${REPO}</strong> — :hourglass: Timeout</summary>"
              echo ""
              echo "Scan exceeded 90 seconds."
            else
              ERROR_MSG=$(head -1 "$ERROR_FILE" | cut -c1-80)
              echo "<summary><strong>${REPO}</strong> — :warning: Scan failed</summary>"
              echo ""
              echo "Error: ${ERROR_MSG:-Unknown error}"
            fi
            echo ""
            echo "</details>"
            echo ""
          } >> "$RESULTS_FILE"
          FAILED_COUNT=$((FAILED_COUNT + 1))
        fi
      done

      TOTAL=$((SUCCESS_COUNT + FAILED_COUNT))
      echo "Scanned $SUCCESS_COUNT/$TOTAL repositories successfully"

      # Build comment body
      COMMENT_FILE="/tmp/comment.md"
      RESULTS_HASH=$(cat "$RESULTS_FILE" | md5sum | cut -d' ' -f1)

      {
        echo "$SCORECARD_MARKER"
        echo "## :shield: OpenSSF Scorecard Results"
        echo ""
        echo "Security analysis of dependencies changed in this MR. Click to expand details."
        echo ""
        cat "$RESULTS_FILE"
        echo "<sub>Scanned ${SUCCESS_COUNT}/${TOTAL} repositories. [What is Scorecard?](https://securityscorecards.dev/)</sub>"
        echo ""
        echo "<!-- hash:${RESULTS_HASH} -->"
      } > "$COMMENT_FILE"

      COMMENT_BODY=$(cat "$COMMENT_FILE")

      # Post/update MR comment
      NOTES=$(curl --silent --show-error --fail \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=100") || {
        echo "Failed to fetch MR notes"
        exit 1
      }

      EXISTING_NOTE=$(echo "$NOTES" | jq -r --arg marker "$SCORECARD_MARKER" '.[] | select(.body | startswith($marker))')
      EXISTING_NOTE_ID=$(echo "$EXISTING_NOTE" | jq -r '.id // empty')
      EXISTING_HASH=$(echo "$EXISTING_NOTE" | jq -r '.body // ""' | sed -n 's/.*<!-- hash:\([^ ]*\) -->.*/\1/p')

      if [ -n "$EXISTING_NOTE_ID" ]; then
        if [ "$EXISTING_HASH" = "$RESULTS_HASH" ]; then
          echo "Results unchanged, skipping update"
          exit 0
        fi

        curl --silent --show-error --fail --request PUT \
          --header "PRIVATE-TOKEN: ${SCORECARD_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/${EXISTING_NOTE_ID}" > /dev/null

        echo "Comment updated"
      else
        curl --silent --show-error --fail --request POST \
          --header "PRIVATE-TOKEN: ${SCORECARD_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" > /dev/null

        echo "Comment posted"
      fi

      echo "=== Scorecard Analysis Complete ==="
  allow_failure: true

# Score this repository and publish badge via GitLab Pages
scorecard-badge:
  stage: deploy
  image:
    name: alpine/k8s:1.35.0
  rules:
    # Run on schedule or manual trigger on default branch
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GITLAB_AUTH_TOKEN: ${SCORECARD_GITLAB_AUTH_TOKEN}
    # renovate: datasource=github-releases depName=ossf/scorecard
    SCORECARD_VERSION: v5.4.0
  script:
    - |
      # Install scorecard
      echo "Installing scorecard ${SCORECARD_VERSION}..."
      mkdir -p /tmp/bin
      curl -sL "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION#v}_linux_amd64.tar.gz" | tar xz -C /tmp/bin
      export PATH="/tmp/bin:$PATH"

      echo "=== Scoring gitlab.com/${CI_PROJECT_PATH} ==="

      # Verify token is set
      if [ -n "$GITLAB_AUTH_TOKEN" ]; then
        echo "GITLAB_AUTH_TOKEN: set (${#GITLAB_AUTH_TOKEN} chars)"
      else
        echo "WARNING: GITLAB_AUTH_TOKEN not set"
      fi

      # Run scorecard against this repo (may exit non-zero even with valid results)
      echo "Running scorecard..."
      ERROR_LOG="/tmp/scorecard-stderr.txt"
      set +e
      OUTPUT=$(scorecard --repo="gitlab.com/${CI_PROJECT_PATH}" --format=json 2>"$ERROR_LOG")
      EXIT_CODE=$?
      set -e
      echo "Scorecard exited with code: $EXIT_CODE"

      # Show any errors
      if [ -s "$ERROR_LOG" ]; then
        echo "Scorecard warnings/errors:"
        cat "$ERROR_LOG"
      fi

      # Check if we got a valid score from the output
      SCORE=$(echo "$OUTPUT" | jq -r '.score // empty' 2>/dev/null || true)
      echo "Parsed score: '$SCORE'"

      if [ -z "$SCORE" ]; then
        echo "Scorecard scan failed - no score in output:"
        echo "$OUTPUT"
        exit 1
      fi

      echo "Score: $SCORE/10"

      # Determine badge color based on score
      if [ "$(echo "$SCORE >= 7" | bc)" -eq 1 ]; then
        COLOR="brightgreen"
      elif [ "$(echo "$SCORE >= 5" | bc)" -eq 1 ]; then
        COLOR="yellow"
      elif [ "$(echo "$SCORE >= 3" | bc)" -eq 1 ]; then
        COLOR="orange"
      else
        COLOR="red"
      fi

      # Create shields.io endpoint JSON
      mkdir -p scorecard
      jq -n \
        --argjson schema 1 \
        --arg label "OpenSSF Scorecard" \
        --arg message "${SCORE}/10" \
        --arg color "$COLOR" \
        '{schemaVersion: $schema, label: $label, message: $message, color: $color}' \
        > scorecard/scorecard.json

      echo "Badge JSON created:"
      cat scorecard/scorecard.json

      # Also save full results for reference
      echo "$OUTPUT" | jq '.' > scorecard/scorecard-full.json

      # Generate human-readable markdown report
      echo "Generating markdown report..."
      {
        echo "# Scorecard Results"
        echo ""
        echo "**Score: ${SCORE}/10**"
        echo ""
        echo "Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')"
        echo ""
        echo "| Check | Score | Description |"
        echo "|-------|-------|-------------|"
        echo "$OUTPUT" | jq -r '
          .checks
          | sort_by(.score)
          | reverse
          | .[]
          | "| \(.name) | \(if .score < 0 then "N/A" else "\(.score)/10" end) | \(.reason | split(" -- ")[0] | .[0:80]) |"
        '
        echo ""
        echo "## Check Details"
        echo ""
        echo "$OUTPUT" | jq -r '
          .checks
          | sort_by(.score)
          | .[]
          | "### \(.name)\n\n**Score:** \(if .score < 0 then "N/A" else "\(.score)/10" end)\n\n\(.reason)\n\n[Documentation](\(.documentation.url))\n"
        '
      } > scorecard/scorecard-details.md

      echo "Markdown report generated"
  artifacts:
    paths:
      - scorecard
    expire_in: 1 week
