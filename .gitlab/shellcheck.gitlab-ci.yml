---
# ShellCheck - Shell script static analysis
# Runs on shell scripts in scripts/ directory, fails on errors only
shellcheck:
  stage: test
  image:
    # renovate: datasource=docker depName=koalaman/shellcheck-alpine
    name: koalaman/shellcheck-alpine:v0.11.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/**/*.sh
        - "*.sh"
  script:
    - |
      echo "=== ShellCheck Static Analysis ==="
      find scripts/ -name "*.sh" -type f -print0 | \
        xargs -0 shellcheck --severity=error
      echo "=== ShellCheck Complete ==="
  allow_failure: false
