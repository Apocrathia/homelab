---
# Trivy - IaC security scanning
# Scans Kubernetes and Terraform manifests for misconfigurations

trivy:
  stage: test
  image:
    # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
    name: ghcr.io/aquasecurity/trivy:0.68.2
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
        - flux/**/*.yaml
        - helm/**/*.yaml
  script:
    - trivy config --severity CRITICAL,HIGH --exit-code 1 .
  allow_failure: false
