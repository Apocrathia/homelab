---
# Trivy - IaC security scanning
# Scans Kubernetes and Terraform manifests for misconfigurations

trivy:
  stage: test
  image:
    # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
    name: ghcr.io/aquasecurity/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
        - flux/**/*.yaml
        - helm/**/*.yaml
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      # --diff-filter=d: deleted paths are gone from the checkout; trivy exits fatal on lstat
      CHANGED=$(git diff --name-only --diff-filter=d "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" -- terraform/ flux/ helm/ | grep -E '\.(yaml|yml|tf)$' || true)
      if [ -z "$CHANGED" ]; then
        echo "No scannable files changed"
        exit 0
      fi
      echo "Scanning changed files:"
      echo "$CHANGED"
      echo "$CHANGED" | xargs -n 1 trivy config --ignorefile .trivyignore.yaml --severity CRITICAL,HIGH --exit-code 1
  allow_failure: false
