---
# Trivy - IaC security scanning
# Scans Kubernetes and Terraform manifests for misconfigurations

trivy:
  stage: test
  image:
    # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
    name: ghcr.io/aquasecurity/trivy:0.68.2
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
        - flux/**/*.yaml
        - helm/**/*.yaml
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      CHANGED=$(git diff --name-only "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD" -- terraform/ flux/ helm/ | grep -E '\.(yaml|yml|tf)$' || true)
      if [ -z "$CHANGED" ]; then
        echo "No scannable files changed"
        exit 0
      fi
      echo "Scanning changed files:"
      echo "$CHANGED"
      echo "$CHANGED" | xargs -n 1 trivy config --severity CRITICAL,HIGH --exit-code 1
  allow_failure: false
