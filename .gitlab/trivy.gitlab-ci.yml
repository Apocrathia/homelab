---
# Trivy - IaC security scanning
# Scans Terraform and Kubernetes manifests for misconfigurations

trivy-iac:
  stage: test
  image:
    # renovate: datasource=docker depName=ghcr.io/aquasecurity/trivy
    name: ghcr.io/aquasecurity/trivy:0.68.2
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
        - flux/**/*.yaml
        - helm/**/*.yaml
  script:
    - |
      echo "=== Trivy IaC Security Scanning ==="
      trivy config \
        --severity CRITICAL,HIGH \
        --exit-code 1 \
        terraform/ flux/ helm/
      echo "=== Trivy Scan Complete ==="
  allow_failure: false
