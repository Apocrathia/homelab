---
# kube-linter - Kubernetes manifest security linting
# Runs on flux/ and helm/ manifests to catch security misconfigurations
kube-linter:
  stage: test
  # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/alpine
  image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  variables:
    # renovate: datasource=github-releases depName=stackrox/kube-linter
    KUBE_LINTER_VERSION: v0.8.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - flux/**/*.yaml
        - helm/**/*.yaml
  script:
    - wget -qO- "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" | tar xz -C /tmp kube-linter
    - /tmp/kube-linter lint flux/ helm/ --config .kube-linter.yaml
  allow_failure: false
