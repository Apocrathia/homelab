---
# kube-linter - Kubernetes manifest security linting
# Runs on flux/ and helm/ manifests to catch security misconfigurations
kube-linter:
  stage: test
  image:
    # renovate: datasource=docker depName=stackrox/kube-linter
    name: stackrox/kube-linter:v0.8.1-amd64
    entrypoint: ["/kube-linter"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - flux/**/*.yaml
        - flux/**/*.yml
        - helm/**/*.yaml
  script:
    - lint
    - flux/
    - helm/
    - --config
    - .kube-linter.yaml
  allow_failure: false
