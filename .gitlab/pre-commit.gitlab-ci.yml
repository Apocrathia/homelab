---
# pre-commit — same hooks as local (.pre-commit-config.yaml)
# Catches agents/devs who skipped or misconfigured pre-commit.
pre-commit:
  stage: test
  image:
    # renovate: datasource=docker depName=burakince/pre-commit
    name: burakince/pre-commit:4.6.1@sha256:fbc0a12dee5fc09084a60b52132a5d6f930d44c05b565784a1cb422152921e2e
    entrypoint: [""]
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
  cache:
    key:
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pre-commit/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pre-commit run --all-files --show-diff-on-failure
  allow_failure: false
