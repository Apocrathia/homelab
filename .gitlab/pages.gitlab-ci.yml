---
# Build and publish GitLab Pages using MkDocs
pages:
  stage: deploy
  image: python:3.12-alpine
  needs:
    - job: scorecard-badge
      artifacts: true
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        - mkdocs.yml
        - docs/**/*
        - "**/*.md"
  script:
    - |
      echo "Installing MkDocs..."
      pip install --quiet mkdocs-material pymdown-extensions
      export PATH="$HOME/.local/bin:$PATH"

      echo "Assembling documentation..."

      # Copy all markdown files into docs/ with path-based naming
      # e.g., talos/README.md -> docs/talos-README.md
      # Skip files already in docs/ and hidden directories
      find . -name "*.md" -type f \
        ! -path "./docs/*" \
        ! -path "./.git/*" \
        ! -path "./.cursor/*" \
        ! -path "./node_modules/*" \
        | while read -r file; do
          # Remove leading ./
          relative="${file#./}"
          # Convert path separators to dashes
          flat_name=$(echo "$relative" | tr '/' '-')
          echo "  $relative -> $flat_name"
          cp "$file" "docs/$flat_name"
        done

      # Rename root README to index for landing page
      mv docs/README.md docs/index.md 2>/dev/null || true

      # Copy scorecard markdown if available from job artifacts
      if [ -d "scorecard" ]; then
        echo "Copying scorecard artifacts into docs..."
        cp scorecard/scorecard-details.md docs/
      fi

      echo "Documentation files:"
      ls -la docs/*.md | head -30

      echo "Building documentation site..."
      mkdocs build

      # Copy scorecard JSON files to site root for badge endpoint
      if [ -d "scorecard" ]; then
        echo "Copying scorecard JSON to site..."
        cp scorecard/*.json public/
        ls -la public/*.json
      else
        echo "No scorecard artifacts found (job may not have run)"
      fi

      echo "Site contents:"
      ls -la public/
  artifacts:
    paths:
      - public
