---
# Semgrep - SAST for application code
# Runs on Python and other programming languages with auto-detected rulesets
semgrep:
  stage: test
  image:
    # renovate: datasource=docker depName=semgrep/semgrep
    name: semgrep/semgrep:1.179.0-nonroot@sha256:7d92d5b5515a6df82c645124629d989f697400d1b05aaac22805cbc09cb4b391
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.py"
        - "**/*.go"
        - "**/*.js"
        - "**/*.ts"
  variables:
    # The image reports itself as containerised, so semgrep looks for the
    # conventional /src bind mount. The k8s executor checks out elsewhere.
    SEMGREP_SRC_DIRECTORY: $CI_PROJECT_DIR
  script:
    - |
      echo "=== Semgrep SAST Scanning ==="
      # Fail only on findings introduced by this MR (not the pre-existing backlog).
      if ! git cat-file -e "${CI_MERGE_REQUEST_DIFF_BASE_SHA}^{commit}" 2>/dev/null; then
        git fetch --depth=1 origin "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      fi
      semgrep scan --config auto --error \
        --baseline-commit "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      echo "=== Semgrep Scan Complete ==="
  allow_failure: false
