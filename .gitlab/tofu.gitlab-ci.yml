---
# OpenTofu/Terragrunt CI Pipeline
# Manages Proxmox VMs via Infrastructure as Code

.tofu-base:
  image:
    # glibc base: 1Password provider is dynamically linked against glibc. Alpine
    # musl cannot exec it, and runners force uid 1000 so apk/gcompat is impossible.
    # tofu + terragrunt are bootstrapped into .ci-bin (see ci-deps.sh).
    name: buildpack-deps:bookworm-curl@sha256:c63e1f47b008e42150a551f51443fd5007d737e9951661bd18b0a808db56abbe
  variables:
    TF_IN_AUTOMATION: "true"
    CI_OPENTOFU_VERSION: "1.12.5"
    CI_TERRAGRUNT_VERSION: "1.1.1"
    # In-cluster Connect Service (runners are on the cluster). Token is a CI var.
    OP_CONNECT_HOST: "http://onepassword-connect.onepassword-system.svc:8080"
  before_script:
    - . "${CI_PROJECT_DIR}/scripts/terraform/ci-deps.sh"
    - ci_deps_bootstrap
    - tofu version
    - terragrunt --version
    - cd terraform/deployments
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*

.tofu-preflight:
  before_script:
    - . "${CI_PROJECT_DIR}/scripts/terraform/ci-deps.sh"
    - ci_deps_bootstrap
    - cd terraform/deployments
    - |
      missing=""
      for var in TF_HTTP_ADDRESS TF_HTTP_USERNAME TF_HTTP_PASSWORD \
        OP_CONNECT_HOST OP_CONNECT_TOKEN; do
        eval "value=\${$var-}"
        if [ -z "$value" ]; then
          missing="${missing} ${var}"
        fi
      done
      if [ -n "$missing" ]; then
        echo "Missing required CI/CD variables:${missing}"
        echo "Configure in GitLab: Settings → CI/CD → Variables"
        echo "TF_HTTP_* is the GitLab remote state backend (see terraform/README.md)"
        echo "OP_CONNECT_* is 1Password Connect for tofu (see docs/plans/tofu-1password-provider.md)"
        exit 1
      fi
      echo "Preflight OK (TF_HTTP_USERNAME length=${#TF_HTTP_USERNAME}, OP_CONNECT_TOKEN length=${#OP_CONNECT_TOKEN})"

tofu-validate:
  extends:
    - .tofu-base
    - .tofu-preflight
  stage: verify
  script:
    - |
      echo "=== Validating Terragrunt Configuration ==="
      terragrunt run --all -- validate
  allow_failure: false

tofu-plan:
  extends:
    - .tofu-base
    - .tofu-preflight
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/**/*
  script:
    - |
      MARKER="<!-- tofu-plan -->"
      PLAN_FILE="/tmp/plan-output.md"

      echo "=== Running Terragrunt Plan ==="

      PLAN_PARSER="${CI_PROJECT_DIR}/scripts/terraform/tofu-plan-summary.sh"
      PLAN_OUTPUT=$(TG_NO_COLOR=true terragrunt run --all -- plan -no-color 2>&1) || PLAN_EXIT=$?

      PLAN_SUMMARY=$(printf '%s\n' "$PLAN_OUTPUT" | "$PLAN_PARSER" summarize)

      printf '%s\n' "$PLAN_OUTPUT"
      echo ""
      echo "=== Plan Summary ==="
      printf '%s\n' "$PLAN_SUMMARY"

      render_plan_comment() {
        awk '
          function add_body(unit, line) {
            body[unit] = body[unit] line "\n"
          }
          function add_refresh(unit, line) {
            refresh[unit] = refresh[unit] line "\n"
          }
          function bracket_delta(line, copy, opens, closes) {
            copy = line
            opens = gsub(/\[/, "", copy)
            copy = line
            closes = gsub(/\]/, "", copy)
            return opens - closes
          }
          function print_refresh(unit) {
            if (refresh[unit] == "") {
              return
            }
            print "<details><summary>Proxmox address refresh</summary>"
            print ""
            print "```hcl"
            printf "%s", refresh[unit]
            print "```"
            print ""
            print "</details>"
            print ""
          }
          function is_compact(status) {
            return status == "No changes" ||
              status == "Changes to Outputs only" ||
              status ~ /^Plan: 0 to add, 0 to change, 0 to destroy/
          }
          BEGIN {
            esc = sprintf("%c", 27)
            prefix = "^[0-9][0-9]:[0-9][0-9]:[0-9][0-9]\\.[0-9][0-9][0-9][ \t]+[A-Z][A-Z]*[ \t]+\\[[^]]+\\][ \t]+"
          }
          $0 == "__TOFU_PLAN_OUTPUT__" {
            reading_output = 1
            next
          }
          !reading_output {
            separator = index($0, ": ")
            if (separator > 0) {
              unit = substr($0, 1, separator - 1)
              status[unit] = substr($0, separator + 2)
              order[++unit_count] = unit
            }
            next
          }
          {
            line = $0
            gsub(esc "\\[[0-9;]*m", "", line)
            unit = ""

            if (line ~ prefix) {
              matched = substr(line, 1, match(line, prefix) + RLENGTH - 1)
              match(matched, /\[[^]]+\]/)
              unit = substr(matched, RSTART + 1, RLENGTH - 2)
              sub(prefix, "", line)
            } else if (line ~ /^\[[^]]+\][ \t]+/) {
              match(line, /^\[[^]]+\]/)
              unit = substr(line, RSTART + 1, RLENGTH - 2)
              sub(/^\[[^]]+\][ \t]+/, "", line)
            }

            if (!(unit in status)) {
              next
            }
            compact = is_compact(status[unit])

            sub(/^terraform: /, "", line)

            if (!compact) {
              if (!started[unit] &&
                  line !~ /^(OpenTofu|Terraform) will perform/ &&
                  line !~ /^[ \t]*#/ &&
                  line !~ /Objects have changed outside/ &&
                  line !~ /Changes to Outputs:/ &&
                  line !~ /^Plan:/) {
                next
              }
              started[unit] = 1
            }

            if (line ~ /Refreshing state/ ||
                line ~ /Read complete after/ ||
                line ~ /compared your real infrastructure/ ||
                line ~ /Your infrastructure matches the configuration/) {
              next
            }

            if (capturing_refresh[unit]) {
              add_refresh(unit, line)
              refresh_depth[unit] += bracket_delta(line)
              if (refresh_depth[unit] <= 0) {
                capturing_refresh[unit] = 0
              }
              next
            }

            if (unit ~ /^proxmox\/talos-cluster\// &&
                line ~ /ipv[46]_addresses[ \t]*=/) {
              add_refresh(unit, line)
              refresh_depth[unit] = bracket_delta(line)
              if (refresh_depth[unit] > 0) {
                capturing_refresh[unit] = 1
              }
              next
            }

            if (compact) {
              next
            }

            add_body(unit, line)
          }
          END {
            for (i = 1; i <= unit_count; i++) {
              unit = order[i]
              if (is_compact(status[unit])) {
                print "- `" unit "`: " status[unit]
                if (refresh[unit] != "") {
                  print ""
                  print_refresh(unit)
                }
                continue
              }

              print "<details open><summary><code>" unit "</code> — " status[unit] "</summary>"
              print ""
              print_refresh(unit)
              print "```hcl"
              printf "%s", body[unit]
              print "```"
              print ""
              print "</details>"
              print ""
            }
          }
        '
      }

      {
        echo "$MARKER"
        echo "## 🏗️ OpenTofu Plan"
        echo ""
        echo "### Summary"
        echo ""
        echo '```'
        echo "$PLAN_SUMMARY"
        echo '```'
        echo ""
        {
          printf '%s\n' "$PLAN_SUMMARY"
          printf '%s\n' "__TOFU_PLAN_OUTPUT__"
          printf '%s\n' "$PLAN_OUTPUT"
        } | render_plan_comment
        echo ""
        echo "<!-- pipeline:${CI_PIPELINE_ID} -->"
      } > "$PLAN_FILE"

      # Avoid ARG_MAX: never pass the plan body via shell argv (--arg / $(jq)).
      COMMENT_JSON="/tmp/plan-comment.json"
      jq -n --rawfile body "$PLAN_FILE" '{body: $body}' > "$COMMENT_JSON"

      echo "Posting plan to MR..."
      NOTES=$(curl --silent --show-error --fail \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=100") || {
        echo "⚠️ Failed to fetch MR notes, skipping comment"
        exit ${PLAN_EXIT:-0}
      }

      EXISTING_NOTE_ID=$(echo "$NOTES" | jq -r --arg marker "$MARKER" '.[] | select(.body | startswith($marker)) | .id // empty' | head -1)

      if [ -n "$EXISTING_NOTE_ID" ]; then
        echo "Updating existing comment (ID: $EXISTING_NOTE_ID)..."
        curl --silent --show-error --fail --request PUT \
          --header "PRIVATE-TOKEN: ${TOFU_TOKEN}" \
          --header "Content-Type: application/json" \
          --data-binary @"$COMMENT_JSON" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/${EXISTING_NOTE_ID}" > /dev/null || true
      else
        echo "Posting new comment..."
        curl --silent --show-error --fail --request POST \
          --header "PRIVATE-TOKEN: ${TOFU_TOKEN}" \
          --header "Content-Type: application/json" \
          --data-binary @"$COMMENT_JSON" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" > /dev/null || true
      fi

      echo "✅ Plan complete"
      exit ${PLAN_EXIT:-0}
  allow_failure: false

# Scheduled drift detection — notify only, never apply. Non-blocking for Pages/scorecard.
tofu-drift:
  extends:
    - .tofu-base
    - .tofu-preflight
  stage: deploy
  needs: []
  rules:
    # Fleet hourly schedule must not run tofu drift
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FLEET_GITOPS_SCHEDULE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  script:
    - |
      echo "=== Running Terragrunt Drift Check ==="
      echo "Read-only plan; skipping state lock (MR/PAT may lack lock write perms)"

      PLAN_PARSER="${CI_PROJECT_DIR}/scripts/terraform/tofu-plan-summary.sh"
      PLAN_OUTPUT=$(terragrunt run --all -- plan -no-color -lock=false 2>&1) || PLAN_EXIT=$?
      PLAN_SUMMARY=$(echo "$PLAN_OUTPUT" | "$PLAN_PARSER" summarize)

      echo "$PLAN_OUTPUT"
      echo ""
      echo "=== Plan Summary ==="
      echo "$PLAN_SUMMARY"

      NOTIFY_REASON=""
      if [ "${PLAN_EXIT:-0}" -ne 0 ]; then
        NOTIFY_REASON="plan_failed"
      else
        DRIFT_STATUS=$(echo "$PLAN_OUTPUT" | "$PLAN_PARSER" drift-status)
        case "$DRIFT_STATUS" in
          no_drift|output_only)
            echo "No infrastructure drift detected (${DRIFT_STATUS})."
            exit 0
            ;;
          drift_detected)
            NOTIFY_REASON="drift_detected"
            ;;
          *)
            NOTIFY_REASON="plan_unclear"
            ;;
        esac
      fi

      if [ -n "${TOFU_DRIFT_WEBHOOK_URL:-}" ]; then
        curl --silent --show-error --fail --request POST \
          --header "Content-Type: application/json" \
          --data "$(jq -n \
            --arg content "OpenTofu ${NOTIFY_REASON} on ${CI_PROJECT_PATH}
      ${PLAN_SUMMARY}
      ${CI_PIPELINE_URL}" \
            '{content: $content}')" \
          "$TOFU_DRIFT_WEBHOOK_URL" || echo "⚠️ Webhook notification failed"
      else
        echo "No TOFU_DRIFT_WEBHOOK_URL configured; skipping notification"
      fi

      exit ${PLAN_EXIT:-0}
  resource_group: terraform-plan

tofu-apply:
  extends: .tofu-base
  stage: deploy
  script:
    - |
      echo "=== Applying Terragrunt Configuration ==="
      echo "⚠️  Using --parallelism 1 to prevent simultaneous control plane reboots"

      terragrunt run --all --parallelism 1 --non-interactive -- apply -auto-approve

      echo "✅ Apply complete"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes:
        - terraform/**/*
  allow_failure: false
  resource_group: terraform-apply
