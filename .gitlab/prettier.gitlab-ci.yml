---
# Prettier - format check (matches pre-commit prettier@3.1.0)
prettier:
  stage: test
  image:
    # renovate: datasource=docker depName=node
    name: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    entrypoint: [""]
  variables:
    # renovate: datasource=npm depName=prettier
    PRETTIER_VERSION: "3.1.0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.md"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.json"
        - .prettierignore
        - .gitlab/prettier.gitlab-ci.yml
  script:
    - npx --yes "prettier@${PRETTIER_VERSION}" --check .
  allow_failure: false
