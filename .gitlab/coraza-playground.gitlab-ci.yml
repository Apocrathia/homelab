---
# Build and push the Coraza Playground Docker image
coraza-playground:
  stage: build
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/coraza-playground:$CI_COMMIT_REF_SLUG
  script:
    - |
      mkdir -p /kaniko/.docker
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR/flux/manifests/04-apps/security/coraza-playground \
        --dockerfile $CI_PROJECT_DIR/flux/manifests/04-apps/security/coraza-playground/Dockerfile \
        --destination $IMAGE_TAG \
        --cache=true
  only:
    changes:
      - flux/manifests/04-apps/security/coraza-playground/**/*
