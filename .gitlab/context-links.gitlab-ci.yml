---
# Context link check — AGENTS.md / .agents markdown links and anchors
context-links:
  stage: test
  image:
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
    name: public.ecr.aws/docker/library/python:3.15-alpine@sha256:0aa144e9ec2ae8fd80dfd94070ef3e432a0df17b6e5e0091dc05323974ce9913
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - AGENTS.md
        - CLAUDE.md
        - .agents/**/*.md
        - .gitlab/context-links.gitlab-ci.yml
        - .agents/skills/reconcile-context/scripts/check_links.py
  script:
    # Rootless runners cannot apk-install git; check_links.py walks the tree
    # when git is missing.
    - python3 .agents/skills/reconcile-context/scripts/check_links.py
  allow_failure: false
