---
# Context link check — AGENTS.md / .agents markdown links and anchors
context-links:
  stage: test
  image:
    # renovate: datasource=docker depName=python
    name: python:3.14-alpine@sha256:2e740b2c28a426e74f11396c05e38afb3191acced75045b8d62df573c1dc8ce8
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - AGENTS.md
        - CLAUDE.md
        - .agents/**/*.md
        - .gitlab/context-links.gitlab-ci.yml
        - .agents/skills/reconcile-context/scripts/check_links.py
  script:
    # Rootless runners cannot apk-install git; check_links.py walks the tree
    # when git is missing.
    - python3 .agents/skills/reconcile-context/scripts/check_links.py
  allow_failure: false
