---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/v1.12.3/pkg/machinery/config/schemas/config.schema.json
machine:
  features:
    kubernetesTalosAPIAccess:
      allowedKubernetesNamespaces:
        - system-upgrade
        - kube-system
      allowedRoles:
        - os:admin
      enabled: true
  kubelet:
    extraArgs:
      rotate-server-certificates: "false"
      feature-gates: "MemoryQoS=true"
    extraConfig:
      maxPods: 200
    extraMounts:
      # Longhorn https://longhorn.io/docs/1.9.0/advanced-resources/os-distro-specific/talos-linux-support/
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
      # Talos UserVolumes
      - destination: /var/mnt
        type: bind
        source: /var/mnt
        options:
          - bind
          - rshared
          - rw
  sysctls:
    # Completely disable swap for etcd performance
    vm.swappiness: "0" # Disable swapping completely
    vm.vfs_cache_pressure: "50" # Reduce VFS cache pressure
    # Network optimizations
    net.core.somaxconn: "32768"
    net.core.netdev_max_backlog: "16384"
    user.max_user_namespaces: "10000"
  install:
    disk: /dev/sda
    wipe: true
    # renovate: datasource=github-releases depName=siderolabs/talos
    image: factory.talos.dev/metal-installer/8b583b5320ff41bf40bd1aea9287923ada45e32a1e2ba0045cb3f6758920ef4a:v1.12.5
    # https://factory.talos.dev/?arch=amd64&board=undefined&cmdline=net.ifnames%3D0&cmdline-set=true&extensions=-&extensions=siderolabs%2Famd-ucode&extensions=siderolabs%2Fiscsi-tools&extensions=siderolabs%2Fqemu-guest-agent&extensions=siderolabs%2Futil-linux-tools&platform=metal&secureboot=undefined&target=metal&version=1.12.2
cluster:
  clusterName: home
  allowSchedulingOnControlPlanes: true
  controlPlane:
    endpoint: https://kubernetes.apocrathia.com:6443
  apiServer:
    certSANs:
      - "10.100.1.8"
      - "kubernetes.apocrathia.com"
    # CRD Controller Specific Optimizations
    extraArgs:
      # Event garbage collection - 1 hour TTL
      event-ttl: "1h"
      max-requests-inflight: "1600"
      max-mutating-requests-inflight: "800"
      request-timeout: "120s"
      # Watch cache sizing for heavy CRD usage
      watch-cache-sizes: "customresourcedefinitions#500,secrets#1000,configmaps#1000,persistentvolumes#200,persistentvolumeclaims#200"
      # Audit optimization to reduce overhead
      audit-log-maxbackup: "3" # Reduce from default 10
      audit-log-maxsize: "50" # Reduce from default 100MB
      # Goaway chance to force client reconnection distribution
      # Helps prevent thundering herd on single API server
      goaway-chance: "0.01"
      # OIDC authentication via Authentik
      oidc-issuer-url: "https://auth.gateway.services.apocrathia.com/application/o/kubernetes/"
      oidc-client-id: "kubernetes"
      oidc-username-claim: "email"
      oidc-username-prefix: "oidc:"
      oidc-groups-claim: "groups"
      oidc-groups-prefix: "oidc:"
    resources:
      requests:
        cpu: "2000m"
        memory: "4Gi" # Increased for larger CRD watch cache
      limits:
        cpu: "5000m" # Allow bursting
        memory: "10Gi" # Increased to accommodate larger watch cache
  network:
    cni:
      name: none
    podSubnets:
      - 10.42.0.0/16
    serviceSubnets:
      - 10.69.0.0/16
  controllerManager:
    extraArgs:
      kube-api-qps: "500" # Increase API calls per second
      kube-api-burst: "1000" # Allow burst API calls
      # Increase leader election lease duration to tolerate etcd latency spikes
      # Default is 15s, increasing to 30s gives more tolerance for I/O spikes
      leader-elect-lease-duration: "30s"
      leader-elect-renew-deadline: "20s" # Default is 10s, increase to 20s
      leader-elect-retry-period: "4s" # Default is 2s, increase to 4s
    resources:
      requests:
        cpu: "200m" # Increase from default 100m
        memory: "512Mi" # Increase from default 256Mi
      limits:
        cpu: "1000m"
        memory: "2Gi"
  proxy:
    disabled: true
  # etcd tuning
  # Increased timeouts to handle storage latency and high load
  # These settings make etcd more tolerant of brief I/O latency spikes
  etcd:
    extraArgs:
      # Auto-compaction
      auto-compaction-mode: "periodic"
      auto-compaction-retention: "12h"
      # Optimize backend quotas and request sizes
      quota-backend-bytes: "4294967296" # 4GB (conservative)
      max-request-bytes: "16777216" # 16MB for large CRD schemas
      # Snapshot settings to reduce I/O frequency
      snapshot-count: "100000" # Increase from default 10000 to reduce I/O under load
      # Timeout settings to reduce timeout errors under load
      # Increase heartbeat interval to reduce coordination overhead
      heartbeat-interval: "250" # 250ms (default 100ms) - more stable under load
      # Increase election timeout to prevent premature leader elections during high load
      election-timeout: "5000" # 5000ms (default 1000ms) - 20x heartbeat-interval for stability
      # Enable initial election tick advance for faster startup
      initial-election-tick-advance: "true"
      # Metrics
      metrics: "basic"
      listen-metrics-urls: "http://0.0.0.0:2381"
---
# Disable Talos's broke-ass OOM controller
apiVersion: v1alpha1
kind: OOMConfig
triggerExpression: "false"
cgroupRankingExpression: "0.0"
sampleInterval: "5s"
---
# Layer 2 VIP for Kubernetes API (replaces deprecated machine.network.interfaces[].vip)
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.100.1.8
link: eth0
---
# DNS resolvers (overrides Talos defaults of 1.1.1.1 and 8.8.8.8)
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.100.1.1
---
# NTP time servers (replaces deprecated machine.time)
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - pool.ntp.org
