{{- if .Values.postgres.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.app.name }}-postgres
  namespace: {{ .Values.app.namespace | default .Values.app.name }}
spec:
  # PostgreSQL version
  imageName: {{ .Values.postgres.imageName }}

  # Number of instances
  instances: {{ .Values.postgres.instances }}

  # Storage configuration
  storage:
    storageClass: {{ .Values.postgres.storage.storageClass }}
    size: {{ .Values.postgres.storage.size }}

  # PostgreSQL-specific configuration
  postgresql:
    {{- if .Values.postgres.postgresql.parameters }}
    parameters:
      {{- range $key, $value := .Values.postgres.postgresql.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
    {{- end }}

  # Resource limits to prevent OOM kills
  {{- if .Values.postgres.resources }}
  resources:
    {{- if .Values.postgres.resources.requests }}
    requests:
      {{- if .Values.postgres.resources.requests.memory }}
      memory: {{ .Values.postgres.resources.requests.memory | quote }}
      {{- end }}
      {{- if .Values.postgres.resources.requests.cpu }}
      cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.postgres.resources.limits }}
    limits:
      {{- if .Values.postgres.resources.limits.memory }}
      memory: {{ .Values.postgres.resources.limits.memory | quote }}
      {{- end }}
      {{- if .Values.postgres.resources.limits.cpu }}
      cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
      {{- end }}
    {{- end }}
  {{- end }}

  # Affinity settings for better performance (CloudNativePG-specific)
  {{- if .Values.postgres.affinity }}
  affinity:
    {{- if hasKey .Values.postgres.affinity "enablePodAntiAffinity" }}
    enablePodAntiAffinity: {{ .Values.postgres.affinity.enablePodAntiAffinity }}
    {{- end }}
    {{- if .Values.postgres.affinity.podAntiAffinityType }}
    podAntiAffinityType: {{ .Values.postgres.affinity.podAntiAffinityType | quote }}
    {{- end }}
    {{- if .Values.postgres.affinity.topologyKey }}
    topologyKey: {{ .Values.postgres.affinity.topologyKey | quote }}
    {{- end }}
  {{- end }}

  {{- if .Values.postgres.backup.enabled }}
  # Barman backups: S3-compatible object store (rustfs). WAL archiving is
  # continuous; base backups are triggered by the ScheduledBackup resource.
  backup:
    retentionPolicy: {{ .Values.postgres.backup.retentionPolicy }}
    barmanObjectStore:
      destinationPath: {{ default (printf "s3://cnpg/%s" .Values.app.name) .Values.postgres.backup.destinationPath }}
      endpointURL: {{ default "http://storage.services.apocrathia.com:9009" .Values.postgres.backup.endpointURL }}
      serverName: {{ default (printf "%s-postgres" .Values.app.name) .Values.postgres.backup.serverName }}
      s3Credentials:
        accessKeyId:
          name: {{ default (printf "%s-postgres-backup-secrets" .Values.app.name) .Values.postgres.backup.credentials.secretName }}
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: {{ default (printf "%s-postgres-backup-secrets" .Values.app.name) .Values.postgres.backup.credentials.secretName }}
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: {{ .Values.postgres.backup.wal.compression }}
      data:
        compression: {{ .Values.postgres.backup.data.compression }}
        jobs: {{ .Values.postgres.backup.data.jobs }}
        immediateCheckpoint: {{ .Values.postgres.backup.data.immediateCheckpoint }}
  {{- end }}

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database | default .Values.app.name }}
      owner: {{ .Values.postgres.owner | default .Values.app.name }}
      secret:
        name: {{ .Values.app.name }}-secrets
{{- end }}
