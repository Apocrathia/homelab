{{- $gatus := .Values.gatus | default dict }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.app.namespace | default .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
  {{- if and (hasKey $gatus "enabled") $gatus.enabled }}
  {{- $ns := .Values.app.namespace | default .Values.app.name }}
  {{- $port := .Values.app.service.port | default 80 }}
  {{- $url := printf "http://%s.%s.svc:%v" .Values.app.name $ns $port }}
  {{- if and (hasKey $gatus "url") (ne $gatus.url "") }}
  {{- $url = $gatus.url }}
  {{- end }}
  {{- if and (hasKey $gatus "path") (ne $gatus.path "") }}
  {{- $url = printf "%s%s" $url $gatus.path }}
  {{- end }}
  {{- $group := .Values.app.name }}
  {{- if and (hasKey $gatus "group") (ne $gatus.group "") }}
  {{- $group = $gatus.group }}
  {{- end }}
  {{- $conditions := list "[STATUS] == 200" }}
  {{- if hasKey $gatus "conditions" }}
  {{- $conditions = $gatus.conditions }}
  {{- end }}
  {{- $endpoint := dict "group" $group "url" $url "conditions" $conditions }}
  {{- if and (hasKey $gatus "interval") (ne $gatus.interval "") }}
  {{- $_ := set $endpoint "interval" $gatus.interval }}
  {{- end }}
  {{- $endpoint = mergeOverwrite $endpoint ($gatus.endpoint | default dict) }}
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
{{ toYaml $endpoint | indent 6 }}
  {{- end }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: {{ .Values.app.service.portName | default "http" }}
      port: {{ .Values.app.service.port | default 80 }}
      targetPort: {{ .Values.app.service.targetPort | default 80 }}
      protocol: TCP
    {{- if .Values.app.extraServicePorts }}
    {{- range .Values.app.extraServicePorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
    {{- end }}
  type: {{ .Values.app.service.type | default "ClusterIP" }}
