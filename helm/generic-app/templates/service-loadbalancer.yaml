{{- $lb := .Values.loadbalancer | default dict }}
{{- if $lb.enabled }}
---
# Separate LoadBalancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-external
  namespace: {{ .Values.app.namespace | default .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
    app.kubernetes.io/name: {{ .Values.app.name }}
    external: "true"
    {{- with $lb.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    io.cilium/lb-ipam-ips: "{{ $lb.ip }}"
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    {{- range ($lb.ports | default list) }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  type: LoadBalancer
  externalTrafficPolicy: {{ $lb.externalTrafficPolicy | default "Local" }}
{{- end }}
