{{- if and .Values.authentik.enabled (eq .Values.authentik.mode "bookmark") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-{{ .Values.app.name }}
  namespace: {{ .Values.app.namespace | default .Values.app.name }}
  labels:
    authentik_blueprint: "true"
data:
  {{ .Values.app.name }}.yaml: |
    ---
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: {{ .Values.app.name }}
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context: {}
    entries:
      # Application for {{ .Values.authentik.displayName }} (Bookmark)
      - model: authentik_core.application
        state: present
        identifiers:
          slug: "{{ .Values.app.name }}"
        attrs:
          name: "{{ .Values.authentik.displayName }}"
          slug: "{{ .Values.app.name }}"
          group: "{{ .Values.authentik.category | default "Applications" }}"
          meta_launch_url: "{{ .Values.authentik.externalHost }}"
          open_in_new_tab: {{ if (hasKey .Values.authentik "openInNewTab") }}{{ .Values.authentik.openInNewTab }}{{ else }}true{{ end }}
          {{- if .Values.authentik.icon }}
          icon: "{{ .Values.authentik.icon }}"
          {{- end }}
          {{- if .Values.authentik.metaDescription }}
          meta_description: "{{ .Values.authentik.metaDescription }}"
          {{- end }}
          {{- if .Values.authentik.metaPublisher }}
          meta_publisher: "{{ .Values.authentik.metaPublisher }}"
          {{- end }}

      # Admins group binding (app access)
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, "{{ .Values.app.name }}"]]
          group: !Find [authentik_core.group, [name, "admins"]]
        attrs:
          order: 10
      {{- if and .Values.authentik.shared (not .Values.tailnet.enabled) }}
      {{- fail "authentik.shared: true requires tailnet.enabled: true - a users binding without tailnet exposure would be unreachable for friends" }}
      {{- end }}
      {{- if .Values.authentik.shared }}

      # Users group binding (app access) - the shared tag
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, "{{ .Values.app.name }}"]]
          group: !Find [authentik_core.group, [name, "users"]]
        attrs:
          order: 20
      {{- end }}
{{- end }}
