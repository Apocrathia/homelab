---
# Default values for generic-app
# This is a YAML-formatted file

app:
  # Application name - used for resource naming
  name: demo-app
  # Namespace - if not specified, uses app.name
  namespace: ""

  # Container image (single value for renovate compatibility)
  image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d

  container:
    name: nginx
    port: 80
    # Optional: keep stdin open / allocate a TTY for the main container.
    # Useful for "CLI-as-server" workloads that read from stdin and exit on
    # EOF (e.g., DuckDB CLI with -cmd "CALL start_ui_server();" — without
    # stdin: true the process exits as soon as the SQL completes).
    # stdin: true
    # tty: false
    # Optional: expose extra container ports
    # Optional: set environment variables
    # env:
    #   - name: EXAMPLE_VAR
    #     value: "example"
    #   - name: SECRET_VAR
    #     valueFrom:
    #       secretKeyRef:
    #         name: my-secret
    #         key: password
    # extraPorts:
    #   - name: satellite
    #     containerPort: 16622
    #     protocol: TCP
    #   - name: satellite-2
    #     containerPort: 16623
    #     protocol: TCP

  # Optional: override the default container command
  # command: ["/custom/entrypoint"]

  # Optional: override the default container arguments
  # args: ["--custom-arg", "value"]

  # Init containers configuration
  initContainers: []
  # Example init container configuration:
  # initContainers:
  #   - name: fix-permissions
  #     image: busybox:alpine
  #     command: ["sh", "-c"]
  #     args: ["chown -R 1000:1000 /app/assets"]
  #     volumeMounts:
  #       - name: demo-app-data
  #         mountPath: /app
  #     volumes:
  #       emptyDir:
  #         - name: temp
  #           mountPath: /tmp
  #       configMap:
  #         - name: init-config
  #           mountPath: /etc/init
  #           configMapName: init-configmap
  #       secret:
  #         - name: tls-cert
  #           mountPath: /etc/tls
  #           secretName: my-tls-secret
  #           readOnly: true
  #     restartPolicy: Always  # Optional: keep init container running (useful for VPN sidecars)
  #     securityContext:
  #       runAsUser: 0
  #       runAsGroup: 0
  #       runAsNonRoot: false
  #       readOnlyRootFilesystem: false  # Required for package installation (apk, apt, etc.)
  #
  # Example VPN sidecar using init container with restartPolicy:
  # initContainers:
  #   - name: vpn-sidecar
  #     image: vpn-client:latest
  #     restartPolicy: Always  # Keep VPN container running as sidecar
  #     env:
  #       - name: VPN_PROVIDER
  #         valueFrom:
  #           secretKeyRef:
  #             name: app-secrets
  #             key: vpn-provider
  #       - name: VPN_USERNAME
  #         valueFrom:
  #           secretKeyRef:
  #             name: app-secrets
  #             key: vpn-username
  #       - name: VPN_PASSWORD
  #         valueFrom:
  #           secretKeyRef:
  #             name: app-secrets
  #             key: vpn-password
  #       - name: VPN_REGION
  #         valueFrom:
  #           secretKeyRef:
  #             name: app-secrets
  #             key: vpn-region
  #       - name: ALLOWED_PORTS
  #         value: "8080"  # Allow app port through VPN firewall
  #     lifecycle:
  #       postStart:
  #         exec:
  #           command: ["/bin/sh", "-c", "echo 'VPN sidecar started' && sleep 5"]
  #       preStop:
  #         exec:
  #           command: ["/bin/sh", "-c", "echo 'VPN sidecar stopping' && sleep 2"]
  #     # Alternative lifecycle handlers:
  #     # lifecycle:
  #     #   postStart:
  #     #     httpGet:
  #     #       path: /health
  #     #       port: 8080
  #     #       scheme: HTTP
  #     #   preStop:
  #     #     tcpSocket:
  #     #       port: 8080
  #     # stopSignal: SIGTERM  # Custom stop signal (optional)
  #     securityContext:
  #       privileged: true
  #       allowPrivilegeEscalation: true
  #       capabilities:
  #         add:
  #           - NET_ADMIN
  #       readOnlyRootFilesystem: false
  #       runAsNonRoot: false
  #       runAsUser: "0"
  #     resources:
  #       requests:
  #         cpu: 100m
  #         memory: 128Mi
  #       limits:
  #         cpu: 200m
  #         memory: 256Mi
  #     volumes:
  #       emptyDir:
  #         - name: vpn-data
  #           mountPath: /vpn

  # Sidecar containers configuration
  sidecars: []
  # Example sidecar configuration:
  # sidecars:
  #   - name: nginx-sidecar
  #     image: nginx:alpine
  #     command: ["/bin/sh"]
  #     args: ["-c", "while true; do echo 'Sidecar running'; sleep 30; done"]
  #     # Optional: keep stdin open / allocate a TTY for the sidecar (same
  #     # CLI-as-server pattern as app.container.stdin/tty).
  #     # stdin: true
  #     # tty: false
  #     ports:
  #       - containerPort: 8080
  #         name: sidecar-port
  #     env:
  #       - name: SIDECAR_VAR
  #         value: "sidecar-value"
  #     volumeMounts:
  #       - name: shared-data
  #         mountPath: /shared
  #     volumes:
  #       emptyDir:
  #         - name: sidecar-cache
  #           mountPath: /var/cache/sidecar
  #       configMap:
  #         - name: sidecar-config
  #           mountPath: /etc/sidecar
  #           configMapName: sidecar-configmap
  #       secret:
  #         - name: tls-cert
  #           mountPath: /etc/tls
  #           secretName: my-tls-secret
  #           readOnly: true
  #     # Optional: sidecar-specific security context
  #     # If not specified, inherits from app.securityContext
  #     securityContext:
  #       runAsUser: 0
  #       runAsNonRoot: false
  #       allowPrivilegeEscalation: true
  #       capabilities:
  #         add:
  #           - NET_ADMIN
  #           - SYS_ADMIN
  #         drop:
  #           - ALL
  #       readOnlyRootFilesystem: false
  #     resources:
  #       requests:
  #         cpu: 10m
  #         memory: 16Mi
  #       limits:
  #         cpu: 50m
  #         memory: 32Mi
  #     # Optional: sidecar lifecycle hooks
  #     lifecycle:
  #       postStart:
  #         exec:
  #           command: ["/bin/sh", "-c", "echo 'Sidecar started' && sleep 2"]
  #       preStop:
  #         exec:
  #           command: ["/bin/sh", "-c", "echo 'Sidecar stopping' && sleep 1"]
  #     # Optional: sidecar health checks
  #     healthChecks:
  #       livenessProbe:
  #         enabled: true
  #         httpGet:
  #           path: /health
  #           port: 8080
  #         initialDelaySeconds: 30
  #         periodSeconds: 10
  #         timeoutSeconds: 5
  #         failureThreshold: 3
  #         successThreshold: 1
  #       readinessProbe:
  #         enabled: true
  #         httpGet:
  #           path: /ready
  #           port: 8080
  #         initialDelaySeconds: 10
  #         periodSeconds: 5
  #         timeoutSeconds: 3
  #         failureThreshold: 3
  #         successThreshold: 1

  # Pod annotations (e.g., for OpenTelemetry auto-instrumentation)
  podAnnotations: {}
  # Example:
  # podAnnotations:
  #   instrumentation.opentelemetry.io/inject-python: "otel-system/python"

  # Deployment configuration
  replicas: 1

  # Deployment strategy (defaults to Recreate to avoid Multi-Attach errors)
  # Use "RollingUpdate" only for stateless apps that need zero-downtime updates
  # strategy: "RollingUpdate"
  # strategy:
  #   rollingUpdate:
  #     maxSurge: "25%"
  #     maxUnavailable: "25%"

  # Pod anti-affinity configuration (helps spread replicas across nodes)
  podAntiAffinity:
    enabled: true

  # DNS configuration for pod (optional)
  # dnsConfig:
  #   # Custom DNS nameservers
  #   nameservers:
  #     - "10.69.0.10" # Cluster DNS
  #   # DNS search domains
  #   searches:
  #     - "default.svc.cluster.local"
  #     - "svc.cluster.local"
  #     - "cluster.local"
  #   # DNS resolver options
  #   options:
  #     - name: ndots
  #       value: "1" # Reduce search domain lookups for external domains

  # Disable SA token mounting by default (security best practice)
  # Set to true only if your app needs Kubernetes API access
  automountServiceAccountToken: false

  # Security context (defaults to 1000)
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    # File system group change policy for volume ownership
    # "OnRootMismatch" automatically changes volume ownership when it doesn't match fsGroup
    # fsGroupChangePolicy: "OnRootMismatch"
    # Allow disabling readOnlyRootFilesystem for containers that need write access during init
    # (e.g., LinuxServer.io containers with s6-overlay)
    readOnlyRootFilesystem: true
    # Allow containers to run as root (e.g., LinuxServer.io containers with s6-overlay)
    runAsNonRoot: true
    # Allow privilege escalation if needed for init processes
    allowPrivilegeEscalation: false
    # Container capabilities configuration
    # capabilities:
    #   # Capabilities to add (useful for init containers or special requirements)
    #   add:
    #     - SETUID      # Allow changing user IDs
    #     - SETGID      # Allow changing group IDs
    #     - CHOWN       # Allow changing file ownership
    #     - DAC_OVERRIDE # Allow bypassing file permission checks
    #   # Capabilities to drop (defaults to ALL if not specified)
    #   drop:
    #     - NET_RAW     # Drop network raw socket capability

  # Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Container lifecycle hooks (postStart and preStop)
  # lifecycle: {}
  # Example lifecycle configuration:
  # lifecycle:
  #   postStart:
  #     exec:
  #       command: ["/bin/sh", "-c", "echo 'Application started' && touch /tmp/app-ready"]
  #   preStop:
  #     exec:
  #       command: ["/bin/sh", "-c", "echo 'Application stopping' && sleep 5"]
  # Alternative lifecycle handlers:
  # lifecycle:
  #   postStart:
  #     httpGet:
  #       path: /health
  #       port: 80
  #       scheme: HTTP
  #   preStop:
  #     tcpSocket:
  #       port: 80

  # Health check probes (liveness, readiness, startup)
  # healthChecks: {}
  # Example HTTP GET probe configuration:
  # healthChecks:
  #   livenessProbe:
  #     enabled: true
  #     httpGet:
  #       path: /health
  #       port: 80
  #       scheme: HTTP
  #       httpHeaders:
  #         - name: Custom-Header
  #           value: "value"
  #     initialDelaySeconds: 30
  #     periodSeconds: 10
  #     timeoutSeconds: 5
  #     failureThreshold: 3
  #     successThreshold: 1
  #   readinessProbe:
  #     enabled: true
  #     httpGet:
  #       path: /ready
  #       port: 80
  #       scheme: HTTP
  #     initialDelaySeconds: 10
  #     periodSeconds: 5
  #     timeoutSeconds: 3
  #     failureThreshold: 3
  #     successThreshold: 1
  #   startupProbe:
  #     enabled: true
  #     httpGet:
  #       path: /health
  #       port: 80
  #       scheme: HTTP
  #     initialDelaySeconds: 10
  #     periodSeconds: 10
  #     timeoutSeconds: 3
  #     failureThreshold: 30
  #     successThreshold: 1
  # Example exec probe configuration:
  # healthChecks:
  #   livenessProbe:
  #     enabled: true
  #     exec:
  #       command:
  #         - /bin/sh
  #         - -c
  #         - "test -f /tmp/healthy"
  #     initialDelaySeconds: 30
  #     periodSeconds: 10
  #     timeoutSeconds: 5
  #     failureThreshold: 3
  #     successThreshold: 1
  # Example TCP socket probe configuration:
  # healthChecks:
  #   livenessProbe:
  #     enabled: true
  #     tcpSocket:
  #       port: 80
  #     initialDelaySeconds: 30
  #     periodSeconds: 10
  #     timeoutSeconds: 5
  #     failureThreshold: 3
  #     successThreshold: 1

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    portName: http

  # Volume configuration
  volumes:
    # EmptyDir volumes
    emptyDir: []
    # Example emptyDir volumes:
    # emptyDir:
    #   - name: temp
    #     mountPath: /tmp
    #   - name: shm
    #     mountPath: /dev/shm
    #     medium: Memory  # Use Memory for RAM-based storage (tmpfs), omit for filesystem
    #     sizeLimit: "2Gi"
    # ConfigMap volumes
    configMap: []
    # Example ConfigMap volumes:
    # configMap:
    #   - name: my-config
    #     mountPath: /etc/config
    #     subPath: config.yaml
    #     readOnly: true
    #     configMapName: my-configmap
    # Secret volumes
    secret: []
    # Example Secret volumes:
    # secret:
    #   - name: my-secret
    #     mountPath: /etc/secret
    #     subPath: credentials.yaml
    #     readOnly: true
    #     secretName: my-secret-name

  # Volume mounts - references pod-wide storage volumes (from storage section)
  # Volume names will be prefixed with app.name (e.g., "myapp-config")
  # Can be used alongside app.volumes for local storage (emptyDir, configMap)
  volumeMounts: []
  # Example volume mounts for pod-wide storage:
  # volumeMounts:
  #   - name: data
  #     mountPath: /app/data
  #   - name: shared-files
  #     mountPath: /shared
  #     readOnly: true
  #   - name: cache
  #     mountPath: /tmp/cache

# Storage configuration - defines available volumes
storage:
  # Longhorn persistent storage
  longhorn:
    enabled: false
    # Number of replicas for Longhorn volumes (align with cluster Longhorn default unless workload is HA-critical)
    # Can be overridden per-volume by setting numberOfReplicas on individual entries
    numberOfReplicas: 2
    volumes: []

  # SMB storage for read-only files
  smb:
    enabled: false
    volumes: []
    # Default CIFS mount options applied to every SMB volume; a per-volume
    # `mountOptions` list overrides these for that volume.
    # vers=3.0 avoids SMB3.1.1 POSIX negotiation, whose server-side uid
    # tracking makes chmod(2) fail with EPERM (RomM's RA hash cache, atomic
    # writes). uid aligns client-side file ownership with the container user
    # so the VFS lets non-root processes chmod. noperm skips client-side
    # permission checks; the SMB session user is the real gate server-side.
    # Example SMB volume configuration:
    # volumes:
    #   - name: media
    #     source: "//smb-server/share"
    #     subDir: "media"
    #     capacity: "100Gi"
    #     credentialsPath: "vaults/Secrets/items/smb-credentials"
    #     readOnly: true  # Set to false for read-write access
    #     createSubDir: "true"  # optional; SMB CSI creates subDir on the server if missing

    # Default CIFS mount options applied to every SMB volume; a per-volume
    # `mountOptions` list overrides these for that volume.
    # vers=3.0 avoids SMB3.1.1 POSIX negotiation, whose server-side uid
    # tracking makes chmod(2) fail with EPERM (RomM's RA hash cache, atomic
    # writes). uid aligns client-side file ownership with the container user
    # so the VFS lets non-root processes chmod. noperm skips client-side
    # permission checks; the SMB session user is the real gate server-side.
    mountOptions:
      - vers=3.0
      - uid=1000
      - noperm

  # EmptyDir storage
  emptyDir:
    enabled: false
    volumes: []

# 1Password secrets integration
secrets:
  enabled: true
  itemPath: "vaults/Secrets/items/demo-app-secrets"

# Authentik SSO integration
authentik:
  enabled: true
  # Provider mode: "proxy", "oidc", or "bookmark"
  # - proxy: Creates proxy provider + outpost (blueprint lane); the tofu
  #   lane renders the proxy provider only — outposts consolidate into the
  #   shared tofu-owned outposts in the authentik tree
  # - oidc: Creates OAuth2 provider, app handles auth via OAuth flow (requires app OIDC support)
  # - bookmark: Creates a dashboard-only entry in Authentik (no auth provider or outpost)
  mode: "proxy"

  # Stack owner: "blueprint" (default/legacy) or "terraform" (the tofu lane).
  # - blueprint: chart renders the authentik blueprint ConfigMaps (mode
  #   proxy/oidc/bookmark) — unchanged behavior for every un-flipped app.
  # - terraform: chart renders the provider-opentofu docs (OnePasswordItem +
  #   ProviderConfig + Workspace, source: Inline) with CHART-GENERATED
  #   per-app HCL composed from the values below — all three modes
  #   (bookmark = the tile shape: application + bindings, no provider).
  #   Inline HCL only: NO module refs, NO chart-tag pins, NO varmap.
  #   THE DEFAULT: new apps deploy tofu-first; the blueprint lane is retired.
  managedBy: "terraform"

  # The tofu lane composes from the same values the blueprint templates
  # read — every value lands INLINE in the generated HCL. There is no
  # values-side varmap: the Workspace spec.forProvider.varmap is the
  # GATE-TIME-ONLY adoption carrier (recipe §8 born-with-varmap: the
  # witness ids — provider pk, binding uuids, custom-mapping pm_uuids —
  # are patched onto the LIVE Workspace object once at the flip gate and
  # cleared after; they NEVER enter git). Per-app config deltas become
  # values keys here, never raw HCL edits.
  #
  # Dead keys on the tofu path (blueprint/outpost machinery the tofu lane
  # never reads): authentikHostInsecure, serviceConnection, replicas,
  # namespace, logLevel, gateway.* (the shared tofu-owned outposts own
  # the outpost shape now), oidc.clientSecret (Sensitive — generated
  # server-side, tofu must not manage it), oidc.tokenValidity (dead attr
  # in authentik 2026.8).

  # Share this app with the users tier / friends; adds the users group binding.
  # Requires tailnet.enabled - friends reach apps over the tailnet, so a users
  # binding without tailnet exposure fails the render (see templates).
  shared: false

  # Common settings (both modes)
  displayName: "Demo Application"
  externalHost: "https://demo.gateway.services.apocrathia.com"
  # Direct SSO entrypoint for the library tile; leave unset for the app's own URL
  ssoLaunchUrl: ""
  icon: "https://i.imgur.com/0gNsvyk.png"
  openInNewTab: true
  # Category for organizing applications in Authentik dashboard
  # Common categories: Applications, Infrastructure, External
  category: "Applications"

  # Application metadata (shown in Authentik dashboard)
  # metaDescription: "Brief description of the application"
  # metaPublisher: "Publisher or vendor name"

  # Flow configuration (both modes)
  authorizationFlow: "default-provider-authorization-implicit-consent"
  invalidationFlow: "default-invalidation-flow"

  # ============================================================
  # Proxy mode settings (only when mode: "proxy")
  # ============================================================
  # In-cluster service URL the proxy forwards to; empty composes
  # http://<app>.<namespace>.svc.cluster.local:<service.port>
  internalHost: ""

  # Enable header-based authentication for reverse proxy auth. The tofu
  # lane ALWAYS sends this in the HCL (the TF resource default true must
  # never silently PATCH a live row)
  interceptHeaderAuth: false

  # Unauthenticated paths configuration (regex patterns)
  # Paths matching these patterns will bypass authentik authentication
  # The tofu lane joins the list into skip_path_regex with newlines,
  # byte-verbatim, no trailing newline (the grafana 18-byte lesson)
  # Example:
  # skipPathRegex:
  #   - "^/$"
  #   - "^/.well-known/"
  #   - "^/api/"
  skipPathRegex: []

  # Proxy provider token validity — ALWAYS sent in the tofu HCL (the TF
  # resource default minutes=10 would PATCH live rows sitting at the
  # authentik model default hours=1)
  accessTokenValidity: "hours=1"

  # Authentication flow (proxy mode only)
  authenticationFlow: "default-authentication-flow"

  # Authentik server configuration. authentikHost is alive on both lanes
  # (the tofu provider block reads it as its url); authentikHostInsecure +
  # serviceConnection are blueprint-outpost machinery — dead on the tofu
  # path (the shared tofu-owned outposts own the outpost shape now)
  authentikHost: "https://auth.gateway.services.apocrathia.com"
  authentikHostInsecure: true
  serviceConnection: "Local Kubernetes Cluster"

  # Outpost configuration (blueprint lane only — dead on the tofu path:
  # no outpost resource renders; the shared tofu-owned outposts own
  # outposts)
  replicas: 1
  namespace: authentik
  logLevel: info

  # Gateway configuration (blueprint lane only - the outpost creates the
  # HTTPRoute; dead on the tofu path)
  gateway:
    name: main-gateway
    namespace: cilium-system
    sectionName: https

  # ============================================================
  # OIDC mode settings (only when mode: "oidc")
  # ============================================================
  oidc:
    # OAuth2 redirect URIs - where Authentik redirects after auth
    # Each URI needs a url and matchingMode ("strict" or "regex")
    redirectUris: []
    # Example:
    # redirectUris:
    #   - url: "https://demo.gateway.services.apocrathia.com/oauth/callback"
    #     matchingMode: "strict"
    #   - url: "app.myapp:///oauth-callback"
    #     matchingMode: "strict"

    # OAuth2 scopes to include in tokens
    # Standard scopes reference built-in Authentik scope mappings by scope_name
    scopes:
      - "openid"
      - "email"
      - "profile"

    # Custom scope mappings for apps needing modified claim expressions
    # These create app-specific scope mappings and reference them by name
    # Example: apps requiring email_verified: True in the email scope
    # customScopeMappings:
    #   - name: "myapp-email-verified-mapping"
    #     scopeName: "email"
    #     description: "Email address with email_verified set to True"
    #     expression: |
    #       return {
    #           "email": request.user.email,
    #           "email_verified": True
    #       }

    # Client type: "confidential" (with secret) or "public" (no secret, e.g., mobile apps)
    clientType: "confidential"

    # Subject mode - what to use as the "sub" claim in tokens
    # Options: "hashed_user_id", "user_id", "user_uuid", "user_username", "user_email"
    subMode: "user_username"

    # Include claims in ID token (vs requiring userinfo endpoint call)
    includeClaimsInIdToken: true

    # Issuer mode - how to construct the issuer URL
    # Options: "global" (shared issuer) or "per_provider" (unique per provider)
    issuerMode: "per_provider"

    # Signing key for JWT tokens
    signingKey: "authentik Self-signed Certificate"

    # Token validity periods — all three are ALWAYS sent in the tofu HCL
    # (a TF resource default must never silently PATCH a live row)
    accessCodeValidity: "minutes=1"
    accessTokenValidity: "minutes=5"
    refreshTokenValidity: "days=30"
    # tokenValidity is DEAD in authentik 2026.8 (no column, not in the
    # goauthentik 2026.8.0 TF schema) — the tofu lane never writes it

    # Grant types, pinned live-verbatim (the MISP lesson): the tofu HCL
    # ALWAYS sends grant_types explicitly — the authentik 2026.8 API no
    # longer backfills it and an empty set rejects every authorize
    # request. Default = the blueprint-era 2-value shape; a flip MR pins
    # the app's LIVE row (a default-set row reproduces the full seven
    # explicitly).
    grantTypes:
      - "authorization_code"
      - "refresh_token"

    # client_id lane 2 — static literal for fresh creates (misp/opencti
    # style). Mutually exclusive with clientIdFromSecret.enabled:
    # clientId: ""
    # clientSecret: never on the tofu path (Sensitive, generated
    # server-side — tofu must not manage it)

    # client_id lane 1 — the 1Password Secret file lane: the ProviderConfig
    # materializes the SAME Secret key the app consumes as the
    # oidc-client-id file, and the tofu HCL reads
    # client_id = trimspace(file("oidc-client-id")) — the value never
    # enters git. The render fails loudly on both lanes set or neither.
    clientIdFromSecret:
      enabled: false
      # Secret name; empty = <app>-secrets (the chart OnePasswordItem)
      name: ""
      # Secret key holding the client id
      key: "oidc-client-id"

# HTTPRoute configuration
# Use with OIDC mode or when not using Authentik proxy
# Note: Don't enable with proxy mode (outpost creates its own HTTPRoute)
#
# httproute.gateway: parent Gateway for this HTTPRoute (cross-namespace allowed).
# Defaults match main-gateway; set to a dedicated Gateway for a separate LB VIP/TLS front door.
httproute:
  enabled: false
  hostname: demo.gateway.services.apocrathia.com
  gateway:
    name: main-gateway
    namespace: cilium-system
    sectionName: https

# Tailnet sharing (friends/admins over Tailscale split DNS): adds a
# tailnet-gateway parentRef to the route, keeping one hostname and one
# route object for both doors. Access control is Authentik-side (app
# group bindings); enabling this only makes the app reachable.
tailnet:
  enabled: false
  gateway:
    name: tailnet-gateway
    namespace: cilium-system
    sectionName: https-gateway-services

# TCPRoute configuration for additional ports
tcproute:
  enabled: false
  routes: []

# UDPRoute configuration for additional UDP ports
udproute:
  enabled: false
  routes: []

# LoadBalancer configuration for direct external access
loadbalancer:
  enabled: false
  # IP address for the LoadBalancer (required when enabled)
  ip: ""
  # Ports to expose externally (in addition to main service port)
  ports: []
  # External traffic policy for LoadBalancer (Local or Cluster)
  externalTrafficPolicy: Local
  # Optional labels for the LoadBalancer service (e.g., for Cilium IP pool selection)
  labels: {}
  # Example labels configuration:
  # labels:
  #   apocrathia.com/ingest: "true"
  # Example ports configuration:
  # ports:
  #   - name: satellite
  #     port: 16622
  #     targetPort: 16622
  #     protocol: TCP

  # Cilium configuration
  cilium:
    # Network interface for L2 announcements
    interface: eth0
    # Namespace where Cilium resources should be created
    namespace: cilium-system

# Gatus in-cluster uptime probe (gatus-sidecar Service annotations)
# Default on — stamps ClusterIP Service annotations. Opt out with enabled: false
# (Jobs-ish / no-HTTP / noisy apps). Set path: when / is not a valid health check.
gatus:
  enabled: true
  # Endpoint group (defaults to app.name)
  group: ""
  # Probe URL. Empty → http://{{ app.name }}.{{ namespace }}.svc:{{ service.port }}
  # Service ports default to tcp:// in gatus-sidecar unless url forces http/https.
  url: ""
  # Optional path appended to url (e.g. /health)
  path: ""
  # Optional check interval (sidecar default when empty)
  interval: ""
  conditions:
    - "[STATUS] == 200"
  # Escape hatch: merge arbitrary gatus endpoint keys (headers, client, etc.)
  endpoint: {}

# PostgreSQL database support (CloudNativePG)
postgres:
  enabled: false
  # PostgreSQL image version
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  # Number of instances
  instances: 1
  # Storage configuration
  storage:
    storageClass: longhorn
    size: 10Gi
  # Resource limits to prevent OOM kills
  # resources:
  #   requests:
  #     memory: "1Gi"
  #     cpu: "500m"
  #   limits:
  #     memory: "2Gi"
  #     cpu: "2000m"
  # PostgreSQL configuration parameters
  postgresql:
    parameters:
      max_connections: "100"
      track_io_timing: "on"
      track_functions: "all"
      log_statement: "ddl"
      log_min_duration_statement: "1000ms"
      log_min_messages: "INFO"
  # Affinity settings for better performance (CloudNativePG-specific)
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: "preferred"
    topologyKey: "kubernetes.io/hostname"
  # Monitoring configuration (PodMonitor instead of deprecated enablePodMonitor)
  monitoring:
    enabled: false
    interval: 30s
  # Database name (defaults to app.name if not specified)
  database: ""

  # Database owner (defaults to app.name if not specified)
  owner: ""

  # Barman object-store backups — matches the manual pattern from
  # 03-services/authentik/postgres.yaml. Disabled by default; enabling adds
  # continuous WAL archiving plus a ScheduledBackup for nightly base backups.
  backup:
    enabled: false
    # S3 destination. Defaults: bucket `cnpg`, per-app subdirectory
    # (s3://cnpg/{app.name}), rustfs endpoint.
    destinationPath: ""
    endpointURL: ""
    # Barman server name. Defaults to the cluster name ({app.name}-postgres).
    serverName: ""
    # Credentials Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
    # Defaults: OnePasswordItem CR named {app.name}-postgres-backup-secrets
    # referencing the shared cnpg-backups-secrets vault item.
    # Set itemPath: "" to use an existing Secret instead of creating the CR.
    credentials:
      secretName: ""
      itemPath: "vaults/Secrets/items/cnpg-backups-secrets"
    wal:
      compression: zstd
    data:
      compression: gzip
      jobs: 2
      immediateCheckpoint: true
    # Nightly base backup (CNPG 6-field cron, seconds first):
    # "0 0 5 * * *" = daily 0500 UTC = 2300 MST, after the kopia 0200 window.
    # Empty string disables the ScheduledBackup (WAL archiving still runs).
    schedule: "0 0 5 * * *"
    retentionPolicy: 14d

# Kopia backup via kopiur (SnapshotPolicy + SnapshotSchedule).
# Requires the app namespace to carry the label matching the
# ClusterRepository's allowedNamespaces selector
# (backup.apocrathia.com/repo: nas-rustfs) - namespaces are app-owned.
backup:
  enabled: false
  # ClusterRepository to back up to
  repository: nas-rustfs
  # Longhorn volume names (storage.longhorn.volumes[].name) to back up.
  # Empty = all Longhorn volumes. SMB and emptyDir volumes are never included.
  volumes: []
  # GFS retention
  retention:
    keepDaily: 7
    keepWeekly: 4
  # Nightly window; H pins a deterministic per-schedule minute
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
