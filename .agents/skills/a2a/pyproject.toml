[project]
name = "homelab-skill-a2a"
version = "0.1.0"
description = "A2A client for LiteLLM-brokered homelab kagent agents."
requires-python = ">=3.10"
dependencies = ["httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a"]
