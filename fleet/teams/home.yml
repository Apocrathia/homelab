---
# Homelab devices (Mac, iPhone, Linux, …).
# Applied by fleetctl gitops via fleet/.gitlab-ci.yml.
#
# Home enroll secret: CI FLEET_HOME_ENROLL_SECRET (same value as 1Password
# fleetdm-secrets → home-enroll-secret).
#
# macOS CIS Level 1 (Tahoe / macOS 26) from Fleet ee/cis — assessment policies.
# Disk encryption + scripts live in lib/controls/home.yml.
# Slack (FMA): slug is darwin-only; GitOps rejects built-in labels like macOS.
name: Home
policies:
  - path: ../lib/macos/policies/cis-macos-26-l1.yml
  - path: ../lib/macos/policies/slack.yml
  - path: ../lib/all/policies/fleet-dm-was-here.yml
reports:
agent_options:
controls:
  path: ../lib/controls/home.yml
software:
  fleet_maintained_apps:
    - slug: slack/darwin
      self_service: true
settings:
  secrets:
    - secret: "$FLEET_HOME_ENROLL_SECRET"
