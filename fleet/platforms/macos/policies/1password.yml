# 1Password: install when missing, then keep Fleet-maintained version current.
# Requires 1password/darwin under software.fleet_maintained_apps on the same fleet.
#
# Patch policies only fail when the app is installed and outdated — missing
# hosts pass. The install policy covers first-time install.
---
- name: macOS - 1Password installed
  description: >
    Fails when 1Password is not installed.
  resolution: >
    Fleet installs 1Password (1password/darwin). Prefer Fleet over Homebrew
    for this app so installs and uninstalls stay consistent.
  platform: darwin
  query: "SELECT 1 FROM apps WHERE bundle_identifier = 'com.1password.1password'"
  install_software:
    fleet_maintained_app_slug: 1password/darwin
  critical: false
- name: macOS - 1Password up to date
  description: >
    Fails when 1Password is installed but behind the Fleet-maintained app
    metadata.
  resolution: >
    Fleet updates 1Password (1password/darwin). Prefer Fleet over Homebrew for
    this app so installs and uninstalls stay consistent.
  type: patch
  fleet_maintained_app_slug: 1password/darwin
  install_software: true
  platform: darwin
  critical: false
