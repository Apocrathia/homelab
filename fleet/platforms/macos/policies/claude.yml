# Claude: install when missing, then keep Fleet-maintained version current.
# Requires claude/darwin under software.fleet_maintained_apps on the same fleet.
#
# Patch policies only fail when the app is installed and outdated — missing
# hosts pass. The install policy covers first-time install.
---
- name: macOS - Claude installed
  description: >
    Fails when Claude is not installed.
  resolution: >
    Fleet installs Claude (claude/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  platform: darwin
  query: "SELECT 1 FROM apps WHERE bundle_identifier = 'com.anthropic.claudefordesktop'"
  install_software:
    fleet_maintained_app_slug: claude/darwin
  critical: false
- name: macOS - Claude up to date
  description: >
    Fails when Claude is installed but behind the Fleet-maintained app metadata.
  resolution: >
    Fleet updates Claude (claude/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  type: patch
  fleet_maintained_app_slug: claude/darwin
  install_software: true
  platform: darwin
  critical: false
