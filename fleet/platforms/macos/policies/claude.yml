# Claude: keep the Fleet-maintained version current — update only, never
# install. Requires claude/darwin under software.fleet_maintained_apps on the
# same fleet.
#
# The patch policy only fails when the app is installed and outdated — missing
# hosts pass, so Fleet never installs it.
---
- name: macOS - Claude up to date
  description: >
    Fails when Claude is installed but behind the Fleet-maintained app metadata.
  resolution: >
    Fleet updates Claude (claude/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  type: patch
  fleet_maintained_app_slug: claude/darwin
  install_software: true
  platform: darwin
  critical: false
