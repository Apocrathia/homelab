# Rectangle: keep the Fleet-maintained version current — update only, never
# install. Requires rectangle/darwin under software.fleet_maintained_apps on the
# same fleet.
#
# The patch policy only fails when the app is installed and outdated — missing
# hosts pass, so Fleet never installs it.
---
- name: macOS - Rectangle up to date
  description: >
    Fails when Rectangle is installed but behind the Fleet-maintained app
    metadata.
  resolution: >
    Fleet updates Rectangle (rectangle/darwin).
  type: patch
  fleet_maintained_app_slug: rectangle/darwin
  install_software: true
  platform: darwin
  critical: false
