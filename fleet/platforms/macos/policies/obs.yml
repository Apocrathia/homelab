# OBS: keep the Fleet-maintained version current — update only, never
# install. Requires obs/darwin under software.fleet_maintained_apps on the
# same fleet.
#
# The patch policy only fails when the app is installed and outdated — missing
# hosts pass, so Fleet never installs it.
---
- name: macOS - OBS up to date
  description: >
    Fails when OBS is installed but behind the Fleet-maintained app
    metadata.
  resolution: >
    Fleet updates OBS (obs/darwin).
  type: patch
  fleet_maintained_app_slug: obs/darwin
  install_software: true
  platform: darwin
  critical: false
