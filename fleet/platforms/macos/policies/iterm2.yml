# iTerm2: install when missing, then keep Fleet-maintained version current.
# Requires iterm2/darwin under software.fleet_maintained_apps on the same fleet.
#
# Patch policies only fail when the app is installed and outdated — missing
# hosts pass. The install policy covers first-time install.
---
- name: macOS - iTerm2 installed
  description: >
    Fails when iTerm2 is not installed.
  resolution: >
    Fleet installs iTerm2 (iterm2/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  platform: darwin
  query: "SELECT 1 FROM apps WHERE bundle_identifier = 'com.googlecode.iterm2'"
  install_software:
    fleet_maintained_app_slug: iterm2/darwin
  critical: false
- name: macOS - iTerm2 up to date
  description: >
    Fails when iTerm2 is installed but behind the Fleet-maintained app metadata.
  resolution: >
    Fleet updates iTerm2 (iterm2/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  type: patch
  fleet_maintained_app_slug: iterm2/darwin
  install_software: true
  platform: darwin
  critical: false
