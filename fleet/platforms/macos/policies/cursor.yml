# Cursor: install when missing, then keep Fleet-maintained version current.
# Requires cursor/darwin under software.fleet_maintained_apps on the same fleet.
#
# Patch policies only fail when the app is installed and outdated — missing
# hosts pass. The install policy covers first-time install.
---
- name: macOS - Cursor installed
  description: >
    Fails when Cursor is not installed.
  resolution: >
    Fleet installs Cursor (cursor/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  platform: darwin
  query: "SELECT 1 FROM apps WHERE bundle_identifier = 'com.todesktop.230313mzl4w4u92'"
  install_software:
    fleet_maintained_app_slug: cursor/darwin
  critical: false
- name: macOS - Cursor up to date
  description: >
    Fails when Cursor is installed but behind the Fleet-maintained app metadata.
  resolution: >
    Fleet updates Cursor (cursor/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  type: patch
  fleet_maintained_app_slug: cursor/darwin
  install_software: true
  platform: darwin
  critical: false
