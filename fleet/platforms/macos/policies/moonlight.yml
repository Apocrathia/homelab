# Moonlight: install when missing, then keep Fleet-maintained version current.
# Requires moonlight/darwin under software.fleet_maintained_apps on the same fleet.
#
# Patch policies only fail when the app is installed and outdated — missing
# hosts pass. The install policy covers first-time install.
---
- name: macOS - Moonlight installed
  description: >
    Fails when Moonlight is not installed.
  resolution: >
    Fleet installs Moonlight (moonlight/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  platform: darwin
  query: "SELECT 1 FROM apps WHERE bundle_identifier = 'com.moonlight-stream.Moonlight'"
  install_software:
    fleet_maintained_app_slug: moonlight/darwin
  critical: false
- name: macOS - Moonlight up to date
  description: >
    Fails when Moonlight is installed but behind the Fleet-maintained app metadata.
  resolution: >
    Fleet updates Moonlight (moonlight/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  type: patch
  fleet_maintained_app_slug: moonlight/darwin
  install_software: true
  platform: darwin
  critical: false
