# Slack: keep the Fleet-maintained version current — update only, never
# install. Requires slack/darwin under software.fleet_maintained_apps on the
# same fleet.
# Do not use built-in labels (e.g. macOS) — fleetctl gitops rejects them.
#
# The patch policy only fails when the app is installed and outdated — missing
# hosts pass, so Fleet never installs it.
---
- name: macOS - Slack up to date
  description: >
    Fails when Slack is installed but behind the Fleet-maintained app metadata.
  resolution: >
    Fleet updates Slack (slack/darwin). Prefer Fleet over Homebrew for this
    app so installs and uninstalls stay consistent.
  type: patch
  fleet_maintained_app_slug: slack/darwin
  install_software: true
  platform: darwin
  critical: false
