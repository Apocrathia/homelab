# Global Fleet GitOps config ("No team" / org-wide).
# Applied by fleetctl gitops via fleet/.gitlab-ci.yml.
#
# Required CI/CD variables (masked):
#   FLEET_URL, FLEET_API_TOKEN, FLEET_GLOBAL_ENROLL_SECRET,
#   FLEET_HOME_ENROLL_SECRET (fleets/home.yml)
#
# Docs: https://fleetdm.com/docs/configuration/yaml-files
---
policies:
reports:
agent_options:
controls:
  # Require Apple Silicon Macs (macOS 14+) to pass Apple's hardware
  # attestation challenge (ACME) before DEP/ADE enrollment completes.
  # Intel Macs fall back to SCEP. Fleet Premium, 4.84+.
  apple_require_hardware_attestation: true
org_settings:
  server_settings:
    server_url: $FLEET_URL
  org_info:
    org_name: Homelab
  secrets:
    - secret: "$FLEET_GLOBAL_ENROLL_SECRET"
  sso_settings:
    enable_sso: true
    idp_name: Authentik
    idp_image_url: https://gitlab.com/Apocrathia/homelab/-/raw/main/fleet/platforms/all/icons/authentik.svg
    entity_id: https://fleet.gateway.services.apocrathia.com
    issuer_uri: authentik
    metadata_url: https://auth.gateway.services.apocrathia.com/application/saml/fleetdm/metadata/
    enable_sso_idp_login: true
    enable_jit_provisioning: true
  # End-user (device user) IdP — macOS Setup Assistant (ADE), Windows MDM,
  # Linux Orbit enrollment. Separate SAML connection from staff SSO above:
  # Fleet uses a different ACS URL per connection, and authentik allows one
  # ACS URL per provider, so this points at the fleetdm-mdm application
  # (flux/manifests/04-apps/management/fleet/authentik-blueprint.yaml).
  # entity_id must equal the authentik provider's audience.
  mdm:
    end_user_authentication:
      idp_name: Authentik
      entity_id: https://fleet.gateway.services.apocrathia.com
      metadata_url: https://auth.gateway.services.apocrathia.com/application/saml/fleetdm-mdm/metadata/
