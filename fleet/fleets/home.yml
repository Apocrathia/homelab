---
# Homelab devices (Mac, iPhone, Linux, …).
# Applied by fleetctl gitops via fleet/.gitlab-ci.yml.
#
# Home enroll secret: CI FLEET_HOME_ENROLL_SECRET (same value as 1Password
# fleetdm-secrets → home-enroll-secret).
#
# macOS CIS Level 1 (Tahoe / macOS 26) from Fleet ee/cis — assessment policies.
# Disk encryption + scripts are inlined under controls below.
name: Home
policies:
  - paths: ../platforms/**/policies/**/*.yml
reports:
agent_options:
controls:
  enable_disk_encryption: true
  apple_settings:
    configuration_profiles:
      # CIS 2.1.1.3 — Ensure iCloud Drive Document and Desktop Sync Is Disabled.
      # Prevents files on the Desktop and in Documents from syncing to iCloud.
      - path: ../platforms/macos/configuration-profiles/cis-macos-26/2.1.1.3.mobileconfig
  scripts:
    - paths: ../platforms/all/scripts/*.sh
software:
  fleet_maintained_apps:
    # Install + patch via policies (also listed in My Device).
    - slug: 1password/darwin
      self_service: true
    - slug: ableton-live-suite/darwin
      self_service: true
    - slug: claude/darwin
      self_service: true
    - slug: cursor/darwin
      self_service: true
    - slug: fleet-desktop/darwin
      self_service: true
    - slug: iterm2/darwin
      self_service: true
    - slug: slack/darwin
      self_service: true
    # Self-service only (My Device; no auto-install policies).
    - slug: blender/darwin
      self_service: true
    - slug: chatgpt/darwin
      self_service: true
    - slug: discord/darwin
      self_service: true
    - slug: github/darwin
      self_service: true
    - slug: handbrake-app/darwin
      self_service: true
    - slug: obs/darwin
      self_service: true
    - slug: obsidian/darwin
      self_service: true
    - slug: podman-desktop/darwin
      self_service: true
    - slug: rectangle/darwin
      self_service: true
    - slug: spotify/darwin
      self_service: true
    - slug: steam/darwin
      self_service: true
    - slug: syncthing-app/darwin
      self_service: true
    - slug: tailscale-app/darwin
      self_service: true
    - slug: vlc/darwin
      self_service: true
    - slug: zoom/darwin
      self_service: true
settings:
  secrets:
    - secret: "$FLEET_HOME_ENROLL_SECRET"
