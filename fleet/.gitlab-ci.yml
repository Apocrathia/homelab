# Fleet GitOps — apply org/team YAML via fleetctl gitops.
# Included from the repo root .gitlab-ci.yml.
#
# Triggers:
#   - MR touching this config tree → dry-run
#   - Push to default branch touching this tree → apply
#   - Pipeline schedule with FLEET_GITOPS_SCHEDULE=true → apply (hourly)
#
# CI/CD variables (Settings → CI/CD → Variables, mask secrets):
#   FLEET_URL                  — https://fleet.gateway.services.apocrathia.com
#   FLEET_API_TOKEN            — API-only user token (GitOps role / admin on Free)
#   FLEET_GLOBAL_ENROLL_SECRET — global enroll secret referenced in default.yml
#   FLEET_HOME_ENROLL_SECRET   — Home fleet enroll secret referenced in fleets/home.yml
#   FLEET_GITOPS_SCHEDULE      — set to "true" on the Fleet hourly schedule only
#
# Runner note: in-cluster Kubernetes executor is non-root — no apt-get.
# fleetctl is installed to a job-local npm prefix; version via Node fetch.
---
.fleet-gitops-base:
  stage: deploy
  image: node:24@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
  needs: []
  variables:
    FLEET_DRY_RUN_ONLY: "true"
    FLEET_GITOPS_DIR: $CI_PROJECT_DIR/fleet
    FLEET_CUSTOM_HEADERS: ""
    FLEETCTL_PREFIX: $CI_PROJECT_DIR/.fleetctl-tools
  before_script:
    - |
      missing=""
      for var in FLEET_URL FLEET_API_TOKEN FLEET_GLOBAL_ENROLL_SECRET FLEET_HOME_ENROLL_SECRET; do
        eval "value=\${$var-}"
        if [ -z "$value" ]; then
          missing="${missing} ${var}"
        fi
      done
      if [ -n "$missing" ]; then
        echo "Missing required CI/CD variables:${missing}"
        echo "Configure in GitLab: Settings → CI/CD → Variables"
        exit 1
      fi
    - |
      FLEET_VERSION="$(node <<'NODE'
      const headers = { Authorization: `Bearer ${process.env.FLEET_API_TOKEN}` };
      const raw = process.env.FLEET_CUSTOM_HEADERS || "";
      for (const part of raw.split(",").map((s) => s.trim()).filter(Boolean)) {
        const i = part.indexOf(":");
        if (i > 0) headers[part.slice(0, i).trim()] = part.slice(i + 1).trim();
      }
      fetch(`${process.env.FLEET_URL}/api/v1/fleet/version`, { headers })
        .then(async (r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const j = await r.json();
          process.stdout.write(j.version || "");
        })
        .catch((e) => {
          console.error(`version lookup failed: ${e.message}`);
          process.exit(0);
        });
      NODE
      )"
      mkdir -p "$FLEETCTL_PREFIX"
      if [ -n "$FLEET_VERSION" ]; then
        echo "Installing fleetctl@${FLEET_VERSION}"
        npm install --prefix "$FLEETCTL_PREFIX" "fleetctl@${FLEET_VERSION}" \
          || npm install --prefix "$FLEETCTL_PREFIX" fleetctl
      else
        echo "Installing latest fleetctl"
        npm install --prefix "$FLEETCTL_PREFIX" fleetctl
      fi
      export PATH="${FLEETCTL_PREFIX}/node_modules/.bin:${PATH}"
      fleetctl --version

      FLEETCTL_HEADER_ARGS=()
      if [ -n "${FLEET_CUSTOM_HEADERS:-}" ]; then
        IFS=',' read -ra _CUSTOM_HEADERS <<< "$FLEET_CUSTOM_HEADERS"
        for _header in "${_CUSTOM_HEADERS[@]}"; do
          FLEETCTL_HEADER_ARGS+=(--custom-header "$_header")
        done
      fi
      fleetctl config set --address "$FLEET_URL" --token "$FLEET_API_TOKEN" \
        "${FLEETCTL_HEADER_ARGS[@]}"

fleet-gitops:
  extends: .fleet-gitops-base
  resource_group: fleet-gitops
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - fleet/**/*
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FLEET_GITOPS_SCHEDULE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        FLEET_DRY_RUN_ONLY: "false"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - fleet/**/*
      variables:
        FLEET_DRY_RUN_ONLY: "false"
  script:
    - export PATH="${FLEETCTL_PREFIX}/node_modules/.bin:${PATH}"
    - chmod +x "$FLEET_GITOPS_DIR/gitops.sh"
    - "$FLEET_GITOPS_DIR/gitops.sh"
