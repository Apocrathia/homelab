---
# Path-scoped Trivy suppressions for IaC misconfigs.
# Experimental: CI must pass --ignorefile .trivyignore.yaml explicitly.
#
# Note: for Kubernetes YAML, Trivy reports Target as the basename only, so
# paths cannot pin a full repo path. Matching "cronjob.yaml" / "daemonset.yaml"
# scopes AVD-KSV-0014 to files with those names (not every manifest in the repo).

misconfigurations:
  - id: AVD-KSV-0014
    paths:
      - "cronjob.yaml"
      - "daemonset.yaml"
      - "dind.yaml"
    statement: >-
      Some CronJobs and DaemonSets intentionally leave the root filesystem
      writable (e.g. apt/compile steps in jobs, or tdarr-node transcoding),
      and the pentagi docker-in-docker daemon writes /var/lib/docker and
      /run by design. Prefer fixing with readOnlyRootFilesystem plus
      emptyDir mounts when practical; until then suppress by basename for
      cronjob.yaml, daemonset.yaml, and dind.yaml only.
  - id: AVD-KSV-0017
    paths:
      - "dind.yaml"
    statement: >-
      The pentagi docker-in-docker daemon (pentagi-dind Deployment) must run
      privileged: dockerd needs CAP_SYS_ADMIN, mounts, and iptables inside
      its own namespace. It is the only privileged pod in the pentagi
      namespace (the app pod runs as uid 100 with caps dropped), lives on
      its own 30Gi PVC, and a CiliumNetworkPolicy pins its unauthenticated
      2375 API to the pentagi app pod and kubelet probes. The same waivers
      are annotated on the Deployment for kube-linter
      (ignore-check.kube-linter.io/privileged-container and friends).
  - id: AVD-KSV-0118
    paths:
      - "dind.yaml"
    statement: >-
      The pentagi-dind dockerd runs as root by requirement (docker-in-docker);
      same rationale and compensating controls as AVD-KSV-0017.
  - id: AVD-KSV-0041
    paths:
      - "generate-rbac.yaml"
    statement: >-
      Kyverno intentionally clones and synchronizes the named Docker Hub
      imagePullSecret into opted-in namespaces. Kubernetes RBAC cannot constrain
      Secret creation by resource name or namespace label.
  - id: AVD-KSV-0109
    paths:
      - "report-reader.yaml"
    statement: >-
      Name-only false positive: the ConfigMap key `secret-reports.tql` contains
      the word "secret", but its value is a Tenzir TQL pipeline (file watch,
      read_json, HTTP push) with no secret material.
  - id: AVD-KSV-0056
    paths:
      - "rbac.yaml"
    statement: >-
      The authentik LDAP outpost controller runs in the authentik namespace
      and deploys its Service object into this namespace by design (operator
      decision: the LDAP outpost lives with the app). Kubernetes RBAC cannot
      scope create verbs by resource name, so the Role mirrors the authentik
      chart's own namespaced Role shape, reduced to the resources the
      outpost controller manages. The chart's equivalent Role never hits
      this check only because it is rendered at deploy time, not committed.
