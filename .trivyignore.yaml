---
# Path-scoped Trivy suppressions for IaC misconfigs.
# Experimental: CI must pass --ignorefile .trivyignore.yaml explicitly.
#
# Note: for Kubernetes YAML, Trivy reports Target as the basename only, so
# paths cannot pin a full repo path. Matching "cronjob.yaml" / "daemonset.yaml"
# scopes AVD-KSV-0014 to files with those names (not every manifest in the repo).

misconfigurations:
  - id: AVD-KSV-0014
    paths:
      - "cronjob.yaml"
      - "daemonset.yaml"
    statement: >-
      Some CronJobs and DaemonSets intentionally leave the root filesystem
      writable (e.g. apt/compile steps in jobs, or tdarr-node transcoding).
      Prefer fixing with readOnlyRootFilesystem plus emptyDir mounts when
      practical; until then suppress by basename for cronjob.yaml and
      daemonset.yaml only.
  - id: AVD-KSV-0041
    paths:
      - "generate-rbac.yaml"
    statement: >-
      Kyverno intentionally clones and synchronizes the named Docker Hub
      imagePullSecret into opted-in namespaces. Kubernetes RBAC cannot constrain
      Secret creation by resource name or namespace label.
  - id: AVD-KSV-0056
    paths:
      - "rbac.yaml"
    statement: >-
      The authentik LDAP outpost controller runs in the authentik namespace
      and deploys its Service object into this namespace by design (operator
      decision: the LDAP outpost lives with the app). Kubernetes RBAC cannot
      scope create verbs by resource name, so the Role mirrors the authentik
      chart's own namespaced Role shape, reduced to the resources the
      outpost controller manages. The chart's equivalent Role never hits
      this check only because it is rendered at deploy time, not committed.
  - id: AVD-KSV-0046
    paths:
      - "rbac.yaml"
    statement: >-
      chaos-mesh dashboard viewer ClusterRole: read-only verbs (get/list/watch)
      on the chaos-mesh.org CRD family, whose resource list churns with chart
      versions — the wildcard avoids silent dashboard breakage on chart upgrades
      and is strictly narrower than the chaos-mesh chart's own rendered role
      (resources: ["*"], verbs: ["*"]), which escapes scanning only because it
      is rendered at deploy time. SCOPE WARNING: basename matching suppresses
      KSV-0046 in ALL repo files named rbac.yaml (the other 7 are clean today:
      authentik/kube-auth, 01-bootstrap/flux-system, kuber-ios, tak,
      mcp-servers/flux, litellm, romm); re-audit this entry when adding
      resource wildcards to any rbac.yaml.
