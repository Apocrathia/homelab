---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/name: demo-app
    # Opt-in to the shared kopiur repository (ClusterRepository/nas-rustfs)
    backup.apocrathia.com/repo: nas-rustfs
    # generic-app chart defaults (non-root, read-only rootfs, dropped caps)
    # already satisfy restricted; enforce it so nothing else landing in this
    # namespace can regress.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
