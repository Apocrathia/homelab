---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-nginx-config
  namespace: demo-app
  labels:
    app.kubernetes.io/name: demo-app
data:
  nginx.conf: |
    # Hardened nginx config for demo-app (static verification page, no auth).
    # Runs non-root (UID 1000) with a read-only rootfs; the only writable paths
    # are the emptyDirs mounted at /var/cache/nginx and /run.
    # Replaces the image stock config: no conf.d include on purpose, so the image's
    # default.conf server block does not collide with the server below.

    worker_processes auto;

    error_log /var/log/nginx/error.log warn;
    pid /run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;

        # Hide nginx version in headers and error pages.
        server_tokens off;

        # Tight timeouts and body size: slowloris resistance and flood limiting
        # for an endpoint that serves nothing but small static files.
        keepalive_timeout 30s;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 10s;
        client_max_body_size 1m;

        # Single shared buckets keyed on a constant. The tailnet path arrives
        # through the tailnet-gateway LoadBalancer (TCP) and Cilium envoy, so
        # every client shares the last-hop source address and per-IP keying
        # would collapse into one bucket anyway.
        limit_req_zone $server_name zone=global_req:1m rate=50r/s;
        limit_conn_zone $server_name zone=global_conn:1m;

        server {
            listen 80 default_server;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'" always;

            # Static page: reads only.
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }

            location / {
                limit_req zone=global_req burst=100 nodelay;
                limit_conn global_conn 100;
                try_files $uri $uri/ =404;
            }
        }
    }
