---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-app
  namespace: demo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.83"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: demo-app
      # renovate: datasource=docker depName=public.ecr.aws/nginx/nginx
      image: public.ecr.aws/nginx/nginx:alpine@sha256:42f630b748ea564bfae750a1b170972e0d087fb57fdc7d03cc00bcbe02d1c465
      volumeMounts:
        - name: data
          mountPath: /app
        - name: nginx-html
          mountPath: /usr/share/nginx/html
      volumes:
        configMap:
          - name: demo-app-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
        emptyDir:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /run

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 10Gi
      smb:
        enabled: true
        volumes:
          - name: nginx-html
            source: "//storage.services.apocrathia.com/Library"
            subDir: "Sites/Demo"
            credentialsPath: "vaults/Secrets/items/smb-credentials"

    backup:
      enabled: true
      volumes:
        - data

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/demo-app-secrets"

    # Authentik stack ownership moved to the provider-opentofu Workspace
    # (crossplane.yaml + terraform.tf): provider -> application -> both
    # group bindings -> outpost. This block is the escape hatch: enabled
    # false stops the chart rendering the blueprint ConfigMap, Helm prunes
    # it, and the provider-opentofu workspace imports (adopts) the existing
    # authentik objects in place; no deletion window. The remaining keys
    # are inert context (nothing in the chart reads them with enabled
    # false).
    authentik:
      enabled: false
      shared: true
      category: "Platform"
      displayName: "Demo Application"
      externalHost: "https://demo.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/demo-app/icon.png"

    gatus:
      enabled: true
      group: demo

    httproute:
      enabled: false

    # Tailnet sharing via chart values (outpost-generated route dual-parents)
    tailnet:
      enabled: true
