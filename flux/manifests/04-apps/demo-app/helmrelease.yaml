---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-app
  namespace: demo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      # The inline tofu lane (chart-generated HCL, no module refs, no chart-tag
      # pin) ships in 0.0.87 — the W0 flip bump; the helmrelease stays
      # suspended until the W0 gate (plan §Waves).
      version: "0.0.87"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: demo-app
      # renovate: datasource=docker depName=public.ecr.aws/nginx/nginx
      image: public.ecr.aws/nginx/nginx:alpine@sha256:30f09579a4d753a8df43dd6275b960760b54b5f12dc5fbd057769772422c7608
      volumeMounts:
        - name: data
          mountPath: /app
        - name: nginx-html
          mountPath: /usr/share/nginx/html
      volumes:
        configMap:
          - name: demo-app-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
        emptyDir:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /run

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 10Gi
      smb:
        enabled: true
        volumes:
          - name: nginx-html
            source: "//storage.services.apocrathia.com/Library"
            subDir: "Sites/Demo"
            credentialsPath: "vaults/Secrets/items/smb-credentials"

    backup:
      enabled: true
      volumes:
        - data

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/demo-app-secrets"

    # Authentik stack: chart-rendered provider-opentofu docs (OnePasswordItem
    # + ProviderConfig + Workspace) with CHART-GENERATED inline HCL — the
    # file-pair pattern, same shape as gatus MINUS the outpost: the new
    # proxy shape renders NO outpost, so demo-app's per-app outpost
    # (ak-outpost-demo-app-outpost + its dual-parent route) becomes
    # UNMANAGED — it stays live and serving until the W4 sweep retires it.
    # Values only; no varmap in git (adoption ids ride the gate-time W0
    # runbook, witness sheet under .scratch). Live provider attrs match
    # the composed surface: internal_host = the composed default (unset
    # internalHost), no skip paths, access_token_validity hours=1 (chart
    # default) — no per-app overrides needed.
    authentik:
      enabled: true
      managedBy: terraform
      shared: true
      category: "Platform"
      displayName: "Demo Application"
      externalHost: "https://demo.gateway.services.apocrathia.com"
      icon: "https://cdn.gateway.services.apocrathia.com/homelab/flux/manifests/04-apps/demo-app/icon.png"
      # Live-verbatim pin: header auth stays off on the proxy provider
      # (the chart always sends intercept_header_auth; the TF default true
      # must never silently PATCH the live row).
      interceptHeaderAuth: false

    gatus:
      enabled: true
      group: demo

    httproute:
      enabled: false

    # Tailnet sharing via chart values (outpost-generated route dual-parents)
    tailnet:
      enabled: true
