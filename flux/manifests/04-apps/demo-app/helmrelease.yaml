---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-app
  namespace: demo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.84"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: demo-app
      # renovate: datasource=docker depName=public.ecr.aws/nginx/nginx
      image: public.ecr.aws/nginx/nginx:alpine@sha256:8874e0593c85fda7ac8fce31ddef23e2926cdadffcdcc955d2797b89c63646bf
      volumeMounts:
        - name: data
          mountPath: /app
        - name: nginx-html
          mountPath: /usr/share/nginx/html
      volumes:
        configMap:
          - name: demo-app-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
        emptyDir:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /run

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 10Gi
      smb:
        enabled: true
        volumes:
          - name: nginx-html
            source: "//storage.services.apocrathia.com/Library"
            subDir: "Sites/Demo"
            credentialsPath: "vaults/Secrets/items/smb-credentials"

    backup:
      enabled: true
      volumes:
        - data

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/demo-app-secrets"

    # Authentik stack: chart-rendered provider-opentofu docs (OnePasswordItem
    # + ProviderConfig + Workspace) pulling the shared module
    # terraform/modules/authentik-app at this chart's own git tag — values
    # only, no per-app HCL (the crossplane.yaml/terraform.tf era is over).
    # The chart composes the standard inputs from this block; no varmap
    # needed. Adoption ids NEVER live in git: the migration gate injects
    # them via a live patch on the Workspace (kubectl patch, Flux
    # suspended), the module's import blocks adopt the existing authentik
    # objects in place — no deletion window, uuids intact, nobody re-logs
    # in — and the patch drops once the imports go inert.
    # Live provider attrs match the composed surface: intercept_header_auth
    # false (chart default), access_token_validity hours=1 (module proxy
    # default) — no per-app overrides needed.
    authentik:
      enabled: true
      managedBy: terraform
      shared: true
      category: "Platform"
      displayName: "Demo Application"
      externalHost: "https://demo.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/demo-app/icon.png"

    gatus:
      enabled: true
      group: demo

    httproute:
      enabled: false

    # Tailnet sharing via chart values (outpost-generated route dual-parents)
    tailnet:
      enabled: true
