---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-app
  namespace: demo-app
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: demo-app
      # renovate: datasource=docker depName=public.ecr.aws/nginx/nginx
      image: public.ecr.aws/nginx/nginx:alpine@sha256:5854e3c300c673e3c6b2f288975f36e33d9476486691536df4a98b6d0eeb4c78
      volumeMounts:
        - name: data
          mountPath: /app
        - name: nginx-html
          mountPath: /usr/share/nginx/html
      volumes:
        configMap:
          - name: demo-app-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
        emptyDir:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /run

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 10Gi
      smb:
        enabled: true
        volumes:
          - name: nginx-html
            source: "//storage.services.apocrathia.com/Library"
            subDir: "Sites/Demo"
            credentialsPath: "vaults/Secrets/items/smb-credentials"

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/demo-app-secrets"

    authentik:
      enabled: true
      category: "Platform"
      displayName: "Demo Application"
      externalHost: "https://demo.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/demo-app/icon.png"

    gatus:
      enabled: true
      group: demo

    httproute:
      enabled: false
