---
# Purges stale torrents from the bitmagnet database to prevent unbounded growth.
# Bitmagnet has no built-in retention (https://github.com/bitmagnet-io/bitmagnet/issues/187),
# so this CronJob enforces a 90-day retention policy on torrents not re-seen by the DHT crawler.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bitmagnet-db-cleanup
  namespace: bitmagnet
spec:
  schedule: "0 3 * * 0" # Weekly at 3 AM Sunday
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Hard ceiling. Real runs complete in ~1h; this aborts pathological cases
      # before they deadlock the cluster's nightly maintenance window.
      activeDeadlineSeconds: 10800 # 3h
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              # renovate: datasource=docker depName=postgres
              image: postgres:18-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "=== Bitmagnet DB Cleanup ==="

                  : "${RETENTION_DAYS:=90}"
                  : "${VACUUM_FULL:=false}"
                  : "${CLEAN_ORPHANED_CONTENT:=false}"
                  : "${QUEUE_JOBS_RETENTION_DAYS:=7}"
                  : "${STATEMENT_TIMEOUT_MS:=3600000}"

                  # Cap any individual statement so a runaway query can't hang
                  # the whole job past activeDeadlineSeconds without feedback.
                  export PGOPTIONS="-c statement_timeout=${STATEMENT_TIMEOUT_MS}"

                  echo "Database size before:"
                  psql -c "SELECT pg_size_pretty(pg_database_size(current_database()));"

                  echo "Top 10 tables by size:"
                  psql -c "
                    SELECT relname, pg_size_pretty(pg_total_relation_size(c.oid))
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public' AND c.relkind = 'r'
                    ORDER BY pg_total_relation_size(c.oid) DESC
                    LIMIT 10;
                  "

                  # Stale stats wreck the planner on subsequent DELETEs (e.g. it
                  # picks a Merge Anti Join across millions of torrent_contents
                  # rows to delete a handful of orphans). Refresh first.
                  echo "Refreshing planner statistics..."
                  vacuumdb --analyze-only --verbose --dbname "$PGDATABASE"

                  echo "Deleting torrents not seen in ${RETENTION_DAYS} days..."
                  psql -c "
                    DELETE FROM torrents t
                    WHERE t.updated_at < NOW() - make_interval(days => ${RETENTION_DAYS})
                    AND NOT EXISTS (
                      SELECT 1 FROM torrents_torrent_sources tts
                      WHERE tts.info_hash = t.info_hash
                      AND tts.updated_at >= NOW() - make_interval(days => ${RETENTION_DAYS})
                    );
                  "

                  echo "Pruning processed queue_jobs older than ${QUEUE_JOBS_RETENTION_DAYS} days..."
                  psql -c "
                    DELETE FROM queue_jobs
                    WHERE status = 'processed'
                    AND ran_at < NOW() - make_interval(days => ${QUEUE_JOBS_RETENTION_DAYS});
                  "

                  # Orphan-content cleanup is disabled by default. The DELETE
                  # joins content (~135K rows) to torrent_contents (~6M rows) on
                  # a 3-column composite key the planner can't cost accurately
                  # without multi-column extended statistics, so it picks a Merge
                  # Anti Join that scans 8 GB of torrent_contents to delete a
                  # handful of true orphans (typically <20). Not worth the I/O
                  # cost. Only flip the env var on for a one-shot cleanup if
                  # orphan rows ever accumulate to a meaningful fraction of the
                  # content table.
                  if [ "$CLEAN_ORPHANED_CONTENT" = "true" ]; then
                    echo "Cleaning up orphaned content metadata..."
                    psql -c "
                      DELETE FROM content c
                      WHERE NOT EXISTS (
                        SELECT 1 FROM torrent_contents tc
                        WHERE tc.content_type = c.type
                        AND tc.content_source = c.source
                        AND tc.content_id = c.id
                      );
                    "
                  else
                    echo "Skipping orphaned content cleanup (CLEAN_ORPHANED_CONTENT=false)."
                  fi

                  echo "Running VACUUM ANALYZE..."
                  vacuumdb --analyze --verbose --dbname "$PGDATABASE"

                  if [ "$VACUUM_FULL" = "true" ]; then
                    echo "Running VACUUM FULL (this will lock tables and can take a while)..."
                    vacuumdb --full --analyze --verbose --dbname "$PGDATABASE"
                  fi

                  echo "Database size after:"
                  psql -c "SELECT pg_size_pretty(pg_database_size(current_database()));"

                  echo "=== Cleanup complete ==="
              env:
                - name: PGHOST
                  value: "bitmagnet-postgres-rw.bitmagnet.svc.cluster.local"
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: "bitmagnet"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: bitmagnet-secrets
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: bitmagnet-secrets
                      key: password
                - name: RETENTION_DAYS
                  value: "90"
                # VACUUM FULL rewrites the entire heap — on torrent_files (~82M
                # rows / 24 GB) that means rewriting 24 GB of data and indexes
                # under an exclusive lock, while the DHT crawler keeps writing.
                # The resulting WAL/memory pressure has crashed the CNPG primary
                # repeatedly. With current 90-day retention deleting 0 rows per
                # run there is nothing to compact, so this is pure waste. Flip
                # to "true" only for a one-shot run after a retention change has
                # actually deleted significant rows.
                - name: VACUUM_FULL
                  value: "false"
                - name: CLEAN_ORPHANED_CONTENT
                  value: "false"
              securityContext:
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 10Mi
