---
apiVersion: v1
kind: ConfigMap
metadata:
  name: copyparty-conf
  namespace: copyparty
  labels:
    app.kubernetes.io/name: copyparty
data:
  copyparty.conf: |
    # copyparty loads every *.conf in /cfg; this is the only one.
    [global]
      e2dsa  # filesystem indexing (search)
      e2ts   # media indexing (thumbnails, transcodes)
      ansi   # colored logs
      idp-h-usr: X-Authentik-Username
      idp-h-grp: X-Authentik-Groups
      xff-src: lan
      iobuf: 524288  # volumes are SMB-backed
      hist: /state/hist  # sqlite db + thumbnails on local disk, not SMB
      idp-db: /state/idp.db
      idp-store: 3  # remember IdP users/groups across restarts

    # Webroot: admins only.
    [/]
      /w
      accs:
        r: @admins
        rwmda: @admins

    # Strategic volume: admins-only gate above the per-user volumes.
    [/u]
      /w/u
      accs:
        rwmda: @admins

    # Per-user drop folder, created on first visit.
    [/u/${u}]
      /w/u/${u}
      accs:
        rwmda: ${u}, @admins
