---
# Credentials for the upstream Tracearr Helm chart (secrets.existingSecret).
#
# Required keys in vaults/Secrets/items/tracearr-secrets:
#   JWT_SECRET    - openssl rand -hex 32
#   COOKIE_SECRET - openssl rand -hex 32
#   DB_PASSWORD   - PostgreSQL password for the tracearr database user
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tracearr-secrets
  namespace: tracearr
spec:
  itemPath: "vaults/Secrets/items/tracearr-secrets"
