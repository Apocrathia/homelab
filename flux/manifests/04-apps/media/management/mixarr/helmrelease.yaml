---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mixarr
  namespace: mixarr
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.54"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: mixarr
      # renovate: datasource=docker depName=ghcr.io/aquantumofdonuts/mixarr
      image: ghcr.io/aquantumofdonuts/mixarr:v1.1.2
      container:
        name: mixarr
        port: 3005
        extraPorts:
          - name: web
            containerPort: 3000
            protocol: TCP
        env:
          - name: TZ
            value: "America/Denver"
          - name: SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: mixarr-secrets
                key: session-secret
          - name: FRONTEND_URL
            value: "https://mixarr.gateway.services.apocrathia.com"
          - name: BASE_URL
            value: "https://mixarr.gateway.services.apocrathia.com"
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      securityContext:
        # Mixarr unified container runs as root internally to manage mysql/redis services
        # and set proper ownership on /data subdirectories. Container needs writable root
        # filesystem to chown directories and manage internal services.
        runAsUser: "0"
        runAsGroup: "0"
        fsGroup: 1000
        runAsNonRoot: "false"
        allowPrivilegeEscalation: "true"
        readOnlyRootFilesystem: "false"
        capabilities:
          add:
            - SETUID
            - SETGID
            - CHOWN
            - DAC_OVERRIDE
      service:
        type: ClusterIP
        port: 80
        targetPort: 3000
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3005
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3005
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: data
          mountPath: /data
      volumes:
        emptyDir:
          # MySQL socket directory
          - name: run
            mountPath: /run
          # Supervisor logs
          - name: supervisor-logs
            mountPath: /var/log/supervisor

    storage:
      longhorn:
        enabled: true
        volumes:
          - name: data
            capacity: 10Gi
      smb:
        enabled: false

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/mixarr-secrets"

    authentik:
      enabled: true
      category: "Media"
      displayName: "Mixarr"
      externalHost: "https://mixarr.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/media/management/mixarr/icon.png"
