---
# PostgreSQL cluster with vectorchord extension for Immich
# Uses ghcr.io/tensorchord/cloudnative-vectorchord image which includes the required vector extension
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
spec:
  # Pin major=17 — CNPG in-place major upgrades break Immich/vectorchord.
  # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord versioning=regex:^(?<major>17)-(?<minor>\d+)\.(?<patch>\d+)(?:\.(?<build>\d+))?$
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-1.1.1@sha256:bb7eb8442f76b1e74911f28585019a77022911f8cfa2ddcfb166ea6af85abd09
  instances: 1
  storage:
    size: 20Gi
    storageClass: longhorn

  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-secrets
      # These run as postgres superuser on the immich database
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "128MB"
      track_io_timing: "on"
      track_functions: "all"
    shared_preload_libraries:
      - "vchord.so"
