---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: huntarr2
  namespace: huntarr2
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.68"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: huntarr2
      # renovate: datasource=docker depName=ghcr.io/refringe/huntarr2
      image: ghcr.io/refringe/huntarr2:0.1.0
      command:
        - /bin/huntarr2
      container:
        name: huntarr2
        port: 9706
        env:
          - name: TZ
            value: "America/Denver"
          - name: ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: huntarr2-secrets
                key: encryption-key
        healthCheck:
          path: /api/health
      replicas: 1
      podAntiAffinity:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        readOnlyRootFilesystem: true
      service:
        type: ClusterIP
        port: 80
        targetPort: 9706
        portName: http
      volumeMounts:
        - name: config
          mountPath: /config

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: config
            capacity: 1Gi

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/huntarr2-secrets"

    authentik:
      enabled: true
      category: "Media"
      displayName: "Huntarr2"
      externalHost: "https://huntarr2.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/media/management/huntarr2/icon.png"
      skipPathRegex:
        - "^/api/"
