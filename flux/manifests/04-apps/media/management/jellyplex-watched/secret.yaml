---
# Required keys in vaults/Secrets/items/jellyplex-watched-secrets:
#   plex-token     - Plex X-Plex-Token (https://support.plex.tv/articles/204059436-finding-an-authentication-token-x-plex-token/)
#   jellyfin-token - Jellyfin API key from Dashboard > API Keys
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: jellyplex-watched-secrets
  namespace: jellyplex-watched
spec:
  itemPath: "vaults/Secrets/items/jellyplex-watched-secrets"
