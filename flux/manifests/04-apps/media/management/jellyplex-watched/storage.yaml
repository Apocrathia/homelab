  namespace: jellyplex-watched
  labels:
    app.kubernetes.io/name: jellyplex-watched
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
