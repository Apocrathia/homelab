---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aurral
  namespace: aurral
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: aurral
      # renovate: datasource=docker depName=ghcr.io/lklynet/aurral
      image: ghcr.io/lklynet/aurral:2.4.0@sha256:3531367843be5959e3e0bdb46fd216c6ece953e8081d8b56d6efbd0b0fdabd57
      container:
        name: aurral
        port: 3001
        env:
          - name: TZ
            value: "America/Denver"
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          # Behind the Gateway API reverse proxy
          - name: TRUST_PROXY
            value: "true"
          - name: AURRAL_PUBLIC_URL
            value: "https://aurral.gateway.services.apocrathia.com"
          # Native OIDC against Authentik (mealie pattern: creds from aurral-secrets)
          - name: OIDC_ENABLED
            value: "true"
          - name: OIDC_ISSUER
            value: "https://auth.gateway.services.apocrathia.com/application/o/aurral/"
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: aurral-secrets
                key: oidc-client-id
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: aurral-secrets
                key: oidc-client-secret
          # Aurral hardcodes its callback path: /sso/callback
          - name: OIDC_REDIRECT_URI
            value: "https://aurral.gateway.services.apocrathia.com/sso/callback"
          # Lidarr connection (web UI settings take precedence over these env
          # fallbacks; LIDARR_API_KEY is source-supported but undocumented)
          - name: LIDARR_URL
            value: "http://lidarr.lidarr.svc.cluster.local"
          - name: LIDARR_API_KEY
            valueFrom:
              secretKeyRef:
                name: aurral-secrets
                key: lidarr-api-key
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      service:
        type: ClusterIP
        port: 80
        targetPort: 3001
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 3001
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 3001
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: config
          mountPath: /config
        - name: music
          mountPath: /music
      volumes:
        emptyDir:
          - name: downloads
            mountPath: /downloads
          - name: tmp
            mountPath: /tmp

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: config
            capacity: 10Gi
      smb:
        enabled: true
        volumes:
          - name: music
            source: "//storage.services.apocrathia.com/Audio"
            subDir: "Music"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/aurral-secrets"

    authentik:
      enabled: true
      mode: oidc
      category: "Media"
      displayName: "Aurral"
      externalHost: "https://aurral.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/media/management/aurral/icon.svg"
      oidc:
        redirectUris:
          - url: "https://aurral.gateway.services.apocrathia.com/sso/callback"
            matchingMode: "strict"

    httproute:
      enabled: true
      hostname: "aurral.gateway.services.apocrathia.com"
