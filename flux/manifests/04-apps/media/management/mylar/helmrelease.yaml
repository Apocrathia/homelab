---
# NOTE: Using LinuxServer.io container which requires root for s6-overlay init.
# A rootless container is pending at containerforge:
# https://github.com/trueforge-org/containerforge/tree/main/porting/post-processed/mylar3
# Once available, switch to the rootless container and update security context.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mylar
  namespace: mylar
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.59"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: mylar
      # renovate: datasource=docker depName=ghcr.io/linuxserver/mylar3
      image: ghcr.io/linuxserver/mylar3:nightly-version-de56c89f
      container:
        name: mylar
        port: 8090
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: "America/Denver"
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      securityContext:
        # LinuxServer.io containers need root initially for s6-overlay, then drop to PUID/PGID
        runAsUser: "0"
        runAsGroup: "0"
        fsGroup: 1000
        runAsNonRoot: "false"
        allowPrivilegeEscalation: "true"
        readOnlyRootFilesystem: "false"
        capabilities:
          add:
            - SETUID
            - SETGID
            - CHOWN
            - DAC_OVERRIDE
      service:
        type: ClusterIP
        port: 80
        targetPort: 8090
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          tcpSocket:
            port: 8090
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          tcpSocket:
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: comics
          mountPath: /comics

    storage:
      longhorn:
        enabled: true
        volumes:
          - name: config
            capacity: 5Gi
      smb:
        enabled: true
        volumes:
          - name: downloads
            source: "//storage.services.apocrathia.com/Downloads"
            subDir: ""
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false
          - name: comics
            source: "//storage.services.apocrathia.com/Library"
            subDir: "Comics"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false

    secrets:
      enabled: false # No secrets needed - web UI configuration

    authentik:
      enabled: true
      category: "Media"
      displayName: "Mylar"
      externalHost: "https://mylar.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/media/management/mylar/icon.png"
