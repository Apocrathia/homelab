---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.86"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: recyclarr
      # renovate: datasource=docker depName=ghcr.io/recyclarr/recyclarr
      image: ghcr.io/recyclarr/recyclarr:8.7.3@sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9
      container:
        name: recyclarr
        # No port needed - this is a background utility, not a web service
        env:
          - name: TZ
            value: "America/Denver"
          - name: CRON_SCHEDULE
            value: "@hourly"
          # API Keys from 1Password
          - name: SONARR_API_KEY
            valueFrom:
              secretKeyRef:
                name: recyclarr-secrets
                key: sonarr-api-key
          - name: RADARR_API_KEY
            valueFrom:
              secretKeyRef:
                name: recyclarr-secrets
                key: radarr-api-key
          # Base URLs (cluster internal)
          - name: SONARR_BASE_URL
            value: "http://sonarr.sonarr.svc.cluster.local"
          - name: RADARR_BASE_URL
            value: "http://radarr.radarr.svc.cluster.local"
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsUser: "1000"
        runAsGroup: "1000"
        fsGroup: 1000
        runAsNonRoot: "true"
        allowPrivilegeEscalation: "false"
        readOnlyRootFilesystem: "true"
      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp
          - name: config
            mountPath: /config
        configMap:
          - name: config-file
            configMapName: recyclarr-config
            mountPath: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/recyclarr-secrets"

    storage:
      longhorn:
        enabled: false

    authentik:
      enabled: false

    gatus:
      enabled: false
    httproute:
      enabled: false
