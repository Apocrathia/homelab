      # Anime-specific formats
      - trash_ids: [026d5aadd1a6b4e550b134cb6c72b3ca] # Uncensored
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 500
          - name: WEB-1080p
            score: 500
          - name: WEB-2160p
            score: 500
          - name: Ultra-HD
