---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

# Recyclarr configuration for Sonarr and Radarr instances (v8 format).
# Guide-backed quality profiles; custom formats use assign_scores_to.
# Reference: https://recyclarr.dev/wiki/yaml/config-reference/

# Configuration for Sonarr and Radarr instances
# Using environment variables for sensitive data per https://recyclarr.dev/wiki/yaml/env-vars/
sonarr:
  series:
    # Internal cluster URLs
    base_url: !env_var SONARR_BASE_URL http://sonarr.sonarr.svc.cluster.local
    api_key: !env_var SONARR_API_KEY

    # v8: guide-backed quality profiles (official include templates removed in v8)
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9 # WEB-1080p (Alternative)
        name: WEB-1080p (Alternative)
        reset_unmatched_scores:
          enabled: true
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
      - trash_id: dfa5eaae7894077ad6449169b6eb03e0 # WEB-2160p (Alternative)
