---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arrsync
  namespace: arrsync
spec:
  schedule: "0 2 * * *" # 0200
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            instrumentation.opentelemetry.io/inject-python: "otel-system/python"
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-deps
              # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
              image: public.ecr.aws/docker/library/python:3.15@sha256:3d35e8d5e482ef4f6151426e59208ecde73b7a80e88b38c1b098f60662e5fb91
              command:
                - pip
                - install
                - --no-cache-dir
                - --target=/deps
                - -r
                - /scripts/requirements.txt
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: deps
                  mountPath: /deps
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: arrsync
              # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
              image: public.ecr.aws/docker/library/python:3.15@sha256:3d35e8d5e482ef4f6151426e59208ecde73b7a80e88b38c1b098f60662e5fb91
              command:
                - python
                - /scripts/arrsync.py
                - all
              env:
                - name: PYTHONPATH
                  value: "/deps"
                - name: SONARR_URL
                  value: "http://sonarr.sonarr.svc.cluster.local"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arrsync-secrets
                      key: sonarr-api-key
                - name: RADARR_URL
                  value: "http://radarr.radarr.svc.cluster.local"
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arrsync-secrets
                      key: radarr-api-key
                - name: LIDARR_URL
                  value: "http://lidarr.lidarr.svc.cluster.local"
                - name: LIDARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arrsync-secrets
                      key: lidarr-api-key
                # Per-service item-failure budget: abort the run (exit 1) once a
                # service hits this many failed items; fewer are tolerated.
                - name: ARRSYNC_FAILURE_THRESHOLD
                  value: "10"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: deps
                  mountPath: /deps
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: arrsync-scripts
                defaultMode: 0755
            - name: deps
              emptyDir: {}
            - name: tmp
              emptyDir: {}
