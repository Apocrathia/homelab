---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaptarr
  namespace: chaptarr
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: chaptarr
      # renovate: datasource=docker depName=chaptarr/chaptarr
      image: chaptarr/chaptarr:latest@sha256:ccbe157f88f33d085d12a3e5d7cfb9d5b15f89d69b6eba984f789064d21e1b85
      container:
        name: chaptarr
        port: 8789
        env:
          - name: TZ
            value: "America/Denver"
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: Chaptarr__Postgres__Host
            value: "chaptarr-postgres-rw.chaptarr.svc.cluster.local"
          - name: Chaptarr__Postgres__Port
            value: "5432"
          - name: Chaptarr__Postgres__User
            valueFrom:
              secretKeyRef:
                name: chaptarr-secrets
                key: username
          - name: Chaptarr__Postgres__Password
            valueFrom:
              secretKeyRef:
                name: chaptarr-secrets
                key: password
          - name: Chaptarr__Postgres__MainDb
            value: "chaptarr"
          - name: Chaptarr__Postgres__LogDb
            value: "chaptarr"
          - name: Chaptarr__Postgres__CacheDb
            value: "chaptarr"
      replicas: 1
      podAnnotations:
        instrumentation.opentelemetry.io/inject-dotnet: "otel-system/dotnet"
      podAntiAffinity:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      service:
        type: ClusterIP
        port: 80
        targetPort: 8789
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /ping
            port: 8789
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /ping
            port: 8789
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: audiobooks
          mountPath: /audiobooks
        - name: ebooks
          mountPath: /ebooks

    storage:
      longhorn:
        enabled: true
        volumes:
          - name: config
            capacity: 5Gi
      smb:
        enabled: true
        volumes:
          - name: downloads
            source: "//storage.services.apocrathia.com/Downloads"
            subDir: ""
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false
          - name: audiobooks
            source: "//storage.services.apocrathia.com/Audio"
            subDir: "Audiobooks"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false
          - name: ebooks
            source: "//storage.services.apocrathia.com/Library"
            subDir: "Books"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/chaptarr-secrets"

    postgres:
      enabled: true
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
      instances: 1
      storage:
        storageClass: longhorn
        size: 10Gi
      postgresql:
        parameters:
          max_connections: "100"
          track_io_timing: "on"
          track_functions: "all"
          log_statement: "ddl"
          log_min_duration_statement: "1000ms"
          log_min_messages: "INFO"
      affinity:
        enablePodAntiAffinity: true
        podAntiAffinityType: "preferred"
        topologyKey: "kubernetes.io/hostname"
      monitoring:
        enabled: false
      database: "chaptarr"
      owner: "chaptarr"

    authentik:
      enabled: true
      mode: "oidc"
      category: "Media"
      displayName: "Chaptarr"
      externalHost: "https://chaptarr.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/media/management/chaptarr/icon.svg"
      oidc:
        scopes:
          - "openid"
          - "email"
          - "profile"
        customScopeMappings:
          - name: "chaptarr-email-verified-mapping"
            scopeName: "email"
            description: "Email address with email_verified set to True for Chaptarr"
            expression: |
              return {
                  "email": request.user.email,
                  "email_verified": True
              }
        redirectUris:
          - url: "https://chaptarr.gateway.services.apocrathia.com/signin-oidc"
            matchingMode: "strict"

    httproute:
      enabled: true
      hostname: "chaptarr.gateway.services.apocrathia.com"
