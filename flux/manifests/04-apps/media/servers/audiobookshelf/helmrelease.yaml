---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.65"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: audiobookshelf
      # renovate: datasource=docker depName=ghcr.io/advplyr/audiobookshelf
      image: ghcr.io/advplyr/audiobookshelf:2.33.1
      container:
        name: audiobookshelf
        port: 80
        env:
          - name: TZ
            value: "America/Denver"
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false # App writes to multiple locations
      service:
        type: ClusterIP
        port: 80
        targetPort: 80
        portName: http
      volumeMounts:
        - name: config
          mountPath: /config
        - name: metadata
          mountPath: /metadata
        - name: audiobooks
          mountPath: /audiobooks
        - name: podcasts
          mountPath: /podcasts

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: config
            capacity: 5Gi
          - name: metadata
            capacity: 10Gi
      smb:
        enabled: true
        volumes:
          - name: audiobooks
            source: "//storage.services.apocrathia.com/Audio"
            subDir: "Audiobooks"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false
          - name: podcasts
            source: "//storage.services.apocrathia.com/Audio"
            subDir: "Podcasts"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false

    authentik:
      enabled: true
      mode: oidc
      category: "Media"
      displayName: "Audiobookshelf"
      externalHost: "https://audiobookshelf.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/media/servers/audiobookshelf/icon.svg"
      oidc:
        redirectUris:
          - url: "https://audiobookshelf.gateway.services.apocrathia.com/auth/openid/callback"
            matchingMode: "strict"
          - url: "https://audiobookshelf.gateway.services.apocrathia.com/auth/openid/mobile-redirect"
            matchingMode: "strict"

    httproute:
      enabled: true
      hostname: audiobookshelf.gateway.services.apocrathia.com
