---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: authentik-terraform-token
  namespace: jellyfin
spec:
  # Scoped Authentik service-account token. Never a bare managed Secret —
  # the operator creates the 1Password item crossplane-terraform-secrets
  # (vault "Secrets", field authentik-terraform-token), and the OnePassword
  # Connect operator syncs it as the authentik-terraform-token Secret
  # consumed by the ProviderConfig in this file. Same item as headlamp's
  # and chaos-mesh's copies; the namespace differs.
  itemPath: "vaults/Secrets/items/crossplane-terraform-secrets"
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: jellyfin-authentik
  namespace: jellyfin
spec:
  # Two workdir files, two Secret sources:
  credentials:
    # Materializes the OnePasswordItem-backed Secret as a file in the tofu
    # workdir; the module's provider block reads it with file("authentik-token").
    # The token itself never appears in a manifest.
    - filename: authentik-token
      source: Secret
      secretRef:
        name: authentik-terraform-token
        namespace: jellyfin
        key: authentik-terraform-token
    # client_id lane: the retired chart lane fed authentik.oidc.clientId
    # via the helmrelease valuesFrom; the file pair reads it in-workdir
    # instead — the HCL does client_id = trimspace(file("oidc-client-id")).
    # The jellyfin-secrets Secret is synced by the chart's secrets: values block (OnePasswordItem CR) — enabled by this flip. The client_id value never appears in git.
    - filename: oidc-client-id
      source: Secret
      secretRef:
        name: jellyfin-secrets
        namespace: jellyfin
        key: oidc-client-id
  # Per-app state args for the module's PARTIAL kubernetes backend: the
  # provider writes this as crossplane.remote.tfbackend and passes it via
  # -backend-config at tofu init. The state Secret is
  # tfstate-jellyfin-authentik-jellyfin in this namespace — deliberately separate
  # from the CI tofu stack (terraform/, GitLab HTTP backend). Two stacks,
  # two states. Born empty: the adoption gate (below) is its first write.
  backendFile: |
    secret_suffix     = "jellyfin"
    namespace         = "jellyfin"
    in_cluster_config = true
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: jellyfin-authentik
  namespace: jellyfin
spec:
  # Prune guard — crossplane v2 removed deletionPolicy; without the Delete
  # action the provider releases the finalizer WITHOUT running tofu destroy,
  # so a GitOps prune of this object can NEVER destroy the live authentik
  # stack (v2-native Orphan). Deliberate decommission therefore requires
  # temporarily restoring ["*"] (or a manual tofu destroy) — the guard is
  # intentional.
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin-authentik
  forProvider:
    # Inline module, stitched at kustomize build time: kustomization.yaml's
    # configMapGenerator packages authentik.tf and the replacements rule
    # copies its bytes into this module field — crossplane.yaml +
    # authentik.tf are the canonical file pair, and the HCL file is the
    # single source of truth (never render this directory outside
    # kustomize). No varmap: the app values live in the HCL now. The ONLY
    # varmap this Workspace ever carries is the gate-time adoption patch
    # on this live object (ids never in git).
    #
    # ADOPTION CONSUMER (not same-state): jellyfin's live Authentik objects
    # are blueprint-created and NOT in any tofu state. authentik.tf carries
    # import blocks — the application by slug (a name, safe in git), the
    # generated ids (provider pk, binding uuids)
    # via gated adoption variables, default off. The flip ADOPTS the live
    # objects in place at gate time: the render-time varmap injection
    # turns the imports on (.scratch/oidc-adopt-gate-recipe.md §8 step 3
    # — the object is born with the varmap; the komga §1 live-patch does
    # not transplant to the file pair). Steady state post-gate: varmap absent
    # from this object -> adoption vars default off -> gated imports inert
    # -> plan No changes forever.
    source: Inline
    module: ""
