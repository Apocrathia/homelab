---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Access-only blueprint — the chart-rendered "jellyfin" blueprint owns the
# provider/application; this one carries the app's access bindings.
version: 1
metadata:
  name: jellyfin-access
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Admins group binding (app access)
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "jellyfin"]]
      group: !Find [authentik_core.group, [name, "admins"]]
    attrs:
      order: 10

  # Users group binding (app access) — the "shared" tag
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "jellyfin"]]
      group: !Find [authentik_core.group, [name, "users"]]
    attrs:
      order: 20
