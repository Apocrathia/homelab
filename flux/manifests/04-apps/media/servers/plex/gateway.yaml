---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumloadbalancerippool_v2.json
# Dedicated Gateway for Plex: same LAN VIP previously used by the chart LoadBalancer (10.100.1.98).
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: plex-gateway-pool
spec:
  blocks:
    - cidr: "10.100.1.98/32"
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: plex-gateway
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: plex-gateway-l2-policy
spec:
  interfaces:
    - eth0
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: plex-gateway
  loadBalancerIPs: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: plex-gateway
  namespace: cilium-system
  annotations:
    io.cilium/lb-ipam-ips: "10.100.1.98"
    # Share VIP 10.100.1.98 with the plex-direct Service (port 32400) in the
    # plex namespace via Cilium's IP-sharing key. Annotation propagates to the
    # underlying gateway-managed Service.
    io.cilium/lb-ipam-sharing-key: "plex-vip"
    service.cilium.io/loadbalancer-mode: "hybrid"
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "10.100.1.98"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: plex-services-apocrathia-com-tls
            namespace: plex
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
  namespace: cilium-system
spec:
  parentRefs:
    - name: plex-gateway
      sectionName: https
    - name: plex-gateway
      sectionName: http
  hostnames:
    - plex.services.apocrathia.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: plex
          namespace: plex
          port: 80
          weight: 1
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plex-services-apocrathia-com-tls
  namespace: plex
spec:
  commonName: plex.services.apocrathia.com
  dnsNames:
    - plex.services.apocrathia.com
    - plex.apocrathia.com
  duration: 2160h
  renewBefore: 360h
  secretName: plex-services-apocrathia-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  subject:
    organizations:
      - Apocrathia
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: plex
  namespace: plex
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: cilium-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: cilium-system
  to:
    - group: ""
      kind: Secret
      name: plex-services-apocrathia-com-tls
    - group: ""
      kind: Service
      name: plex
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumloadbalancerippool_v2.json
# Second pool over the same /32 so the plex-direct Service can claim 10.100.1.98.
# Cilium permits the shared allocation because both Services carry the matching
# io.cilium/lb-ipam-sharing-key and have non-overlapping ports (gateway: 80/443,
# direct: 32400).
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: plex-direct-pool
spec:
  blocks:
    - cidr: "10.100.1.98/32"
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: plex-direct
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/service-v1.json
# Direct LAN access to Plex on its native port 32400, bypassing the gateway.
# Plex iOS/tvOS clients prefer talking to the server on 32400 directly rather
# than through HTTP/2 + TLS termination at the gateway. externalTrafficPolicy
# is Cluster (not Local) because the VIP is announced from the gateway pod's
# node, which may not host the plex pod -- Cluster lets traffic forward to
# whichever node runs plex.
apiVersion: v1
kind: Service
metadata:
  name: plex-direct
  namespace: plex
  labels:
    app.kubernetes.io/name: plex-direct
  annotations:
    io.cilium/lb-ipam-ips: "10.100.1.98"
    io.cilium/lb-ipam-sharing-key: "plex-vip"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: plex
  ports:
    - name: plex
      port: 32400
      targetPort: 32400
      protocol: TCP
