---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: halcyon
  namespace: halcyon
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: halcyon
      # renovate: datasource=docker depName=ghcr.io/halcyon-video/halcyon-video
      image: ghcr.io/halcyon-video/halcyon-video:0.17.1@sha256:ea93557c8b1460c2fa12dc604c64d062f06a5f02072c930a03e3ac53238a777b
      container:
        name: halcyon
        port: 1420
        env:
          - name: TZ
            value: "America/Denver"
          # Host-header guard. Three consumers reach the pod with different
          # Host headers: the external hostname (X-Forwarded-Host path), the
          # Authentik proxy outpost (rewrites Host to the internal svc name),
          # and gatus (probes http://halcyon.halcyon.svc:80). All must pass.
          - name: HALCYON_ALLOWED_HOSTS
            value: "halcyon.gateway.services.apocrathia.com,halcyon.halcyon.svc.cluster.local,halcyon.halcyon.svc"
          # Remote Play "shared mirror" seed — survives restarts on the /data volume
          - name: REMOTE_PLAY_SEED
            value: "/data/remote-play-seed.json"
          # Server-side integrations: visitors get a stocked store; keys never
          # reach the browser (built-in proxy attaches them host-side).
          - name: HALCYON_JELLYSEERR_URL
            value: "http://seerr.seerr.svc.cluster.local"
          - name: HALCYON_JELLYSEERR_APIKEY
            valueFrom:
              secretKeyRef:
                name: halcyon-secrets
                key: seerr-api-key
          - name: HALCYON_ROMM_URL
            value: "http://romm.romm.svc.cluster.local:8080"
          - name: HALCYON_ROMM_APIKEY
            valueFrom:
              secretKeyRef:
                name: halcyon-secrets
                key: romm-api-key
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      service:
        type: ClusterIP
        port: 80
        targetPort: 1420
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 1420
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 1420
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: data
          mountPath: /data
      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp
          # vite preview writes a config timestamp file here on every boot —
          # EROFS CrashLoopBackOff with readOnlyRootFilesystem otherwise
          - name: vite-temp
            mountPath: /app/node_modules/.vite-temp
          # F8 in-app feedback pins (upstream compose mounts ./feedback for
          # the same purpose); on-demand writes to a fixed path
          - name: feedback
            mountPath: /app/feedback

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 1Gi
      smb:
        enabled: false

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/halcyon-secrets"

    authentik:
      enabled: true
      mode: "proxy"
      displayName: "Halcyon Video"
      externalHost: "https://halcyon.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/media/servers/halcyon/icon.svg"
      category: "Media"

    httproute:
      enabled: false
