---
apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
  labels:
    app.kubernetes.io/name: substrate
    app.kubernetes.io/component: agent-runtime
    # atelet is privileged + hostPath + hostPort; Talos PSA defaults to baseline
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/enforce-version: latest
    # valkey / rustfs / busybox / coredns pull from Docker Hub
    images/dockerhub: "true"
