---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ate-system
spec:
  interval: 30m
  dependsOn:
    - name: substrate-crds
      namespace: ate-system
    # Snapshot store must exist before atelet starts writing to it.
    - name: ate-cache
      namespace: ate-system
  chart:
    spec:
      chart: substrate
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/substrate/helm/substrate
      version: "0.0.10"
      sourceRef:
        kind: HelmRepository
        name: substrate
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  postRenderers:
    - kustomize:
        patches:
          # v0.0.10 treats non-default Kubernetes issuers as external and uses
          # system roots for OIDC discovery. Trust Talos' mounted API CA.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: ate-api-server-deployment
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ate-api-server-deployment
              spec:
                template:
                  spec:
                    containers:
                      - name: ate-api-server
                        env:
                          - name: SSL_CERT_FILE
                            value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

  values:
    # Namespace owned by namespace.yaml (PSA privileged + dockerhub pull secret)
    createNamespace: false

    # JWT via projected SA tokens; chart bootstraps TLS + session pools
    auth:
      mode: jwt
      jwt:
        # Talos kube-apiserver SA issuer (not kind's kubernetes.default.svc default)
        issuer: https://kubernetes.apocrathia.com:6443
        audience: api.ate-system.svc
        bootstrap:
          enabled: true

    # Pin component images with the chart appVersion
    image:
      registry: ghcr.io/kagent-dev/substrate
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/substrate/ateapi
      tag: "v0.0.10"

    # Snapshots live in ate-cache (cache-helmrelease.yaml), not the bundled
    # RustFS. The bundled Deployment is RollingUpdate on a ReadWriteOnce
    # Longhorn PVC and its bucket-init Job template is immutable, so any upgrade
    # touching either one deadlocks the release.
    rustfs:
      enabled: false

    atelet:
      storageBackend: s3
      extraEnv:
        - name: AWS_ENDPOINT_URL
          value: "http://ate-cache.ate-system.svc.cluster.local:9000"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: agent-substrate-secrets
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: agent-substrate-secrets
              key: access-key-secret
