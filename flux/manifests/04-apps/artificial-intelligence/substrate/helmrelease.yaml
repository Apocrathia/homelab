---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ate-system
spec:
  interval: 30m
  dependsOn:
    - name: substrate-crds
      namespace: ate-system
    # Issues the service-DNS / pod-identity / postgres CA pools the control
    # plane validates its client certificates against.
    - name: substrate-podcert
      namespace: podcertificate-controller-system
    # Snapshot store must exist before atelet starts writing to it.
    - name: substrate-atelet
      namespace: ate-system
    - name: ate-cache
      namespace: ate-system
  chart:
    spec:
      chart: substrate
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/substrate/helm/substrate
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: substrate
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    # Namespace owned by namespace.yaml (PSA privileged + dockerhub pull secret)
    createNamespace: false

    # kagent Harnesses set per-ActorTemplate snapshot locations
    # (substrate.snapshotPolicy.location); the API rejects that field without
    # this gate. All Substrate binaries share the gate list.
    # GoldenEgressPolicy: kagent 1.0.1 compiles a golden egress rule into every
    # ActorTemplate (its controller bearer token); the API rejects the field
    # without this gate. All Substrate binaries share the gate list.
    preview:
      - PerTemplateSnapshotLocation
      - GoldenEgressPolicy

    # Postgres is the new state store (valkey is gone). External CNPG cluster
    # (postgres.yaml). Both logins and both assumed roles are the bootstrap
    # `substrate` user — single-login posture, same as kagent's database.
    # Connection strings live in OnePasswordItem/substrate-postgres.
    postgres:
      ownerRole: substrate
      readWriteRole: substrate
      ownerConnectionStringSecretRef:
        name: substrate-postgres
        key: ownerConnectionString
      readWriteConnectionStringSecretRef:
        name: substrate-postgres
        key: readWriteConnectionString

    # Snapshots live in ate-cache (cache-helmrelease.yaml), not the bundled
    # RustFS. Component images come from the chart appVersion (v1.0.1) — no
    # registry/tag overrides, the chart version is the single Renovate knob.
    rustfs:
      enabled: false

    # Cluster-wide snapshot URI (atelet writes, actors restore). gs:// URIs are
    # the S3-backend convention. Per-template prefixes (kagent, agent-*) ride
    # on the kagent-side Harnesses.
    ateApi:
      snapshotLocation: "gs://ate-snapshots/"
      # The kagent controller's mTLS SPIFFE identity must be an owner or every
      # actor_template RPC comes back PermissionDenied.
      authorization:
        bootstrapOwners:
          - system:serviceaccount:ate-system:ate-client
          - spiffe://cluster.local/ns/kagent/sa/kagent-controller

    # atelet is deprecated in this chart (one upgrade would move it together
    # with ate-api-server, which the skew policy forbids). It moves to its own
    # release: atelet-helmrelease.yaml.
    atelet:
      enabled: false

    # S3 credentials + endpoint for the control-plane object-store plugin
    # (snapshot transfers). Keys are the AWS_* pair on the shared substrate
    # secrets item; ate-cache serves the bucket.
    objectStorePlugin:
      extraEnv:
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ENDPOINT_URL
          value: "http://ate-cache.ate-system.svc.cluster.local:9000"
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: agent-substrate-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: agent-substrate-secrets
              key: AWS_SECRET_ACCESS_KEY
