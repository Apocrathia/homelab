---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# atelet split out of the substrate chart (bundled atelet is deprecated there:
# one upgrade would move it together with ate-api-server, which the version
# skew policy forbids). Skew policy: upgrade/install this release BEFORE the
# substrate release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-atelet
  namespace: ate-system
spec:
  interval: 30m
  dependsOn:
    - name: substrate-crds
      namespace: ate-system
    # Snapshot store must exist before atelet starts writing to it.
    - name: ate-cache
      namespace: ate-system
  chart:
    spec:
      chart: substrate-atelet
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/substrate/helm/substrate-atelet
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: substrate
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Object names follow the substrate release.
    substrateReleaseName: substrate
    # Match the substrate release's preview gates (its release name resolves
    # shared objects like SandboxConfigs).
    preview:
      - PerTemplateSnapshotLocation
    # Snapshots live in ate-cache (dedicated RustFS), not the bundled one.
    objectStore:
      backend: s3
      endpoint: "http://ate-cache.ate-system.svc.cluster.local:9000"
      region: us-east-1
      pathStyle: true
      # Secret needs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY keys
      # (agent-substrate-secrets item, AWS_* fields).
      credentialsSecret: agent-substrate-secrets
