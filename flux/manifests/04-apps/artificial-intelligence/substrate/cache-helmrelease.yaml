---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# RustFS object store backing Agent Substrate golden snapshots. Named ate-cache
# rather than rustfs because the substrate chart's own bundled RustFS occupies
# Deployment/Service/PVC "rustfs" and label app=rustfs in this namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ate-cache
  namespace: ate-system
spec:
  interval: 15m
  timeout: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.74"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    app:
      name: ate-cache
      namespace: ate-system
      # renovate: datasource=docker depName=rustfs/rustfs
      image: rustfs/rustfs:1.0.0-beta.3
      replicas: 1

      container:
        name: rustfs
        port: 9000
        extraPorts:
          - name: console
            containerPort: 9001
            protocol: TCP
        env:
          - name: RUSTFS_ADDRESS
            value: ":9000"
          - name: RUSTFS_CONSOLE_ADDRESS
            value: ":9001"
          - name: RUSTFS_CONSOLE_ENABLE
            value: "true"
          - name: RUSTFS_VOLUMES
            value: "/data"
          # Unset RUSTFS_OBS_LOG_DIRECTORY keeps logs on stdout for Loki.
          - name: RUSTFS_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: agent-substrate-secrets
                key: access-key-id
          - name: RUSTFS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: agent-substrate-secrets
                key: access-key-secret

      sidecars:
        # RustFS does not auto-create buckets. This replaces the chart's
        # rustfs-bucket-init Job, whose immutable pod template failed
        # server-side apply on every upgrade that changed its env.
        - name: bucket-init
          # renovate: datasource=docker depName=amazon/aws-cli
          image: amazon/aws-cli:2.17.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until aws s3api head-bucket --bucket ate-snapshots 2>/dev/null ||
                aws s3api create-bucket --bucket ate-snapshots 2>/dev/null; do
                echo "waiting for rustfs at ${AWS_ENDPOINT_URL}..."
                sleep 2
              done
              echo "bucket ate-snapshots ready"
              # ponytail: resident sleep instead of a Job so a pod restart
              # re-runs the check. Exiting 0 would just make kubelet restart it
              # on a backoff and muddy the pod status.
              sleep infinity
          env:
            - name: AWS_ENDPOINT_URL
              value: "http://127.0.0.1:9000"
            - name: AWS_REGION
              value: "us-east-1"
            # aws-cli writes ~/.aws and temp state; HOME must be writable.
            - name: HOME
              value: "/tmp"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: agent-substrate-secrets
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-substrate-secrets
                  key: access-key-secret
          volumes:
            emptyDir:
              - name: aws-home
                mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      service:
        type: ClusterIP
        port: 9000
        targetPort: 9000
        portName: api

      extraServicePorts:
        - name: console
          port: 9001
          targetPort: 9001

      securityContext:
        # Matches the bundled RustFS pod so Longhorn volume ownership lines up.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

      volumeMounts:
        - name: data
          mountPath: /data

      volumes:
        emptyDir:
          # RustFS entrypoint touches /logs even when logging to stdout.
          - name: logs
            mountPath: /logs
          - name: tmp
            mountPath: /tmp

      healthChecks:
        readinessProbe:
          enabled: true
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          enabled: true
          tcpSocket:
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 2
        volumes:
          - name: data
            capacity: 20Gi

    # Credentials come from OnePasswordItem/agent-substrate-secrets, declared in
    # secret.yaml alongside the substrate release.
    secrets:
      enabled: false

    authentik:
      enabled: false

    httproute:
      enabled: false
