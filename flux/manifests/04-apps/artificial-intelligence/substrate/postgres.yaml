---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: substrate-postgres
  namespace: ate-system
spec:
  # PostgreSQL version
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533

  # Single instance for homelab
  instances: 1

  # Barman backups: rustfs S3 (bucket `cnpg`, policy scoped to bucket+objects);
  # same store and schedule as kagent-postgres.
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      destinationPath: s3://cnpg/substrate
      endpointURL: http://storage.services.apocrathia.com:9009
      serverName: substrate-postgres
      s3Credentials:
        accessKeyId:
          name: substrate-postgres-backup-secrets
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: substrate-postgres-backup-secrets
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: zstd
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: true

  # Storage configuration
  storage:
    storageClass: longhorn
    size: 10Gi

  # Resource limits to prevent OOM kills
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # PostgreSQL-specific configuration
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"

  # Bootstrap configuration. The bootstrap `substrate` user is the single login:
  # the substrate chart's owner/readWrite connection strings and assumed roles
  # all point at it (single-login posture, mirroring kagent's database). No
  # managed roles — the upstream role split (substrate_owner_user /
  # substrate_readwrite_user + schema grants) cannot be expressed through CNPG
  # and is deferred.
  bootstrap:
    initdb:
      database: substrate
      owner: substrate
      secret:
        name: substrate-postgres
