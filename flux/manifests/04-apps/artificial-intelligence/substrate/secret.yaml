---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: agent-substrate-secrets
  namespace: ate-system
spec:
  # The consolidated item also carries the podcert CA pools and the
  # substrate-postgres login; only the object-store keys are consumed here
  # (ate-cache, substrate-atelet, objectStorePlugin).
  itemPath: "vaults/Secrets/items/agent-substrate-secrets"
