---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# Valkey for Agent Substrate ate-api. Replaces the chart-bundled Valkey cluster
# (pod-IP nodes.conf breaks after StatefulSet IP churn). Same generic-app
# pattern as litellm-valkey / terminus-valkey; plaintext, no AUTH (JWT auth mode).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ate-valkey
  namespace: ate-system
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    app:
      name: ate-valkey
      namespace: ate-system
      # renovate: datasource=docker depName=valkey/valkey
      image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
      args:
        - valkey-server
        - --bind
        - "0.0.0.0"
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - ""
        - --appendonly
        - "no"
      container:
        name: valkey
        port: 6379
      service:
        type: ClusterIP
        port: 6379
        targetPort: 6379
        portName: valkey
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      healthChecks:
        livenessProbe:
          enabled: true
          exec:
            command:
              - valkey-cli
              - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          enabled: true
          exec:
            command:
              - valkey-cli
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    postgres:
      enabled: false

    secrets:
      enabled: false

    authentik:
      enabled: false

    gatus:
      enabled: false
    httproute:
      enabled: false
