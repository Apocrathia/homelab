---
# Nightly base backup for substrate-postgres (barman object store).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: substrate-postgres-backup
  namespace: ate-system
spec:
  # CNPG cron is 6-field (seconds first): "0 0 5 * * *" = daily 05:00 UTC.
  schedule: "0 0 5 * * *" # 0500 UTC = 2300 MST, after the kopia 0200 UTC window
  backupOwnerReference: self
  cluster:
    name: substrate-postgres
