---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
  namespace: ate-system
spec:
  interval: 30m
  chart:
    spec:
      chart: substrate-crds
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/substrate/helm/substrate-crds
      version: "0.0.10"
      sourceRef:
        kind: HelmRepository
        name: substrate
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
