---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
# Single substrate database login: the CNPG bootstrap `substrate` user. Both
# chart connection strings (owner + read/write) use it; the assumed roles are
# also `substrate`, so no role-membership grants are needed. The consolidated
# agent-substrate-secrets item carries username, password (CNPG bootstrap
# contract), ownerConnectionString + readWriteConnectionString
# (postgres://substrate:<password>@substrate-postgres-rw.ate-system.svc.cluster.local:5432/substrate?sslmode=require);
# this CR syncs the whole item under the substrate-postgres secret name.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: substrate-postgres
  namespace: ate-system
spec:
  itemPath: "vaults/Secrets/items/agent-substrate-secrets"
