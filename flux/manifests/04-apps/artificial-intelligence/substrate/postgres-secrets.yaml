---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
# Single substrate database login: the CNPG bootstrap `substrate` user. Both
# chart connection strings (owner + read/write) use it; the assumed roles are
# also `substrate`, so no role-membership grants are needed.
# Item fields: username, password (CNPG bootstrap contract),
# ownerConnectionString + readWriteConnectionString
# (postgres://substrate:<password>@substrate-postgres-rw.ate-system.svc.cluster.local:5432/substrate).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: substrate-postgres
  namespace: ate-system
spec:
  itemPath: "vaults/Secrets/items/substrate-postgres"
