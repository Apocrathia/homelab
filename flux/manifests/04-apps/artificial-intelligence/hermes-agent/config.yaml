---
# Static config — reconciled into /opt/data/config.yaml on every pod start.
# Keys defined here are enforced; additional runtime keys (UI/CLI) are preserved.
# LiteLLM model id must match litellm.yml model_name.
# Dashboard OIDC is env-driven (see helmrelease) — same pattern as other generic-app OIDC apps.
#
# Bare provider: custom ignores OPENAI_API_KEY unless base_url is openai.com (#28660).
# Named custom_providers + key_env is required for cluster LiteLLM.
#
# Model tiers (all via LiteLLM → Prime):
#   main  = glm-5.2-prime          (default agent thinking)
#   hard  = kimi-k3-prime          (/model hard or /model hard --once)
#   smol  = llama3.1-8b-prime      (auxiliary side-jobs + /model smol)
# Hermes does not auto-route by difficulty — escalate hard with /model.
model:
  provider: litellm
  default: glm-5.2-prime

custom_providers:
  - name: litellm
    base_url: http://litellm.litellm.svc.cluster.local:4000/v1
    key_env: OPENAI_API_KEY
    # Curated catalog for the dashboard picker — skip live /v1/models dump.
    discover_models: false
    models:
      - glm-5.2-prime
      - kimi-k3-prime
      - llama3.1-8b-prime

model_aliases:
  hard:
    model: kimi-k3-prime
    provider: litellm
  smol:
    model: llama3.1-8b-prime
    provider: litellm

# Cheap side-jobs — titles, compression, approval, etc. Vision stays auto
# (Llama 3.1 8B is text-only; escalate vision via a multimodal model later).
auxiliary:
  title_generation:
    provider: litellm
    model: llama3.1-8b-prime
  compression:
    provider: litellm
    model: llama3.1-8b-prime
  approval:
    provider: litellm
    model: llama3.1-8b-prime
  web_extract:
    provider: litellm
    model: llama3.1-8b-prime
  skills_hub:
    provider: litellm
    model: llama3.1-8b-prime
  mcp:
    provider: litellm
    model: llama3.1-8b-prime
  triage_specifier:
    provider: litellm
    model: llama3.1-8b-prime
  profile_describer:
    provider: litellm
    model: llama3.1-8b-prime

# Error/capacity fallback for the main agent — not the same as /model hard.
fallback_providers:
  - provider: litellm
    model: kimi-k3-prime

mcp_servers:
  litellm:
    url: "http://litellm.litellm.svc.cluster.local:4000/mcp"
    headers:
      x-litellm-api-key: "Bearer ${OPENAI_API_KEY}"
      x-mcp-x-grafana-api-key: "${GRAFANA_API_KEY}"
      x-mcp-x-home-assistant-authorization: "${HA_TOKEN}"
      x-mcp-gitlab-private-token: "${GITLAB_TOKEN}"
    timeout: 180
  musicassistant:
    # No in-cluster Service — Music Assistant runs on the HA host.
    url: "http://home.services.apocrathia.com:8095/mcp/v1"
    headers:
      Authorization: "Bearer ${MA_TOKEN}"
    timeout: 180
  n8n:
    url: "http://n8n.n8n.svc.cluster.local/mcp-server/http"
    headers:
      Authorization: "Bearer ${N8N_API_KEY}"
    timeout: 180
  deepwiki:
    url: "https://mcp.deepwiki.com/mcp"
  context7:
    url: "https://mcp.context7.com/mcp"

# ── A2A (Agent-to-Agent) ──────────────────────────────────────────────
# Native Hermes A2A plugin — peers are kagent agents registered in
# litellm.yml under top-level `agents:`. The old MCP bridge
# (`mcp_servers.a2a`) was removed; prefer these native peers.
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/messaging/a2a
a2a_agents:
  homelab-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/homelab-agent"
    timeout: 120
  git-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/agent-git/git-agent"
    timeout: 120
  home-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/agent-home/home-agent"
    timeout: 120
  infrastructure-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/agent-infrastructure/infrastructure-agent"
    timeout: 120
  knowledge-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/agent-knowledge/knowledge-agent"
    timeout: 120
  media-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/agent-media/media-agent"
    timeout: 120
  search-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/agent-search/search-agent"
    timeout: 120
  k8s-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/k8s-agent"
    timeout: 120
  helm-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/helm-agent"
    timeout: 120
  cilium-policy-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/cilium-policy-agent"
    timeout: 120
  cilium-manager-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/cilium-manager-agent"
    timeout: 120
  observability-agent:
    url: "http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/observability-agent"
    timeout: 120
