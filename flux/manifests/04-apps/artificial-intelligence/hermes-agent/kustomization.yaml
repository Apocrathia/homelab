---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: hermes-agent

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: hermes-agent-config
    namespace: hermes-agent
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
