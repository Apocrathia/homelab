---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: hermes-agent
      namespace: hermes-agent
      # renovate: datasource=docker depName=nousresearch/hermes-agent
      image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524

      # s6 /init must run as root to fix /run and remap UIDs; generic-app defaults
      # to runAsUser 1000. Run gateway + dashboard directly as the image hermes user.
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          export HOME=/opt/data
          cd /opt/data
          source /opt/hermes/.venv/bin/activate
          if [[ "${HERMES_DASHBOARD:-}" =~ ^(1|true|yes)$ ]]; then
            hermes dashboard \
              --host "${HERMES_DASHBOARD_HOST:-0.0.0.0}" \
              --port "${HERMES_DASHBOARD_PORT:-9119}" \
              --no-open \
              --tui &
          fi
          exec hermes gateway run --no-supervise

      container:
        name: hermes-agent
        port: 9119
        env:
          - name: TZ
            value: "America/Denver"
          - name: HERMES_HOME
            value: "/opt/data"
          - name: HOME
            value: "/opt/data"
          - name: HERMES_GATEWAY_NO_SUPERVISE
            value: "1"
          - name: HERMES_DASHBOARD
            value: "1"
          - name: HERMES_DASHBOARD_HOST
            value: "0.0.0.0"
          - name: HERMES_DASHBOARD_PORT
            value: "9119"
          - name: HERMES_DASHBOARD_PUBLIC_URL
            value: "https://hermes-agent.gateway.services.apocrathia.com"
          # Self-hosted OIDC via Authentik (PKCE + confidential client secret)
          - name: HERMES_DASHBOARD_OIDC_ISSUER
            value: "https://auth.gateway.services.apocrathia.com/application/o/hermes-agent/"
          - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: oidc-client-id
          - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: oidc-client-secret
          - name: HERMES_DASHBOARD_OIDC_SCOPES
            value: "openid profile email"
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: litellm-api-key
          # MCP header substitution for config.yaml mcp_servers
          - name: GRAFANA_API_KEY
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: grafana-api-key
          - name: HA_TOKEN
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: ha-token
          - name: MA_TOKEN
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: ma-token
          - name: N8N_API_KEY
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: n8n-api-key
          - name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: gitlab-token
          # A2A inbound — lets other agents call Hermes via JSONRPC.
          # Bearer token lives in 1Password (hermes-agent-secrets/a2a-bearer-token).
          - name: A2A_HOST
            value: "0.0.0.0"
          - name: A2A_PORT
            value: "9900"
          - name: A2A_PUBLIC_URL
            value: "http://hermes-agent.hermes-agent.svc.cluster.local:9900"
          - name: A2A_BEARER_TOKEN
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secrets
                key: a2a-bearer-token

      service:
        type: ClusterIP
        port: 80
        targetPort: 9119
        portName: http
      # A2A inbound port — other agents reach Hermes via this port.
      extraServicePorts:
        - name: a2a
          port: 9900
          targetPort: 9900

      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false

      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp

      initContainers:
        - name: reconcile-config
          # renovate: datasource=docker depName=ghcr.io/trueforge-org/go-yq
          image: ghcr.io/trueforge-org/go-yq:4.53.6@sha256:3cc03b063250bf2bca9d6351723fe1d40358cf7586749c7b5fd3de7ddef860b9
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              static=/static/config.yaml
              runtime=/opt/data/config.yaml

              if [ ! -f "$static" ] || [ ! -s "$static" ]; then
                echo "ERROR: static config missing or empty at $static"
                exit 1
              fi

              # Zero-byte runtime is a trap: yq merge of empty+static can rewrite
              # emptiness and leave Hermes with no model config forever.
              if [ ! -f "$runtime" ] || [ ! -s "$runtime" ]; then
                echo "No/empty runtime config — copying static config"
                cp "$static" "$runtime"
              else
                echo "Reconciling static config into runtime config"
                tmp=$(mktemp)
                yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                  "$runtime" "$static" > "$tmp"
                yq eval '.' "$tmp" > /dev/null
                if [ ! -s "$tmp" ]; then
                  echo "ERROR: merge produced empty config — refusing to overwrite"
                  rm -f "$tmp"
                  exit 1
                fi
                mv "$tmp" "$runtime"
              fi

              chown 10000:10000 "$runtime"
              echo "config.yaml ready ($(wc -c < "$runtime") bytes)"
          volumeMounts:
            - name: state
              mountPath: /opt/data
          volumes:
            configMap:
              - name: static-config
                mountPath: /static
                configMapName: hermes-agent-config
                readOnly: true
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false

      healthChecks:
        livenessProbe:
          enabled: true
          tcpSocket:
            port: 9119
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          enabled: true
          tcpSocket:
            port: 9119
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          enabled: true
          tcpSocket:
            port: 9119
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

      volumeMounts:
        - name: state
          mountPath: /opt/data

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: state
            capacity: 10Gi

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/hermes-agent-secrets"

    authentik:
      enabled: true
      mode: oidc
      category: "Artificial Intelligence"
      displayName: "Hermes Agent"
      externalHost: "https://hermes-agent.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/artificial-intelligence/hermes-agent/icon.png"
      oidc:
        # Confidential + PKCE — same pattern as other generic-app OIDC apps.
        # Copy Authentik Client ID / Secret into 1Password after blueprint apply.
        redirectUris:
          - url: "https://hermes-agent.gateway.services.apocrathia.com/auth/callback"
            matchingMode: "strict"

    httproute:
      enabled: true
      hostname: "hermes-agent.gateway.services.apocrathia.com"
