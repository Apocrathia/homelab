---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-postgres
  namespace: litellm
spec:
  # PostgreSQL version
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e

  # Number of instances
  instances: 1

  # Barman backups: rustfs S3 (bucket `cnpg`, policy scoped to bucket+objects).
  # WAL archiving is continuous; base backups are triggered by the scheduled
  # Backup resource in scheduled-backup.yaml.
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      destinationPath: s3://cnpg/litellm
      endpointURL: http://storage.services.apocrathia.com:9009
      serverName: litellm-postgres
      s3Credentials:
        accessKeyId:
          name: litellm-postgres-backup-secrets
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: litellm-postgres-backup-secrets
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: zstd
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: true

  # Storage configuration
  storage:
    storageClass: longhorn
    size: 10Gi

  # Resource limits to prevent OOM kills
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  # PostgreSQL-specific configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
      secret:
        name: litellm-secrets
