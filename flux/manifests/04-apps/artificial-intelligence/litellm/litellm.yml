---
general_settings:
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Name
      litellm_user_role: internal_user

model_list:
  # OpenAI models
  - model_name: gpt-5
    litellm_params:
      model: gpt-5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5-nano
    litellm_params:
      model: gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY
  - model_name: o3-mini
    litellm_params:
      model: o3-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY

  # OpenAI Embedding models
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic models
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-4-5-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Local models (OpenAI-compatible endpoint)
  - model_name: llama3.2
    litellm_params:
      model: openai/llama3.2:3b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: gpt-oss
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: dolphin3
    litellm_params:
      model: openai/dolphin3:8b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: deepseek-r1
    litellm_params:
      model: openai/deepseek-r1:14b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: qwen3
    litellm_params:
      model: openai/qwen3:14b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: cogito
    litellm_params:
      model: openai/cogito:14b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: qwen3.5-small
    litellm_params:
      model: openai/qwen3.5:4b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: qwen3.5-medium
    litellm_params:
      model: openai/qwen3.5:9b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: qwen3.5-large
    litellm_params:
      model: openai/qwen3.5:27b
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: muse-glimmer
    litellm_params:
      model: openai/muse-glimmer
      api_base: os.environ/OLLAMA_OPENAI_API_BASE
  - model_name: nemotron-3.5-lightning
    litellm_params:
      model: openai/nemotron-3.5-lightning
      api_base: os.environ/OLLAMA_OPENAI_API_BASE

  # Prime Inference (cloud)
  - model_name: qwen3.8-prime
    litellm_params:
      model: openai/qwen/qwen3.8-max
      api_base: https://api.pinference.ai/api/v1
      api_key: os.environ/PRIME_API_KEY
      extra_headers:
        X-Prime-Team-ID: os.environ/PRIME_TEAM_ID
  - model_name: deepseek-v4-prime
    litellm_params:
      model: openai/deepseek/deepseek-v4-pro
      api_base: https://api.pinference.ai/api/v1
      api_key: os.environ/PRIME_API_KEY
      extra_headers:
        X-Prime-Team-ID: os.environ/PRIME_TEAM_ID
  - model_name: glm-5.2-prime
    litellm_params:
      model: openai/z-ai/glm-5.2
      api_base: https://api.pinference.ai/api/v1
      api_key: os.environ/PRIME_API_KEY
      extra_headers:
        X-Prime-Team-ID: os.environ/PRIME_TEAM_ID
  - model_name: kimi-k3-prime
    litellm_params:
      model: openai/moonshotai/kimi-k3
      api_base: https://api.pinference.ai/api/v1
      api_key: os.environ/PRIME_API_KEY
      extra_headers:
        X-Prime-Team-ID: os.environ/PRIME_TEAM_ID
  - model_name: llama3.1-8b-prime
    litellm_params:
      model: openai/meta-llama/llama-3.1-8b-instruct
      api_base: https://api.pinference.ai/api/v1
      api_key: os.environ/PRIME_API_KEY
      extra_headers:
        X-Prime-Team-ID: os.environ/PRIME_TEAM_ID

  # Abliterated: use ollama_chat + native OLLAMA_API_BASE so namespaced model IDs
  # (huihui_ai/...) are not split incorrectly by the openai/ compatible path.
  - model_name: qwen3.5-abliterated-small
    litellm_params:
      model: ollama_chat/huihui_ai/qwen3.5-abliterated:4b-Claude
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: qwen3.5-abliterated-medium
    litellm_params:
      model: ollama_chat/huihui_ai/qwen3.5-abliterated:9b-Claude
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: qwen3.5-abliterated-large
    litellm_params:
      model: ollama_chat/huihui_ai/qwen3.5-abliterated:27b-Claude
      api_base: os.environ/OLLAMA_API_BASE

  # Local embedding models (native Ollama endpoint)
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE
      drop_params: true
    model_info:
      mode: embedding

  # llm-d models (Kubernetes-native inference serving with inference-sim)
  # Uses openai/ provider prefix for OpenAI-compatible vLLM endpoint
  - model_name: inference-sim
    litellm_params:
      model: openai/llm-d/inference-sim
      api_base: http://llm-d-modelservice.llm-d.svc.cluster.local:8000/v1

# Mask credentials in prompts before any provider call (local or remote).
# Add custom entries with pattern_type: regex (pattern, name, action).
# Docs: https://docs.litellm.ai/docs/proxy/guardrails/litellm_content_filter
guardrails:
  - guardrail_name: "secret-mask"
    litellm_params:
      guardrail: litellm_content_filter
      mode: "pre_call"
      default_on: true
      pattern_redaction_format: "[{pattern_name}_REDACTED]"
      patterns:
        - pattern_type: "prebuilt"
          pattern_name: "aws_access_key"
          action: "MASK"
        - pattern_type: "prebuilt"
          pattern_name: "aws_secret_key"
          action: "MASK"
        - pattern_type: "prebuilt"
          pattern_name: "github_token"
          action: "MASK"
        - pattern_type: "prebuilt"
          pattern_name: "slack_token"
          action: "MASK"
        - pattern_type: "prebuilt"
          pattern_name: "generic_api_key"
          action: "MASK"
        - pattern_type: "regex"
          pattern: '\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b'
          name: "jwt"
          action: "MASK"

mcp_servers:
  context7:
    alias: "context7"
    url: "https://mcp.context7.com/mcp"
    transport: "http"
    auth_type: "none"
  deepwiki:
    alias: "deepwiki"
    url: "https://mcp.deepwiki.com/mcp"
    transport: "http"
    auth_type: "none"
  discord:
    alias: "discord"
    url: "http://discord.mcp-discord.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  firecrawl:
    alias: "firecrawl"
    url: "http://firecrawl.mcp-firecrawl.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  flux:
    alias: "flux"
    url: "http://flux.mcp-flux.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  gitlab:
    alias: "gitlab"
    url: "http://gitlab.mcp-gitlab.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
    # Forward caller GitLab PAT (REMOTE_AUTHORIZATION on the MCP server).
    extra_headers:
      - "Private-Token"
      - "Authorization"
  github:
    alias: "github"
    url: "http://github.mcp-github.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
    # Forward caller Authorization; do not inject a shared PAT here.
    extra_headers:
      - "Authorization"
  grafana:
    alias: "grafana"
    url: "http://grafana.mcp-grafana.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
    # Forward Grafana auth headers from client
    extra_headers:
      - "X-Grafana-API-Key"
  homeassistant:
    alias: "homeassistant"
    url: "https://home.services.apocrathia.com:8123/api/mcp"
    transport: "http"
    auth_type: "none"
    # Static HA Long-Lived Access Token for initialization
    static_headers:
      Authorization: os.environ/HOMEASSISTANT_TOKEN
    # Allow client to override with their own token
    extra_headers:
      - "Authorization"
  openzim:
    alias: "openzim"
    url: "http://openzim.mcp-openzim.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  proxmox:
    alias: "proxmox"
    url: "http://proxmox.mcp-proxmox.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  qdrant:
    alias: "qdrant"
    url: "http://qdrant.mcp-qdrant.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  searxng:
    alias: "searxng"
    url: "http://searxng.mcp-searxng.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  servarr:
    alias: "servarr"
    url: "http://servarr.mcp-servarr.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  truenas:
    alias: "truenas"
    url: "http://truenas.mcp-truenas.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"
  unifi:
    alias: "unifi"
    url: "http://unifi.mcp-unifi.svc.cluster.local:8080/mcp"
    transport: "http"
    auth_type: "none"

