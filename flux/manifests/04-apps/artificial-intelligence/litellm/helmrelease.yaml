---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: litellm-helm
      # renovate: datasource=docker depName=ghcr.io/berriai/litellm-helm
      version: "1.105.0"
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system

  # Pull all sensitive configuration from secret
  valuesFrom:
    - kind: Secret
      name: litellm-secrets
      valuesKey: master-key
      targetPath: proxy_config.general_settings.master_key
    - kind: Secret
      name: litellm-secrets
      valuesKey: master-key
      targetPath: envVars.LITELLM_MASTER_KEY
    - kind: Secret
      name: litellm-secrets
      valuesKey: username
      targetPath: proxy_config.general_settings.ui_username
    - kind: Secret
      name: litellm-secrets
      valuesKey: password
      targetPath: proxy_config.general_settings.ui_password
    - kind: Secret
      name: litellm-secrets
      valuesKey: anthropic-api-key
      targetPath: envVars.ANTHROPIC_API_KEY
    - kind: Secret
      name: litellm-secrets
      valuesKey: ollama-api-base
      targetPath: envVars.OLLAMA_API_BASE
    - kind: Secret
      name: litellm-secrets
      valuesKey: ollama-openai-api-base
      targetPath: envVars.OLLAMA_OPENAI_API_BASE
    - kind: Secret
      name: litellm-secrets
      valuesKey: openai-api-key
      targetPath: envVars.OPENAI_API_KEY
    - kind: Secret
      name: litellm-secrets
      valuesKey: prime-api-key
      targetPath: envVars.PRIME_API_KEY
    - kind: Secret
      name: litellm-secrets
      valuesKey: prime-team-id
      targetPath: envVars.PRIME_TEAM_ID
    - kind: Secret
      name: litellm-secrets
      valuesKey: redis-password
      targetPath: envVars.REDIS_PASSWORD
    - kind: Secret
      name: litellm-secrets
      valuesKey: homeassistant-token
      targetPath: envVars.HOMEASSISTANT_TOKEN
    # Full "Bearer <token>" header value for Hermes Agent inbound A2A auth
    # (same token as hermes-agent-secrets/a2a-bearer-token).
    - kind: Secret
      name: litellm-secrets
      valuesKey: hermes-a2a-authorization
      targetPath: envVars.HERMES_A2A_AUTHORIZATION
    # Full "Bearer <token>" header value for Prime Agent inbound A2A auth
    # (same token as prime-agent-secrets/a2a-webhook-token).
    - kind: Secret
      name: litellm-secrets
      valuesKey: prime-a2a-authorization
      targetPath: envVars.PRIME_A2A_AUTHORIZATION
    - kind: Secret
      name: litellm-secrets
      valuesKey: oidc-client-id
      targetPath: envVars.GENERIC_CLIENT_ID
    - kind: Secret
      name: litellm-secrets
      valuesKey: oidc-client-secret
      targetPath: envVars.GENERIC_CLIENT_SECRET

  values:
    # Use the database-optimized image
    image:
      repository: ghcr.io/berriai/litellm-database
      pullPolicy: IfNotPresent
      # renovate: datasource=docker depName=ghcr.io/berriai/litellm-database
      tag: "v1.105.0"

    # Chart-native HPA; min 3 keeps a NotReady pod from emptying endpoints.
    # CPU-only signal — chart 1.104.2's hpa.yaml supports it, but we (like
    # chart defaults) deliberately omit targetMemoryUtilizationPercentage:
    # prisma query-engine memory ratchets to worst-ever-write and never
    # releases. One-time first-apply blip: 3-way merge drops spec.replicas,
    # ReplicaSet scales 3→1, HPA restores 3 in ~15s but cold start 60–90s —
    # net ~90–120s one ready pod; apply in a quiet window.
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 6
      targetCPUUtilizationPercentage: 60

    # Keep replicas on separate nodes; NotReady flaps stay node-local
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
                  app.kubernetes.io/instance: litellm

    # Service configuration
    service:
      type: ClusterIP
      port: 4000

    # Ingress disabled - using Gateway API (HTTPRoute direct to service)
    ingress:
      enabled: false

    # Resource limits
    resources:
      requests:
        cpu: 1000m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 4Gi

    # Environment secrets
    environmentSecrets:
      - litellm-secrets

    # Use existing database (our CNPG cluster)
    db:
      useExisting: true
      deployStandalone: false
      endpoint: litellm-postgres-rw.litellm.svc.cluster.local:5432
      database: litellm
      secret:
        name: litellm-secrets
        usernameKey: username
        passwordKey: password

    # Disable built-in postgres since we use CNPG
    postgresql:
      enabled: false

    # Cache is litellm-valkey (generic-app); chart Redis/Bitnami subchart off
    redis:
      enabled: false

    # Use the rbac.yaml service account
    serviceAccount:
      create: false
      name: litellm

    # Proxy configuration
    proxyConfigMap:
      create: true

    # Mount the ConfigMap containing model configuration
    volumes:
      - name: model-config
        configMap:
          name: litellm-config

    volumeMounts:
      - name: model-config
        mountPath: /tmp/model-config/
        readOnly: true

    # Additional environment variables
    envVars:
      CONFIG_FILE_PATH: "/etc/litellm/config.yaml"
      # Valkey (Redis protocol) for response cache — see valkey.yaml
      REDIS_HOST: litellm-valkey
      REDIS_PORT: "6379"
      # OpenTelemetry configuration for tracing
      OTEL_EXPORTER: "otlp_grpc"
      OTEL_ENDPOINT: "http://alloy.alloy-system.svc.cluster.local:4317"
      OTEL_SERVICE_NAME: "litellm"
      # Head-sample 25% of traces; OTel export to alloy was resource-exhausted
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      OTEL_TRACES_SAMPLER_ARG: "0.25"
      PROXY_BASE_URL: "https://ai.gateway.services.apocrathia.com"
      GENERIC_AUTHORIZATION_ENDPOINT: "https://auth.gateway.services.apocrathia.com/application/o/authorize/"
      GENERIC_TOKEN_ENDPOINT: "https://auth.gateway.services.apocrathia.com/application/o/token/"
      GENERIC_USERINFO_ENDPOINT: "https://auth.gateway.services.apocrathia.com/application/o/userinfo/"
      GENERIC_SCOPE: "openid profile email"
      AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"

    proxy_config:
      # Include model configuration from separate file using relative path
      include:
        - ../../tmp/model-config/models.yaml

      # Override default model_list to prevent duplicate entries with placeholder keys
      model_list: []

      # Retry transient upstream failures instead of hard-400ing callers.
      # Fallbacks: glm-5.3-prime -> closest Prime Inference capability peers.
      router_settings:
        num_retries: 2
        retry_after: 5
        allowed_fails: 3
        timeout: 120
        fallbacks:
          - glm-5.3-prime: ["deepseek-v4-prime", "kimi-k3-prime"]

      general_settings:
        # Database configuration
        store_model_in_db: true

        # Rate limiting
        default_max_tokens: 1000000
        default_tpm_limit: 60000
        default_rpm_limit: 600

      litellm_settings:
        # Logging and monitoring via OpenTelemetry
        success_callback: ["otel"]
        failure_callback: ["otel"]

        # Cost tracking
        track_cost_per_user: true

        # Health checks
        health_check_interval: 300

        # Caching
        cache: false
        cache_params:
          type: redis
          namespace: "litellm"
          ttl: 3600
          max_connections: 50

    # Migration job configuration
    migrationJob:
      enabled: true
      retries: 3
      backoffLimit: 4
      ttlSecondsAfterFinished: 3600 # 1 hour - allows Helm to manage the job properly
      hooks:
        argocd:
          enabled: false
        helm:
          enabled: true # Auto-deletes old job before creating new one

    # Probes: chart 1.104.2 has no separateHealthApp/separateHealthPort
    # values (silently ignored) — removed. Liveness tuned so load-burst
    # stalls of the serving loop don't get the pod killed:
    # 30s period, 10s timeout, 6 failures = ~3 min sustained failure
    # before a restart (was 15s/5s/5 = 75s).
    livenessProbe:
      path: /health/liveliness
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 6

    # Readiness tuned for the DB-backed readiness flap: the /health/readiness
    # endpoint can exceed the chart's 5s kubelet timeout under DB load
    # (inference stays healthy), so double the timeout and require 6
    # consecutive failures (~60s at 10s period) before the pod flips
    # NotReady instead of 3 (~30s).
    readinessProbe:
      path: /health/readiness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 6

    # Cold start against CNPG (prisma schema check) takes ~60-90s;
    # 10s x 18 = 180s startup budget before liveness takes over.
    startupProbe:
      path: /health/readiness
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 18

    # Pod disruption budget
    pdb:
      enabled: true
      minAvailable: 1
