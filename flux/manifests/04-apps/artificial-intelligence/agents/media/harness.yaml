---
# v1alpha3 Agent.spec.harnessRef is namespace-local, so every namespace that
# hosts Agents needs its own Harness (the kagent chart only creates one in
# its release namespace). Mirrors the chart's kagent-default Harness: Go ADK
# runtime, local WorkerPool, snapshots on the shared ate-cache bucket.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent-default
  namespace: agent-media
  labels:
    app.kubernetes.io/name: media-agent
    app.kubernetes.io/component: harness
    app.kubernetes.io/part-of: artificial-intelligence
spec:
  kagent: {}
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: "s3://ate-snapshots/agent-media/"
