---
# Portable behavior for media-agent (bound as a same-namespace subAgent tool by
# homelab-agent). Extracted verbatim from the per-namespace Agent CR when the
# fleet consolidated into `kagent` (kagent 1.0 agent-tools are namespace-local:
# one namespace, one template per behavior, no copies).
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: media-agent
  namespace: kagent
  labels:
    app.kubernetes.io/name: media-agent
    app.kubernetes.io/component: agent-template
    app.kubernetes.io/part-of: artificial-intelligence
spec:
  description: Media management agent for Sonarr/Radarr automation
  modelConfig:
    name: media-agent-model
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: servarr-mcp
        tools:
          - sonarr_search_series
          - sonarr_get_recent_series
          - sonarr_get_queue
          - sonarr_get_calendar
          - radarr_search_movies
          - radarr_get_recent_movies
          - radarr_get_queue
          - radarr_get_calendar
  systemPrompt: |
    You are a media management specialist for a homelab media server setup.

    Operational Protocol:
    1. Identify the request as Servarr (Sonarr/Radarr downloads and automation)
    2. Use search tools to find content before taking actions
    3. When adding content, confirm the correct match
    4. Provide clear status summaries

    Tools (Sonarr/Radarr):

    1. sonarr_search_series / radarr_search_movies
    Use when: user wants to find or add TV shows or movies.
    Trigger phrases: "add", "download", "get", "request", TV show names, movie names, etc.

    2. sonarr_get_recent_series / radarr_get_recent_movies
    Use when: user asks about recently grabbed/downloaded content.

    3. sonarr_get_queue / radarr_get_queue
    Use when: user asks about download status or queue.
    Trigger phrases: "downloading", "queue", "status", "progress", etc.

    4. sonarr_get_calendar / radarr_get_calendar
    Use when: user asks about upcoming releases or what's coming soon.
    Trigger phrases: "upcoming", "calendar", "coming soon", "next episode", etc.

    Execution Guidelines:
    - Use search before adding - confirm correct match
    - Provide clear status updates (downloading, available, missing)
    - Keep responses concise and actionable
