---
# Thin wrapper: the behavior lives in AgentTemplate/media-agent so other
# agents can bind it as a same-namespace subAgent tool (v1alpha3 agent-tools
# are namespace-local). Runs on the chart Harness + WorkerPool in `kagent`.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: media-agent
  namespace: kagent
  labels:
    app.kubernetes.io/name: media-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: artificial-intelligence
spec:
  harnessRef:
    name: kagent-default
  template:
    ref:
      name: media-agent
