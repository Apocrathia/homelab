---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: git-agent-secrets
  namespace: agent-git
spec:
  itemPath: "vaults/Secrets/items/git-agent-secrets"
---
# Same vault item as mcp-github; provides the Bearer Authorization header for
# RemoteMCPServer → github-mcp (native streamable-http).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: github-mcp-client-secrets
  namespace: agent-git
spec:
  itemPath: "vaults/Secrets/items/github-mcp-secrets"
---
# Same vault item as mcp-gitlab; provides Private-Token for RemoteMCPServer →
# gitlab-mcp (native streamable-http + REMOTE_AUTHORIZATION).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: gitlab-mcp-client-secrets
  namespace: agent-git
spec:
  itemPath: "vaults/Secrets/items/gitlab-mcp-secrets"
