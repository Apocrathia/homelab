---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-knowledge
  labels:
    app.kubernetes.io/name: knowledge-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
    kagent-agent: "true"
    mcp-client: "true"
    # Substrate worker pods (WorkerPool/kagent-default) run in this namespace:
    # RunAsUser 0 + hostPath ate-base + seccomp Unconfined trip PSA baseline,
    # so the namespace must enforce privileged (same rationale as ate-system).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/enforce-version: latest
