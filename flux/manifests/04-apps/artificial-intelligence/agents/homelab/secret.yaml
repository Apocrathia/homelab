---
# kagent: ModelConfig apiKeySecret (same namespace as Agent + ModelConfig)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homelab-agent-secrets
  namespace: kagent
spec:
  itemPath: "vaults/Secrets/items/homelab-agent-secrets"
---
# agent-homelab: Discord bridge secretKeyRef (Pod cannot reference cross-namespace Secrets)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homelab-agent-secrets
  namespace: agent-homelab
spec:
  itemPath: "vaults/Secrets/items/homelab-agent-secrets"
