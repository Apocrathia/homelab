---
# Bridge-only namespace: homelab-agent itself runs in `kagent` with the rest
# of the consolidated fleet; this namespace hosts the discord-bridge
# HelmRelease (Discord bot that relays to the agent via A2A).
apiVersion: v1
kind: Namespace
metadata:
  name: agent-homelab
  labels:
    app.kubernetes.io/name: discord-bridge
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
