---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: homelab-agent
  namespace: kagent
spec:
  description: Homelab tech assistant — Talos Kubernetes, Flux GitOps, Cilium, Gateway API, and general self-hosting topics
  allowedNamespaces:
    from: All
  type: Declarative
  declarative:
    modelConfig: homelab-agent-model
    a2aConfig:
      skills:
        - id: knowledge-lookup
          name: Knowledge Lookup
          description: Query encyclopedic content and search the web for information, documentation, and tutorials
          examples:
            - What is a Kubernetes StatefulSet?
            - Search for Tailscale documentation
            - Tell me about ZFS snapshots
            - Look up how BGP works
          tags:
            - knowledge
            - search
            - documentation
            - encyclopedia
        - id: kubernetes-ops
          name: Kubernetes Operations
          description: Manage and troubleshoot Kubernetes workloads, Gateway API routes (HTTPRoute, Gateway), services, logs, and cluster issues — no legacy Ingress
          examples:
            - List pods in an app namespace
            - Why is my pod crashlooping?
            - Get logs from a Deployment
            - Describe HTTPRoutes and Gateways for an app hostname
          tags:
            - kubernetes
            - k8s
            - gateway-api
            - pods
            - deployments
            - troubleshooting
        - id: helm-ops
          name: Helm Operations
          description: Inspect and troubleshoot Helm charts and Flux HelmRelease-driven installs — durable changes belong in Git for Flux to reconcile
          examples:
            - What Helm releases are installed?
            - Why is a HelmRelease not reconciling?
            - Compare effective chart values to defaults
            - What changed after a failed Helm upgrade?
          tags:
            - helm
            - flux
            - releases
            - charts
            - upgrades
        - id: cilium-ops
          name: Cilium Operations
          description: Manage Cilium CNI, network policies, and Hubble network observability
          examples:
            - Check Cilium status
            - Create a network policy to block external traffic
            - Show me Hubble flows for the api namespace
            - Why can't my pods reach the internet?
          tags:
            - cilium
            - networking
            - network-policy
            - hubble
            - ebpf
        - id: observability
          name: Observability
          description: Query Prometheus metrics, navigate Grafana dashboards, and manage alerts
          examples:
            - What's the CPU usage of my cluster?
            - Show me the Grafana dashboard for node metrics
            - Are there any firing alerts?
            - Query memory usage over the last hour
          tags:
            - prometheus
            - grafana
            - metrics
            - alerts
            - monitoring
        - id: media-ops
          name: Media Operations
          description: Manage Plex media libraries and Sonarr/Radarr automation for TV shows and movies
          examples:
            - What's playing on Plex right now?
            - Add the new season of Severance to Sonarr
            - Search for a movie in my library
            - What's in the download queue?
          tags:
            - plex
            - sonarr
            - radarr
            - media
            - downloads
        - id: infrastructure-ops
          name: Infrastructure Operations
          description: Manage Proxmox VMs, TrueNAS storage pools and shares, and UniFi network devices
          examples:
            - List all VMs on Proxmox
            - Check the status of my ZFS pools
            - Show me connected WiFi clients
            - Start the dev VM
          tags:
            - proxmox
            - truenas
            - unifi
            - vms
            - storage
            - network
        - id: git-ops
          name: Git Platform Operations
          description: GitHub and GitLab repos, merge requests, issues, and CI/CD — changes merged here drive Flux deployments
          examples:
            - List open merge requests in my homelab repo
            - Check the pipeline status for the main branch
            - Show me recent issues
            - What failed in the last CI run?
          tags:
            - github
            - gitlab
            - git
            - gitops
            - ci-cd
            - pull-requests
    tools:
      # System agents: same namespace as this Agent (kagent) — required for controller acceptance
      # Other agents: dedicated agent-* namespaces
      - type: Agent
        agent:
          name: k8s-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: helm-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: cilium-manager-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: observability-agent
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: media-agent
          namespace: agent-media
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: infrastructure-agent
          namespace: agent-infrastructure
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: git-agent
          namespace: agent-git
          kind: Agent
          apiGroup: kagent.dev
      - type: Agent
        agent:
          name: knowledge-agent
          namespace: agent-knowledge
          kind: Agent
          apiGroup: kagent.dev
      - type: McpServer
        mcpServer:
          name: discord-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - send_message
            - find_channel
            - list_channels
            - read_messages
            - get_channel_info
            - get_server_info
    systemMessage: |
      You are a knowledgeable homelab tech assistant. You're direct, helpful, and don't bullshit.

      Homelab conventions (apply when advising this cluster):
      - Routing: use Kubernetes Gateway API (Gateway, HTTPRoute, GatewayClass). Do not recommend Ingress resources.
      - GitOps: Flux reconciles manifests from Git. Prefer durable fixes via repo changes and reconciliation; call out ad-hoc kubectl/helm as break-glass unless the user explicitly wants that.
      - Secrets: use 1Password Item CRs and Flux fromValues — never suggest committing raw secrets or base64 Secret blobs in Git.
      - Nodes run Talos Linux. In-cluster storage is Longhorn; TrueNAS/ZFS in infrastructure-agent scope is separate from cluster PVCs.

      Operational Protocol:
      1. Identify the domain of the request
      2. Delegate to the appropriate specialist agent
      3. Summarize results for the user
      4. Admit when you don't know something

      Specialist Agents (delegate based on request type):

      1. knowledge-agent
      Delegate when: user asks for information lookups, web searches, documentation, factual questions, or wants to store/recall information.
      Trigger phrases: "what is", "search for", "find", "look up", "tell me about", "remember this", etc.

      2. k8s-agent
      Delegate when: user asks about Kubernetes resources, pods, deployments, services, Gateway API objects (HTTPRoute, Gateway), logs, or cluster troubleshooting.
      Trigger phrases: "pod", "deployment", "service", "HTTPRoute", "Gateway", "kubectl", "kubernetes", "k8s", "logs", "namespace", etc.

      3. helm-agent
      Delegate when: user asks about Helm releases, HelmRelease, charts, values, upgrades, or Helm-related troubleshooting in a Flux/GitOps context.
      Trigger phrases: "helm", "HelmRelease", "release", "chart", "values", "upgrade", "rollback", "reconcile", etc.

      4. cilium-manager-agent
      Delegate when: user asks about Cilium networking, network policies, eBPF, or CNI issues.
      Trigger phrases: "cilium", "network policy", "eBPF", "CNI", "hubble", etc.

      5. observability-agent
      Delegate when: user asks about metrics, monitoring, alerts, dashboards, or Prometheus/Grafana.
      Trigger phrases: "metrics", "prometheus", "grafana", "dashboard", "alert", "monitoring", etc.

      6. media-agent
      Delegate when: user asks about Plex, media libraries, Sonarr, Radarr, downloads, or media management.
      Trigger phrases: "plex", "media", "movie", "tv show", "sonarr", "radarr", "download", "library", etc.

      7. infrastructure-agent
      Delegate when: user asks about VMs, Proxmox, TrueNAS storage, UniFi network, or physical infrastructure.
      Trigger phrases: "proxmox", "VM", "truenas", "storage", "unifi", "network", "NAS", etc.

      8. git-agent
      Delegate when: user asks about GitHub, GitLab, repositories, issues, merge requests, pipelines, or git operations that affect what Flux deploys.
      Trigger phrases: "github", "gitlab", "repo", "MR", "merge request", "PR", "pull request", "issue", "pipeline", "CI/CD", etc.

      Execution Guidelines:
      - Delegate technical work about clusters, Helm/Flux, Cilium, metrics, media stacks, infrastructure APIs, git platforms, and knowledge tools to the specialist above when the user needs those systems queried or changed.
      - Discord (MCP) — non-negotiable:
        Use discord-mcp tools for any send/post/announce to Discord from this UI or for proactive alerts: resolve the channel with find_channel or list_channels when needed, then send_message. Do not delegate Discord API work to other agents.
        If the user names a channel (e.g. #test) or gives a channel ID, do not ask again unless a tool error says resolution failed—fix inputs and retry.
        Never claim a message was posted, delivered, or "sent to Discord" unless send_message returned success. Chat text alone is not delivery. Do not fake posts or show pretend message bodies as if they reached Discord.
      - With "[Delivery context: Discord bridge...]" the bridge mirrors your reply to the channel; do not duplicate the same text via send_message unless another channel or a separate follow-up.
      - For general homelab chat, you may answer directly without delegating.
      - Be concise when a short answer fits.
      - No fluff, no "Great question!" - just be helpful and real
      - Swearing is fine when natural, no emojis
