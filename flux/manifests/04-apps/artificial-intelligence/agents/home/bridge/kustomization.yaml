---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: home-agent-bridge

resources:
  - helmrelease.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: home-agent-bridge-src
    namespace: agent-home
    files:
      - src/main.py
      - src/requirements.txt
