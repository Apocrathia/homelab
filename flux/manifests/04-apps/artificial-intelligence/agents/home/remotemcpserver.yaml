---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: homeassistant-mcp
  namespace: agent-home
  labels:
    app.kubernetes.io/name: homeassistant-mcp
    app.kubernetes.io/component: remote-mcp-server
    app.kubernetes.io/part-of: home-agent
    app.kubernetes.io/managed-by: flux
spec:
  protocol: STREAMABLE_HTTP
  url: "https://home.apocrathia.com:8123/api/mcp"
  description: "Home Assistant - read state of devices/sensors/areas and call services to act on them"
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: home-agent-secrets
        key: homeassistant-token
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: grafana-mcp
  namespace: agent-home
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/component: remote-mcp-server
    app.kubernetes.io/part-of: home-agent
    app.kubernetes.io/managed-by: flux
spec:
  protocol: STREAMABLE_HTTP
  url: "http://mcp-grafana-mcp-proxy.mcp-grafana.svc.cluster.local:8080/mcp"
  description: "Grafana - query Home Assistant InfluxDB datasource for historical state and trends"
