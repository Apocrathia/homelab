---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: infrastructure-agent-model
  namespace: kagent
spec:
  provider: OpenAI
  model: glm-5.3-prime
  openAI:
    baseUrl: http://litellm.litellm.svc.cluster.local:4000/v1
  # kagent 1.0.1 compiles shared subagent trees into one runtime with one
  # gateway credential per origin+header: every ModelConfig in a shared tree
  # must reference the same Secret. All agent litellm keys are the same value;
  # kagent-secrets is the chart default's Secret, so the tree standardizes on
  # it (the infrastructure-agent-secrets OnePasswordItem is now unused by this
  # ModelConfig).
  apiKeySecret: kagent-secrets
  apiKeySecretKey: litellm-api-key
