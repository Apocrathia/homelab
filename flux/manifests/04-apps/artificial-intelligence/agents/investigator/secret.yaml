---
# kagent: ModelConfig apiKeySecret (same namespace as Agent + ModelConfig).
# Field (1Password field label = rendered Secret key):
#   litellm-api-key - API key for the cluster LiteLLM proxy (operator adds
#                     the value; git only names the field). Same convention
#                     as git-agent-secrets / homelab-agent-secrets.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: investigator-agent-secrets
  namespace: kagent
spec:
  itemPath: "vaults/Secrets/items/investigator-agent-secrets"
---
# Namespace materialization of the tenzir-secrets item (the "one item,
# multiple OnePasswordItem CRs" 1Password-operator pattern): the
# investigator agent consumes ONLY the investigations-api-token field
# (the node web-API token, node README bootstrap step 5) — the Agent CR
# projects that single key into its pod via a secret-volume items filter
# (agent.yaml spec.deployment.volumes). The other fields ride the
# rendered Secret in-namespace but are never mounted anywhere in the
# agent pod.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tenzir-secrets
  namespace: kagent
spec:
  itemPath: "vaults/Secrets/items/tenzir-secrets"
