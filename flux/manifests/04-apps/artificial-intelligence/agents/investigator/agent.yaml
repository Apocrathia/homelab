---
# Thin wrapper: the behavior lives in AgentTemplate/investigator-agent so
# homelab-agent can bind it as a same-namespace subAgent tool (v1alpha3
# agent-tools are namespace-local). Egress grants live here (Agent-level),
# not on the template.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: investigator-agent
  namespace: kagent
  labels:
    app.kubernetes.io/name: investigator-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: artificial-intelligence
spec:
  harnessRef:
    name: kagent-default
  template:
    ref:
      name: investigator-agent
  # Replaces the 0.10.x sandbox.network.allowedDomains grant: sandbox egress
  # is denied by default, so both investigations-node lanes must be granted
  # here (and on homelab-agent, which compiles the investigator as a shared
  # subagent into its own runtime).
  egressPolicyRefs:
    - name: investigator-tenzir-egress
