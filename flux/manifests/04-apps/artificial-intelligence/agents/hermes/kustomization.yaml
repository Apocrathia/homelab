---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: hermes-agent

resources:
  - namespace.yaml
  - secret.yaml
  - agent.yaml

# The Agent CR references the ConfigMap by name; keep it stable. Editing
# src/server.py therefore needs a pod rollout to take effect (see README).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: hermes-proxy-src
    namespace: agent-hermes
    files:
      - server.py=src/server.py
