---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: hermes-agent
  namespace: agent-hermes
spec:
  description: >-
    Hermes personal agent (Nous Research) — general-purpose work outside the
    homelab Kubernetes toolset: browser automation, multi-step web research,
    code execution, image/video generation, and long-running personal tasks.
    Fronts the hermes-agent app's A2A endpoint via an auth-forwarding proxy.
  allowedNamespaces:
    from: All
  type: BYO
  byo:
    deployment:
      # Stock python image; the proxy is stdlib-only and mounted from the
      # hermes-proxy-src ConfigMap (no pip install at runtime).
      # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
      image: public.ecr.aws/docker/library/python:3.14-slim@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
      cmd: /bin/sh
      args:
        - -c
        - exec python3 /opt/hermes-proxy/server.py
      env:
        - name: HOME
          value: "/tmp"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: HERMES_A2A_URL
          value: "http://hermes-agent.hermes-agent.svc.cluster.local:9900"
        - name: HERMES_PROXY_URL
          value: "http://hermes-agent.agent-hermes.svc.cluster.local:8080"
        - name: HERMES_A2A_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: agent-hermes-secrets
              key: a2a-bearer-token
      volumeMounts:
        - name: hermes-proxy-src
          mountPath: /opt/hermes-proxy
          readOnly: true
      volumes:
        - name: hermes-proxy-src
          configMap:
            name: hermes-proxy-src
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
