---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datahub-prerequisites
  namespace: datahub
spec:
  # Release name matches the service hostnames hard-coded in the datahub chart
  # global defaults (prerequisites-mysql, prerequisites-kafka). Changing this
  # forces overriding every global.*.host value in the datahub HelmRelease.
  releaseName: prerequisites
  interval: 1h
  timeout: 20m
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    remediation:
      retries: 3
  chart:
    spec:
      chart: datahub-prerequisites
      # renovate: datasource=helm registryUrl=https://helm.datahubproject.io/ depName=datahub-prerequisites
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: datahub
        namespace: flux-system
      interval: 1h

  values:
    # Use OpenSearch (modern default per upstream chart); ES disabled
    elasticsearch:
      enabled: false

    opensearch:
      enabled: true
      singleNode: true
      # OpenSearch chart from opensearch-project/helm-charts (not bitnami)
      # Security plugin disabled by chart default in prereqs values; no auth
      # is exchanged between OpenSearch and DataHub on the in-cluster network.
      config:
        opensearch.yml: |
          plugins:
            security:
              disabled: true
      extraEnvs:
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: "true"
      image:
        tag: "2.19.5"
      opensearchJavaOpts: "-Xms1024m -Xmx1024m"
      resources:
        requests:
          cpu: "100m"
          memory: "1536Mi"
        limits:
          cpu: "1500m"
          memory: "2Gi"
      persistence:
        enabled: true
        storageClass: longhorn
        accessModes:
          - ReadWriteOnce
        size: 20Gi

    # Graph service runs on ES/OpenSearch (global.graph_service_impl), Neo4j unused
    neo4j:
      enabled: false

    mysql:
      enabled: true
      image:
        repository: bitnamilegacy/mysql
        tag: 8.0.40-debian-12-r5
      auth:
        existingSecret: datahub-secrets
      primary:
        extraFlags: "--character-set-server=utf8mb4 --collation-server=utf8mb4_bin"
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        persistence:
          enabled: true
          storageClass: longhorn
          accessModes:
            - ReadWriteOnce
          size: 10Gi

    postgresql:
      enabled: false

    gcloud-sqlproxy:
      enabled: false

    # Confluent Platform tooling not used; DataHub's INTERNAL schema registry
    # in GMS handles schema management for the metadata topics.
    cp-helm-charts:
      enabled: false

    kafka:
      enabled: true
      image:
        repository: bitnamilegacy/kafka
      listeners:
        client:
          protocol: PLAINTEXT
        interbroker:
          protocol: PLAINTEXT
      controller:
        replicaCount: 1
        controllerOnly: false
        # Single-pod KRaft requires replication factor 1 on internal topics
        # (consumer_offsets, transaction state log); the defaults of 3 fail to
        # elect a leader against one broker and the controller crashloops.
        extraConfig: |
          default.replication.factor=1
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
        persistence:
          enabled: true
          storageClass: longhorn
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
      broker:
        replicaCount: 0
        minId: 0
      kraft:
        enabled: true
      zookeeper:
        enabled: false
