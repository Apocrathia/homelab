---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datahub
  namespace: datahub
spec:
  # Hold off install until the prerequisites release is reconciled so the
  # mysqlSetupJob hook and GMS startup probes don't race the backing services.
  dependsOn:
    - name: datahub-prerequisites
      namespace: datahub
  interval: 1h
  timeout: 30m
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    cleanupOnFail: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: datahub
      # renovate: datasource=helm registryUrl=https://helm.datahubproject.io/ depName=datahub
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: datahub
        namespace: flux-system
      interval: 1h

  # OIDC client credentials for datahub-frontend, sourced from 1Password
  valuesFrom:
    - kind: Secret
      name: datahub-secrets
      valuesKey: oidc-client-id
      targetPath: datahub-frontend.oidcAuthentication.clientId

  values:
    global:
      # Disable LinkedIn's product analytics. DataHub still functions
      # without analytics; this matches the homelab privacy stance.
      datahub_analytics_enabled: false
      strict_mode: true
      # ES-backed graph store (default since v0.10.x); Neo4j stays off
      graph_service_impl: elasticsearch
      datahub_standalone_consumers_enabled: false
      imageRegistry: "docker.io"

      elasticsearch:
        # Service name from the OpenSearch project chart (does not honor the
        # prerequisites release name like the Bitnami subcharts do).
        host: "opensearch-cluster-master"
        port: "9200"
        useSSL: "false"
        insecure: "false"
        skipcheck: "false"
        engineType: "AUTO_DETECT"
        autoDetect: "true"

      kafka:
        bootstrap:
          server: "prerequisites-kafka:9092"
        # System-update creates the Kafka topics; no setup job needed (v1.3+)
        precreateTopics: true
        schemaregistry:
          # GMS-internal schema registry, no external CP schema registry
          type: INTERNAL

      sql:
        datasource:
          host: "prerequisites-mysql:3306"
          hostForMysqlClient: "prerequisites-mysql"
          port: "3306"
          url: "jdbc:mysql://prerequisites-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2"
          driver: "com.mysql.cj.jdbc.Driver"
          database: "datahub"
          username: "root"
          password:
            secretRef: datahub-secrets
            secretKey: mysql-root-password

      datahub:
        version: v1.5.0.1
        timezone: "America/Denver"
        appVersion: "1.5.0"
        gms:
          protocol: "http"
          port: "8080"

        # System-update handles MySQL schema creation and OpenSearch index
        # provisioning in v1.5.0+ (consolidatedUpgrade), replacing the legacy
        # mysqlSetupJob and elasticsearchSetupJob helm hooks.
        systemUpdate:
          enabled: true
          consolidatedUpgrade: true
          scaleDown:
            enabled: true

        # Internal token/encryption material is generated by helm hooks on
        # first install and persisted to k8s secrets. These are infrastructure
        # signing material, not user-managed credentials, so the auto-gen
        # pattern is acceptable here.
        encryptionKey:
          secretRef: "datahub-encryption-secrets"
          secretKey: "encryption_key_secret"
          provisionSecret:
            enabled: true
            autoGenerate: true

        metadata_service_authentication:
          enabled: true
          systemClientId: "__datahub_system"
          systemClientSecret:
            secretRef: "datahub-auth-secrets"
            secretKey: "system_client_secret"
          tokenService:
            signingKey:
              secretRef: "datahub-auth-secrets"
              secretKey: "token_service_signing_key"
            salt:
              secretRef: "datahub-auth-secrets"
              secretKey: "token_service_salt"
          provisionSecrets:
            enabled: true
            autoGenerate: true

        monitoring:
          enablePrometheus: true
          metricsMode: legacy

    # Legacy hook jobs disabled; system-update consolidates this work
    elasticsearchSetupJob:
      enabled: false
    kafkaSetupJob:
      enabled: false
    mysqlSetupJob:
      enabled: false
    postgresqlSetupJob:
      enabled: false

    datahubSystemUpdate:
      sql:
        setup:
          enabled: true
          createTables: true
          createDatabase: true
          createUser: false
      elasticsearch:
        setup:
          enabled: true
          createUser: false
      resources:
        requests:
          cpu: 300m
          memory: 2Gi
        limits:
          cpu: 500m
          memory: 2Gi

    datahub-gms:
      enabled: true
      replicaCount: 1
      image:
        repository: acryldata/datahub-gms
      # GMS LoadBalancer is the upstream default; force ClusterIP since the
      # frontend reaches GMS in-cluster and external traffic enters via the
      # Gateway-fronted HTTPRoute on the frontend.
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      livenessProbe:
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 8
      readinessProbe:
        initialDelaySeconds: 120
        periodSeconds: 30
        failureThreshold: 8
      serviceAccount:
        create: false

    datahub-frontend:
      enabled: true
      replicaCount: 1
      image:
        repository: acryldata/datahub-frontend-react
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1400Mi
      ingress:
        enabled: false
      # Authentik OIDC. provider=other + discoveryUri pulls endpoints from
      # Authentik's well-known config. clientSecret lives in datahub-secrets;
      # clientId is wired through HelmRelease valuesFrom because the chart
      # interpolates it into env vars rather than env-from-secret references.
      oidcAuthentication:
        enabled: true
        provider: other
        discoveryUri: "https://auth.gateway.services.apocrathia.com/application/o/datahub/.well-known/openid-configuration"
        clientSecretRef:
          secretRef: datahub-secrets
          secretKey: oidc-client-secret
        scope: "openid profile email"
        user_name_claim: "preferred_username"
        user_name_claim_regex: "(.*)"
        # AUTH_OIDC_BASE_URL is otherwise inferred from ingress.hosts[0]; ingress
        # is off here (Gateway API instead), so set it directly via the chart's
        # supported override instead of an extraEnvs duplicate.
        oidcBaseUrl: "https://datahub.gateway.services.apocrathia.com"
      # Authentik token exchange returned invalid_request with Pac4j defaults
      # (PKCE on, client_secret_basic). Tune here before publishing manifests.
      authCookies:
        sameSite: "LAX"
        secure: "true"
      extraEnvs:
        - name: AUTH_JAAS_ENABLED
          value: "false"
        - name: AUTH_OIDC_DISABLE_PKCE
          value: "true"
        - name: AUTH_OIDC_CLIENT_AUTHENTICATION_METHOD
          value: "client_secret_post"
      serviceAccount:
        create: false

    acryl-datahub-actions:
      enabled: true
      image:
        repository: acryldata/datahub-actions
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      serviceAccount:
        create: false

    datahub-mae-consumer:
      image:
        repository: acryldata/datahub-mae-consumer
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1536Mi
      serviceAccount:
        create: false

    datahub-mce-consumer:
      image:
        repository: acryldata/datahub-mce-consumer
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1536Mi
      serviceAccount:
        create: false

    # Scheduled ingestion CronJobs are configured via the DataHub UI / API
    # rather than the helm-managed cron subchart; keep this off until a use
    # case actually needs an in-chart cron.
    datahub-ingestion-cron:
      enabled: false
