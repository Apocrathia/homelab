---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: datahub
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "HTTPRoute for DataHub frontend external access via Gateway API"
spec:
  parentRefs:
    - name: main-gateway
      namespace: cilium-system
      sectionName: https
  hostnames:
    - "datahub.gateway.services.apocrathia.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: datahub-datahub-frontend
          port: 9002
