---
# Single consolidated OnePasswordItem for DataHub. The Bitnami MySQL subchart
# reads its credentials via existingSecret, datahub-gms reads the MySQL root
# password via global.sql.datasource.password.secretRef, and datahub-frontend
# reads the OIDC client secret via oidcAuthentication.clientSecretRef. Keeping
# every key in one item means one 1Password entry to manage and one k8s secret
# to mount.
#
# Required keys in vaults/Secrets/items/datahub-secrets:
#   mysql-root-password         - MySQL root password (Bitnami chart + DataHub Ebean)
#   mysql-replication-password  - Required by Bitnami contract on standalone topology
#   mysql-password              - Required by Bitnami contract; not used at runtime
#   oidc-client-id              - Authentik OIDC client ID for datahub-frontend
#   oidc-client-secret          - Authentik OIDC client secret for datahub-frontend
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: datahub-secrets
  namespace: datahub
spec:
  itemPath: "vaults/Secrets/items/datahub-secrets"
