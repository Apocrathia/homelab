---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: datahub
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "datahub-oidc-provider"
    attrs:
      name: "datahub-oidc-provider"
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, "default-provider-authorization-implicit-consent"],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
      sub_mode: "user_username"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, "authentik Self-signed Certificate"],
        ]
      redirect_uris:
        - url: "https://datahub.gateway.services.apocrathia.com/callback/oidc"
          matching_mode: "strict"
      grant_types:
        - authorization_code
        - refresh_token
      access_code_validity: "minutes=5"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      token_validity: "days=30"
      client_type: "confidential"

  - model: authentik_core.application
    state: present
    identifiers:
      slug: "datahub"
    attrs:
      name: "DataHub"
      slug: "datahub"
      provider:
        !Find [
          authentik_providers_oauth2.oauth2provider,
          [name, "datahub-oidc-provider"],
        ]
      launch_url: "https://datahub.gateway.services.apocrathia.com"
      group: "AI & Automation"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/artificial-intelligence/datahub/icon.svg"
      meta_description: "Open-source metadata platform for data discovery, governance, and observability"
      meta_publisher: "DataHub Project (LinkedIn)"
