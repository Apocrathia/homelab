---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: datahub
  namespace: datahub

resources:
  - namespace.yaml
  - secret.yaml
  - helmrelease-prerequisites.yaml
  - helmrelease.yaml
  - httproute.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-datahub
    namespace: datahub
    files:
      - datahub.yaml=authentik-blueprint.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: datahub
      authentik_blueprint: "true"
