---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: openhands
  namespace: openhands

resources:
  - namespace.yaml
  - secret.yaml
  - helmrelease.yaml
  - crossplane.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Crossplane stitch: packages authentik.tf (the Workspace's HCL module) so
  # the replacements rule below can copy it into the Workspace at build
  # time. Data key is the literal filename (authentik.tf); the replacements
  # fieldPath bracket-escapes it: data.[authentik.tf]. Intentionally NOT
  # labeled authentik_blueprint: authentik ignores it as a blueprint source.
  - name: openhands-authentik-module
    namespace: openhands
    files:
      - authentik.tf

replacements:
  # Build-time stitch, house pattern from gitlab/runner: copy the generated
  # ConfigMap's authentik.tf data into the Workspace's module field.
  # authentik.tf stays the single source of truth for the HCL; the rendered
  # module must stay byte-identical to it.
  #
  # The intermediate ConfigMap cannot be dropped from the render: kustomize
  # applies patches and transformers before replacements, so a $patch: delete
  # would remove the source before this rule consumes it (verified on
  # kustomize v5.8.1; no deletions-transformer builtin exists). The ConfigMap
  # is harmless in-cluster (no authentik_blueprint label) and keeps a stable
  # name (disableNameSuffixHash), so authentik.tf edits update it in place.
  - source:
      kind: ConfigMap
      name: openhands-authentik-module
      fieldPath: data.[authentik.tf]
    targets:
      - select:
          kind: Workspace
          name: openhands-authentik
        fieldPaths:
          - spec.forProvider.module
