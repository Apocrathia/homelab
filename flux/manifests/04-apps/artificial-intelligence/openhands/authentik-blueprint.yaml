---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: openhands
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Proxy Provider for OpenHands
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: "openhands-proxy-provider"
    attrs:
      name: "openhands-proxy-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      authentication_flow: !Find [authentik_flows.flow, [slug, "default-authentication-flow"]]
      mode: "proxy"
      intercept_header_auth: false
      internal_host: "http://openhands-agent-canvas.openhands.svc.cluster.local:8000"
      external_host: "https://openhands.gateway.services.apocrathia.com"

  # Application for OpenHands
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "openhands"
    attrs:
      name: "OpenHands"
      slug: "openhands"
      group: "Artificial Intelligence"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "openhands-proxy-provider"]]
      meta_launch_url: "https://openhands.gateway.services.apocrathia.com"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/artificial-intelligence/openhands/icon.svg"
      meta_description: "AI software-engineering agent platform for coding agents"
      meta_publisher: "OpenHands"
  # Outpost for OpenHands
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: "openhands-outpost"
    attrs:
      name: "openhands-outpost"
      type: "proxy"
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, "Local Kubernetes Cluster"]]
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, "openhands-proxy-provider"]]
      config:
        authentik_host: "https://auth.gateway.services.apocrathia.com"
        authentik_host_insecure: true
        authentik_host_browser: ""
        log_level: "info"
        object_naming_template: "ak-outpost-%(name)s"
        kubernetes_replicas: 1
        kubernetes_namespace: "authentik"
        kubernetes_httproute_parent_refs:
          - name: main-gateway
            namespace: cilium-system
            sectionName: https
          - name: tailnet-gateway
            namespace: cilium-system
            sectionName: https-gateway-services
        kubernetes_json_patches:
          deployment:
            - op: add
              path: /spec/template/spec/automountServiceAccountToken
              value: false

  # Admins group binding (app access)
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "openhands"]]
      group: !Find [authentik_core.group, [name, "admins"]]
    attrs:
      order: 10

  # Users group binding (app access) - the shared tag
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "openhands"]]
      group: !Find [authentik_core.group, [name, "users"]]
    attrs:
      order: 20
