# nginx reverse proxy for the official DuckDB UI.
#
# DuckDB UI binds to localhost only and validates Origin/Referer against
# http://localhost:4213. On the distroless cc-debian12 image, "localhost"
# resolves to ::1 first via getaddrinfo, so the actual listener ends up on
# IPv6 loopback (see proxy_pass below). Browsers hitting
# duckdb.gateway.services.apocrathia.com would otherwise be rejected at the
# CSRF check, so we rewrite Origin/Referer inbound to make the UI think
# requests are local. Authentik proxy in front handles authn/authz; this is
# intentionally an open endpoint behind that.

server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 100m;

    location / {
        # DuckDB UI binds to "localhost" via getaddrinfo, which on the
        # distroless cc-debian12 image resolves to ::1 first — so the actual
        # listener ends up on IPv6 loopback. Connecting via 127.0.0.1 yields
        # ECONNREFUSED. Use the IPv6 loopback explicitly to match the bind.
        proxy_pass http://[::1]:4213;

        proxy_set_header Host localhost:4213;
        proxy_set_header Origin http://localhost:4213;
        proxy_set_header Referer http://localhost:4213/;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
