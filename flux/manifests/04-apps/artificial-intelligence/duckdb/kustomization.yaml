---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: duckdb

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: duckdb-nginx-config
    namespace: duckdb
    files:
      - nginx.conf
    options:
      disableNameSuffixHash: true
