---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prime-agent
  namespace: prime-agent
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.85"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: prime-agent
      namespace: prime-agent
      # renovate: datasource=docker depName=node
      image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6

      # No upstream OCI image exists: install the pinned npm tarball into the
      # Longhorn-backed HOME on boot, then idle. The daemon supervisor and
      # session workers spawn in-pod on first attach and persist across exec
      # sessions. Renovate tracks PRIME_AGENT_VERSION via upstream git tags.

      # Single replica, pinned explicitly: the chart defaults to 2 when the
      # key is absent. Two replicas would double-mount the RWO Longhorn PVC
      # and run two webui collectors with split beacon registries.
      replicas: 1

      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          export HOME=/opt/data
          export NPM_CONFIG_PREFIX=/opt/data/npm
          export PATH=/opt/data/npm/bin:$PATH

          installed=""
          pkg=/opt/data/npm/lib/node_modules/prime-agent/package.json
          if [[ -f "$pkg" ]]; then
            installed=$(node -p "require('$pkg').version" || true)
          fi
          if [[ "$installed" != "$PRIME_AGENT_VERSION" ]]; then
            echo "installing prime-agent $PRIME_AGENT_VERSION (was: ${installed:-none})"
            npm install -g "https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/releases/v${PRIME_AGENT_VERSION}/prime-agent-${PRIME_AGENT_VERSION}.tgz"
          fi

          # Python kernel: the node:*-slim image ships no curl or wget, so
          # prime-agent's PRIME_AGENT_INSTALL_UV path (astral.sh installer)
          # cannot run here. Fetch the pinned uv release with node's own fetch
          # and extract it onto the PVC; prime-agent finds ~/.local/bin/uv.
          uv_installed=""
          if [[ -x "$HOME/.local/bin/uv" ]]; then
            uv_installed=$("$HOME/.local/bin/uv" --version 2>/dev/null | awk '{print $2}' || true)
          fi
          if [[ "$uv_installed" != "$UV_VERSION" ]]; then
            echo "installing uv $UV_VERSION (was: ${uv_installed:-none})"
            arch=$(uname -m)
            url="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${arch}-unknown-linux-gnu.tar.gz"
            node -e '
              const [url, out] = process.argv.slice(1);
              fetch(url).then(async (r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
                require("fs").writeFileSync(out, Buffer.from(await r.arrayBuffer()));
              }).catch((e) => { console.error(e.message); process.exit(1); });
            ' "$url" /tmp/uv.tgz
            mkdir -p "$HOME/.local/bin"
            tar -xzf /tmp/uv.tgz -C /tmp
            install -m 0755 "/tmp/uv-${arch}-unknown-linux-gnu/uv" "$HOME/.local/bin/uv"
            rm -rf /tmp/uv.tgz "/tmp/uv-${arch}-unknown-linux-gnu"
          fi

          # Payload: the agent/ tree rides this repo, not a ConfigMap
          # (the CM era died at the API server's 1 MiB limit). The
          # per-path archive pull that replaced the CM died too:
          # GitLab/Cloudflare rate-limit the anonymous archive endpoint
          # per IP, and the homelab egress is ONE shared public IP
          # (Renovate polling, Flux, every pod boot — same anonymous
          # budget), so the fetch 406'd transiently. One mechanism now:
          # the working-repo clone below IS the payload source — git's
          # HTTPS endpoints with the token draw the separate
          # authenticated budget, and the payload copies from the
          # checkout, so the anonymous archive pool is out of the loop.

          # The agent's working repo: a token-authenticated full clone of
          # this repository at /opt/data/repos/homelab. Layout (operator,
          # 2026-09-14): /opt/data/repos carries the associated repos
          # (homelab clone, prime-agent source snapshot);
          # /opt/data/workspace stays the agents' default cwd — scratch
          # space, never a clone target. node:24-bookworm-slim ships no git binary, and
          # apt needs root — the pod runs as uid 1000 (runAsNonRoot;
          # apt-get is Permission denied there, verified) — so git
          # installs rootless like uv/fd: a pinned micromamba (static
          # binary) pulls conda-forge's self-contained git into a PVC
          # prefix. The image also has no system CA store (node's fetch
          # works because node carries its own roots): node dumps its
          # root store to a PEM once, and micromamba's ssl_verify points
          # at it (micromamba ignores SSL_CERT_FILE env).
          git_prefix=/opt/data/git
          ca_pem=/opt/data/ca-root-certs.pem
          micromamba=/opt/data/bin/micromamba
          if [[ ! -x "$micromamba" ]]; then
            echo "installing micromamba $MICROMAMBA_VERSION (was: none)"
            case "$(uname -m)" in
              x86_64) mmarch=64 ;;
              aarch64) mmarch=aarch64 ;;
            esac
            url="https://github.com/mamba-org/micromamba-releases/releases/download/${MICROMAMBA_VERSION}/micromamba-linux-${mmarch}"
            node -e '
              const [url, out] = process.argv.slice(1);
              fetch(url, { signal: AbortSignal.timeout(30000) }).then(async (r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
                require("fs").writeFileSync(out, Buffer.from(await r.arrayBuffer()));
              }).catch((e) => { console.error(e.message); process.exit(1); });
            ' "$url" "$micromamba"
            chmod 0755 "$micromamba"
          fi
          if [[ ! -f "$ca_pem" ]]; then
            node -e "process.stdout.write(require('tls').rootCertificates.join('\n') + '\n')" > "$ca_pem"
          fi
          "$micromamba" config set ssl_verify "$ca_pem" >/dev/null
          if [[ ! -x "$git_prefix/bin/git" ]]; then
            echo "installing git via conda-forge (was: none)"
            MAMBA_ROOT_PREFIX=/opt/data/mamba "$micromamba" create -y -p "$git_prefix" -c conda-forge git
          fi
          export PATH="$git_prefix/bin:$PATH"

          # Clone only if the target is not a repo yet (a present .git =
          # the pull below keeps it current). Strays without .git = warn +
          # skip (git refuses a non-empty target). The token rides the
          # clone/pull process args only (http.extraheader) — never the
          # remote URL, never .git/config, never on disk. A failed clone
          # WARNs and degrades; the payload copy below then boots the
          # last good PVC copy (a later successful restart clones and
          # re-syncs).
          repo=/opt/data/repos/homelab
          mkdir -p /opt/data/workspace /opt/data/repos
          # git-over-HTTPS auth: PRIVATE-TOKEN is an API-only header — the
          # git endpoint ignores it, so the old extraheader silently ran
          # clone/pull ANONYMOUS (outside the authenticated GitLab budget
          # the comments relied on). Basic auth with the PAT as password
          # works; the credential still rides process args only — never
          # the remote URL, .git/config, disk.
          auth=""
          if [[ -n "${GITLAB_TOKEN:-}" ]]; then
            auth="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 | tr -d '\n')"
          fi
          if [[ ! -d "$repo/.git" ]]; then
            if [[ -z "$(ls -A "$repo" 2>/dev/null)" ]]; then
              echo "cloning homelab into $repo (the agent working repo)"
              if [[ -n "$auth" ]]; then
                git -c http.extraheader="$auth" clone https://gitlab.com/Apocrathia/homelab.git "$repo" \
                  || echo "WARN: homelab clone failed — booting degraded (payload stays last-good; next successful restart clones)"
              else
                git clone https://gitlab.com/Apocrathia/homelab.git "$repo" \
                  || echo "WARN: homelab clone failed (tokenless) — booting degraded (payload stays last-good; next successful restart clones)"
              fi
            else
              echo "WARN: $repo has pre-clone strays and no .git — skipping the repo clone (clean the dir; the next boot clones)"
            fi
          fi
          # Pull on EVERY pod start: fast-forward only — NEVER reset
          # --hard; the agents WORK in this clone and their local state
          # must never be destroyed by a boot. Any pull failure (network,
          # diverged main, dirty tree) WARNs and continues with the
          # checkout as-is — the payload copy below reads the current
          # files either way.
          if [[ -d "$repo/.git" ]]; then
            echo "pulling homelab (ff-only; never resets)"
            if [[ -n "$auth" ]]; then
              git -c http.extraheader="$auth" -C "$repo" pull --ff-only \
                || echo "WARN: homelab pull failed — continuing with the checkout as-is (extensions may be stale)"
            else
              git -C "$repo" pull --ff-only \
                || echo "WARN: homelab pull failed (tokenless) — continuing with the checkout as-is (extensions may be stale)"
            fi
          fi

          # Payload reconcile: copies from the CLONE's working tree —
          # the same files the agents work with, so a payload change
          # merged to main lands on the next pod restart, no manifest
          # MR. Compare-first (cp -u): unchanged files are not
          # rewritten. Copy ONLY when the source shape holds: a missing
          # clone (fresh PVC + failed clone, or the strays skip) never
          # clobbers the last good copy on the PVC, so the pod boots
          # degraded (stale extensions) instead of empty. The webui
          # collector and A2A webhook also fail to load on a fresh+failed
          # PVC (their payload is missing); a later successful restart
          # re-syncs everything.
          src="$repo/flux/manifests/04-apps/artificial-intelligence/prime-agent/agent"
          if [[ ! -f "$src/settings.json" ]]; then
            echo "WARN: payload source missing at $src — booting the last good copy from the PVC (extensions may be stale; next successful restart re-syncs)"
          else
            # One folder per extension (index.ts + resources — the a2a/
            # scheme); the repo tree already carries the real nested
            # shape, so the CM-era flat-key reassembly is gone. Nothing
            # may live at the extensions root: the loader picks a root
            # index.ts FIRST and returns it as the ONLY extension,
            # silently suppressing every folder — so root *.ts strays
            # from older flat layouts are removed on every boot.
            mkdir -p /opt/data/.prime/agent/extensions/activity-recap
            mkdir -p /opt/data/.prime/agent/extensions/litellm
            mkdir -p /opt/data/.prime/agent/extensions/name-sessions
            mkdir -p /opt/data/.prime/agent/extensions/a2a
            mkdir -p /opt/data/.prime/agent/extensions/discord
            cp -u "$src/extensions/activity-recap/index.ts" /opt/data/.prime/agent/extensions/activity-recap/index.ts
            cp -u "$src/extensions/litellm/index.ts" /opt/data/.prime/agent/extensions/litellm/index.ts
            cp -u "$src/extensions/name-sessions/index.ts" /opt/data/.prime/agent/extensions/name-sessions/index.ts
            cp -u "$src/extensions/a2a/index.ts" /opt/data/.prime/agent/extensions/a2a/index.ts
            cp -u "$src/extensions/a2a/server.mjs" /opt/data/.prime/agent/extensions/a2a/server.mjs
            cp -u "$src/extensions/discord/index.ts" /opt/data/.prime/agent/extensions/discord/index.ts
            cp -u "$src/extensions/discord/server.mjs" /opt/data/.prime/agent/extensions/discord/server.mjs
            cp -u "$src/extensions/discord/discord-guidelines.md" /opt/data/.prime/agent/extensions/discord/discord-guidelines.md
            mkdir -p /opt/data/.prime/agent/extensions/webui
            cp -u "$src/extensions/webui/index.ts" /opt/data/.prime/agent/extensions/webui/index.ts
            cp -u "$src/extensions/webui/server.mjs" /opt/data/.prime/agent/extensions/webui/server.mjs
            cp -u "$src/extensions/webui/dashboard.js" /opt/data/.prime/agent/extensions/webui/dashboard.js
            cp -u "$src/extensions/webui/dashboard.css" /opt/data/.prime/agent/extensions/webui/dashboard.css
            cp -u "$src/extensions/webui/mark.svg" /opt/data/.prime/agent/extensions/webui/mark.svg
            cp -u "$src/extensions/webui/config.json" /opt/data/.prime/agent/extensions/webui/config.json
            cp -u "$src/extensions/webui/marked.min.js" /opt/data/.prime/agent/extensions/webui/marked.min.js
            cp -u "$src/extensions/webui/purify.min.js" /opt/data/.prime/agent/extensions/webui/purify.min.js
            rm -f /opt/data/.prime/agent/extensions/*.ts
            # settings.json is seeded once from the checkout; runtime
            # keys (recentModels, theme) accumulate on the PVC
            # afterwards. Delete it to re-seed.
            if [[ ! -f /opt/data/.prime/agent/settings.json ]]; then
              cp "$src/settings.json" /opt/data/.prime/agent/settings.json
            fi
          fi

          # webui token: copy from the 1Password-synced Secret to the HERE
          # default (both index.ts and server.mjs read HERE/webui-token with
          # no env needed). Mode enforced here because the chart's
          # secret-volume block has no defaultMode passthrough. Empty field
          # fails the boot loudly: otherwise collector and beacons would
          # each auto-generate different tokens (401s everywhere). The
          # mkdir is payload-agnostic: the token rides even when the
          # payload pull failed and the boot runs degraded.
          if [[ ! -s /secret/webui-token ]]; then
            echo "FATAL: prime-agent-secrets/webui-token is missing or empty"; exit 1
          fi
          mkdir -p /opt/data/.prime/agent/extensions/webui
          cp -f /secret/webui-token /opt/data/.prime/agent/extensions/webui/webui-token
          chmod 0400 /opt/data/.prime/agent/extensions/webui/webui-token

          # fd for the @-picker (pattern: the uv install above). Static musl
          # build to a PATH dir on the PVC (PATH already carries
          # /opt/data/bin). The mkdir is load-bearing: nothing else creates
          # /opt/data/bin on a fresh (or current) PVC, and install fails on
          # a missing parent — set -e would crashloop the pod.
          mkdir -p /opt/data/bin
          fd_installed=""
          if [[ -x /opt/data/bin/fd ]]; then
            fd_installed=$(/opt/data/bin/fd --version 2>/dev/null | awk '{print $2}' || true)
          fi
          if [[ "$fd_installed" != "$FD_VERSION" ]]; then
            echo "installing fd $FD_VERSION (was: ${fd_installed:-none})"
            arch=$(uname -m)
            url="https://github.com/sharkdp/fd/releases/download/v${FD_VERSION}/fd-v${FD_VERSION}-${arch}-unknown-linux-musl.tar.gz"
            node -e '
              const [url, out] = process.argv.slice(1);
              fetch(url).then(async (r) => {
                if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
                require("fs").writeFileSync(out, Buffer.from(await r.arrayBuffer()));
              }).catch((e) => { console.error(e.message); process.exit(1); });
            ' "$url" /tmp/fd.tgz
            tar -xzf /tmp/fd.tgz -C /tmp
            install -m 0755 "/tmp/fd-v${FD_VERSION}-${arch}-unknown-linux-musl/fd" /opt/data/bin/fd
            rm -rf /tmp/fd.tgz "/tmp/fd-v${FD_VERSION}-${arch}-unknown-linux-musl"
          fi

          # glab (GitLab CLI) for agent MR flows: conda-forge like git,
          # rootless prefix, symlinked into the PATH dir above. Unpinned
          # (matches the git pattern): the install runs only when the
          # binary is missing, so conda-forge's current build lands and
          # boots stay idempotent. PVC note: the pod's fsGroup makes
          # config files group-writable (660); glab refuses anything
          # over 600, so the boot chmods its config dir every start.
          if [[ ! -x /opt/data/glab/bin/glab ]]; then
            echo "installing glab via conda-forge (was: none)"
            MAMBA_ROOT_PREFIX=/opt/data/mamba "$micromamba" create -y -p /opt/data/glab -c conda-forge glab
          fi
          mkdir -p /opt/data/bin
          ln -sf /opt/data/glab/bin/glab /opt/data/bin/glab
          chmod 600 /opt/data/.config/glab-cli/*.yml 2>/dev/null || true

          # Inbound A2A webhook: server.mjs owns the declared port 8080; the
          # a2a extension respawns it if it dies.
          mkdir -p /opt/data/.prime/agent/logs
          nohup node /opt/data/.prime/agent/extensions/a2a/server.mjs >>/opt/data/.prime/agent/logs/a2a-webhook.log 2>&1 &

          # The collector must outlive "no agent running": start it from the
          # boot script (backgrounded; output lands in the container log),
          # so the dashboard serves even with zero live agent sessions. The
          # per-beacon spawnCollectorIfDown probe is the self-heal.
          node /opt/data/.prime/agent/extensions/webui/server.mjs &
          echo "prime-webui collector started (8788)"

          # Discord bridge: the same always-on contract — the gateway must
          # outlive "no agent running" too. Before this, only a session
          # worker's beacon ever spawned it, so a pod restart killed the
          # bridge until the next agent attach (the live outage: the pod
          # booted with zero discord processes). The beacon's health-probe
          # respawn stays the self-heal. Config-gated on the token (the
          # beacon's own gate chain): no token, no bridge, silent skip.
          if [[ -n "${DISCORD_BOT_TOKEN:-}" ]]; then
            nohup node /opt/data/.prime/agent/extensions/discord/server.mjs >>/opt/data/.prime/agent/logs/discord-bridge.log 2>&1 &
            echo "discord bridge started (8790)"
          fi

          prime-agent --version
          echo "ready: kubectl exec -it deploy/prime-agent -n prime-agent -- prime-agent"
          exec sleep infinity

      container:
        name: prime-agent
        # Two listeners: the webui collector (extensions/webui/server.mjs)
        # owns the primary 8788 (8789 register port is loopback-only and
        # never exposed), and the inbound A2A webhook (a2a/server.mjs)
        # owns 8080, carried by extraServicePorts for the broker only.
        port: 8788
        env:
          - name: TZ
            value: "America/Denver"
          - name: HOME
            value: "/opt/data"
          - name: NPM_CONFIG_PREFIX
            value: "/opt/data/npm"
          - name: PATH
            value: "/opt/data/npm/bin:/opt/data/git/bin:/opt/data/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          # The slim node image ships no system CA store: static curl and Go
          # binaries (glab) need SSL_CERT_FILE pointed at the bundle the boot
          # script materializes at /opt/data/tools/certs/ca-bundle.crt.
          # GITLAB_HOST pins glab's default instance so agent sessions can
          # use `glab` without per-shell exports.
          - name: SSL_CERT_FILE
            value: "/opt/data/tools/certs/ca-bundle.crt"
          - name: GITLAB_HOST
            value: "gitlab.com"
          # renovate: datasource=github-tags depName=PrimeIntellect-ai/prime-agent versioning=semver
          - name: PRIME_AGENT_VERSION
            value: "0.9.6"
          # Let kernel bootstrap install uv by itself when missing instead of
          # failing the (non-TTY) install prompt. Normally a no-op: the boot
          # script pre-seeds uv on the PVC.
          - name: PRIME_AGENT_INSTALL_UV
            value: "1"
          # renovate: datasource=github-releases depName=astral-sh/uv versioning=semver
          - name: UV_VERSION
            value: "0.12.18"
          # In-cluster LiteLLM gateway (OpenAI-compatible). The litellm
          # extension reads LITELLM_API_KEY for catalog discovery and requests.
          - name: LITELLM_BASE_URL
            value: "http://litellm.litellm.svc.cluster.local:4000/v1"
          - name: LITELLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: prime-agent-secrets
                key: litellm-api-key
          # In-cluster A2A broker root (no /v1) for the a2a extension's
          # native a2a_agents/a2a_send/a2a_task tools. A2A rides the same
          # LiteLLM virtual key.
          - name: A2A_BASE_URL
            value: "http://litellm.litellm.svc.cluster.local:4000"
          - name: A2A_API_KEY
            valueFrom:
              secretKeyRef:
                name: prime-agent-secrets
                key: litellm-api-key
          # Bearer token for the inbound A2A webhook (a2a/server.mjs,
          # fail-closed). The broker sends the same token via
          # litellm-secrets/prime-a2a-authorization (with the "Bearer "
          # prefix); the a2a extension also gates its webhook respawn on
          # this env var being set.
          - name: A2A_WEBHOOK_TOKEN
            valueFrom:
              secretKeyRef:
                name: prime-agent-secrets
                key: a2a-webhook-token
          # Webui collector (index.ts beacon auto-loads in every agent
          # process). The token is deliberately NOT env-shaped: it rides the
          # Secret-file mount -> boot-script copy -> HERE/webui-token, so
          # PRIME_WEBUI_TOKEN / PRIME_WEBUI_TOKEN_FILE stay unset and spawn
          # env inheritance cannot leak it. The sessions-dir pin makes the
          # collector's spawn contract explicit (HOME=/opt/data already
          # resolves the same default). FILE_REPO_ROOT aligns the
          # dashboard's file viewer + file tools with the cluster
          # workspace: without it server.mjs falls back to the dev
          # machine's repo path and every spawned-agent output under
          # defaultCwd (/opt/data/workspace) 400s as "outside roots".
          - name: PRIME_WEBUI_HOST
            value: "0.0.0.0"
          - name: PRIME_WEBUI_PORT
            value: "8788"
          - name: PRIME_WEBUI_SESSIONS_DIR
            value: "/opt/data/.prime/agent/sessions"
          - name: PRIME_WEBUI_FILE_REPO_ROOT
            value: "/opt/data/workspace"
          # renovate: datasource=github-releases depName=sharkdp/fd versioning=semver
          - name: FD_VERSION
            value: "10.5.0"
          # renovate: datasource=github-releases depName=mamba-org/micromamba-releases
          - name: MICROMAMBA_VERSION
            value: "2.9.0-0"
          # GitLab token: rides the workspace clone/pull fetch — and so
          # the payload source too (the payload copies from that clone).
          # Authenticated requests draw GitLab's separate authenticated
          # budget; the anonymous per-IP pool (the whole homelab shares
          # ONE egress IP) exhausts transiently, which is what killed
          # the tokenless archive pull. optional: true in manifest
          # semantics — the repo is public, an unset token still
          # clones/pulls and the boot WARN-degrades instead of
          # crashlooping — but the field is practically required for
          # reliable payload sync. The credential rides the fetch/clone-
          # time process args (http.extraheader) — never the remote URL,
          # never .git/config, never on disk.
          - name: GITLAB_TOKEN
            valueFrom:
              secretKeyRef:
                name: prime-agent-secrets
                key: gitlab-token
                optional: true
          # Discord gateway (agent/extensions/discord) go-live wiring. The
          # beacon factory gates on this env (or config bot_token) before
          # registering anything; the gateway resolves it via the same
          # env->config chain. Same token fields the local Mac instance uses —
          # scope-split (DISCORD_ALLOWED_*) or instance retirement is the
          # operator's cutover call, not wired here.
          - name: DISCORD_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: prime-agent-secrets
                key: discord-bot-token
          # Discord application id (presence/activity payload + REST shape).
          - name: DISCORD_APPLICATION_ID
            valueFrom:
              secretKeyRef:
                name: prime-agent-secrets
                key: discord-app-id
          # Default cwd for discord-spawned conversations: the extension's
          # env override for config default_cwd (which otherwise resolves to
          # ~ = HOME = /opt/data). Session cwd is harness-owned — the
          # container workingDir never reaches spawned sessions — so the
          # default is pinned at each spawn surface: this env var (discord),
          # the webui config defaultCwd (already /opt/data/workspace), and
          # --cwd on TUI attach (README). resolveNewCwd fails on a missing
          # dir, so the boot script mkdirs it before the bridge starts.
          - name: DISCORD_DEFAULT_CWD
            value: "/opt/data/workspace"

      service:
        type: ClusterIP
        port: 8788
        targetPort: 8788
      # Inbound A2A webhook: litellm.yml's agents: entry targets
      # http://prime-agent.prime-agent.svc.cluster.local:8080, so the
      # webhook port rides an extra Service port next to the webui primary
      # above — ClusterIP-only, no Gateway route.
      extraServicePorts:
        - name: a2a-webhook
          port: 8080
          targetPort: 8080

      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 4Gi

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        # npm install + kernel bootstrap write to the container fs.
        readOnlyRootFilesystem: false

      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp
        # webui dashboard token: single field from the 1Password-synced
        # secret, subPath-mounted read-only; the boot script copies it to
        # HERE/webui-token (mode 0400) — the token-file default both
        # index.ts and server.mjs resolve.
        secret:
          - name: webui-token
            secretName: prime-agent-secrets
            mountPath: /secret/webui-token
            subPath: webui-token

      volumeMounts:
        - name: state
          mountPath: /opt/data

      # The collector answers /healthz (200, pre-auth) from boot, so kubelet
      # probes restart a crashed collector instead of a human noticing dead
      # air. Probes hit pod loopback — fine with PRIME_WEBUI_HOST=0.0.0.0.
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /healthz
            port: 8788
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          enabled: true
          httpGet:
            path: /healthz
            port: 8788
          periodSeconds: 10
          failureThreshold: 3

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: state
            capacity: 10Gi

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/prime-agent-secrets"

    # SSO in front on both doors (LAN + tailnet): the Authentik proxy
    # outpost owns the hostname — no straight route to the app service
    # (httproute stays off below; the outpost dials the app's ClusterIP
    # directly). The webui trusts the outpost (trustedCidrs = the cluster
    # pod CIDR in the payload config.json — no env surface; the operator's
    # gate decision), so SSO is the front door and the webui token is the
    # break-glass layer for anything the pod CIDR does not cover. NEVER
    # enable the shared/friends tier on this app: it would put SSO in
    # front of full agent control (see README). gatus stays off: a
    # synthetic probe cannot pass the outpost's SSO gate. The dashboard
    # tile icon is the webui's own mark, served via the GitLab raw URL
    # (icon.svg in this directory).
    authentik:
      enabled: true
      managedBy: blueprint
      mode: "proxy"
      displayName: "Prime Agent"
      category: "Artificial Intelligence"
      externalHost: "https://prime.gateway.services.apocrathia.com"
      openInNewTab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/artificial-intelligence/prime-agent/icon.svg"
      metaDescription: "The prime-agent conversations dashboard"
    # The Authentik proxy outpost creates the hostname's HTTPRoute itself
    httproute:
      enabled: false
    # Tailnet sharing: adds the tailnet-gateway parentRef to the outpost's
    # HTTPRoute (one hostname, both doors)
    tailnet:
      enabled: true
    gatus:
      enabled: false
