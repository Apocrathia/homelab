---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: prime-agent

resources:
  - namespace.yaml
  - helmrelease.yaml

# Payload mirrors ~/.prime/agent/. One folder per extension under
# agent/extensions/ (index.ts + resources + README); kustomize cannot glob
# a directory and ConfigMap keys are flat, so each payload file is keyed
# <extension>_<basename> and the boot script reassembles the folders.
# READMEs are repo/local context only — they do not ship to the pod.
configMapGenerator:
  - name: prime-agent-config
    namespace: prime-agent
    files:
      - activity-recap_index.ts=agent/extensions/activity-recap/index.ts
      - litellm_index.ts=agent/extensions/litellm/index.ts
      - name-sessions_index.ts=agent/extensions/name-sessions/index.ts
      - a2a_index.ts=agent/extensions/a2a/index.ts
      - a2a_server.mjs=agent/extensions/a2a/server.mjs
      - discord_index.ts=agent/extensions/discord/index.ts
      - discord_server.mjs=agent/extensions/discord/server.mjs
      - discord_guidelines.md=agent/extensions/discord/discord-guidelines.md
      - agent/settings.json
    options:
      disableNameSuffixHash: true
