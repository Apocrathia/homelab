---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: prime-agent

resources:
  - namespace.yaml
  - helmrelease.yaml

# Payload mirrors ~/.prime/agent/. kustomize cannot glob a directory, so each
# injected file gets one entry here; drop the file under agent/ and list it.
configMapGenerator:
  - name: prime-agent-config
    namespace: prime-agent
    files:
      - agent/extensions/litellm.ts
      - agent/settings.json
    options:
      disableNameSuffixHash: true
