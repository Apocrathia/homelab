---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: prime-agent

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: prime-agent-config
    namespace: prime-agent
    files:
      - litellm.ts
      - settings.json
    options:
      disableNameSuffixHash: true
