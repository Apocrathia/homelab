---
apiVersion: kagent.dev/v1alpha2
kind: AgentHarness
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: kagent
    app.kubernetes.io/component: harness
spec:
  backend: openclaw
  description: Resident OpenClaw coding harness on Agent Substrate
  modelConfigRef: openclaw-model
  # Omit workerPoolRef — controller default is ate-system/kagent-default.
  # kagent 0.10.0 (CRD v1alpha2) removed spec.runtime and
  # spec.substrate.gatewayTokenSecretRef: the gateway no longer authenticates
  # the actor WebSocket handshake with a bearer token. Harness workload env is
  # built entirely by the controller (bootstrap JSON + ACP shim env).
  substrate: {}
