---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
  namespace: openclaw
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.71"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: openclaw
      namespace: openclaw
      # renovate: datasource=docker depName=ghcr.io/openclaw/openclaw
      image: ghcr.io/openclaw/openclaw:2026.4.22

      container:
        name: openclaw
        port: 18789
        env:
          - name: NODE_ENV
            value: "production"
          - name: OPENCLAW_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: gateway-token
          - name: LITELLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: litellm-api-key
          - name: OPENCLAW_CONFIG_PATH
            value: "/config/openclaw.json"
          - name: OPENCLAW_STATE_DIR
            value: "/home/node/.openclaw"
          - name: HOME
            value: "/home/node"

      service:
        type: ClusterIP
        port: 80
        targetPort: 18789
        portName: http

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp
            medium: Memory
        configMap:
          - name: config
            mountPath: /config
            configMapName: openclaw-config
            readOnly: true

      healthChecks:
        livenessProbe:
          enabled: true
          tcpSocket:
            port: 18789
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          enabled: true
          tcpSocket:
            port: 18789
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          enabled: true
          tcpSocket:
            port: 18789
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

      volumeMounts:
        - name: state
          mountPath: /home/node/.openclaw

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: state
            capacity: 6Gi

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/openclaw-secrets"

    authentik:
      enabled: true
      mode: "proxy"
      category: "AI & Automation"
      displayName: "OpenClaw"
      externalHost: "https://openclaw.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/artificial-intelligence/openclaw/icon.svg"

    httproute:
      enabled: false
