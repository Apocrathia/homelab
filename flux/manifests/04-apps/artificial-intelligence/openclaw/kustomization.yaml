---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: openclaw

resources:
  - namespace.yaml
  - rbac-ate-api.yaml
  - secret.yaml
  - modelconfig.yaml
  - agentharness.yaml
# Rollback artifacts kept on disk (not active):
# - helmrelease.yaml (former generic-app OpenClaw)
# - openclaw.json (former ConfigMap payload)

generatorOptions:
  disableNameSuffixHash: true

# Authentik blueprint as ConfigMap
configMapGenerator:
  - name: authentik-blueprint-openclaw
    namespace: authentik
    files:
      - openclaw.yaml=authentik-blueprint.yaml

labels:
  - includeSelectors: true
    pairs:
      authentik_blueprint: "true"
