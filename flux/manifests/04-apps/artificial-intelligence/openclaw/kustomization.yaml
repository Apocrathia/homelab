---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: openclaw

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: openclaw-config
    namespace: openclaw
    files:
      - openclaw.json
    options:
      disableNameSuffixHash: true
