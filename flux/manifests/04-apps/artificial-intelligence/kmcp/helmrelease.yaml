---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# MCPServer controller. Replaces the kmcp subchart the kagent 0.10.x chart
# embedded (same chart lineage: embedded 0.3.0 -> standalone). Chart defaults
# carry the effective old config over: 1 replica, cluster-scoped RBAC +
# watch, leader election, secure metrics on 8443. Image tag follows the
# chart appVersion (0.4.0) — no tag override, the chart version is the
# single Renovate knob.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kmcp
  namespace: kagent
spec:
  interval: 30m
  dependsOn:
    - name: kmcp-crds
      namespace: kagent
  chart:
    spec:
      chart: kmcp
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/kmcp/helm/kmcp
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: kmcp
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
