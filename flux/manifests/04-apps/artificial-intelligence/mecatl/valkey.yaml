---
# Mecatl session/event state. Dedicated instance: the litellm-valkey is
# cache-scoped (response cache, TTL'd) and not durable enough for Mecatl
# session snapshots + event streams. Redis protocol via Valkey
# (same pattern as terminus-valkey).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mecatl-valkey
  namespace: mecatl
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: mecatl-valkey
      # generic-app renders into app.namespace | default app.name; the
      # mecatl-valkey namespace does not exist and mecatl dials
      # mecatl-valkey.mecatl.svc.cluster.local:6379, so keep everything
      # in the mecatl namespace (same pattern as terminus-valkey).
      namespace: mecatl
      # renovate: datasource=docker depName=valkey/valkey
      image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
      # generic-app renders command/args from app.command/app.args only;
      # app.container accepts name/port/stdin/tty/env. The args block sat
      # under container: and was silently dropped, so the image default
      # command ran a passwordless valkey-server. Keep args at app level;
      # kubelet expands $(VAR) in container args from the container env.
      args:
        - valkey-server
        - --requirepass
        - $(VALKEY_PASSWORD)
      container:
        name: mecatl-valkey
        port: 6379
        env:
          - name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mecatl-secrets
                key: valkey-password
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      service:
        type: ClusterIP
        port: 6379
        targetPort: 6379
        portName: redis
      healthChecks:
        readinessProbe:
          enabled: true
          exec:
            command:
              - sh
              - -c
              # $() is shell command substitution, not variable expansion:
              # the bare $(VALKEY_PASSWORD) form ran a command named
              # VALKEY_PASSWORD (not found) and authenticated with an empty
              # password, so every probe failed NOAUTH on a healthy server.
              # "$VALKEY_PASSWORD" is real variable expansion with the
              # container's env var; --no-auth-warning silences the cli
              # password warning that polluted probe output.
              - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          enabled: true
          exec:
            command:
              - sh
              - -c
              # Same $(VAR) command-substitution bug as readinessProbe above.
              - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep PONG
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: data
          mountPath: /data
      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 5Gi

    secrets:
      enabled: false

    # No Authentik SSO for an internal Redis: authentik.enabled defaults
    # true in generic-app, which would create a proxy-provider blueprint.
    authentik:
      enabled: false

    gatus:
      enabled: false
