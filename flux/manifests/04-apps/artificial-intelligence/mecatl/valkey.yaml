---
# Mecatl session/event state. Dedicated instance: the litellm-valkey is
# cache-scoped (response cache, TTL'd) and not durable enough for Mecatl
# session snapshots + event streams. Redis protocol via Valkey
# (same pattern as terminus-valkey).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mecatl-valkey
  namespace: mecatl
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.83"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: mecatl-valkey
      # generic-app renders into app.namespace | default app.name; the
      # mecatl-valkey namespace does not exist and mecatl dials
      # mecatl-valkey.mecatl.svc.cluster.local:6379, so keep everything
      # in the mecatl namespace (same pattern as terminus-valkey).
      namespace: mecatl
      # renovate: datasource=docker depName=valkey/valkey
      image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
      # TLS-only listener: Mecatl's engine hard-requires verified TLS for a
      # credentialled redis and refuses plaintext+password outright
      # (redisstore: "Redis credentials require verified TLS"), so the TLS
      # channel is the auth and --port 0 disables the plaintext listener.
      # args stay at app level: generic-app renders command/args from
      # app.command/app.args only; app.container accepts name/port/stdin/
      # tty/env (the original args block sat under container: and was
      # silently dropped).
      args:
        - valkey-server
        - --port
        - "0"
        - --tls-port
        - "6379"
        - --tls-cert-file
        - /tls/tls.crt
        - --tls-key-file
        - /tls/tls.key
        # No client-certificate mTLS (engine does not support it, ADR 0233).
        - --tls-auth-clients
        - "no"
      container:
        name: mecatl-valkey
        port: 6379
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      service:
        type: ClusterIP
        port: 6379
        targetPort: 6379
        portName: redis
      healthChecks:
        readinessProbe:
          enabled: true
          exec:
            command:
              - sh
              - -c
              # TLS-only valkey: verify against the CA bundled in the
              # same cert-manager Secret. No AUTH - the channel is the auth.
              - valkey-cli --tls --cacert /tls/ca.crt ping | grep PONG
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          enabled: true
          exec:
            command:
              - sh
              - -c
              # Same TLS check as readinessProbe.
              - valkey-cli --tls --cacert /tls/ca.crt ping | grep PONG
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: data
          mountPath: /data
      volumes:
        # generic-app auto-mounts secret volumes at the entry's mountPath
        # (unprefixed volume name, unlike app.volumeMounts entries).
        secret:
          - name: mecatl-valkey-tls
            secretName: mecatl-valkey-tls
            mountPath: /tls
            readOnly: true
        emptyDir:
          - name: tmp
            mountPath: /tmp

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 5Gi

    secrets:
      enabled: false

    # No Authentik SSO for an internal Redis: authentik.enabled defaults
    # true in generic-app, which would create a proxy-provider blueprint.
    authentik:
      enabled: false

    gatus:
      enabled: false
