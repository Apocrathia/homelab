---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: comfyui

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: comfyui-extra-model-paths
    namespace: comfyui
    files:
      - extra_model_paths.yml
    options:
      disableNameSuffixHash: true
