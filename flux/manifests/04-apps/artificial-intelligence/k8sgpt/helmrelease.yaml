---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8sgpt-operator
  namespace: k8sgpt-system
spec:
  interval: 1h
  chart:
    spec:
      chart: k8sgpt-operator
      # renovate: datasource=helm registryUrl=https://charts.k8sgpt.ai depName=k8sgpt-operator
      version: "0.2.26"
      sourceRef:
        kind: HelmRepository
        name: k8sgpt
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    # Enable ServiceMonitor for Prometheus scraping
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

    # Enable Grafana dashboard
    grafanaDashboard:
      enabled: true
      folder:
        annotation: grafana_folder
        name: ai
      label:
        key: grafana_dashboard
        value: "1"

    controllerManager:
      replicas: 1
      manager:
        # Enable result logging for debugging
        enableResultLogging: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # Add security context for PodSecurity compliance
        containerSecurityContext:
          seccompProfile:
            type: RuntimeDefault
      kubeRbacProxy:
        resources:
          requests:
            cpu: 5m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # Add security context for PodSecurity compliance
        containerSecurityContext:
          seccompProfile:
            type: RuntimeDefault
