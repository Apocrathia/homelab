---
apiVersion: v1
kind: Namespace
metadata:
  name: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/component: orchestration
    mcp-client: "true"
    images/dockerhub: "true"
    # Substrate worker pods (WorkerPool/kagent-default) run in this namespace:
    # RunAsUser 0 + hostPath ate-base + seccomp Unconfined trip PSA baseline,
    # so the namespace must enforce privileged (same rationale as ate-system).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/enforce-version: latest
