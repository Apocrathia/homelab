---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kagent-postgres
  namespace: kagent
spec:
  # PostgreSQL version
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533

  # Single instance for homelab
  instances: 1

  # Barman backups: rustfs S3 (bucket `cnpg`, policy scoped to bucket+objects).
  # WAL archiving is continuous; base backups are triggered by the scheduled
  # Backup resource in scheduled-backup.yaml.
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      destinationPath: s3://cnpg/kagent
      endpointURL: http://storage.services.apocrathia.com:9009
      serverName: kagent-postgres
      s3Credentials:
        accessKeyId:
          name: kagent-postgres-backup-secrets
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: kagent-postgres-backup-secrets
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: zstd
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: true

  # Storage configuration
  storage:
    storageClass: longhorn
    size: 10Gi

  # Resource limits to prevent OOM kills
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # PostgreSQL-specific configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: kagent
      owner: kagent
      secret:
        name: kagent-secrets
