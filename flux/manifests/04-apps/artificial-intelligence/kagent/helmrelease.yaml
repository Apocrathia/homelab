---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 30m
  dependsOn:
    - name: kagent-crds
      namespace: kagent
  chart:
    spec:
      chart: kagent
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/kagent/helm/kagent
      version: "0.9.12"
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  # Pull database URL from secret (contains password)
  valuesFrom:
    - kind: Secret
      name: kagent-secrets
      valuesKey: postgres-url
      targetPath: database.postgres.url

  values:
    # Use ghcr.io for release images (default cr.kagent.dev is for dev)
    registry: ghcr.io
    # renovate: datasource=docker depName=ghcr.io/kagent-dev/kagent/controller
    tag: "0.9.12"

    database:
      type: postgres
      # URL injected via valuesFrom from kagent-secrets.postgres-url
      postgres:
        vectorEnabled: false
        # CNPG Cluster (kagent-postgres) is the database; do not deploy chart bundled Postgres
        bundled:
          enabled: false

    controller:
      replicas: 1
      loglevel: "info"

      # Watch all namespaces for Agent/MCPServer CRDs
      watchNamespaces: []

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1
          memory: 512Mi

      # Agent Substrate — sibling install in ate-system (not the bundled subchart)
      substrate:
        enabled: true
        ateApiEndpoint: "dns:///api.ate-system.svc:443"
        atenetRouterURL: "http://atenet-router.ate-system.svc:80"
        ateApiInsecure: true
        ateApiTokenAudience: api.ate-system.svc
        defaultWorkerPool:
          # WorkerPool lives in ate-system (PSA privileged); not in kagent
          namespace: ate-system
          name: kagent-default

    # Keep bundled substrate subchart off — ate-system owns the data plane
    substrate:
      enabled: false

    # WorkerPool CR is managed under substrate/ (ate-system) — chart create
    # would land privileged ateom pods in kagent and fail PSA baseline.
    substrateWorkerPool:
      create: false

    ui:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      service:
        type: ClusterIP
        ports:
          port: 8080
          targetPort: 8080

    # Using LiteLLM as OpenAI-compatible proxy
    # Model is required - agents can create their own ModelConfig for specific models
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: "qwen3.8-prime"
        apiKeySecretRef: kagent-secrets
        apiKeySecretKey: litellm-api-key
        config:
          baseUrl: "http://litellm.litellm.svc.cluster.local:4000/v1"

    # Enable kmcp
    kmcp:
      enabled: true

    # Enable built-in tools
    kagent-tools:
      enabled: true

    # Enable MCP tool integrations
    tools:
      grafana-mcp:
        enabled: true
      querydoc:
        enabled: true

    # Subchart overrides: pin grafana-mcp image (default is mcp/grafana:latest)
    grafana-mcp:
      grafana:
        # In-cluster kube-prometheus-stack Grafana (same as mcp-servers/grafana RemoteMCPServer)
        url: "http://kube-prometheus-stack-grafana.prometheus-system.svc.cluster.local"
        # Secret must provide GRAFANA_SERVICE_ACCOUNT_TOKEN (preferred) or GRAFANA_API_KEY.
        secretRef: kagent-secrets
      image:
        registry: docker.io
        repository: grafana/mcp-grafana
        # renovate: datasource=docker depName=docker.io/grafana/mcp-grafana
        tag: "1.3.0"
        pullPolicy: IfNotPresent

    # Built-in agent subcharts (top-level keys; agents.*.enabled does not control these)
    istio-agent:
      enabled: false
    kgateway-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false

    # Enable system agents
    agents:
      k8s-agent:
        enabled: true
      promql-agent:
        enabled: true
      observability-agent:
        enabled: true
      helm-agent:
        enabled: true
      cilium-policy-agent:
        enabled: true
      cilium-manager-agent:
        enabled: true
      cilium-debug-agent:
        enabled: true

    # Agent OTLP: Alloy receives gRPC 4317 / HTTP 4318 (see observability/alloy/configmap.yaml)
    otel:
      tracing:
        enabled: false
      logging:
        enabled: true
        exporter:
          otlp:
            endpoint: alloy.alloy-system.svc.cluster.local:4317
            insecure: true
            timeout: 15
