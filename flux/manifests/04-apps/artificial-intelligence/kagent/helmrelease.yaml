---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 30m
  dependsOn:
    - name: kagent-crds
      namespace: kagent
    # MCPServer CRD + controller live in the kmcp release now (kagent-crds
    # 1.0.1 dropped them).
    - name: kmcp-crds
      namespace: kagent
    # The 1.0.1 controller hard-exits ~10s after start when it cannot dial
    # the substrate API (ate-api in ate-system), so substrate Ready is a hard
    # precondition: without this edge a kagent chart bump races the substrate
    # rollout and every upgrade times out on Deployment InProgress (the
    # upgrade/rollback loop of 2026-11-20).
    - name: substrate
      namespace: ate-system
  chart:
    spec:
      chart: kagent
      # renovate: datasource=docker depName=ghcr.io/kagent-dev/kagent/helm
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    # Use ghcr.io for release images (default cr.kagent.dev is for dev).
    # kagent chart has no appVersion, so the tag is pinned here.
    registry: ghcr.io
    # renovate: datasource=docker depName=ghcr.io/kagent-dev/kagent/controller
    tag: "1.0.1"

    # Both logins reuse the bootstrap `kagent` user via the existing
    # kagent-secrets/postgres-url field (same URL, zero new 1Password items).
    # Both assumed roles are also `kagent` — the role split the chart defaults
    # imply (kagent_owner/kagent_readwrite) requires DB role membership that
    # CNPG cannot grant post-init on the existing cluster.
    database:
      postgres:
        ownerConnectionStringSecretRef:
          name: kagent-secrets
          key: postgres-url
        readWriteConnectionStringSecretRef:
          name: kagent-secrets
          key: postgres-url

    # ControllerConfig (protobuf-shaped YAML): substrate endpoints, database
    # roles, logging, telemetry. The substrate values are the chart defaults
    # (release `substrate` in ate-system) — set explicitly for GitOps
    # visibility.
    config:
      substrate:
        apiEndpoint: "dns:///api.ate-system.svc:443"
        routerUrl: "https://atenet-router.ate-system.svc:443"
        actorJwtIssuer: "https://idp.ate-system.svc"
      database:
        owner:
          role: kagent
        readWrite:
          role: kagent
        vectorEnabled: false
      logging:
        level: info
      # Controller OTLP logs: Alloy receives gRPC on 4317 (see
      # observability/alloy/logs/configmap.yaml). Endpoint must be an
      # HTTP(S) URL; protocol grpc; duration is a protobuf string.
      telemetry:
        logs:
          endpoint: "http://alloy.alloy-system.svc.cluster.local:4317"
          protocol: grpc
          timeout: "15s"

    controller:
      replicas: 1
      # Mount rotating substrate PodIdentity/ServiceDNS credentials
      # (ClusterTrustBundle + PodCertificate projected volumes); needs the
      # Talos kube-apiserver gates from talos/patches/unified-patch.yaml.
      substrateClientCertificate:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1
          memory: 512Mi

    # WorkerPool CR is hand-managed (workerpool.yaml): every namespace that
    # hosts Agents needs its own pool + Harness (references are local).
    substrateWorkerPool:
      create: false

    # Chart-created Harness `kagent-default` (Go ADK runtime) in this
    # namespace; codex/claude adapters stay off. Snapshots ride the shared
    # ate-snapshots bucket on ate-cache.
    harnesses:
      enabled: true
      snapshotLocation: "s3://ate-snapshots/kagent/"
      kagent:
        enabled: true
      codex:
        enabled: false
      claude:
        enabled: false

    ui:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      service:
        type: ClusterIP
        ports:
          port: 8080
          targetPort: 8080

    # Using LiteLLM as OpenAI-compatible proxy
    # Model is required - agents can create their own ModelConfig for specific models
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: "glm-5.3-prime"
        apiKeySecretRef: kagent-secrets
        apiKeySecretKey: litellm-api-key
        config:
          baseUrl: "http://litellm.litellm.svc.cluster.local:4000/v1"

    # Built-in tool server (bash/files/etc. for Go ADK agents)
    kagent-tools:
      enabled: true
