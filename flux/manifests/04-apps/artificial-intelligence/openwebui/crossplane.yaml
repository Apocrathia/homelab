---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: authentik-terraform-token
  namespace: openwebui
spec:
  # Scoped Authentik service-account token. Never a bare managed Secret —
  # the operator creates the 1Password item crossplane-terraform-secrets
  # (vault "Secrets", field authentik-terraform-token), and the OnePassword
  # Connect operator syncs it as the authentik-terraform-token Secret
  # consumed by the ProviderConfig in this file. Same item as every other
  # authentik-consumer copy (headlamp, chaos-mesh, misp, opencti, matrix,
  # openhands); the namespace differs.
  itemPath: "vaults/Secrets/items/crossplane-terraform-secrets"
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: openwebui-authentik
  namespace: openwebui
spec:
  # Materializes the OnePasswordItem-backed Secret as a file in the tofu
  # workdir; authentik.tf's provider block reads it with
  # file("authentik-token"). The token itself never appears in a manifest.
  # Proxy shape: SINGLE credentials entry — proxy mode has NO client_id
  # lane (the outpost authenticates users against authentik itself; no
  # OIDC credential is exchanged with the app).
  credentials:
    - filename: authentik-token
      source: Secret
      secretRef:
        name: authentik-terraform-token
        namespace: openwebui
        key: authentik-terraform-token
  # Per-app state args for the PARTIAL kubernetes backend in authentik.tf:
  # the provider writes this as crossplane.remote.tfbackend and passes it
  # via -backend-config at tofu init. The state Secret is
  # tfstate-openwebui-authentik-openwebui in this namespace — deliberately
  # separate from the CI tofu stack (terraform/, GitLab HTTP backend).
  # Two stacks, two states.
  backendFile: |
    secret_suffix     = "openwebui"
    namespace         = "openwebui"
    in_cluster_config = true
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: openwebui-authentik
  namespace: openwebui
spec:
  # Prune guard — crossplane v2 removed deletionPolicy; without the Delete
  # action the provider releases the finalizer WITHOUT running tofu destroy,
  # so a GitOps prune of this object can NEVER destroy the live authentik
  # stack (v2-native Orphan). Deliberate decommission therefore requires
  # temporarily restoring ["*"] (or a manual tofu destroy) — the guard is
  # intentional.
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: openwebui-authentik
  forProvider:
    # Inline module, stitched at kustomize build time: kustomization.yaml's
    # configMapGenerator packages authentik.tf and the replacements rule
    # copies its bytes into this module field — crossplane.yaml +
    # authentik.tf are the canonical file pair, and the HCL file is the
    # single source of truth (never render this directory outside
    # kustomize). No varmap in git — ever: the app values live in the HCL,
    # and the ADOPTION varmap (recipe §8, born-with-varmap) exists only as
    # a gate-time patch on the applied Workspace. The live objects are
    # blueprint-created and ride in tofu state only after the gate imports
    # them; the first reconcile of the unsuspended tree plans No changes.
    source: Inline
    module: ""
