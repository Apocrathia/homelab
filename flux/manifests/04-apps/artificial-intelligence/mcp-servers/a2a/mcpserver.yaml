---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: a2a
  namespace: mcp-a2a
  labels:
    app.kubernetes.io/name: a2a
    app.kubernetes.io/component: mcp-server
spec:
  # agentgateway replaces the image entrypoint; restate the MCP process here.
  transportType: stdio
  stdioTransport: {}
  deployment:
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
    image: public.ecr.aws/docker/library/python:3.14-slim@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
    port: 8080
    cmd: /bin/sh
    args:
      - -c
      # Service name "a2a" injects A2A_PORT=tcp://... via service links.
      # agentgateway inherits that into the stdio child, so pin the port
      # with an explicit export in the shell (env block alone is not enough).
      # After pip install, rewrite client card path agent.json -> agent-card.json
      # (kagent serves AgentCard at /.well-known/agent-card.json).
      - |
        set -e
        export HOME=/tmp
        export A2A_PORT=41241
        mkdir -p /tmp/a2a-data
        pip install --quiet a2a-mcp-server
        python <<'PY'
        from pathlib import Path
        import site

        old = "/.well-known/agent.json"
        new = "/.well-known/agent-card.json"
        for root in map(Path, site.getsitepackages()):
            for path in root.rglob("*.py"):
                text = path.read_text(errors="ignore")
                if old in text:
                    path.write_text(text.replace(old, new))
        PY
        exec python -m a2a_mcp_server
    env:
      HOME: /tmp
      A2A_MCP_DATA_DIR: /tmp/a2a-data
      A2A_PORT: "41241"
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
