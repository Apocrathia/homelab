---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: osv
  namespace: mcp-osv
  labels:
    app.kubernetes.io/name: osv
    app.kubernetes.io/component: mcp-server
spec:
  transportType: http
  httpTransport:
    targetPort: 8080
    path: /mcp
  deployment:
    # renovate: datasource=docker registryUrl=https://ghcr.io depName=stackloklabs/osv-mcp/server
    image: ghcr.io/stackloklabs/osv-mcp/server:0.1.3
    port: 8080
    env:
      MCP_PORT: "8080"
      FASTMCP_PORT: "8080"
      MCP_TRANSPORT: streamable-http
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "50m"
        memory: "128Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
