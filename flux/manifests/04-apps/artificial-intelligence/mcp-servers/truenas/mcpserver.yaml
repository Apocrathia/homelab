---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: truenas
  namespace: mcp-truenas
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
    image: public.ecr.aws/docker/library/python:3.15-slim@sha256:f786b2e19cf9bb54e96bfcd4c1b40c4c56336c22e60607ffd4b080ae5b5dee83
    port: 8080
    cmd: /bin/sh
    args:
      - -c
      - |
        export HOME=/tmp &&
        export TRUENAS_URL="$(cat /var/run/secrets/mcp/truenas-url)" &&
        export TRUENAS_API_KEY="$(cat /var/run/secrets/mcp/truenas-api-key)" &&
        pip install --quiet truenas-mcp-server &&
        export PATH="$HOME/.local/bin:$PATH" &&
        exec truenas-mcp-server
    env:
      HOME: /tmp
      TRUENAS_LOG_LEVEL: INFO
      TRUENAS_VERIFY_SSL: "false"
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: credentials
        mountPath: /var/run/secrets/mcp
        readOnly: true
    volumes:
      - name: credentials
        secret:
          secretName: truenas-mcp-secrets
