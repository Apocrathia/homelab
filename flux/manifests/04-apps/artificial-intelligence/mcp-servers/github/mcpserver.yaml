---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: github
  namespace: mcp-github
  labels:
    app.kubernetes.io/name: github
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
spec:
  transportType: http
  httpTransport:
    path: /mcp
    targetPort: 8080
  deployment:
    # renovate: datasource=docker registryUrl=https://ghcr.io depName=github/github-mcp-server
    image: ghcr.io/github/github-mcp-server:v1.12.1@sha256:0ba840c46a237879c8300e7fddb0b6347f20e029ccb9cbe2ce4a943daa1ff560
    port: 8080
    args:
      - http
      - --port
      - "8080"
      - --toolsets
      - context,repos,pull_requests,issues,users
    env:
      HOME: /tmp
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
