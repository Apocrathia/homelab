---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github-mcp-server
  namespace: mcp-github
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "GitHub MCP server for repository and issue management"
spec:
  # renovate: datasource=docker registryUrl=https://ghcr.io depName=github/github-mcp-server
  image: ghcr.io/github/github-mcp-server:v1.6.0
  # Native streamable-http (stateless). Avoids stdio session reuse that
  # go-sdk ≥1.7 rejects as duplicate initialize.
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8080
  permissionProfile:
    type: builtin
    name: network
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      securityContext:
        readOnlyRootFilesystem: false
      containers:
        - name: mcp
          # renovate: datasource=docker registryUrl=https://ghcr.io depName=github/github-mcp-server
          image: ghcr.io/github/github-mcp-server:v1.6.0
          args:
            - http
            - --port
            - "8080"
            - --toolsets
            - context,repos,pull_requests,issues,users
          env:
            # No GitHub PAT here — clients must send Authorization.
            - name: HOME
              value: "/tmp"
