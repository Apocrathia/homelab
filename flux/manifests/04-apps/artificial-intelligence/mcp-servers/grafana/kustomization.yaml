---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: grafana-mcp
# No kustomization-level namespace: resources carry their own, and
# secret-store.yaml contains cluster-scoped and prometheus-system objects.
resources:
  - namespace.yaml
  - mcpserver.yaml
  - secret-store.yaml
  - externalsecret.yaml
