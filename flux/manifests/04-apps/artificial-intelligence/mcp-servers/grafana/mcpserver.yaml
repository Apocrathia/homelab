---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: grafana
  namespace: mcp-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: mcp-server
spec:
  transportType: http
  httpTransport:
    targetPort: 8080
    path: /mcp
  deployment:
    # renovate: datasource=docker registryUrl=https://docker.io depName=grafana/mcp-grafana
    image: docker.io/grafana/mcp-grafana:1.2.0@sha256:cfae68f893dbe40cb6df69579f78beb226f973ded4436d47c844f91d2f00dc53
    port: 8080
    args:
      - -t
      - streamable-http
      - --address
      - "0.0.0.0:8080"
      - --debug
    env:
      GRAFANA_URL: http://kube-prometheus-stack-grafana.prometheus-system.svc.cluster.local
      # Default identity: the mcp-server GrafanaServiceAccount token, mirrored
      # into this namespace by External Secrets and mounted below. Read fresh
      # per request, so token rotation needs no pod restart. Per-request
      # X-Grafana-Service-Account-Token / X-Grafana-API-Key headers still win.
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /var/run/secrets/grafana/token
    volumes:
      - name: grafana-token
        secret:
          secretName: mcp-server-token
    volumeMounts:
      - name: grafana-token
        mountPath: /var/run/secrets/grafana
        readOnly: true
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
