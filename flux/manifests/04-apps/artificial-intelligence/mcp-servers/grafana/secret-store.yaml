---
# Plumbing that lets External Secrets mirror the grafana-operator-managed
# mcp-server-token Secret out of prometheus-system into this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: mcp-grafana
---
# Read access to exactly one Secret. Bound only in prometheus-system below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-read-grafana-mcp-token
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-server-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-read-grafana-mcp-token
  namespace: prometheus-system
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: mcp-grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-read-grafana-mcp-token
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-prometheus-system
spec:
  provider:
    kubernetes:
      remoteNamespace: prometheus-system
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: mcp-grafana
      auth:
        serviceAccount:
          name: external-secrets
          namespace: mcp-grafana
