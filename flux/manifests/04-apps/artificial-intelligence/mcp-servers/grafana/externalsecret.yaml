---
# Mirrors Secret mcp-server-token (written by grafana-operator in
# prometheus-system for the mcp-server GrafanaServiceAccount) into this
# namespace so the MCPServer pod can mount it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-server-token
  namespace: mcp-grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-prometheus-system
    kind: ClusterSecretStore
  target:
    name: mcp-server-token
  data:
    - secretKey: token
      remoteRef:
        key: mcp-server-token
        property: token
