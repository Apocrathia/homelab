---
# SaseQ Discord MCP — native streamable-http (Spring); ToolHive proxy fronts the pod.
# https://github.com/SaseQ/discord-mcp
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: discord-mcp
  namespace: mcp-discord
  labels:
    app.kubernetes.io/name: discord-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "Discord MCP — channels, messages (SaseQ/discord-mcp)"
spec:
  # renovate: datasource=docker registryUrl=https://docker.io depName=saseq/discord-mcp
  image: docker.io/saseq/discord-mcp@sha256:4a030d93f6986f6b0cd8076678cba0d9eca0d438f6e6f484cf9e05369edf182a
  transport: streamable-http
  port: 8080
  targetPort: 8080
  permissionProfile:
    type: builtin
    name: network
  resources:
    limits:
      cpu: "500m"
      memory: "768Mi"
    requests:
      cpu: "100m"
      memory: "384Mi"
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      securityContext:
        readOnlyRootFilesystem: false
      volumes:
        # ToolHive runs the container with read-only root; mount writable dirs.
        - name: discord-mcp-data
          emptyDir: {}
        - name: discord-mcp-tmp
          emptyDir: {}
      containers:
        - name: mcp
          # renovate: datasource=docker registryUrl=https://docker.io depName=saseq/discord-mcp
          image: docker.io/saseq/discord-mcp@sha256:4a030d93f6986f6b0cd8076678cba0d9eca0d438f6e6f484cf9e05369edf182a
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: discord-mcp-data
              mountPath: /data
            - name: discord-mcp-tmp
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: http
            # Align with ToolHive proxy (see MCP_PORT on the pod).
            - name: SERVER_PORT
              value: "8080"
            # Upstream JAR sets logging.file.name=./target/logs/... (relative) and logging.pattern.console=
            # (empty — breaks Logback). Flat JSON overrides application.properties before Logback starts.
            - name: SPRING_APPLICATION_JSON
              value: '{"logging.file.name":"/data/discord-mcp-server.log","logging.pattern.console":"%d{HH:mm:ss} %level %logger - %msg%n"}'
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homelab-agent-secrets
                  key: discord-token
            # Guild-scoped tools require a guild unless this is set (same 1Password item).
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: homelab-agent-secrets
                  key: discord-guild-id
