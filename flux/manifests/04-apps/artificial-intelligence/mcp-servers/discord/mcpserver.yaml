---
# SaseQ Discord MCP — native streamable-http (Spring); ToolHive proxy fronts the pod.
# https://github.com/SaseQ/discord-mcp
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: discord-mcp
  namespace: mcp-discord
  labels:
    app.kubernetes.io/name: discord-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "Discord MCP — channels, messages (SaseQ/discord-mcp)"
spec:
  # renovate: datasource=docker registryUrl=https://docker.io depName=saseq/discord-mcp
  image: docker.io/saseq/discord-mcp@sha256:4a030d93f6986f6b0cd8076678cba0d9eca0d438f6e6f484cf9e05369edf182a
  transport: streamable-http
  # ToolHive injects MCP_PORT=8080; Spring must listen on the same port.
  port: 8080
  targetPort: 8080
  permissionProfile:
    type: builtin
    name: network
  resources:
    limits:
      cpu: "500m"
      memory: "768Mi"
    requests:
      cpu: "100m"
      memory: "384Mi"
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      securityContext:
        readOnlyRootFilesystem: false
      volumes:
        - name: discord-mcp-logs
          emptyDir: {}
      containers:
        - name: mcp
          # renovate: datasource=docker registryUrl=https://docker.io depName=saseq/discord-mcp
          image: docker.io/saseq/discord-mcp@sha256:4a030d93f6986f6b0cd8076678cba0d9eca0d438f6e6f484cf9e05369edf182a
          volumeMounts:
            - name: discord-mcp-logs
              mountPath: /app/target/logs
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: http
            # Align with ToolHive proxy (see MCP_PORT on the pod).
            - name: SERVER_PORT
              value: "8080"
            # Default logback path is under ./target/logs which is not writable in the image.
            - name: LOGGING_FILE_NAME
              value: /tmp/discord-mcp-server.log
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homelab-agent-secrets
                  key: discord-token
