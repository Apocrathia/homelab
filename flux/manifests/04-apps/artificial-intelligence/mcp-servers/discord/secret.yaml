---
# Reuses homelab Discord bot token (same bot as the bridge; ensure intents/scopes match MCP usage).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homelab-agent-secrets
  namespace: mcp-discord
  labels:
    app.kubernetes.io/name: discord-mcp
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
spec:
  itemPath: "vaults/Secrets/items/homelab-agent-secrets"
