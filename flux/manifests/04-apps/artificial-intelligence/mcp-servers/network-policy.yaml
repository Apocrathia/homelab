---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: mcp-server-isolation
  labels:
    app.kubernetes.io/name: mcp-server-isolation
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
  annotations:
    description: "Restrict MCP server access to authorized AI orchestration namespaces"
spec:
  description: |
    Isolates MCP servers to only accept traffic from authorized namespaces.
    Allowed sources: namespaces with mcp-client=true label, same namespace, system namespaces.
    (kagent and litellm are the mcp-client namespaces since the agent fleet
    consolidated into kagent; the agent-* namespaces no longer exist.)
  # Target all pods in namespaces labeled as MCP servers
  endpointSelector:
    matchExpressions:
      - key: io.cilium.k8s.namespace.labels.mcp-server
        operator: In
        values:
          - "true"
  ingress:
    # Allow traffic within the same namespace (for proxy <-> server communication)
    - fromEndpoints:
        - matchExpressions:
            - key: io.cilium.k8s.namespace.labels.mcp-server
              operator: In
              values:
                - "true"
    # Allow traffic from MCP client namespaces (kagent, litellm)
    - fromEndpoints:
        - matchExpressions:
            - key: io.cilium.k8s.namespace.labels.mcp-client
              operator: In
              values:
                - "true"
    # Allow traffic from kube-system for DNS, health checks, etc.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
