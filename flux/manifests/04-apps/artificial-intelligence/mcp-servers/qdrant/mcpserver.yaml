---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant
  namespace: mcp-qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # Must stay <3.14: mcp-server-qdrant pins pydantic<2.12, whose pydantic-core
    # ships no cp314 wheels — 3.14 forces a source build that dies on a missing
    # C toolchain (`linker cc not found`) in the slim image. Enforced by an
    # allowedVersions rule in renovate.json; do not bump the major here.
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
    image: public.ecr.aws/docker/library/python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
    port: 8080
    cmd: /bin/sh
    args:
      - -c
      - |
        pip install --quiet uv
        export PATH="/tmp/.local/bin:$PATH"
        export QDRANT_API_KEY="$(cat /var/run/secrets/qdrant/api-key)"
        exec uvx mcp-server-qdrant --transport stdio
    env:
      QDRANT_URL: http://qdrant.qdrant.svc.cluster.local:6333
      COLLECTION_NAME: knowledge
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      HOME: /tmp
    volumes:
      - name: qdrant-secrets
        secret:
          secretName: qdrant-secrets
    volumeMounts:
      - name: qdrant-secrets
        mountPath: /var/run/secrets/qdrant
        readOnly: true
    resources:
      limits:
        cpu: "500m"
        memory: "2Gi"
      requests:
        cpu: "100m"
        memory: "512Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      # pip and uv install their runtime under /tmp at startup.
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
