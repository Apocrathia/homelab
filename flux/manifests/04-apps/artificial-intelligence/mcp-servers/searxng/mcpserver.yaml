---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: searxng
  namespace: mcp-searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: mcp-server
spec:
  # agentgateway wraps the image entrypoint over stdio and serves HTTP /mcp + /sse.
  transportType: stdio
  stdioTransport: {}
  deployment:
    # renovate: datasource=docker registryUrl=https://docker.io depName=isokoliuk/mcp-searxng
    image: docker.io/isokoliuk/mcp-searxng:1.16@sha256:d892b5aede28ab6476ba7ab3ce6b7e2e564ee43888e9c39ac5df52b74e1ca74d
    port: 8080
    # Image ENTRYPOINT is replaced by agentgateway; restate the MCP process here.
    cmd: node
    args:
      - dist/cli.js
    env:
      SEARXNG_URL: "http://searxng.searxng.svc.cluster.local:8080"
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
