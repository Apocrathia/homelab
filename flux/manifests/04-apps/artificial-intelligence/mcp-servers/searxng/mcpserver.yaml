---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: searxng
  namespace: mcp-searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: mcp-server
spec:
  # agentgateway wraps the image entrypoint over stdio and serves HTTP /mcp + /sse.
  transportType: stdio
  stdioTransport: {}
  deployment:
    # renovate: datasource=docker registryUrl=https://docker.io depName=isokoliuk/mcp-searxng
    image: docker.io/isokoliuk/mcp-searxng:1.14@sha256:9af77b4fa75b933ef0a3ae49f4ddf086ecceaccac5740bc595a6174b2f0d1a26
    port: 8080
    # Image ENTRYPOINT is replaced by agentgateway; restate the MCP process here.
    cmd: node
    args:
      - dist/cli.js
    env:
      SEARXNG_URL: "http://searxng.searxng.svc.cluster.local:8080"
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
