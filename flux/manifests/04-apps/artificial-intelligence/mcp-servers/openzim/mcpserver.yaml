---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: openzim
  namespace: mcp-openzim
  labels:
    app.kubernetes.io/name: openzim
    app.kubernetes.io/component: mcp-server
spec:
  transportType: stdio
  deployment:
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
    image: public.ecr.aws/docker/library/python:3.15-slim@sha256:8c13a3f37a6a5b71498228e902c4b9f51c1f7900d49fabf71f9a650c6120e0d0
    port: 8080
    cmd: /bin/sh
    args:
      - -c
      - export HOME=/tmp && pip install --quiet openzim-mcp && exec python -m openzim_mcp /data
    env:
      HOME: /tmp
      OPENZIM_MCP_TOOL_MODE: advanced
      OPENZIM_MCP_INSTANCES_PATH: /tmp
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      # pip installs at startup and needs a writable root filesystem.
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: zim
        mountPath: /data
        readOnly: true
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: zim
        persistentVolumeClaim:
          claimName: openzim-zim
      - name: tmp
        emptyDir: {}
