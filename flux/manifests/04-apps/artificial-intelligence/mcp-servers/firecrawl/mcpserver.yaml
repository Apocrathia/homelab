---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: firecrawl
  namespace: mcp-firecrawl
  labels:
    app.kubernetes.io/name: firecrawl
    app.kubernetes.io/component: mcp-server
spec:
  # stdio: kmcp injects an agentgateway init container; the adapter spawns
  # cmd/args as a stdio subprocess and serves streamable HTTP on
  # deployment.port at /mcp (and /sse).
  transportType: stdio
  deployment:
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/node
    image: public.ecr.aws/docker/library/node:24-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
    port: 8080
    cmd: npx
    args:
      - "-y"
      - firecrawl-mcp
    env:
      # npx cache needs a writable HOME; env reaches both the container and
      # the stdio subprocess via the adapter config.
      HOME: /tmp
      FIRECRAWL_API_URL: http://firecrawl.firecrawl.svc.cluster.local:3002
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
