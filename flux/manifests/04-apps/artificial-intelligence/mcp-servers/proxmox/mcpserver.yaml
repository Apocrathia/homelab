---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: proxmox
  namespace: mcp-proxmox
  labels:
    app.kubernetes.io/name: proxmox
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
    image: public.ecr.aws/docker/library/python:3.14@sha256:4fad23465a06cc5149a541fbec6f87e234a64dc0550f6bfdd2d290d8f03240df
    port: 8080
    cmd: /bin/sh
    args:
      - -c
      - |
        export HOME=/tmp &&
        pip install --quiet "git+https://github.com/RekklesNA/ProxmoxMCP-Plus.git@v0.5.10" &&
        export PATH="$HOME/.local/bin:$PATH" &&
        cat > /tmp/config.json << EOF
        {
          "proxmox": {
            "host": "$(cat /var/run/secrets/mcp/proxmox-host)",
            "port": ${PROXMOX_PORT:-8006},
            "verify_ssl": ${PROXMOX_VERIFY_SSL:-false}
          },
          "auth": {
            "user": "$(cat /var/run/secrets/mcp/proxmox-user)",
            "token_name": "$(cat /var/run/secrets/mcp/proxmox-token-name)",
            "token_value": "$(cat /var/run/secrets/mcp/proxmox-token-value)"
          },
          "security": {
            "dev_mode": ${PROXMOX_DEV_MODE:-false}
          },
          "jobs": {
            "sqlite_path": "${PROXMOX_JOBS_SQLITE_PATH:-/tmp/proxmox-jobs.sqlite3}"
          },
          "logging": {
            "level": "INFO"
          }
        }
        EOF
        export PROXMOX_MCP_CONFIG=/tmp/config.json &&
        exec python -m proxmox_mcp.server
    env:
      PROXMOX_DEV_MODE: "true"
      PROXMOX_JOBS_SQLITE_PATH: /tmp/proxmox-jobs.sqlite3
      PROXMOX_PORT: "8006"
      PROXMOX_VERIFY_SSL: "false"
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: credentials
        mountPath: /var/run/secrets/mcp
        readOnly: true
    volumes:
      - name: credentials
        secret:
          secretName: proxmox-mcp-secrets
