---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: gitlab
  namespace: mcp-gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
spec:
  # Native streamable-http (stateless sessions) — avoids agentgateway stdio
  # session leaks that starved change-summary under Renovate concurrency.
  transportType: http
  httpTransport:
    path: /mcp
    targetPort: 8080
  deployment:
    replicas: 3
    # renovate: datasource=docker depName=zereight050/gitlab-mcp
    image: docker.io/zereight050/gitlab-mcp:2.3.19@sha256:4fa95eb44c2c3b199355cd7a9bc669fcc9ef294e5fa003b2deed39c19f90599f
    port: 8080
    cmd: /bin/sh
    args:
      - -c
      - |
        export OAUTH_STATELESS_SECRET="$(cat /var/run/secrets/gitlab-mcp/OAUTH_STATELESS_SECRET)"
        exec node /app/build/index.js
    env:
      HOST: "0.0.0.0"
      PORT: "8080"
      STREAMABLE_HTTP: "true"
      # Stateless multi-pod-safe session mode (see README).
      OAUTH_STATELESS_MODE: "true"
      # Non-loopback /mcp Host allowlist (kagent cluster DNS).
      MCP_SERVER_URL: "http://gitlab.mcp-gitlab.svc.cluster.local:8080"
      # Callers (kagent RemoteMCPServer / LiteLLM) supply Private-Token per request.
      REMOTE_AUTHORIZATION: "true"
      GITLAB_API_URL: "https://gitlab.com/api/v4"
      # Read/write notes for change-summary; no delete tools.
      GITLAB_PERMISSION_MODE: "modify"
      GITLAB_TOOLSETS: "merge_requests,projects,issues,pipelines,repositories"
    resources:
      limits:
        cpu: "1"
        memory: "1Gi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    volumes:
      - name: gitlab-mcp-secrets
        secret:
          secretName: gitlab-mcp-secrets
    volumeMounts:
      - name: gitlab-mcp-secrets
        mountPath: /var/run/secrets/gitlab-mcp/OAUTH_STATELESS_SECRET
        subPath: OAUTH_STATELESS_SECRET
        readOnly: true
