---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: gitlab
  namespace: mcp-gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/node
    image: public.ecr.aws/docker/library/node:24-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
    port: 8080
    cmd: /bin/sh
    args:
      - -c
      - |
        export HOME=/tmp
        export NPM_CONFIG_TOKEN="$(cat /var/run/secrets/gitlab-mcp/gitlab-token)"
        exec npx -y @alosies/gitlab-mcp-server
    env:
      HOME: /tmp
      GITLAB_BASE_URL: https://gitlab.com
    volumes:
      - name: gitlab-mcp-secrets
        secret:
          secretName: gitlab-mcp-secrets
    volumeMounts:
      - name: gitlab-mcp-secrets
        mountPath: /var/run/secrets/gitlab-mcp
        readOnly: true
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
