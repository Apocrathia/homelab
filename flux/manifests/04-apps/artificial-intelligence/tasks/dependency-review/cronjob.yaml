---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dependency-review-sweep
  namespace: agent-tasks
  annotations:
    ignore-check.kube-linter.io/non-existent-service-account: "ServiceAccount is defined in separate serviceaccount.yaml file"
spec:
  # :23 minutes past the hour
  schedule: "23 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dependency-review-sweep
        spec:
          serviceAccountName: dependency-review
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-deps
              # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
              image: public.ecr.aws/docker/library/python:3.14@sha256:e06cc1111ed84189e91866447f562b89faadbfbbb9937cd67e6bf4172cdb45df
              env:
                - name: HOME
                  value: /tmp
                - name: UV_CACHE_DIR
                  value: /tmp/uv-cache
              command:
                - sh
                - -c
                - |
                  set -e
                  python -m pip install --no-cache-dir uv
                  python -m uv export --frozen --no-dev --directory=/scripts -o /tmp/req.txt
                  python -m uv pip install --target=/deps --no-cache -r /tmp/req.txt
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: deps
                  mountPath: /deps
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: sweep
              # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
              image: public.ecr.aws/docker/library/python:3.14@sha256:e06cc1111ed84189e91866447f562b89faadbfbbb9937cd67e6bf4172cdb45df
              command:
                - python
                - /scripts/invoke.py
              env:
                - name: PYTHONPATH
                  value: /deps
                - name: A2A_URL
                  value: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/agent-git/git-agent/
                - name: MAX_TURNS
                  value: "6"
                - name: HTTP_TIMEOUT_S
                  value: "300"
                - name: GITLAB_API
                  value: https://gitlab.com/api/v4
                - name: GITLAB_PROJECT
                  value: Apocrathia/homelab
                - name: COOLDOWN_HOURS
                  value: "24"
                - name: INFRA_COOLDOWN_HOURS
                  value: "72"
                - name: APPROVE_ON_PASS
                  value: "true"
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dependency-review-secrets
                      key: gitlab-token
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: dependency-review-github
                      key: authorization
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: deps
                  mountPath: /deps
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: dependency-review-scripts
            - name: deps
              emptyDir: {}
            - name: tmp
              emptyDir: {}
