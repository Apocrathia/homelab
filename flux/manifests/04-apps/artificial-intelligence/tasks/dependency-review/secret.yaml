---
# Reuses the existing gitlab-mcp-secrets vault item (same token the gitlab-mcp
# server uses for MR notes/approvals) so the runner can list MRs, post verdict
# notes, set labels, and approve passes. Approve-only: no merge authority.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: dependency-review-secrets
  namespace: agent-tasks
spec:
  itemPath: "vaults/Secrets/items/gitlab-mcp-secrets"
---
# Same vault item as mcp-github (1Password field: authorization, full
# "Bearer <token>" header value) — upstream releases/issues/OSV lookups.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: dependency-review-github
  namespace: agent-tasks
spec:
  itemPath: "vaults/Secrets/items/github-mcp-secrets"
