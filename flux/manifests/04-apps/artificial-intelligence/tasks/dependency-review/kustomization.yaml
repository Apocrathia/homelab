---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dependency-review

resources:
  - serviceaccount.yaml
  - secret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: dependency-review-scripts
    namespace: agent-tasks
    files:
      - task.md=prompts/task.md
      - continuation.md=prompts/continuation.md
      - invoke.py=src/invoke.py
      - facts.py=src/facts.py
      - pyproject.toml=src/pyproject.toml
      - uv.lock=src/uv.lock
