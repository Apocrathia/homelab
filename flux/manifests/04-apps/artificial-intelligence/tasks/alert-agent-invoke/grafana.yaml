---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: homelab-agent
  namespace: prometheus-system
spec:
  name: Homelab Agent
  type: webhook
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  settings:
    url: http://alert-agent-invoke.agent-tasks.svc.cluster.local:8080/webhook
    httpMethod: POST

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicyRoute
metadata:
  name: homelab-agent-route
  namespace: prometheus-system
  labels:
    grafana.alerting/policy: default
spec:
  receiver: Homelab Agent
  continue: true
