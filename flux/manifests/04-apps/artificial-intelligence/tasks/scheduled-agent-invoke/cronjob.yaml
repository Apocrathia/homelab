---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-agent-scheduled-task-template
  namespace: agent-tasks
spec:
  # Template default; clone and adjust per task.
  schedule: "0 * * * *"
  # Safe default: do not run until explicitly enabled.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: homelab-agent-scheduled-task-template
        spec:
          serviceAccountName: scheduled-agent-invoke
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-deps
              # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
              image: public.ecr.aws/docker/library/python:3.14
              env:
                - name: HOME
                  value: /tmp
                - name: UV_CACHE_DIR
                  value: /tmp/uv-cache
              command:
                - sh
                - -c
                - |
                  set -e
                  python -m pip install --no-cache-dir uv
                  python -m uv export --frozen --no-dev --directory=/scripts -o /tmp/req.txt
                  python -m uv pip install --target=/deps --no-cache -r /tmp/req.txt
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: deps
                  mountPath: /deps
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: invoke
              # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/python
              image: public.ecr.aws/docker/library/python:3.14
              command:
                - python
                - /scripts/invoke.py
              env:
                - name: PYTHONPATH
                  value: /deps
                - name: PROMPT_PATH
                  value: /scripts/task.md
                - name: CONTINUATION_PATH
                  value: /scripts/continuation.md
                - name: MAX_TURNS
                  value: "8"
                - name: MULTITURN_EARLY_EXIT
                  value: "true"
                - name: HTTP_TIMEOUT_S
                  value: "300"
                - name: A2A_URL
                  value: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/homelab-agent/
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: deps
                  mountPath: /deps
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: homelab-agent-task-template
            - name: deps
              emptyDir: {}
            - name: tmp
              emptyDir: {}
