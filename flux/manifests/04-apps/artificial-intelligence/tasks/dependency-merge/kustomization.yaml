---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dependency-merge

resources:
  - serviceaccount.yaml
  - cronjob.yaml

# GitLab token comes from the sibling dependency-review OnePasswordItem
# (dependency-review-secrets in agent-tasks); no new secret here.

configMapGenerator:
  - name: dependency-merge-scripts
    namespace: agent-tasks
    files:
      - task.md=prompts/task.md
      - continuation.md=prompts/continuation.md
      - triage.md=prompts/triage.md
      - invoke.py=src/invoke.py
      - pyproject.toml=src/pyproject.toml
      - uv.lock=src/uv.lock
