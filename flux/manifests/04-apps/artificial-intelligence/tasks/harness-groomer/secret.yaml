---
# Reuses the existing prime-agent-secrets vault item (same item the
# prime-agent deployment mounts): the a2a-webhook-token field backs the
# fail-closed bearer auth on the pod's inbound A2A webhook. The whole item
# syncs (litellm-api-key included) — same posture as the dependency-review
# precedent that reuses gitlab-mcp-secrets.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: harness-groomer-secrets
  namespace: agent-tasks
spec:
  itemPath: "vaults/Secrets/items/prime-agent-secrets"
