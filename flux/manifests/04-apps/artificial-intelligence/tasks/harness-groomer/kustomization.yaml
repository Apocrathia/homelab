---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: harness-groomer

resources:
  - serviceaccount.yaml
  - secret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: harness-groomer-scripts
    namespace: agent-tasks
    files:
      - task.md=prompts/task.md
      - invoke.py=src/invoke.py
      - pyproject.toml=src/pyproject.toml
      - uv.lock=src/uv.lock
