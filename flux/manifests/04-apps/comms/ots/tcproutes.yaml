---
# TCPRoutes for ATAK client traffic on both front doors (LAN via
# main-gateway, tailnet via tailnet-gateway). Dual parentRefs are why these
# ship as plain manifests - the chart's tcproute template cannot express
# them. Listener names (sectionName) match the ots-* TCP listeners added to
# both Gateways (allowedRoutes locked to the ots namespace).
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ots-cot
  namespace: ots
spec:
  parentRefs:
    - name: main-gateway
      namespace: cilium-system
      sectionName: ots-8088
    - name: tailnet-gateway
      namespace: cilium-system
      sectionName: ots-8088
  rules:
    - backendRefs:
        - name: ots
          port: 8088
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ots-ssl-cot
  namespace: ots
spec:
  parentRefs:
    - name: main-gateway
      namespace: cilium-system
      sectionName: ots-8089
    - name: tailnet-gateway
      namespace: cilium-system
      sectionName: ots-8089
  rules:
    - backendRefs:
        - name: ots
          port: 8089
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ots-marti
  namespace: ots
spec:
  parentRefs:
    - name: main-gateway
      namespace: cilium-system
      sectionName: ots-8443
    - name: tailnet-gateway
      namespace: cilium-system
      sectionName: ots-8443
  rules:
    - backendRefs:
        - name: ots
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ots-enroll
  namespace: ots
spec:
  parentRefs:
    - name: main-gateway
      namespace: cilium-system
      sectionName: ots-8446
    - name: tailnet-gateway
      namespace: cilium-system
      sectionName: ots-8446
  rules:
    - backendRefs:
        - name: ots
          port: 8446
