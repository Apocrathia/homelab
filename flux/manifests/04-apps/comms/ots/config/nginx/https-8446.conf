# ATAK automatic certificate enrollment. TLS with the OTS CA server
# certificate; only /Marti/api/tls is proxied, everything else is denied.
# Enrollment credentials are checked by OTS against LDAP (Authentik).
server {
    listen 8446 ssl;
    server_name tak.gateway.services.apocrathia.com;

    # OpenTAKServer CA + server certificate (written by ots-api on first boot)
    ssl_client_certificate /app/ots/ca/ca.pem;
    ssl_certificate /app/ots/ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key /app/ots/ca/certs/opentakserver/opentakserver.nopass.key;

    location / {
        return 403;
    }

    location /Marti/api/tls {
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://localhost:8081;
    }
}
