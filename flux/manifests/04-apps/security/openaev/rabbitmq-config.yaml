---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openaev-rabbitmq-config
  namespace: openaev
  labels:
    app.kubernetes.io/name: openaev
    app.kubernetes.io/component: broker-config
    app.kubernetes.io/part-of: artificial-intelligence
    app.kubernetes.io/managed-by: flux
data:
  # Upstream-mandated broker settings (verbatim from OpenAEV-Platform/docker
  # rabbitmq.conf): exercises publish payloads up to 512MB and long-running
  # consumers need the 24h ack timeout. The image's VOLUME /var/lib/rabbitmq is
  # backed by the Longhorn PVC from rabbitmq.yaml, so these apply on every
  # boot.
  rabbitmq.conf: |
    max_message_size = 536870912
    consumer_timeout = 86400000
