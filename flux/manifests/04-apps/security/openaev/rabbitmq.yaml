---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openaev-rabbitmq
  namespace: openaev
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.88"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m

  values:
    app:
      name: openaev-rabbitmq
      namespace: openaev
      # Broker for exercise injects/notifications (firecrawl-rabbitmq pattern).
      # docker.io library image, digest-pinned (multiarch manifest).
      # Pin to docker.io, NOT the ECR mirror: renovate's docker datasource
      # resolves digests against docker.io, and the ECR mirror serves its own
      # manifest lists - a cross-registry pin is unpullable (the 4.4.0 bump
      # shipped docker.io's eb37f586 against public.ecr.aws and
      # ImagePullBackOff'd). The images/dockerhub namespace label makes the
      # Kyverno-cloned pull secret cover docker.io pulls.
      # renovate: datasource=docker depName=docker.io/library/rabbitmq
      image: docker.io/library/rabbitmq:4.4.0-management-alpine@sha256:d5c8b200a061242868833c8bbdd0703534a4a06ffe654a853e33acd46c7ce258
      container:
        name: rabbitmq
        port: 5672
        env:
          # Same keys the platform's OPENAEV_RABBITMQ_USER/PASS read — the
          # entrypoint creates this user on boot.
          - name: RABBITMQ_DEFAULT_USER
            valueFrom:
              secretKeyRef:
                name: openaev-secrets
                key: rabbitmq-user
          - name: RABBITMQ_DEFAULT_PASS
            valueFrom:
              secretKeyRef:
                name: openaev-secrets
                key: rabbitmq-pass

      service:
        type: ClusterIP
        port: 5672
        targetPort: 5672
        portName: amqp

      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi

      volumes:
        configMap:
          - name: rabbitmq-config
            mountPath: /etc/rabbitmq/rabbitmq.conf
            subPath: rabbitmq.conf
            readOnly: true
            configMapName: openaev-rabbitmq-config
        emptyDir:
          - name: data
            mountPath: /var/lib/rabbitmq
            # Broker state is pod-local: Khepri boots blank on hostname change
            # (Deployment pod recreation) regardless of PVC, and a Longhorn PVC
            # plus the chart-default fsGroup re-chmods the erlang cookie
            # group-readable on every mount (owner-only check fails -> crash
            # loop). emptyDir matches the actual durability class: survives
            # container restarts, not pod moves.

      healthChecks:
        livenessProbe:
          enabled: true
          exec:
            command:
              - rabbitmq-diagnostics
              - -q
              - check_running
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          enabled: true
          exec:
            command:
              - rabbitmq-diagnostics
              - -q
              - check_running
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    postgres:
      enabled: false

    secrets:
      enabled: false

    authentik:
      enabled: false

    gatus:
      enabled: false
    httproute:
      enabled: false
