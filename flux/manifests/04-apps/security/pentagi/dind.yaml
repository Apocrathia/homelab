---
# Docker-in-docker daemon for PentAGI agent sandboxes.
#
# PentAGI hard-requires a Docker daemon: it Fatals at startup if the docker
# client cannot reach one (backend/cmd/pentagi/main.go), because every agent
# terminal runs inside a container it creates. The cluster has no host docker
# socket (Talos runs containerd), so this privileged dockerd serves that API
# over plain TCP inside the namespace. The CiliumNetworkPolicy in
# networkpolicy.yaml restricts 2375 to the pentagi app pod and the kubelet
# probes; the app reaches it as
# DOCKER_HOST=tcp://pentagi-dind.pentagi.svc.cluster.local:2375.
#
# PentAGI's own container runs unprivileged; only this daemon is privileged.
# Worker containers live entirely inside this daemon (their bind-mount
# fallback for workspaces is docker named volumes, the documented
# "docker socket hosted on a different machine" path), so agent sandboxes
# cannot see the node or the cluster.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pentagi-dind-data
  namespace: pentagi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pentagi-dind
  namespace: pentagi
  labels:
    app: pentagi-dind
    app.kubernetes.io/name: pentagi
    app.kubernetes.io/component: docker-daemon
    app.kubernetes.io/part-of: security
    app.kubernetes.io/managed-by: flux
  annotations:
    # dockerd cannot run read-only-rootfs or non-root; privileged is the
    # documented docker-in-docker requirement.
    ignore-check.kube-linter.io/no-read-only-root-fs: dockerd writes /var/lib/docker and /run
    ignore-check.kube-linter.io/privileged-container: docker-in-docker requires a privileged dockerd
    ignore-check.kube-linter.io/privilege-escalation-container: same privileged requirement
    ignore-check.kube-linter.io/run-as-non-root: dockerd needs root in its own namespace
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO claim
  selector:
    matchLabels:
      app: pentagi-dind
  template:
    metadata:
      labels:
        app: pentagi-dind
        app.kubernetes.io/name: pentagi
        app.kubernetes.io/component: docker-daemon
        app.kubernetes.io/part-of: security
    spec:
      containers:
        - name: dind
          # renovate: datasource=docker depName=docker.io/library/docker
          image: docker.io/library/docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
          env:
            # Plain TCP daemon (2375): no TLS cert rotation inside a single
            # namespace; the CNP is the compensating control.
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          ports:
            - name: docker
              containerPort: 2375
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: dind-data
              mountPath: /var/lib/docker
          startupProbe:
            httpGet:
              path: /_ping
              port: docker
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /_ping
              port: docker
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_ping
              port: docker
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: dind-data
          persistentVolumeClaim:
            claimName: pentagi-dind-data
---
apiVersion: v1
kind: Service
metadata:
  name: pentagi-dind
  namespace: pentagi
  labels:
    app: pentagi-dind
    app.kubernetes.io/name: pentagi
    app.kubernetes.io/component: docker-daemon
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    app: pentagi-dind
  ports:
    - name: docker
      port: 2375
      targetPort: docker
      protocol: TCP
  type: ClusterIP
