---
apiVersion: v1
kind: Namespace
metadata:
  name: pentagi
  labels:
    app.kubernetes.io/name: pentagi
    app.kubernetes.io/component: autonomous-pentest
    app.kubernetes.io/part-of: security
    # vxcontrol/pentagi + docker.io/library/docker live on docker.io; Kyverno
    # clones the docker.io pull secret into namespaces with this label.
    images/dockerhub: "true"
    # Opt-in to the shared kopiur repository (ClusterRepository/nas-rustfs)
    backup.apocrathia.com/repo: nas-rustfs
