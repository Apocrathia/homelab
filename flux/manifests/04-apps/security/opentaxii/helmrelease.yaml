---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentaxii
  namespace: opentaxii
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.88"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  values:
    app:
      name: opentaxii
      namespace: opentaxii
      # Why 0.10.0b1 and not 0.9.3: TAXII 2.1 is on by default, gunicorn is
      # current (0.9.3 pins 20.0.4, CVE-2024-1135 request smuggling), and
      # Python 3.10 replaces EOL 3.9. Image is amd64-only.
      # renovate: datasource=docker depName=eclecticiq/opentaxii
      image: eclecticiq/opentaxii:0.10.0b1@sha256:c7b7adc4bd1ee1e9419615e7c56c3f7a2cb5e1e06448b04a6245537c5efe1268
      container:
        name: opentaxii
        port: 9000
        env:
          # The entrypoint writes /tmp/opentaxii.yml from the DATABASE_* and
          # AUTH_DATABASE_* vars; gunicorn and sync-data read it through
          # OPENTAXII_CONFIG. Its `cp -> /opentaxii.yml` copy fails under
          # uid 1000, but the script has no set -e, so that failure is
          # harmless - the real config is /tmp/opentaxii.yml.
          - name: OPENTAXII_CONFIG
            value: /tmp/opentaxii.yml
          # Advertised TAXII 1 service addresses in discovery responses
          - name: OPENTAXII_DOMAIN
            value: opentaxii.opentaxii.svc.cluster.local:9000
          # SQLAlchemy pool_pre_ping via the OPENTAXII_* config override chain:
          # persistence parameters map 1:1 to API constructor kwargs, and
          # BaseSQLDatabaseAPI.__init__(**engine_parameters) passes unknown
          # kwargs straight to sqlalchemy.create_engine. Do NOT nest an extra
          # ENGINE_PARAMETERS__ level - that arrives as a literal constructor
          # kwarg and crashes create_engine (verified the hard way, 2026-10-18).
          # Heals stale pooled SSL connections after a CNPG pod restart without
          # a rollout: every TAXII surface 500ed (psycopg2 SSL SYSCALL error /
          # bad record mac) until the app was restarted. See README
          # troubleshooting.
          - name: OPENTAXII_PERSISTENCE_API__PARAMETERS__POOL_PRE_PING
            value: "true"
          - name: OPENTAXII_TAXII2__PERSISTENCE_API__PARAMETERS__POOL_PRE_PING
            value: "true"
          - name: OPENTAXII_AUTH_API__PARAMETERS__POOL_PRE_PING
            value: "true"
          # Connector account creds for the postStart ensure-hook below.
          # opentaxii-sync-data prunes accounts not declared in
          # data-configuration.yml on every boot (utils.py sync_accounts), so
          # the account is re-created at start; fields live in the
          # opentaxii-secrets vault item (taxii2-username / taxii2-password).
          - name: TAXII2_ACCOUNT_USERNAME
            valueFrom:
              secretKeyRef:
                name: opentaxii-secrets
                key: taxii2-username
          - name: TAXII2_ACCOUNT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: opentaxii-secrets
                key: taxii2-password
          - name: DATABASE_HOST
            value: opentaxii-postgres-rw.opentaxii.svc.cluster.local
          - name: DATABASE_NAME
            value: opentaxii
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: opentaxii-secrets
                key: username
          - name: DATABASE_PASS
            valueFrom:
              secretKeyRef:
                name: opentaxii-secrets
                key: password
          # Auth tables in the same CNPG database. Without AUTH_DATABASE_HOST
          # the entrypoint falls back to SQLite at /data (volume not mounted).
          - name: AUTH_DATABASE_HOST
            value: opentaxii-postgres-rw.opentaxii.svc.cluster.local
          - name: AUTH_DATABASE_NAME
            value: opentaxii
          # JWT signing secret for /management/auth (0.10 renamed from
          # OPENTAXII_AUTH_SECRET, which the config loader now ignores)
          - name: DOCKER_OPENTAXII_AUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: opentaxii-secrets
                key: auth-secret
          - name: TZ
            value: "America/Denver"
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity

      securityContext:
        # Image default user is root; uid 1000 is sufficient - the entrypoint
        # only writes /tmp (emptyDir) and reads /input. TAXII 2.1 + TAXII 1
        # data live in CNPG postgres, /data SQLite is unused.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # postStart waits for the entrypoint's sync-data prune to finish
      # (gunicorn listening on :9000), then re-ensures the connector account.
      # Failures are logged but non-fatal - a postStart failure would kill
      # the container.
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                i=0
                until python3 -c "import urllib.request as u; u.urlopen('http://localhost:9000/management/health', timeout=2)" 2>/dev/null; do
                  i=$((i+1))
                  if [ "$i" -gt 90 ]; then echo "poststart: app never came up; skipping account ensure"; exit 0; fi
                  sleep 2
                done
                python3 - <<'PYEOF' || echo "poststart: account ensure failed (non-fatal)"
                import os
                from opentaxii.cli import app
                user = os.environ["TAXII2_ACCOUNT_USERNAME"]
                pw = os.environ["TAXII2_ACCOUNT_PASSWORD"]
                with app.app_context():
                    auth = app.taxii_server.auth
                    existing = [a for a in auth.get_accounts() if a.username == user]
                    if existing:
                        auth.update_account(existing[0], password=pw)
                    else:
                        auth.api.create_account(username=user, password=pw, is_admin=False)
                print("poststart: account ensured")
                PYEOF

      healthChecks:
        # Built-in management blueprint: GET /management/health -> 200
        # {"alive": true} (opentaxii/management.py), no auth needed
        livenessProbe:
          enabled: true
          httpGet:
            path: /management/health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /management/health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          enabled: true
          httpGet:
            path: /management/health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
          successThreshold: 1

      service:
        type: ClusterIP
        port: 9000
        targetPort: 9000
        portName: http

      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp
        configMap:
          # TAXII 1.x bootstrap data for the entrypoint's opentaxii-sync-data
          # run (ConfigMap from kustomization configMapGenerator)
          - name: data-configuration
            mountPath: /input/data-configuration.yml
            subPath: data-configuration.yml
            readOnly: true
            configMapName: opentaxii-data-configuration

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/opentaxii-secrets"

    authentik:
      # No SSO: TAXII clients speak basic auth/token, a proxy would break them
      enabled: false

    gatus:
      enabled: true
      group: security
      path: /management/health

    httproute:
      # Internal consumption only (MISP/OpenCTI feeders in-cluster)
      enabled: false

    postgres:
      enabled: true
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
      instances: 1
      storage:
        storageClass: longhorn
        size: 5Gi
