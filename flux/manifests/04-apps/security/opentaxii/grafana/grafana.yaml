---
# Custom OpenTAXII workload dashboard (kube-prometheus-stack + Alloy → Loki).
# JSON lives in ConfigMap opentaxii-workload-dashboard (generated from dashboard.json).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: opentaxii-workload
  namespace: prometheus-system
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  configMapRef:
    name: opentaxii-workload-dashboard
    key: dashboard.json
  folder: Security
