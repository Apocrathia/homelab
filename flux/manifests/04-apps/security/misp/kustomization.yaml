---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: misp
  namespace: misp

resources:
  - namespace.yaml
  - secret.yaml
  - externalsecret.yaml
  - backup-secret.yaml
  - backup-cronjob.yaml
  - backup.yaml
  - helmrelease.yaml
  - crossplane.yaml

generatorOptions:
  disableNameSuffixHash: true
