---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: authentik-terraform-token
  namespace: misp
spec:
  # Scoped Authentik service-account token. Never a bare managed Secret —
  # the operator creates the 1Password item crossplane-terraform-secrets
  # (vault "Secrets", field authentik-terraform-token), and the OnePassword
  # Connect operator syncs it as the authentik-terraform-token Secret
  # consumed by the ProviderConfig in this file. Same item as headlamp's
  # and chaos-mesh's copies; the namespace differs.
  itemPath: "vaults/Secrets/items/crossplane-terraform-secrets"
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: misp-authentik
  namespace: misp
spec:
  # Materializes the OnePasswordItem-backed Secret as a file in the tofu
  # workdir; the module's provider block reads it with file("authentik-token").
  # The token itself never appears in a manifest.
  credentials:
    - filename: authentik-token
      source: Secret
      secretRef:
        name: authentik-terraform-token
        namespace: misp
        key: authentik-terraform-token
  # Per-app state args for the module's PARTIAL kubernetes backend: the
  # provider writes this as crossplane.remote.tfbackend and passes it via
  # -backend-config at tofu init. The state Secret is
  # tfstate-default-misp in this namespace — deliberately separate from
  # the CI tofu stack (terraform/, GitLab HTTP backend). Two stacks, two
  # states.
  backendFile: |
    secret_suffix     = "misp"
    namespace         = "misp"
    in_cluster_config = true
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: misp-authentik
  namespace: misp
spec:
  # Prune guard — crossplane v2 removed deletionPolicy; without the Delete
  # action the provider releases the finalizer WITHOUT running tofu destroy,
  # so a GitOps prune of this object can NEVER destroy the live authentik
  # stack (v2-native Orphan). Deliberate decommission therefore requires
  # temporarily restoring ["*"] (or a manual tofu destroy) — the guard is
  # intentional.
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: misp-authentik
  forProvider:
    source: Remote
    # The shared module is the root config (import blocks are root-only).
    # Pinned to the generic-app chart release tag — generic-app-0.0.84
    # already exists (the module landed on main with it), so the first
    # reconcile resolves the module immediately; a later chart tag means
    # bumping this pin by hand (no renovate manager matches a git:: ref).
    module: "git::https://gitlab.com/Apocrathia/homelab.git//terraform/modules/authentik-app?ref=generic-app-0.0.84"
    # Pull once per URL; a tag move changes the ref and re-pulls. The
    # admission default (Always) would re-clone the repo on every poll.
    remotePullPolicy: IfNotPresent
    # Module inputs — no chart composer here, so the varmap carries the
    # full input set (variable contract: terraform/modules/authentik-app/
    # variables.tf). FRESH CREATE (blip): nothing is live yet (MR
    # unmerged — the first apply creates every authentik object fresh),
    # so adoption stays false and NO import ids are set (the module's
    # plan-time variable validation fails ids-without-adoption). OIDC
    # mode: the provider is the native MISP OidcAuth client, the custom
    # "MISP Roles" scope mapping feeds the HelmRelease oidcRolesMapping
    # (misp-admin -> MISP role 1); validity windows match the blueprint
    # numbers (minutes=1 / minutes=5 / days=30 — the module's oidc
    # defaults, sent explicitly for chart parity). token_validity
    # (blueprint days=30) is NOT expressible in TF provider 2026.8.0 —
    # unmanaged; the fresh create takes the authentik API default.
    varmap:
      app_name: "misp"
      display_name: "MISP"
      external_host: "https://misp.gateway.services.apocrathia.com"
      mode: "oidc"
      shared: false
      tailnet: false
      adoption: false
      sso_launch_url: ""
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/security/misp/icon.svg"
      category: "Security"
      authorization_flow: "default-provider-authorization-implicit-consent"
      invalidation_flow: "default-invalidation-flow"
      authentication_flow: "default-authentication-flow"
      oidc_client_id: "misp"
      client_type: "confidential"
      sub_mode: "user_email"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key: "authentik Self-signed Certificate"
      # OidcAuth setRedirectURL(MISP.baseurl + '/users/login') — the IdP
      # callback lands on the login route (plugin source, research §1.6).
      redirect_uris:
        - url: "https://misp.gateway.services.apocrathia.com/users/login"
          matching_mode: "strict"
      scopes:
        - "openid"
        - "email"
        - "profile"
      # Scope mapping for the MISP `roles` claim (research §1.6 step 2):
      # the authentik `admins` group -> OidcAuth role_mapper key
      # `misp-admin` (-> MISP role id 1 in the HelmRelease
      # OIDC_ROLES_MAPPING). House pattern: the kube-auth `groups` scope
      # mapping. Ported verbatim from the shipped blueprint.
      custom_scope_mappings:
        - name: "MISP Roles"
          scope_name: "roles"
          description: "MISP role claim: authentik admins group -> misp-admin"
          expression: |
            roles = []
            for group in user.ak_groups.all():
                if group.name == "admins":
                    roles.append("misp-admin")
            return {"roles": roles}
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      meta_description: "MISP threat intelligence sharing platform - IOCs, feeds, and event data"
      meta_publisher: "CIRCL"
