---
# The misp chart's deployment template reads MySQL credentials from a Secret
# with `username`/`password` keys (mysqlCredentialsSecretName), which the
# `misp-secrets` item field names cannot satisfy directly. This ExternalSecret
# remaps the vault fields into that shape. Operator steer 2026-10-12:
# usernames live in the vault too — no credential material (even the# well-known DB username) rides plaintext in manifests.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: misp-mysql-credentials
  namespace: misp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-connect
    kind: ClusterSecretStore
  target:
    name: misp-mysql-credentials
    template:
      engineVersion: v2
      data:
        username: "{{ .MYSQL_USER }}"
        password: "{{ .MYSQL_PASSWORD }}"
  data:
    - secretKey: MYSQL_USER
      remoteRef:
        key: misp-secrets
        property: MYSQL_USER
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: misp-secrets
        property: MYSQL_PASSWORD
