---
# The misp chart's deployment template reads MySQL credentials from a Secret
# with `username`/`password` keys (mysqlCredentialsSecretName), which the
# `misp-secrets` item field names cannot satisfy directly. This ExternalSecret
# remaps the vault fields into that shape; the DB username is static
# (`misp`, matches mariadb.auth.username).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: misp-mysql-credentials
  namespace: misp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-connect
    kind: ClusterSecretStore
  target:
    name: misp-mysql-credentials
    template:
      engineVersion: v2
      data:
        username: misp
        password: "{{ .MYSQL_PASSWORD }}"
  data:
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: misp-secrets
        property: MYSQL_PASSWORD

---
# Same key-shape remap for the chart's OIDC credentials Secret
# (oidcCredentialsSecretName: the deployment template reads OIDC_CLIENT_ID
# / OIDC_CLIENT_SECRET from `username` / `password` keys). `username` is the
# varmap-pinned client_id (not a secret); the client secret is
# authentik-generated on provider create and copied by the operator into
# the misp-secrets item post-merge (README post-deploy step 1). Until that
# copy happens this ExternalSecret stays not-Ready and the misp pod waits
# on the missing Secret - that ordering is intended.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: misp-oidc-credentials
  namespace: misp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-connect
    kind: ClusterSecretStore
  target:
    name: misp-oidc-credentials
    template:
      engineVersion: v2
      data:
        username: misp
        password: "{{ .OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: misp-secrets
        property: OIDC_CLIENT_SECRET
