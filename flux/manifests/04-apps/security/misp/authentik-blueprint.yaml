---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: misp
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Scope mapping for the MISP `roles` claim (research §1.6 step 2): the
  # authentik `admins` group -> OidcAuth role_mapper key `misp-admin`
  # (-> MISP role id 1 in the HelmRelease OIDC_ROLES_MAPPING). House
  # pattern: the kube-auth `groups` scope mapping.
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "MISP Roles"
    attrs:
      name: "MISP Roles"
      scope_name: "roles"
      description: "MISP role claim: authentik admins group -> misp-admin"
      expression: |
        roles = []
        for group in user.ak_groups.all():
            if group.name == "admins":
                roles.append("misp-admin")
        return {"roles": roles}

  # OIDC Provider for MISP (native OidcAuth plugin, not proxy). PKCE S256 is
  # client-driven (HelmRelease env OIDC_CODE_CHALLENGE_METHOD=S256); no
  # provider-side flag. Auth method client_secret_post (image default,
  # matches the chart env OIDC_AUTHENTICATION_METHOD).
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "misp-oidc-provider"
    attrs:
      name: "misp-oidc-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "MISP Roles"]]
      sub_mode: "user_email"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        # OidcAuth setRedirectURL(MISP.baseurl + '/users/login') - the IdP
        # callback lands on the login route (plugin source, research §1.6).
        - url: "https://misp.gateway.services.apocrathia.com/users/login"
          matching_mode: "strict"
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      token_validity: "days=30"
      client_type: "confidential"
      # Pinned so helmrelease.yaml / externalsecret.yaml can name the
      # client_id statically; only the authentik-generated client secret is
      # a post-merge copy (the opencti blueprint pattern).
      client_id: "misp"

  # Application for MISP (dashboard tile in the "Security" category)
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "misp"
    attrs:
      name: "MISP"
      slug: "misp"
      group: "Security"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "misp-oidc-provider"]]
      meta_launch_url: "https://misp.gateway.services.apocrathia.com/"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/security/misp/icon.svg"
      meta_description: "MISP threat intelligence sharing platform - IOCs, feeds, and event data"
      meta_publisher: "CIRCL"

  # Admins group binding (app access)
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "misp"]]
      group: !Find [authentik_core.group, [name, "admins"]]
    attrs:
      order: 10
