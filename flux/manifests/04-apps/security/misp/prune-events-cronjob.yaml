---
# Daily prune of MISP events older than 90 days, by the event `date` field -
# the retention authority of the 90-day threat-intel window (operator doctrine
# 2026-11-01). MISP has no native age-based event expiry, so this CronJob is
# the mechanism: REST query for events dated before the cutoff, then delete
# each one. The event `date` (content date) is the semantic "intel age":
# abuse.ch backfill events carry historical dates with recent timestamps, so
# a timestamp-based prune would keep the 2022-era junk forever. OpenCTI keeps
# only what MISP holds (see the opencti README retention runbook).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: misp-event-prune
  namespace: misp
spec:
  # 23:30 America/Denver = 05:30 UTC during DST (06:30 UTC in winter): an
  # hour after the 22:30 misp-mariadb-backup start so the nightly dump
  # captures the pre-prune state (pruned events stay recoverable from the
  # 14-day bucket life, same as the audit-log prune), 45 min clear of the
  # 22:45 misp-mariadb-prune run, and clear of the CNPG-style 05:00 UTC
  # backup wave. First run can take hours (one DELETE per expired event);
  # Forbid keeps nightly runs from overlapping it.
  schedule: "30 23 * * *"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          # The prune client only talks to the MISP Service; no
          # ServiceAccount, no API access.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              # Stdlib-only REST client (urllib): the bitnami mariadb
              # image the sibling cronjobs use ships no python, and the call
              # shapes (POST /events/index with dateuntil + minimal, bare
              # JSON array back; DELETE /events/<id>) are verified against
              # the MISP 2.5.44 EventsController source and the automation
              # guide - no REST client dependency needed.
              # renovate: datasource=docker depName=docker.io/library/python
              image: docker.io/library/python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
              command:
                - python
                - -c
                - |
                  import json
                  import os
                  import sys
                  import urllib.error
                  import urllib.request
                  from datetime import date, timedelta

                  # Cutoff computed on the UTC container clock; one day of skew vs the Denver
                  # calendar is immaterial for a rolling 90-day window.
                  misp_url = os.environ["MISP_URL"].rstrip("/")
                  headers = {"Authorization": os.environ["MISP_KEY"], "Accept": "application/json"}
                  cutoff = (date.today() - timedelta(days=90)).isoformat()

                  # POST /events/index, body filter dateuntil = "Event.date <= cutoff"
                  # (MISP automation guide: searchDateuntil, "anything older than the given
                  # date"); minimal trims each event to a few small fields
                  # (id/uuid/timestamp/published/…; this script reads only the
                  # id). The REST branch returns the bare event array with no
                  # result cap (verified against the MISP 2.5.44
                  # EventsController source).
                  index_req = urllib.request.Request(
                      f"{misp_url}/events/index",
                      data=json.dumps({"dateuntil": cutoff, "minimal": True}).encode(),
                      headers={**headers, "Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(index_req, timeout=120) as resp:
                      events = json.load(resp)
                  ids = [int(event["id"]) for event in events]
                  del events
                  print(f"events with date <= {cutoff} (90-day window): {len(ids)}")

                  deleted = failed = 0
                  for event_id in ids:
                      # DELETE /events/<id> (automation guide); MISP 403s both
                      # permission failures and not-found, so count it and keep sweeping.
                      delete_req = urllib.request.Request(
                          f"{misp_url}/events/{event_id}", headers=headers, method="DELETE"
                      )
                      try:
                          with urllib.request.urlopen(delete_req, timeout=60) as resp:
                              resp.read()
                          deleted += 1
                      except urllib.error.HTTPError as err:
                          failed += 1
                          print(f"delete failed for event {event_id}: HTTP {err.code}", file=sys.stderr)
                      if deleted and deleted % 1000 == 0:
                          print(f"deleted {deleted} events")
                  print(f"deleted {deleted} events, {failed} delete failures")
                  sys.exit(1 if failed else 0)

              env:
                # In-cluster Service, same direct-to-Service path as the
                # mariadb sibling cronjobs - no gateway hairpin, no TLS
                # needed. The auth key header rides the pod network.
                - name: MISP_URL
                  value: http://misp.misp.svc.cluster.local:80
                # Delete-capable MISP auth key (dedicated user, org
                # Apocrathia) - the opencti connector's misp-key is
                # read-only. The operator mints the key and adds the
                # `prune-key` field to the `misp-secrets` 1Password item
                # post-merge (README); until it syncs, fired jobs wait on
                # the missing key (CreateContainerConfigError), the same
                # intended step-0 ordering as the misp-key pattern.
                - name: MISP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: misp-secrets
                      key: prune-key
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                # The index response for a big first run (hundreds of
                # thousands of minimal events, ~170 bytes each) is parsed
                # in-memory before the ids are extracted; 512Mi holds the
                # peak. Steady-state nightly runs are tiny.
                limits:
                  memory: 512Mi
