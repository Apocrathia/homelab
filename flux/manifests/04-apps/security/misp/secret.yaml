---
# Canonical in-cluster materialization of the 1Password item
# `vaults/Secrets/items/misp-secrets` (created in slice 1). Field labels
# follow the misp-docker env names:
#   MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / REDIS_PASSWORD /
#   ADMIN_EMAIL / ADMIN_PASSWORD
# Consumed by the HelmRelease valuesFrom (MariaDB auth, valkey ACL password,
# notification email) and by the postRenderers env patches (admin bootstrap
# creds).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: misp-secrets
  namespace: misp
spec:
  itemPath: "vaults/Secrets/items/misp-secrets"
