---
# Materializes the 1Password item
# `vaults/Secrets/items/misp-mariadb-backups-secrets` (slice 1 rustfs keypair
# for the `misp-mariadb-backups` bucket; fields AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY) as the in-cluster Secret read by the upload container
# of the MariaDB dump CronJob (backup-cronjob.yaml). The bucket policy is
# scoped `s3:*` on this bucket only (rustfs house onboarding).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: misp-mariadb-backups-secrets
  namespace: misp
spec:
  itemPath: "vaults/Secrets/items/misp-mariadb-backups-secrets"
