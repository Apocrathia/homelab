---
# Materializes the 1Password item `vaults/Secrets/items/prism-secrets`
# (fields: `api-key` = the PRISM API key; `llm-api-key` = LiteLLM virtual key)
# as the in-cluster Secret the deployment reads via secretKeyRef
# (helmrelease.yaml). The API key value serves both API_KEYS and
# PRISM_UI_API_KEY: the UI key is a member of the accepted key set by design,
# and the backend injects it into the browser at page load.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: prism-secrets
  namespace: prism
spec:
  itemPath: "vaults/Secrets/items/prism-secrets"
