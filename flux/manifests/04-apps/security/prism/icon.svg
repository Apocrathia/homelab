<!-- Transparent background (no opaque tile) so the launchpad card shows
     through, like every other fleet icon. Root dims of 256x256: small
     intrinsic px sizes render at face value in the launchpad grid
     (position:absolute + object-fit:contain resolves width:auto to the
     intrinsic size — the old width="32" height="32" rendered at 32px in the
     ~87px tile); 256px sits above every dashboard slot so the launchpad
     scales down to fill. Eye glyph scaled 1.167x around center to fill the
     canvas (previously 24x16 of 32, floating small inside the old dark tile). -->
<svg width="256" height="256" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(-2.6667 -2.6667) scale(1.1667)">
  <path d="M4 16C4 16 9 8 16 8C23 8 28 16 28 16C28 16 23 24 16 24C9 24 4 16 4 16Z" stroke="url(#fg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="5" stroke="url(#fg)" stroke-width="1.4"/>
  <circle cx="16" cy="16" r="2.5" stroke="url(#fg)" stroke-width="0.8" opacity="0.6"/>
  <circle cx="16" cy="16" r="1.3" fill="url(#fg)"/>
  <line x1="16" y1="11" x2="16" y2="13" stroke="url(#fg)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="16" y2="21" stroke="url(#fg)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="16" x2="13" y2="16" stroke="url(#fg)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19" y1="16" x2="21" y2="16" stroke="url(#fg)" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <defs>
    <linearGradient id="fg" x1="4" y1="8" x2="28" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#7c5cfc"/>
    </linearGradient>
  </defs>
</svg>
