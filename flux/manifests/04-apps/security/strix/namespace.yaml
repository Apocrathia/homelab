---
apiVersion: v1
kind: Namespace
metadata:
  name: strix
  labels:
    app.kubernetes.io/name: strix
    app.kubernetes.io/component: ai-pentesting
    app.kubernetes.io/part-of: security
    # The strix platform image lives on docker.io; Kyverno clones the
    # docker.io pull secret into namespaces with this label. (The sandbox
    # daemon image is on quay.io, no pull secret needed.)
    images/dockerhub: "true"
