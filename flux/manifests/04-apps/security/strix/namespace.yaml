---
apiVersion: v1
kind: Namespace
metadata:
  name: strix
  labels:
    app.kubernetes.io/name: strix
    app.kubernetes.io/component: ai-pentesting
    app.kubernetes.io/part-of: security
    # docker.io images need the Kyverno-cloned pull secret (kept for future
    # use; the current images pull from quay.io/public.ecr.aws, and podman
    # fetches the ghcr.io sandbox itself).
    images/dockerhub: "true"
    # Opt-in to the shared kopiur repository (ClusterRepository/nas-rustfs
    # selects consumer namespaces by this label and evaluates it at
    # admission — without it the chart-rendered SnapshotPolicy is rejected,
    # which is why only the schedule existed on-cluster)
    backup.apocrathia.com/repo: nas-rustfs
    # The rootless podman sandbox daemon (podman.yaml) needs seccomp
    # Unconfined plus SETUID/SETGID in its bounding set for the nested user
    # namespace containerd's RuntimeDefault profile blocks — both beyond the
    # cluster-default PSA baseline, so the namespace enforces privileged
    # (pentagi dind / speedtest / kagent pattern; this also retroactively
    # unblocks the pod, which PSA baseline had rejected since the first
    # deploy). The app pod itself stays unprivileged: uid 1000, caps
    # dropped, RuntimeDefault.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
