---
# strix-dockerd listens on plain-HTTP 2375 (no TLS without client certs
# mounted): restrict ingress to the strix app pod only. Docker-API access is
# root-equivalent on the daemon pod, so nothing else in the cluster may
# reach it. Egress stays open — the sandbox containers scan arbitrary
# authorized targets and pull the sandbox image from ghcr.io.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: strix-dockerd-ingress
  namespace: strix
  labels:
    app.kubernetes.io/name: strix
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: security
    app.kubernetes.io/managed-by: flux
spec:
  endpointSelector:
    matchLabels:
      app: strix-dockerd
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: strix
            io.kubernetes.pod.namespace: strix
      toPorts:
        - ports:
            - port: "2375"
              protocol: TCP
