---
# OpenCanary triage -> OpenTAXII STIX push: the canary lane of
# docs/issues/opentaxii-feed-sources.md. Every 15 min, query Loki for
# attacker alerts (logtype >= 2000) from the last 20 min, build one STIX 2.1
# indicator per alert, and POST it to the public-write stix-feed collection;
# OpenCTI's taxii2 connector polls that collection hourly, so an alert lands
# in OpenCTI within one polling cycle (the issue's canary-lane acceptance).
# Stateless and idempotent by design: no PVC, no secrets (the push is
# anonymous - the collection has is_public_write), and re-POSTed alerts are
# storage no-ops because indicator ids are deterministic uuid5 derivations
# that OpenTAXII treats as already-stored versions. Mechanism and inline
# citations in stix_push.py.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opencanary-stix-push
  namespace: opencanary
spec:
  # 15 min cadence with a 20 min Loki lookback: the 5 min overlap makes every
  # alert visible to at least one run even when a run is skipped (Forbid) or
  # fails, and the overlap re-POSTs are server-side no-ops (deterministic
  # STIX ids). 15 min push + 60 min connector poll = worst case ~75 min from
  # alert to OpenCTI.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          # The pusher only talks to the Loki read Service and the OpenTAXII
          # Service; no ServiceAccount, no API access.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: push
              # The push script (source: stix_push.py) is mounted at /app from
              # the opencanary-stix-push-script ConfigMap, generated by the
              # configMapGenerator in kustomization.yaml; as a raw .py file it
              # rides the repo's ruff pre-commit hooks (same image and layout
              # as the misp-event-prune CronJob: stdlib-only REST client, no
              # pip installs at runtime).
              # renovate: datasource=docker depName=docker.io/library/python
              image: docker.io/library/python:3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command: ["python", "/app/stix_push.py"]
              env:
                # Loki read path of the SimpleScalable deployment, anonymous
                # (auth_enabled: false) - the same endpoint the Grafana
                # datasource and the opencanary dashboard use.
                - name: LOKI_URL
                  value: http://loki-read.loki-system.svc.cluster.local:3100
                # OpenTAXII Service, direct-to-Service like the misp prune
                # cronjobs - no gateway hairpin, no TLS on the pod network.
                - name: TAXII_URL
                  value: http://opentaxii.opentaxii.svc.cluster.local:9000
                # Live-bootstrapped TAXII 2.1 ids (opentaxii README, "TAXII
                # 2.1 bootstrap"). The collection alias is NULL in the live
                # DB, so the UUID is the only anonymous-write address without
                # a one-time live mutation; stix-feed has public read +
                # public write, so the push needs no account and no secret.
                - name: TAXII_API_ROOT
                  value: "9d2329b4-6a06-4f01-9c94-a2c3e6d1a501"
                - name: TAXII_COLLECTION
                  value: "952c801c-e4c8-4316-a565-5f97221e799f"
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                # The Loki response (<= 5000 alert lines) plus the indicators
                # built from it are held in-memory; 128Mi covers a flooded
                # window with margin. Steady-state runs are tiny - the
                # honeypot sees near-zero attacker traffic.
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: opencanary-stix-push-script
