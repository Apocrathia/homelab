{
  "device.node_id": "opencanary",
  "ip.ignorelist": [],
  "http.enabled": true,
  "http.port": 8080,
  "http.banner": "Apache/2.2.22 (Ubuntu)",
  "http.skin": "nasLogin",
  "ssh.enabled": true,
  "ssh.port": 2222,
  "ssh.version": "SSH-2.0-OpenSSH_5.1p1 Debian-4",
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout"
        }
      }
    }
  }
}
