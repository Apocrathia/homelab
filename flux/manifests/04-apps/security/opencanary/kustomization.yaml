---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: opencanary
  namespace: opencanary
  labels:
    app.kubernetes.io/name: opencanary

resources:
  - namespace.yaml
  - helmrelease.yaml
  - stix-push-cronjob.yaml
  - grafana/

configMapGenerator:
  - name: opencanary-config
    namespace: opencanary
    files:
      - opencanary.conf
    options:
      disableNameSuffixHash: true
  # Raw .py file (not inline in the CronJob) so the repo's ruff/pre-commit
  # hooks format and lint the push script; mounted at /app by the
  # opencanary-stix-push CronJob.
  - name: opencanary-stix-push-script
    namespace: opencanary
    files:
      - stix_push.py
    options:
      disableNameSuffixHash: true
