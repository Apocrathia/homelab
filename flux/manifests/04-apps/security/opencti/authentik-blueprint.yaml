---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: opencti
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # OIDC Provider for OpenCTI (native OpenIDConnectStrategy, not proxy)
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "opencti-oidc-provider"
    attrs:
      name: "opencti-oidc-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
      sub_mode: "user_email"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://opencti.gateway.services.apocrathia.com/auth/oic/callback"
          matching_mode: "strict"
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      token_validity: "days=30"
      client_type: "confidential"
      # Pinned so helmrelease.yaml can name the client_id statically; only the
      # authentik-generated client secret is a post-merge copy (the litellm /
      # jupyterhub blueprints leave client_id server-generated instead).
      client_id: "opencti"

  # Application for OpenCTI (creates the "Security" dashboard category)
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "opencti"
    attrs:
      name: "OpenCTI"
      slug: "opencti"
      group: "Security"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "opencti-oidc-provider"]]
      meta_launch_url: "https://opencti.gateway.services.apocrathia.com/"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/security/opencti/icon.svg"
      meta_description: "Open Cyber Threat Intelligence platform - threat-intel knowledge graph"
      meta_publisher: "Filigran"

  # Admins group binding (app access)
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "opencti"]]
      group: !Find [authentik_core.group, [name, "admins"]]
    attrs:
      order: 10
