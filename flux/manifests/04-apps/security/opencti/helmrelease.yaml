---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencti
  namespace: opencti
spec:
  interval: 30m
  chart:
    spec:
      chart: opencti
      # renovate: datasource=helm registryUrl=https://devops-ia.github.io/helm-opencti/ depName=opencti
      version: "3.0.22"
      sourceRef:
        kind: HelmRepository
        name: devops-ia
        namespace: flux-system
  values:
    fullnameOverride: opencti

    # Platform (opencti-server) settings.
    # Secret values come from the opencti-secrets 1Password item via envFromSecrets;
    # envFromSecrets entries take precedence over chart-default plaintext env.
    env:
      # Blank the chart-default ChangeMe so the chart's probe helper switches to the
      # exec form that reads the secret-sourced APP__HEALTH_ACCESS_KEY (admin token).
      APP__HEALTH_ACCESS_KEY: ""
      # Heap tuned down from the 8GB default (research doc 2.3: tune down for homelab).
      NODE_OPTIONS: "--max-old-space-size=4096"
      # OpenSearch subchart service is named <clusterName>-<nodeGroup>.
      # TLS is mandatory: the opensearch security plugin enforces it on the
      # REST layer. Allowing the demo SELF-SIGNED CERT for now (operator
      # decision 2026-10-12; a house internal CA is the future production
      # model, deferred). The platform's config path is
      # elasticsearch.ssl.reject_unauthorized, so the env needs the DOUBLE
      # underscore between SSL and REJECT - the single-underscore form maps
      # to a path the platform never reads (verified against the
      # 7.261008.0 engine source).
      ELASTICSEARCH__URL: "https://opensearch-cluster-master:9200"
      ELASTICSEARCH__SSL__REJECT_UNAUTHORIZED: "false"
      RABBITMQ__HOSTNAME: "opencti-rabbitmq"
      REDIS__HOSTNAME: "opencti-redis"
      # File storage: NAS rustfs bucket (slice 1), HTTP on the LAN segment.
      MINIO__ENDPOINT: "storage.services.apocrathia.com"
      MINIO__PORT: "9009"
      MINIO__USE_SSL: false
      MINIO__BUCKET_NAME: "opencti-files"
      # OIDC SSO via authentik (slice 5). Local strategy stays enabled
      # (chart default PROVIDERS__LOCAL__STRATEGY) as break-glass. OpenCTI 7.x
      # migrates PROVIDERS__* env into its own DB on first boot; after that
      # the DB provider is the source of truth and env edits are ignored.
      # Callback route /auth/oic/callback = OpenCTI's default provider
      # identifier (oic) for OpenIDConnectStrategy.
      PROVIDERS__OPENID__STRATEGY: "OpenIDConnectStrategy"
      PROVIDERS__OPENID__CONFIG__LABEL: "Login with Authentik"
      PROVIDERS__OPENID__CONFIG__ISSUER: "https://auth.gateway.services.apocrathia.com/application/o/opencti/"
      PROVIDERS__OPENID__CONFIG__CLIENT_ID: "opencti"
      PROVIDERS__OPENID__CONFIG__REDIRECT_URIS: '["https://opencti.gateway.services.apocrathia.com/auth/oic/callback"]'
      # Groups mapping: authentik 'admins' group -> OpenCTI built-in
      # 'Administrators' group; claims read from the access token (authentik
      # emits the groups claim via the profile scope mapping).
      # The published 3.0.19 chart renders the server's exec health probe
      # harsh (failureThreshold 3 / period 10s / timeout 1s = a 30s kill
      # window with no startup gate). The platform's boot-to-health now
      # takes longer than that at the current graph size (32k+ entities),
      # so liveness killed it mid-boot (exit 137 ratchet, 4 restarts in
      # 31m, 2026-10-19). The Custom probe objects take precedence over
      # the chart render: a 200s startup gate + a 90s runtime tolerance.
      # Same exec form as the chart default - the health key never lands
      # in the pod spec.
      livenessProbeCustom:
        exec:
          command:
            - node
            - -e
            - require('http').get({host:'127.0.0.1',port:4000,path:'/health?health_access_key='+process.env.APP__HEALTH_ACCESS_KEY},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
        failureThreshold: 6
        periodSeconds: 15
        successThreshold: 1
        timeoutSeconds: 10
      readinessProbeCustom:
        exec:
          command:
            - node
            - -e
            - require('http').get({host:'127.0.0.1',port:4000,path:'/health?health_access_key='+process.env.APP__HEALTH_ACCESS_KEY},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
        failureThreshold: 6
        periodSeconds: 15
        successThreshold: 1
        timeoutSeconds: 10
      startupProbeCustom:
        exec:
          command:
            - node
            - -e
            - require('http').get({host:'127.0.0.1',port:4000,path:'/health?health_access_key='+process.env.APP__HEALTH_ACCESS_KEY},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
        failureThreshold: 20
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 10

      PROVIDERS__OPENID__CONFIG__GROUPS_MANAGEMENT__GROUPS_SCOPE: "groups"
      PROVIDERS__OPENID__CONFIG__GROUPS_MANAGEMENT__GROUPS_PATH: '["groups"]'
      PROVIDERS__OPENID__CONFIG__GROUPS_MANAGEMENT__GROUPS_MAPPING: '["admins:Administrators"]'

    envFromSecrets:
      # Enterprise Edition license (PEM): the platform reads conf key
      # app:enterprise_edition_license from this env (APP__ prefix mapping).
      # Config-path license takes precedence over a UI-pasted
      # (DB-stored) one, so the vault stays the source of truth;
      # rotation = vault edit + item sync + pod recreate.
      APP__ENTERPRISE_EDITION_LICENSE:
        name: opencti-secrets
        key: APP__ENTERPRISE_EDITION_LICENSE
      APP__ADMIN__EMAIL:
        name: opencti-secrets
        key: APP__ADMIN__EMAIL
      APP__ADMIN__PASSWORD:
        name: opencti-secrets
        key: APP__ADMIN__PASSWORD
      APP__ADMIN__TOKEN:
        name: opencti-secrets
        key: APP__ADMIN__TOKEN
      # The 1Password item has no dedicated health key field; gate /health with the
      # admin token value. Upstream rejects an empty/ChangeMe key with 401.
      APP__HEALTH_ACCESS_KEY:
        name: opencti-secrets
        key: APP__ADMIN__TOKEN
      APP__ENCRYPTION_KEY:
        name: opencti-secrets
        key: APP__ENCRYPTION_KEY
      ELASTICSEARCH__USERNAME:
        name: opencti-secrets
        key: ELASTICSEARCH__USERNAME
      ELASTICSEARCH__PASSWORD:
        name: opencti-secrets
        key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      RABBITMQ__USERNAME:
        name: opencti-secrets
        key: RABBITMQ__USERNAME
      RABBITMQ__PASSWORD:
        name: opencti-secrets
        key: RABBITMQ__PASSWORD
      REDIS__PASSWORD:
        name: opencti-secrets
        key: REDIS__PASSWORD
      MINIO__ACCESS_KEY:
        name: opencti-secrets
        key: MINIO__ACCESS_KEY
      MINIO__SECRET_KEY:
        name: opencti-secrets
        key: MINIO__SECRET_KEY
      # Authentik generates this when the tofu workspace creates the OIDC
      # provider; it is copied into the 1Password item post-merge (README).
      PROVIDERS__OPENID__CONFIG__CLIENT_SECRET:
        name: opencti-secrets
        key: OIDC_CLIENT_SECRET

    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "5Gi"

    # Worker talks to the platform via OPENCTI_URL (auto-built) + OPENCTI_TOKEN.
    # The chart only derives OPENCTI_TOKEN from plaintext values, so wire the
    # vault field explicitly here.
    worker:
      envFromSecrets:
        OPENCTI_TOKEN:
          name: opencti-secrets
          key: APP__ADMIN__TOKEN
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

    # MISP -> OpenCTI external-import connector (slice 6): the official
    # Filigran-verified connector (OpenCTI-Platform/connectors
    # external-import/misp) as its own Deployment. The chart auto-wires
    # OPENCTI_URL to the in-cluster platform service; everything else is
    # env-only per the connector docs. Defaults not pinned here (verified
    # against the connector source settings.py): CONNECTOR_ID has a built-in
    # UUID, reports/indicators/observables creation defaults true, connector
    # type/scope default EXTERNAL_IMPORT/misp.
    connectors:
      - name: misp
        enabled: true
        replicas: 1
        image:
          # Chart default builds opencti/<name>, which does not exist on
          # Docker Hub; Filigran publishes connectors as
          # opencti/connector-<name>. Tag rides the chart appVersion
          # (connector images publish the same date-based tags as the
          # platform, e.g. 7.261008.0).
          repository: opencti/connector-misp
        env:
          MISP_URL: https://misp.gateway.services.apocrathia.com
          # Public Let's Encrypt wildcard terminates the gateway listener
          # (gateway-cert.yaml), so chain verification works from any image.
          MISP_SSL_VERIFY: true
          # PT5M is also the connector default; pinned because the slice
          # acceptance is worded on the poll interval.
          CONNECTOR_DURATION_PERIOD: PT5M
          # Default log level is error; info keeps the import runs visible.
          CONNECTOR_LOG_LEVEL: info
          # Acceptance-critical outputs; defaults true, pinned explicitly.
          MISP_CREATE_REPORTS: true
          MISP_CREATE_INDICATORS: true
          MISP_CREATE_OBSERVABLES: true
          # MISP `timestamp` is the source event's last-modified, NOT the local
          # creation time: the CIRCL archive import bulk-touched events to
          # 2026-10-16 00:59:xx and feed-imported events (abuse.ch backfill)
          # carry historical timestamps, so a live timestamp cursor strands
          # them below the watermark. import_from_date is the initial cursor
          # when the connector state resets — the documented re-import
          # mechanism for the 2026-10 backlog strand (see README).
          MISP_IMPORT_FROM_DATE: "2000-01-01T00:00:00Z"
        envFromSecrets:
          # Same platform-token vault ref as the worker: the chart only
          # auto-derives OPENCTI_TOKEN from plaintext values.
          OPENCTI_TOKEN:
            name: opencti-secrets
            key: APP__ADMIN__TOKEN
          # MISP auth key (read permission); vault item created by the
          # operator post-merge — see secret.yaml and the README slice-6
          # steps for the intended wait-on-Secret ordering.
          # Consolidated into the opencti-secrets item (field `misp-key`,
          # kebab per the tenzir-secrets style) — the envFromSecrets
          # indirection maps it to the connector's MISP_KEY env name.
          MISP_KEY:
            name: opencti-secrets
            key: misp-key
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        # Bumped from 512Mi: the 2026-10-18 epoch sweep (post state reset,
        # MISP_IMPORT_FROM_DATE) OOMKilled the connector ~88x in a ratchet
        # (exit 137); the batch processor holds tens of thousands of objects
        # per in-flight window (observed 21.6k remaining_objects_count).
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      - name: mitre
        enabled: true
        replicas: 1
        image:
          # Same repo-override reason as the MISP connector: Filigran
          # publishes connectors as opencti/connector-<name>; the tag rides
          # the chart appVersion.
          repository: opencti/connector-mitre
        env:
          # Default log level is error; info keeps the seed/import runs
          # visible. Everything else trusts connector defaults (verified
          # against the connector source): MITRE_INTERVAL=7 days, bundle
          # URLs = mitre-attack/attack-stix-data (enterprise/mobile/ics) +
          # mitre/cti CAPEC, CONNECTOR_ID ships a built-in UUID.
          CONNECTOR_LOG_LEVEL: info
        envFromSecrets:
          # Same platform-token vault ref as the worker and MISP connector:
          # the chart only auto-derives OPENCTI_TOKEN from plaintext values.
          OPENCTI_TOKEN:
            name: opencti-secrets
            key: APP__ADMIN__TOKEN
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
      - name: taxii2
        enabled: true
        replicas: 1
        image:
          # Same repo-override reason as the MISP connector: Filigran
          # publishes connectors as opencti/connector-<name>; the tag rides
          # the chart appVersion.
          repository: opencti/connector-taxii2
        env:
          # OpenTAXII staging hub via its in-cluster ClusterIP service -
          # TAXII 2.1 discovery endpoint. Collections default *.* polls
          # every api root/collection, here the single Default root /
          # stix-feed collection, so no TAXII2_COLLECTIONS env is needed.
          # Everything else trusts connector defaults (verified against
          # the connector source): PT60M poll period, TAXII2_V21=true
          # (matches OpenTAXII 0.10 TAXII 2.1), anonymous collection so
          # no auth vars. Default log level is error; info keeps the poll
          # runs visible.
          TAXII2_DISCOVERY_URL: http://opentaxii.opentaxii.svc.cluster.local:9000/taxii2/
          CONNECTOR_LOG_LEVEL: info
        envFromSecrets:
          # Same platform-token vault ref as the worker and MISP connector:
          # the chart only auto-derives OPENCTI_TOKEN from plaintext values.
          OPENCTI_TOKEN:
            name: opencti-secrets
            key: APP__ADMIN__TOKEN
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"

      - name: alienvault
        enabled: true
        replicas: 1
        image:
          # Filigran publishes as opencti/connector-<name>. Tag rides the
          # chart appVersion, same as the MISP/MITRE connectors: the image
          # publishes the platform's date-based tags (7.261008.0, 7.261016.0,
          # ... verified on Docker Hub — an early 1.0.0 pin read a truncated
          # tag list and was wrong). No tag/renovate anchor needed: the chart
          # version stays the single deliberate update knob.
          repository: opencti/connector-alienvault
        env:
          # Default PT30M. Info keeps the import runs visible.
          CONNECTOR_LOG_LEVEL: info
          # Default 2020-05-01 imports a massive historical pulse backlog
          # (upstream README warns about it); pinned ~6 weeks back for a
          # recent-intel feed. Move the date to re-scope.
          ALIENVAULT_PULSE_START_TIMESTAMP: "2026-09-01T00:00:00Z"
        envFromSecrets:
          # Consolidated kebab field per the opencti-secrets style;
          # envFromSecrets maps it onto the connector's ALIENVAULT_API_KEY.
          ALIENVAULT_API_KEY:
            name: opencti-secrets
            key: otx-api-key
          OPENCTI_TOKEN:
            name: opencti-secrets
            key: APP__ADMIN__TOKEN
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"

    # Single-node OpenSearch on Longhorn. vm.max_map_count is set at the
    # NODE level via talos/patches/unified-patch.yaml SysctlConfig - the
    # chart's privileged sysctl initContainer is disabled (it violates
    # baseline PodSecurity admission in app namespaces; operator steer
    # 2026-10-12: no namespace-wide relaxation, node-level is the proper
    # sysctl home).
    opensearch:
      opensearchJavaOpts: "-Xms3g -Xmx3g"
      # Chart 2.18+/OpenSearch 2.12+ requires the initial admin password
      # explicitly - the cluster refuses to boot without it (the pod sat
      # in CrashLoopBackOff on 'No custom admin password found' until
      # this landed). Single-item pattern: the field lives in the
      # opencti-secrets vault item.
      extraEnvs:
        - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opencti-secrets
              key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      sysctlInit:
        enabled: false
      persistence:
        enabled: true
        storageClass: longhorn
        size: 30Gi
      resources:
        requests:
          cpu: "1"
          memory: "3.5Gi"
        limits:
          cpu: "2"
          memory: "4.5Gi"

    # RabbitMQ per research doc 2.3: 512MB max message, 24h consumer timeout.
    # Password from the vault; erlang cookie left empty so bitnami generates a
    # random one into the managed secret (instead of shipping ChangeMe).
    rabbitmq:
      auth:
        existingPasswordSecret: opencti-secrets
        existingSecretPasswordKey: RABBITMQ__PASSWORD
        erlangCookie: ""
      extraConfiguration: |-
        max_message_size = 536870912
        consumer_timeout = 86400000
      persistence:
        enabled: true
        storageClass: longhorn
        size: 8Gi

    # Dragonfly (redis-compatible). Password from the vault. cache_mode dropped
    # (chart default --cache_mode=true): LRU eviction would silently drop
    # OpenCTI stream/task state; rely on REDIS__TRIMMING + memory limit instead.
    redis:
      extraArgs: []
      passwordFromSecret:
        enable: true
        existingSecret:
          name: opencti-secrets
          key: REDIS__PASSWORD
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

    # File storage is the NAS rustfs instance; no in-cluster S3 subchart.
    rustfs:
      enabled: false
