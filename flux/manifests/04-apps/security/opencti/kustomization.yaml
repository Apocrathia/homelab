---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: opencti
  namespace: opencti
resources:
  - namespace.yaml
  - secret.yaml
  - helmrelease.yaml
  - httproute.yaml
  - backup.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-opencti
    namespace: opencti
    files:
      - opencti.yaml=authentik-blueprint.yaml

labels:
  - includeSelectors: true
    pairs:
      authentik_blueprint: "true"
