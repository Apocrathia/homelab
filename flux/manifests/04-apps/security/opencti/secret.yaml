---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: opencti-secrets
  namespace: opencti
spec:
  itemPath: "vaults/Secrets/items/opencti-secrets"

---
# Materializes the 1Password item `vaults/Secrets/items/opencti-misp-connector`
# (one field, `MISP_KEY` = the MISP auth key) as the in-cluster Secret the
# MISP external-import connector reads via envFromSecrets (helmrelease.yaml).
# The item is created POST-MERGE by the operator: a running MISP mints the
# auth key (MISP UI -> My Profile -> Auth Keys), and it is copied into the
# vault item (README slice-6 steps / issue checklist). Until the item exists
# this OnePasswordItem stays un-synced and the connector pod waits on the
# missing Secret — the same intended step-0 ordering as the OIDC client
# secret (slice 5).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: opencti-misp-connector
  namespace: opencti
spec:
  itemPath: "vaults/Secrets/items/opencti-misp-connector"
