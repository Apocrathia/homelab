---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-introspection
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Sibling parity: the fresh node boots an empty partition catalog,
    # so the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-introspection + entry
    # introspection would double to
    # tenzir-node-introspection-introspection. The override pins fullname
    # at tenzir-node so the entry renders tenzir-node-introspection (pod,
    # Service; verified by helm template against chart 0.1.0).
    fullnameOverride: tenzir-node
    # No Kubernetes API access from the node: its entire surface is
    # user-space I/O (OTLP/UDP/HTTP ingest, outbound dials to
    # ClickHouse/Loki/Mimir/the pull sources, the platform WebSocket),
    # so the ServiceAccount token stays unmounted (the chart's
    # serviceAccount.automount knob; the kyverno
    # audit-automount-sa-token policy rows this workload).
    serviceAccount:
      automount: false
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.20.1

    # Startup gate for multi-minute partition-catalog loads (chart-native
    # since tenzir-node 0.2.0): 10s x 60 = 10-minute boot budget, matching
    # the install/upgrade timeouts above.
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60

    # Registers into the same hosted Tenzir Platform workspace as the
    # sibling nodes; this node reads its own pre-provisioned token from
    # the introspection-node-token field of the tenzir-secrets Secret (vault
    # field added by the operator; the platform node is already
    # registered — workspace t-vrj4igpf). Platform tokens are per-node,
    # never shared.
    #
    # No ingest surface: no extraPorts — the chart-rendered main
    # Service on :5158 carries node RPC only; all work is outbound
    # (platform WebSocket, plus this node's own lane pair dialing
    # loki-write and the Mimir gateway). Since the B1 lap every node
    # ships its own diagnostics pair through its node config (the two
    # pipelines below cover this node), and the central poller
    # Deployment is retired.
    nodes:
      - name: introspection
        token:
          existingSecret: tenzir-secrets
          key: introspection-node-token

    # Stateless: the introspection node imports nothing, runs no
    # archive rule — its only pipelines are diagnostics-to-loki and
    # error-diagnostics-to-mimir. No lake. No PVC.
    persistence:
      # enabled false is load-bearing: the chart defaults to a 10Gi PVC
      # when the key is absent, and that default is what the
      # vct-immutable upgrade failures were. False renders the state
      # volume as an emptyDir; platform registration rides the
      # 1Password token at boot.
      enabled: false

    # Node configuration (renders to the tenzir-node-introspection-config
    # ConfigMap and rolls the pod on change). Nothing secret may live
    # here: values land in a ConfigMap in plaintext.
    tenzir:
      config:
        tenzir:
          # Server-log verbosity, same warning level as the siblings:
          # the chart default (tenzir.file-verbosity: quiet) writes
          # nothing to server.log, so pipeline failures that point at the
          # log for their diagnostics would surface blind. server.log
          # opens at /var/log/tenzir on every boot, which
          # readOnlyRootFilesystem makes unwritable — the tenzir-logs
          # emptyDir (extraVolumes below) backs the path; keep the
          # key/mount pair together on any new node.
          file-verbosity: warning
          # Pipeline definitions live in pipelines/<id>.tql; this
          # kustomization's replacements stitch them back into these
          # empty definition fields at build time.
          pipelines:
            diagnostics-to-loki:
              name: diagnostics to loki
              description: |
                Ships every live, not-hidden pipeline diagnostic to Loki as
                job=tenzir-diagnostics entries (node label =
                introspection) — the sibling lanes' exact shape, covering
                this node's own two pipelines. to_fluent_bit resolves
                $pipeline_name and $severity
                per event and consumes both out of the shipped body
                (live-verified 2026-10-17 probe); drop discards the ANSI
                escape-coded rendered field, so the line keeps the rest of
                the diagnostic record — pipeline_id, hidden, run,
                timestamp, message, notes, annotations — and the labels
                carry pipeline + severity. Hidden entries (platform-UI
                pipeline deprecation noise) stay out. Plain HTTP to
                loki-write, cluster-internal. live=true without retro: no
                store-backlog replay on start, so restarts never re-ship
                history (Loki has no dedup) — since B1 every node ships
                its own pair; this one covers this node's pipelines.
              definition: ""
              restart-on-error: 1 minute
            error-diagnostics-to-mimir:
              name: error diagnostics to mimir
              description: |
                Pushes a tenzir_pipeline_errors / tenzir_pipeline_warnings
                sample (value 1, pipeline labels, node label =
                introspection) to Mimir for every live error / warning
                diagnostic, so the dashboard can count both severities
                with sum_over_time. They otherwise live only in the
                diagnostics stream, not in metrics. Sibling lanes' exact
                shape, byte-identical to every node's pair modulo the
                node label (all seven pairs since B1).
              definition: ""
              restart-on-error: 1 minute

    # Sized with the docs' size-a-node formula at introspection volume
    # (near zero): no sources, no destinations beyond the two thin ship
    # lanes — the formula's max(2, ·) floor pins 2 cores and the 2 GB RAM
    # floor (investigations/enrichment parity at near-zero volume).
    # Requests stay small: limits are caps, not reservations.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    extraVolumes:
      # Writable target for the node's own file logger (file-verbosity
      # above): server.log opens at /var/log/tenzir on every boot, which
      # readOnlyRootFilesystem makes unwritable — the 2026-10-17
      # crashloop on the warning-level siblings. emptyDir, same
      # lifecycle as the tmp mount; the 10 MiB rotation cap bounds the
      # disk cost.
      - name: tenzir-logs
        emptyDir: {}

    extraVolumeMounts:
      # The file logger's home (tenzir-logs volume above).
      - name: tenzir-logs
        mountPath: /var/log/tenzir
