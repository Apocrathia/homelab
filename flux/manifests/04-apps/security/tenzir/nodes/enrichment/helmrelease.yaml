---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-enrichment
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Sibling parity: the fresh node boots an empty partition catalog,
    # so the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-enrichment + entry enrichment
    # would double to tenzir-node-enrichment-enrichment. The override pins
    # fullname at tenzir-node so the entry renders
    # tenzir-node-enrichment (pod, Service; verified by helm template
    # against chart 0.1.0).
    fullnameOverride: tenzir-node
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.20.0

    # Startup gate for multi-minute partition-catalog loads (chart-native
    # since tenzir-node 0.2.0): 10s x 60 = 10-minute boot budget, matching
    # the install/upgrade timeouts above.
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60

    # Registers into the same hosted Tenzir Platform workspace as the
    # sibling nodes; this node reads its own pre-provisioned token from
    # the enrichment-node-token field of the tenzir-secrets Secret (vault
    # field added by the operator; the platform node is already
    # registered). Platform tokens are per-node, never shared.
    #
    # Still no listeners: the node is a pure outbound puller — no
    # extraPorts (the chart-rendered main Service on :5158 carries node
    # RPC only), no web server (no certificate.yaml). Lap 2 (the
    # fleet-assets-pull factory pipeline) added the first
    # tenzir.pipelines entry plus the two secret env wirings below.
    nodes:
      - name: enrichment
        token:
          existingSecret: tenzir-secrets
          key: enrichment-node-token

    persistence:
      # 5Gi, investigations parity: lap 1 imports nothing, so the lake
      # stays empty and the PVC carries node state only (platform
      # registration, diagnostics). The lap-2+ factory pipelines pull
      # external data and write lookup tables to ClickHouse — the lake
      # stays a small transit buffer, not a query surface. Longhorn
      # grows on demand anyway.
      size: 5Gi

    # Node configuration (renders to the tenzir-node-enrichment-config
    # ConfigMap and rolls the pod on change). Nothing secret may live
    # here: values land in a ConfigMap in plaintext.
    tenzir:
      config:
        tenzir:
          # Server-log verbosity, same warning level as the siblings:
          # the chart default (tenzir.file-verbosity: quiet) writes
          # nothing to server.log, so future factory-pipeline failures
          # that point at the log for their diagnostics would surface
          # blind. server.log opens at /var/log/tenzir on every boot,
          # which readOnlyRootFilesystem makes unwritable — the
          # tenzir-logs emptyDir (extraVolumes below) backs the path;
          # keep the key/mount pair together on any new node.
          file-verbosity: warning
          # Catalog knobs, sibling shape: dormant on an empty lake, but
          # kept so future import lanes inherit the OOM lessons
          # (lazy-sketches defers Bloom-filter sketches to query time;
          # load-concurrency caps the boot synopsis loader at 4).
          index:
            lazy-sketches: true
            load-concurrency: 4
          # Pipeline definitions live in pipelines/<id>.tql; this
          # kustomization's replacements stitch them back into these
          # empty definition fields at build time.
          pipelines:
            fleet-assets-pull:
              name: fleet assets pull
              description: |
                Lap-2 factory pipeline: pulls the Fleet host inventory
                (GET /api/v1/fleet/hosts, no pagination params = full
                host list per Fleet's ListOptions per_page=0-means-
                unlimited) every 1h — the first run fires at pipeline
                start — with the fleetdm-token Bearer header, projects
                each host to a stable asset row (uuid identity,
                primary_ip, hostname, os, hardware, last_seen), and
                appends into ocsf.fleet_assets on the ClickHouse query
                store. Never-checked-in hosts (Fleet's Go zero-time
                seen_time, e.g. MDM-only placeholders) drop before the
                write — their timestamp would fall outside the
                DateTime64(9) range. to_clickhouse mode="append" fails
                loudly while the CHI startup-script DDL is missing (the
                second net for the Keeper first-boot race); the
                enrichment node is the SINGLE WRITER of that table (the
                core node only reads it via its own
                fleet-assets-loader). The pull pipeline writes nothing
                to this node's lake — ClickHouse is the only sink.
              definition: ""
              restart-on-error: 1 minute
            error-diagnostics-to-mimir:
              name: error diagnostics to mimir
              description: |
                Pushes a tenzir_pipeline_errors / tenzir_pipeline_warnings
                sample (value 1, pipeline labels, node label = enrichment) to Mimir
                for every live error / warning diagnostic, so the dashboard can
                count both severities with sum_over_time. They otherwise live
                only in the diagnostics stream, not in metrics. The per-node B1 shape
                every node ships since the central poller's retirement; this
                node never had a native pair.
              definition: ""
              restart-on-error: 1 minute
            diagnostics-to-loki:
              name: diagnostics to loki
              description: |
                Ships every live, not-hidden pipeline diagnostic to Loki as
                job=tenzir-diagnostics entries (node label = enrichment) — the
                factory lane's own diagnostics (a failed Fleet pull or a failed
                ClickHouse write) become filterable log lines.
                to_fluent_bit resolves $pipeline_name and $severity per event
                and consumes both out of the shipped body (live-verified
                2026-10-17 probe); drop discards the ANSI escape-coded
                rendered field, so the line keeps the rest of the diagnostic
                record — pipeline_id, hidden, run, timestamp, message, notes,
                annotations — and the labels carry pipeline + severity. Hidden
                entries (platform-UI pipeline deprecation noise) stay out.
                Plain HTTP to loki-write, cluster-internal. live=true without
                retro: no store-backlog replay on start, so restarts never
                re-ship history (Loki has no dedup) — the per-node
                B1 shape every node ships since the central poller's
                retirement; this node never had a native pair (the poller
                shipped its diagnostics until now).
              definition: ""
              restart-on-error: 1 minute

    # Sized with the docs' size-a-node formula. Lap 2 re-sized it with
    # the factory pipeline live: one batch source (hourly from_http of a
    # 5-host inventory) and one ClickHouse destination is far below the
    # formula's max(2, ·) floor, so 2 cores / 2 Gi stand (the lap-1
    # zero-volume shape unchanged; the lake still stays empty — the
    # pull's only sink is ClickHouse). Requests stay small: limits are
    # caps, not reservations.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    # Secrets (1Password item tenzir-secrets; env
    # var names map to tenzir.secrets.* config keys, UPPER snake-case env
    # to kebab config key, same convention as the siblings):
    #   TENZIR_SECRETS__FLEETDM_TOKEN        -> secret("fleetdm-token")
    #     The FleetDM API bearer token (fleet-assets-pull's Authorization
    #     header). Operator action item: mint an API-only Fleet user
    #     token and stage it as the fleetdm-token field on the
    #     tenzir-secrets 1Password item — the field does NOT exist in
    #     the vault yet (verified read-only via op, field-label list
    #     only, 2026-10-19; neither fleet-token nor fleetdm-token was
    #     present); git only names the field, same lap-1 pattern as the
    #     node tokens.
    #   TENZIR_SECRETS__CLICKHOUSE_PASSWORD  -> secret("clickhouse-password")
    #     The `tenzir` ClickHouse writer user's password
    #     (fleet-assets-pull's to_clickhouse leg; user grants INSERT,
    #     SELECT ON ocsf.* in clickhouse/cluster.yaml).
    extraEnv:
      - name: TENZIR_SECRETS__FLEETDM_TOKEN
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: fleetdm-token
      - name: TENZIR_SECRETS__CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: clickhouse-password

    extraVolumes:
      # Writable target for the node's own file logger (file-verbosity
      # above): server.log opens at /var/log/tenzir on every boot, which
      # readOnlyRootFilesystem makes unwritable — the 2026-10-17
      # crashloop on the warning-level siblings. emptyDir, same
      # lifecycle as the tmp mount; the 10 MiB rotation cap bounds the
      # disk cost.
      - name: tenzir-logs
        emptyDir: {}

    extraVolumeMounts:
      # The file logger's home (tenzir-logs volume above).
      - name: tenzir-logs
        mountPath: /var/log/tenzir
