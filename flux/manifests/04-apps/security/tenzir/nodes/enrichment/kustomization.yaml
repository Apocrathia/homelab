---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-enrichment

# Lap 1 ships zero pipelines, so there is no stitch here yet: no
# configMapGenerator / replacements. The tenzir.pipelines map is absent
# from ../helmrelease.yaml on purpose (zero-pipeline validity is grounded
# in the HelmRelease comments). Lap 2 adds the first factory pipeline:
# a pipelines/<id>.tql file, a pipelines entry in the HelmRelease, a
# configMapGenerator entry here, and the matching replacements rule —
# the same stitch shape as the sibling node kustomizations.
resources:
  - helmrelease.yaml
