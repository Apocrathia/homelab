---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-enrichment

resources:
  - helmrelease.yaml

# TQL definitions live as .tql files under pipelines/ (one per
# pipeline); the generator below packages them and the replacements
# stitch them into the HelmRelease at build time — the sibling node
# kustomization shape, grown here in lap 2 with the first factory
# pipeline.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-enrichment-pipelines
    namespace: tenzir
    files:
      - fleet-assets-pull.tql=pipelines/fleet-assets-pull.tql
      - error-diagnostics-to-mimir.tql=pipelines/error-diagnostics-to-mimir.tql
      - diagnostics-to-loki.tql=pipelines/diagnostics-to-loki.tql

replacements:
  - source:
      kind: ConfigMap
      name: tenzir-enrichment-pipelines
      fieldPath: data.[fleet-assets-pull.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-enrichment
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.fleet-assets-pull.definition
  - source:
      kind: ConfigMap
      name: tenzir-enrichment-pipelines
      fieldPath: data.[error-diagnostics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-enrichment
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.error-diagnostics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-enrichment-pipelines
      fieldPath: data.[diagnostics-to-loki.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-enrichment
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.diagnostics-to-loki.definition
