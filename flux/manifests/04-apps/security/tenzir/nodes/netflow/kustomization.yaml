---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-netflow

resources:
  - helmrelease.yaml
  - service-ingest.yaml

# TQL definitions live as .tql files under pipelines/ (one per
# pipeline); the generator below packages them and the replacements
# stitch them into the HelmRelease at build time. The ocsf-archive.tql
# compaction-rule entry and the storage.yaml lake-PVC exclusion died
# with the lake (the direct legs are the only write path).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-netflow-pipelines
    namespace: tenzir
    files:
      - netflow-ingest.tql=pipelines/netflow-ingest.tql
      - geo-open-loader.tql=pipelines/geo-open-loader.tql
      - opencti-osint-loader.tql=pipelines/opencti-osint-loader.tql
      - pipeline-metrics-to-mimir.tql=pipelines/pipeline-metrics-to-mimir.tql
      - error-diagnostics-to-mimir.tql=pipelines/error-diagnostics-to-mimir.tql
      - diagnostics-to-loki.tql=pipelines/diagnostics-to-loki.tql
      - netflow-attest-verify.tql=pipelines/netflow-attest-verify.tql

replacements:
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[netflow-ingest.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.netflow-ingest.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[geo-open-loader.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.geo-open-loader.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[opencti-osint-loader.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.opencti-osint-loader.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[pipeline-metrics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.pipeline-metrics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[error-diagnostics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.error-diagnostics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[diagnostics-to-loki.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.diagnostics-to-loki.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[netflow-attest-verify.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.netflow-attest-verify.definition
