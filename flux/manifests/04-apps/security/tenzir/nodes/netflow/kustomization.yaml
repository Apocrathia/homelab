---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-netflow

resources:
  - helmrelease.yaml
  - service-ingest.yaml
  - storage.yaml

# TQL definitions live as .tql files under pipelines/ (one per
# pipeline, plus ocsf-archive.tql for the compaction rule where
# present); the generator below packages them and the replacements
# stitch them into the HelmRelease at build time.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-netflow-pipelines
    namespace: tenzir
    files:
      - netflow-ingest.tql=pipelines/netflow-ingest.tql
      - geo-open-loader.tql=pipelines/geo-open-loader.tql
      - pipeline-metrics-to-mimir.tql=pipelines/pipeline-metrics-to-mimir.tql
      - ocsf-archive.tql=pipelines/ocsf-archive.tql

replacements:
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[netflow-ingest.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.netflow-ingest.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[geo-open-loader.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.geo-open-loader.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[pipeline-metrics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.pipeline-metrics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-netflow-pipelines
      fieldPath: data.[ocsf-archive.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-netflow
        fieldPaths:
          - spec.values.tenzir.config.plugins.compaction.time.rules.0.pipeline
