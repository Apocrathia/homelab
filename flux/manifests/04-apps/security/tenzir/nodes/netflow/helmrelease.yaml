---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-netflow
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Sibling parity: the fresh netflow node boots an empty partition
    # catalog, so the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  # Startup gate, grafted after render: tenzir-node 0.1.0 ships no
  # startupProbe hook (a values key renders nothing — verified against the
  # extracted chart), so the liveness probe alone owns boot and kills the
  # pod at 120s (initialDelay 30 + 3x30) against the multi-minute
  # partition-catalog load before :5158 accepts. The kustomize postRenderer
  # grafts a startupProbe onto the rendered StatefulSet instead: kubelet
  # holds readiness/liveness gated until it passes, trading the 120s kill
  # for a 10-minute boot budget (10s period x 60 failures) that matches
  # the 10m install/upgrade timeouts above. When upstream ships a
  # startupProbe values hook, this patch deletes and the block moves to
  # values.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: tenzir-node-netflow
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: tenzir-node-netflow
              spec:
                template:
                  spec:
                    containers:
                      - name: tenzir-node
                        startupProbe:
                          tcpSocket:
                            port: node
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 60
  values:
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-netflow + entry netflow would
    # double to tenzir-node-netflow-netflow. The override pins fullname
    # at tenzir-node so the entry renders tenzir-node-netflow.
    fullnameOverride: tenzir-node
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.19.1

    # Registers into the same hosted Tenzir Platform workspace as the core
    # and tetragon nodes; this node reads its own pre-provisioned token from
    # the netflow-node-token field of the tenzir-secrets Secret. Platform tokens
    # are per-node, never shared.
    nodes:
      - name: netflow
        token:
          existingSecret: tenzir-secrets
          key: netflow-node-token
        # The collector listener: UniFi exporters send NetFlow v5/v9/IPFIX
        # datagrams here via the tenzir-ingest-lb pool IP (10.100.1.96).
        extraPorts:
          - name: netflow
            containerPort: 2055
            protocol: UDP

    persistence:
      # 20Gi stays a cap, not a capacity plan: netflow measures ~0.15 GB/day
      # raw (~15% of the core node's ~1 GB/day), so the 15-minute window is
      # ~150 KB on disk — the PVC buys headroom for archive-rule failure
      # windows and the day the UniFi vendor renderer fix lands and real
      # exporter traffic shows up. Longhorn volumes grow on demand; a smaller
      # request buys nothing (both siblings' exact argument).
      size: 20Gi

    # Node configuration (renders to the tenzir-node-netflow-config ConfigMap
    # and rolls the pod on change). Nothing secret may live here: values land
    # in a ConfigMap in plaintext. Secrets arrive via extraEnv below.
    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Server-log verbosity, same warning level as core and tetragon:
          # the chart default (tenzir.file-verbosity: quiet) writes
          # nothing to server.log, so pipeline failures that point at
          # the log for their diagnostics surface blind. server.log
          # opens at /var/log/tenzir on every boot, which
          # readOnlyRootFilesystem makes unwritable — the tenzir-logs
          # emptyDir (extraVolumes below) backs the path; keep the
          # key/mount pair together on any new node.
          file-verbosity: warning
          # Partition mint-rate control, same 60s as the siblings: this node
          # runs a low-volume collector, and 60s caps the partition count the
          # 15-minute window mints; the async background merge consolidates
          # undersized partitions. max-partition-size stays at its 4Mi
          # default.
          active-partition-timeout: 60s
          # Catalog knobs, sibling shape (recipe step 6): on a ~150 KB lake
          # lazy-sketches and load-concurrency 4 are harmless consistency
          # with core and tetragon, not load-driven tuning. max-partition-
          # size stays default.
          index:
            lazy-sketches: true
            load-concurrency: 4
          start:
            # Corridor matched to the compaction space budgets below,
            # identical math to the siblings (backstop only).
            disk-budget-high: 6GiB
            disk-budget-low: 4GiB
          # Node-resident enrichment state (contexts are per-node,
          # shared across this node's pipelines, and survive pipeline
          # restarts; creation arguments apply only at creation, so
          # this block never reconfigures an existing context — the
          # geo-open-loader pipeline is the refresh path). The geoip
          # context is created empty at boot and filled by context_load
          # of CIRCL's free Geo Open country+ASN MMDB (~80 MiB in node
          # memory); no GeoLite2/MaxMind route, so no license-key
          # secret rides this node (see geo-open-loader).
          contexts:
            geo-open:
              type: geoip
            # The osint lookup table is the consumer half of the intel
            # node's factory row: opencti-osint-loader applies the
            # ocsf.OSINT_Inventory_Info ClickHouse table into it via
            # tenzir::osint::update_context, entries expiring 30d after
            # their last application (the operator's max_age); declared
            # empty at boot, same pattern as geo-open. netflow-ingest's
            # tenzir::osint::enrich call reads it per flow record.
            ocsf-osint:
              type: lookup-table
            # Chain state for this node's record_integrity lane (the
            # archive rule's attest leg + the netflow-attest-verify
            # pipeline): one lookup-table entry (key = the node identity
            # constant tenzir-node-netflow) holding the per-node chain's
            # cross-pass tail — the previous archive pass's last record
            # uid, type_uid, and fingerprint, which the next pass's
            # first record links to as prev_event (the batch seam; the
            # intra-batch links ride the attest operator's internal lag
            # — probed: context reads run engine-batches ahead of the
            # writes at batch rate, so the context is the seam channel
            # only, never the intra-batch channel). Same shape as the
            # core node's detection-chains and the tetragon node's
            # tetragon-chains. The table is memory: a NODE restart
            # loses it, and the next pass's first record restarts the
            # chain with prev_event absent plus one WARNING diagnostic
            # from attest (the epoch marker; best-effort per node
            # lifetime — the verify lane's per-record fingerprint
            # recompute still catches post-hoc mutation across
            # restarts, only the linkage gap around a restart is lost,
            # documented in the datalake README).
            netflow-chains:
              type: lookup-table
          # Pipeline definitions live in pipelines/<id>.tql; this
          # kustomization's replacements stitch them back into these
          # empty definition fields at build time.
          pipelines:
            netflow-ingest:
              name: netflow ingest
              description: |
                NetFlow v5/v9/IPFIX from the UniFi exporters behind
                tenzir-ingest-lb (:2055/UDP). Flow records map to OCSF
                Network Activity (4001, Traffic) through the official
                `netflow` library package (vendored at packages/netflow/
                from github.com/tenzir/library); options records are
                dropped. This dedicated node owns the collector, moved off
                the core detection node: the pipeline stores into this
                node's lake and publishes onto its node-local `ocsf`
                topic, feeding this node's own archive rule — no sigma
                pass sees the flow stream (no homelab rule targets
                netflow fields). Enrichment runs after the OCSF map
                and before the store/publish legs, so lake, archive,
                and Grafana all see the enriched record: both
                endpoints gain geo country + ASN from the
                node-resident geo-open context (filled by
                geo-open-loader) and a reverse-DNS hostname from
                dns_lookup's TTL cache, mapped into OCSF fields
                (endpoint location.country, autonomous_system,
                hostname) rather than raw appends; matched OSINT
                indicators from the node-resident ocsf-osint context
                (filled by opencti-osint-loader) append to the record's
                osint field with a metadata.profiles "osint" stamp
                (tenzir::osint::enrich, the vendored operator — same
                enrich-before-store spot, so the archive rule's
                attestation covers the indicators); private addresses
                stay bare — Geo Open marks them not routed and the
                pipeline filters those markers. Start ordering
                matters: the collector must be up before v9/IPFIX
                template datagrams arrive.
              definition: ""
              restart-on-error: 1 minute
            geo-open-loader:
              name: geo open loader
              description: |
                Builder pipeline for the geo-open geoip context (declared
                in the contexts block above): fetches CIRCL's free Geo
                Open country+ASN MMDB and atomically replaces the
                context state — the two-pipeline builder/consumer shape
                from the vendored add-enrichment-contexts tutorial. Geo
                Open over GeoLite2 on purpose: MaxMind needs a license
                account plus out-of-band download plumbing (tar.gz
                extract, initContainer or CronJob) for city/coords this
                lab's flow triage does not need; Geo Open answers
                country + ASN in one MMDB fetched in-band, no license,
                no extra volume, no secret. The read_all binary=true /
                write_all data round trip is not redundant: from_http
                requires a parser, so read_all wraps the ~80 MiB
                download into one event and write_all unwraps it to the
                byte stream context_load consumes. context_load replaces
                the whole state, so a failed fetch never half-updates —
                the context keeps serving the last good database and
                restart-on-error retries in a minute. every 24h fires
                its first run at pipeline start (fresh node: context
                filled seconds after boot; until then the collector
                passes flows through unenriched with one warning, by
                design). CIRCL publishes a fresh snapshot daily, so 24h
                keeps lookups current without hammering the mirror.
              definition: ""
              restart-on-error: 1 minute
            opencti-osint-loader:
              name: opencti osint loader
              description: |
                Consumer half of the intel factory, the core node's
                opencti-osint-loader row verbatim: reads the intel
                node's ocsf.OSINT_Inventory_Info ClickHouse table into
                this node's ocsf-osint lookup-table context (declared
                in the contexts block) through the vendored library
                `tenzir` package's update_context operator. The
                factory appends the collection's current state on
                every walk, so the loader applies updates in
                event-time order — the indicator's STIX modified time,
                ORDER BY server-side: per key the newest version lands
                last, and a revoked row (status Removed; STIX
                versioning bumps modified on revoke) erases the key
                after older active copies re-applied it; expired
                indicators erase regardless of order. The read rides
                SQL-mode projection, not table mode (6.19.1 table mode
                does not reconstruct catch-alls at all, and 6.20 table
                mode re-types IP-shaped indicator values — the
                vendored operators pin string keys): the projection
                re-types the osint array back to record shape with
                values coerced to strings, and rows without a joinable
                indicator value (compound/yara patterns) drop before
                the update. The round trip rebuilds the event fields
                but not the schema name, so the pipeline stamps @name
                back — update_context gates on it. max_age=30d is the upstream default: entries
                unseen by a walk for 30d age out. every 24h fires at
                pipeline start (fresh node: context filled seconds
                after boot, same shape as geo-open-loader), then daily
                — the factory's own walk is daily, so the context
                converges to the table state daily. netflow-ingest's
                tenzir::osint::enrich call reads this context per flow
                record: src/dst IP matches append indicator objects to
                the osint field and stamp metadata.profiles "osint", so
                the archive rule's attestation covers the enriched
                record.
              definition: ""
              restart-on-error: 1 minute
            # A dead UDP collector is a silent black hole: the Node
            # Pipelines dashboard heartbeat panel is this node's only
            # liveness view, so the metrics pipelines come over from
            # the core node. pipeline_ids are NOT node-qualified
            # (live-verified 2026-10-17: the vendored docs'
            # demo-node/m57-suricata example applies to platform
            # pipelines, not node-config pipelines), so each arm stamps
            # a node label (plus the per-direction internal flag) that
            # pins this node's series; the dashboard's
            # `{{pipeline_name}}` legend still shows every node under
            # one name — split on node when it matters.
            # sigma-metrics-to-mimir stays core-only: no sigma here.
            pipeline-metrics-to-mimir:
              name: pipeline metrics to mimir
              description: |
                Pushes the node's tenzir.metrics.pipeline events (per-pipeline
                ingress/egress event counts, emitted every 10s) to the Mimir
                remote-write endpoint kube-prometheus-stack remote-writes to;
                the mimir gateway injects the tenant header, so no auth here.
                Raw shape, not shape="prometheus" — that transform drops all
                non-health schemas, pipeline metrics included. Grafana reads
                the tenzir_pipeline_{ingress,egress}_events series; note this
                pipeline (and its siblings) also self-report in those series.
                The internal label carries the metric event's per-direction
                internal flag (ingress.internal / egress.internal), so
                bus-internal flow (publish, import, subscribe) is separable
                from external export in the series; the node label pins the
                pushing node — pipeline_ids are not node-qualified
                (live-verified 2026-10-17: the vendored docs'
                demo-node/m57-suricata example applies to platform pipelines,
                not node-config pipelines), and without it this node's
                self-reports collide with the core node's same-named series
                (observed live: interleaved values with Mimir's
                same-timestamp handling eating roughly half the samples).
              definition: ""
              restart-on-error: 1 minute
            netflow-attest-verify:
              name: netflow attestation verify
              description: |
                Verification half of this node's record_integrity lane:
                reads the last 24h of this node's one archived class
                back (Network Activity via table-mode from_clickhouse —
                the vendor catch-all reconstruction), recomputes each
                attestation's fingerprint over the canonical
                serialization, and walks the per-node prev_event chain
                (chain_uid = tenzir-node-netflow); a Detection Finding
                (2004) drops for every break — content tamper
                (fingerprint_mismatch), deletion (chain_link_mismatch),
                or splice — while the windowed walk tolerates its own
                edge (the first record's predecessor lives outside the
                24h read). ocsf.Network_Activity is the shared table:
                the tetragon node's archive rule writes its Network
                Activity rows there too, and this walk reads the whole
                table window — the verify operator walks each chain_uid
                separately, so both per-node chains get witnessed by
                this walk (and the tetragon node's own walk returns the
                favor). The walk is SCHEDULED hourly (the every wrapper,
                the loader-pipeline shape): the first walk fires at
                pipeline start, then every 1h re-walks the rolling 24h
                window. Each break's finding rides two legs: stdout
                (pod-log visibility) and, via ocsf_derive + ocsf_cast,
                an INSERT into ocsf.Detection_Finding with the tenzir
                user — landing inside the Grafana tenzir-findings
                rule's WHERE clauses (class 2004, severity 4), so
                tamper evidence pages through the agent_invoke bridge
                instead of waiting for a human to read pod logs. The
                package tests prove the walk and the finding shape
                (homelab package: netflow-attest /
                netflow-verify-clean / netflow-verify-tamper
                baselines).
              definition: ""
              restart-on-error: 1 minute
            error-diagnostics-to-mimir:
              name: error diagnostics to mimir
              description: |
                Pushes a tenzir_pipeline_errors / tenzir_pipeline_warnings
                sample (value 1, pipeline labels, node label = netflow) to Mimir
                for every live error / warning diagnostic, so the dashboard can
                count both severities with sum_over_time. They otherwise live
                only in the diagnostics stream, not in metrics. Restored per-node (B1)
                with the central poller's retirement.
              definition: ""
              restart-on-error: 1 minute
            diagnostics-to-loki:
              name: diagnostics to loki
              description: |
                Ships every live, not-hidden pipeline diagnostic to Loki as
                job=tenzir-diagnostics entries (node label = netflow) — the
                collector node's own pipeline warnings (UNCLOSED_STRING parse
                noise and friends) become filterable log lines.
                to_fluent_bit resolves $pipeline_name and $severity per event
                and consumes both out of the shipped body (live-verified
                2026-10-17 probe); drop discards the ANSI escape-coded
                rendered field, so the line keeps the rest of the diagnostic
                record — pipeline_id, hidden, run, timestamp, message, notes,
                annotations — and the labels carry pipeline + severity. Hidden
                entries (platform-UI pipeline deprecation noise) stay out.
                Plain HTTP to loki-write, cluster-internal. live=true without
                retro: no store-backlog replay on start, so restarts never
                re-ship history (Loki has no dedup) — restored per-node (B1)
                with the central poller's retirement: every node ships its own
                pair now, so no cross-node consumer can ever blind against it.
              definition: ""
              restart-on-error: 1 minute
        plugins:
          compaction:
            # Budget backstop, same weighted-age path as the siblings: every
            # 30 minutes, erase oldest past 6GiB down to 4GiB. Sized for the
            # 15-minute window (sizing math in nodes/netflow/README.md): the
            # netflow lake peaks near ~150 KB on disk, so the corridor only
            # exists for archive-rule failure windows and holds days of the
            # worst stall on the 20Gi PVC.
            space:
              mode: weighted-age
              interval: 30 minutes
              disk-budget-high: 6GiB
              disk-budget-low: 4GiB
            # 15-minute local lake, same horizon and same archive as the
            # siblings: the netflow OCSF class exports to the ClickHouse
            # OCSF query store's per-class ocsf.<Class_Name> tables, then
            # expires locally (consume + export = archive-then-delete;
            # preserve-input stays off). The s3://tenzir/ocsf/ parquet
            # lane retired with the MR-5 teardown: the existing objects
            # stay untouched in the rustfs bucket as frozen, unqueried
            # history — deleting them is a separate operator call. The
            # lake is a transit buffer between ingest and the archive,
            # not a query surface; ClickHouse is the OCSF record past
            # the window. The pass runs every 5 minutes, so the true
            # window at pass boundaries is 15-20 minutes.
            time:
              interval: 5 minutes
              rules:
                # The one OCSF class this node stores: Network Activity
                # (4001) from the vendored netflow package's dispatch.
                # ClickHouse is the archive (rollout MR-5 teardown, plan
                # D8 end state): the retired to_s3 tail and its fork
                # wrapper are gone, so to_clickhouse is the rule's sole,
                # terminal sink — a sink-only pipeline returns no
                # transformed events, so consume + export =
                # archive-then-delete semantics are unchanged.
                # mode="append" fails loudly when the MR-1 DDL is
                # missing (the second net for the Keeper first-boot
                # race), and max_batch_rows bounds the insert buffers.
                # The rule's pipeline (pipelines/ocsf-archive.tql)
                # stamps the record_integrity attestation on every
                # archived record BEFORE the INSERT: a per-node SHA-256
                # fingerprint chain (chain_uid = tenzir-node-netflow)
                # covering the record exactly as stored — the detection
                # plane's attestation lane (docs/issues/
                # tenzir-record-integrity-attestations.md); the
                # stamping cost is the measured detection-plane number
                # (the clickhouse README's attestation section), and at
                # this node's probe-only flow volume it is noise.
                - after: 15 minutes
                  name: ocsf-archive
                  field: time
                  types: ["ocsf.network_activity"]
                  # Stitched from pipelines/ocsf-archive.tql at
                  # kustomize build time.
                  pipeline: ""

    # Sized by the docs' size-a-node formula for this node's shape (full
    # math in nodes/netflow/README.md): CPU = max(2, ceil(0.15/250 ingest
    # + 1*0.1 source + 1*0.1 destination (clickhouse)
    # + 1*0.2 normalization)) = 2 (the formula's 2-core floor binds); the
    # formula's RAM floor is 2 GB and a fresh tiny lake carries none of
    # core's 76k-synopsis boot history, so 4Gi is the floor plus 2x
    # headroom. Detection is off: no sigma pipeline. Requests small:
    # talos-04 CPU requests are 92% committed, and limits are caps, not
    # reservations.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    # The ClickHouse writer password rides the dedicated clickhouse-secrets
    # item (this namespace materializes its own OnePasswordItem in
    # ../secret.yaml): the env var maps to config key
    # tenzir.secrets.clickhouse-password, so the to_clickhouse archive leg
    # reads it as secret("clickhouse-password") — same env-var shape as the
    # siblings. No authentik token: no authentik pipeline runs here. The
    # retired to_s3 tail's rustfs AWS_* env entries are gone with the MR-5
    # teardown; the aws-* fields stay on the tenzir-secrets item, unused,
    # for the operator to delete.
    extraEnv:
      - name: TENZIR_SECRETS__CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secrets
            key: clickhouse-password

    extraVolumes:
      # The homelab package manifest: the package loader registers the
      # `homelab` module from package.yaml alone — operator files
      # mounted under a package dir do NOT register the package
      # without it. This missing mount was the generation-3
      # boot-breaker: the pending config mounted the record_integrity
      # operator files but not this manifest, so boot failed lowering
      # homelab::record_integrity::attest (module `homelab` not found)
      # before :5158 bound and every upgrade wedged; tetragon mounts
      # this manifest and upgraded clean — that was the whole
      # netflow-specific delta.
      - name: packages-homelab
        configMap:
          name: tenzir-packages-homelab
      - name: packages-netflow
        configMap:
          name: tenzir-packages-netflow
      - name: packages-netflow-ocsf-base
        configMap:
          name: tenzir-packages-netflow-ocsf-base
      - name: packages-netflow-ocsf-normalize
        configMap:
          name: tenzir-packages-netflow-ocsf-normalize
      - name: packages-netflow-ocsf-map
        configMap:
          name: tenzir-packages-netflow-ocsf-map
      - name: packages-netflow-ocsf-events-network-activity
        configMap:
          name: tenzir-packages-netflow-ocsf-events-network-activity
      # The shared record_integrity operators (generated at the root
      # kustomization, the same ConfigMaps the core node mounts): the
      # archive rule's attest leg and the netflow-attest-verify
      # pipeline call them directly.
      - name: packages-homelab-record-integrity-attest
        configMap:
          name: tenzir-packages-homelab-record-integrity-attest
      - name: packages-homelab-record-integrity-verify
        configMap:
          name: tenzir-packages-homelab-record-integrity-verify
      # Vendored library `tenzir` utilities package: the OSINT pair this
      # node rides — update_context (the opencti-osint-loader
      # pipeline) and enrich (netflow-ingest's indicator stamp). One
      # ConfigMap per mounted file, generated at the root kustomization,
      # same wiring as the core node.
      - name: packages-tenzir
        configMap:
          name: tenzir-packages-tenzir
      - name: packages-tenzir-osint-update-context
        configMap:
          name: tenzir-packages-tenzir-osint-update-context
      - name: packages-tenzir-osint-enrich
        configMap:
          name: tenzir-packages-tenzir-osint-enrich
      # Writable target for the node's own file logger (file-verbosity
      # above): server.log opens at /var/log/tenzir on every boot, which
      # readOnlyRootFilesystem makes unwritable — the 2026-10-17
      # crashloop on the warning-level siblings. emptyDir, same
      # lifecycle as the tmp mount; the 10 MiB rotation cap bounds the
      # disk cost.
      - name: tenzir-logs
        emptyDir: {}

    extraVolumeMounts:
      # Same file-level subPath mounts as the siblings (kubelet ..data
      # internals fail Tenzir's operator-path segment check in a walked package
      # tree). subPath does not live-propagate ConfigMap updates — package
      # changes need a pod roll. Generator entries stay at the root
      # kustomization: the source files never move, only the mount side
      # moved here from the core node.
      - name: packages-homelab
        mountPath: /etc/tenzir/packages/homelab/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-netflow
        mountPath: /etc/tenzir/packages/netflow/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-netflow-ocsf-base
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/base.tql
        subPath: base.tql
        readOnly: true
      - name: packages-netflow-ocsf-normalize
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/normalize.tql
        subPath: normalize.tql
        readOnly: true
      - name: packages-netflow-ocsf-map
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-netflow-ocsf-events-network-activity
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/events/network_activity.tql
        subPath: network_activity.tql
        readOnly: true
      - name: packages-homelab-record-integrity-attest
        mountPath: /etc/tenzir/packages/homelab/operators/record_integrity/attest.tql
        subPath: attest.tql
