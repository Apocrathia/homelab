---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-investigations
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Core parity: the fresh node boots an empty partition catalog, so
    # the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Blast-radius isolation is why this node exists (the investigations
    # plane design): agent query storms, malformed POSTs, and
    # experimental TQL die on a pod that owns no detection feed, no
    # archive rule, and no credentials beyond the two investigations
    # ClickHouse users plus the tenzir lake writer (INSERT/SELECT on
    # ocsf.* — the scheduled attest-verify findings leg; a deliberate
    # blast-radius expansion the record-integrity rails lap made, see
    # extraEnv). The detection plane (core node) is untouched by
    # anything that happens here; the planes share only the ClickHouse
    # cluster and vault items. The containment stack on this node:
    #   - operator denylist + no-location-overrides (tenzir.config below)
    #   - INSERT/SELECT-scoped ClickHouse users, no ALTER/TRUNCATE/DROP
    #     (the CHI users block, clickhouse/cluster.yaml)
    #   - chart NetworkPolicy scoping ingress to the agent namespaces
    #   - append-only discipline: nothing ever updates or deletes a row
    #     of investigations.records (residual risk floor = visible,
    #     attributed, easily-recoverable pollution, not destruction)
    #
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-investigations + entry
    # investigations would double to
    # tenzir-node-investigations-investigations. The override pins
    # fullname at tenzir-node so the entry renders
    # tenzir-node-investigations (pod, Service, and ConfigMap; the
    # Service is the agent-facing name).
    fullnameOverride: tenzir-node
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.20.0

    # Startup gate for multi-minute partition-catalog loads (chart-native
    # since tenzir-node 0.2.0): 10s x 60 = 10-minute boot budget, matching
    # the install/upgrade timeouts above.
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60

    # Registers into the same hosted Tenzir Platform workspace as the
    # core and tetragon nodes; this node reads its own pre-provisioned
    # token from the investigations-node-token field of the tenzir-secrets
    # Secret (NEW vault field, same convention as tetragon-node-token /
    # core-node-token; the platform issues per-node tokens only).
    #
    # The API-token bootstrap is operator-side, once, because web-server
    # tokens are NODE STATE, not config: `tenzir-ctl web generate-token`
    # prints the token and persists it under the state directory
    # (plugins/web/authenticator.svs on the PVC). No config key or env
    # var seeds it, so the manifest cannot wire it: exec into the pod
    # once, generate the token, copy the value into the tenzir-secrets
    # item as investigations-api-token (NEW field), and hand that field
    # to the investigator agent. Static bearer token — the residual risk
    # the investigations design accepts inside the NetworkPolicy scope.
    # Bootstrap order in the node README.
    nodes:
      - name: investigations
        token:
          existingSecret: tenzir-secrets
          key: investigations-node-token
        extraPorts:
          # Write lane: accept_http listener for agent POSTs (case
          # open/update/close + evidence pin envelopes).
          - name: http-ingest
            containerPort: 8080
          # Query lane: the web server's node REST API (default port from
          # the v6.19.1 web plugin).
          - name: web-api
            containerPort: 5160

    persistence:
      # Minimal by design: the node never imports a record — the local
      # lake stays empty by construction (no import in the ingest
      # pipeline, no archive rule), and the PVC carries node state only
      # (platform registration, web-token state, diagnostics). The
      # siblings' 20Gi buys headroom for archive-failure windows this
      # node does not have. Longhorn grows on demand anyway.
      size: 5Gi

    # Node configuration (renders to the tenzir-node-investigations-config
    # ConfigMap and rolls the pod on change). Nothing secret may live
    # here: values land in a ConfigMap in plaintext. Secrets arrive via
    # extraEnv below.
    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Server-log verbosity, same warning level as the siblings:
          # the chart default (tenzir.file-verbosity: quiet) writes
          # nothing to server.log, so pipeline failures that point at
          # the log for their diagnostics surface blind. server.log
          # opens at /var/log/tenzir on every boot, which
          # readOnlyRootFilesystem makes unwritable — the tenzir-logs
          # emptyDir (extraVolumes below) backs the path; keep the
          # key/mount pair together on any new node.
          file-verbosity: warning
          # Containment stack, part 1: the operator denylist. Each entry
          # forbids a pipeline operator/builtin node-wide (upstream docs,
          # "Control the plugins"):
          #   shell   - arbitrary command execution from a pipeline; the
          #             single worst containment breach an injected
          #             pipeline definition could achieve
          #   python  - the python operator executes embedded Python
          #             node-side; same RCE class as shell with a nicer
          #             syntax
          #   to_file - filesystem write from a pipeline; nothing on this
          #             node may write files (the chart mounts /tmp and
          #             the PVC writable, but the write tool here is
          #             ClickHouse, not a filesystem)
          # Open item (investigations design): decide the egress trio
          # to_http / to_s3 / to_tcp — denylisting them hard-blocks
          # pipeline exfiltration; this node legitimately uses none of
          # them (the only sink is to_clickhouse), so the denylist
          # decision is safe either way and only needs the operator's
          # call on future flexibility.
          disable-plugins:
            - shell
            - python
            - to_file
          # Containment stack, part 2: forbid `local`/`remote` keyword
          # overrides in pipeline definitions (e.g., an API-launched
          # pipeline remotely reading from a file).
          no-location-overrides: true
          # Containment stack, part 3: pipelines stay in-process (the
          # pipeline-subprocesses default, kept). The tetragon node turns
          # subprocesses on for flood crash-isolation; here the node IS
          # the isolation boundary, the volume is tiny, and in-process
          # keeps the API-launched query pipelines cheap.
          # Catalog knobs, sibling parity (tetragon shape): dormant on an
          # empty lake — nothing is imported, no partitions mint — but
          # kept so a future import lane inherits the OOM lessons
          # (lazy-sketches defers Bloom-filter sketches to query time;
          # load-concurrency caps the boot synopsis loader at 4).
          index:
            lazy-sketches: true
            load-concurrency: 4
          # Chain state for the record_integrity attestation lane (the
          # attest operator + ingest pipeline below): one lookup-table
          # entry per case (key = metadata.correlation_uid) holding the
          # case's current chain tail — the previous record's uid,
          # type_uid, and fingerprint, which context_enrich turns into the
          # next record's prev_event. Same shape as the siblings' context
          # blocks (core's ocsf-osint; contexts are per-node, shared
          # across this node's pipelines, and survive pipeline restarts).
          # The table is memory: a NODE restart loses it, and every case
          # chain then restarts at its next record with prev_event absent
          # plus a WARNING diagnostic from attest (best-effort per node
          # lifetime — the verify lane's per-record fingerprint recompute
          # still catches post-hoc mutation across restarts; the semantics
          # are documented in the datalake README).
          contexts:
            investigations-chains:
              type: lookup-table
          start:
            # Start the web server (node REST API) — the guide's
            # mechanism (start-the-api: options ride the plugins.web
            # block below; the server command reads its options from the
            # plugins.web config group). The API surface:
            # /api/v0/pipeline/{launch,list,update,delete}, /api/v0/serve
            # — the agent query lane.
            commands:
              - web server
          # Pipeline definitions live in pipelines/<id>.tql; this
          # kustomization's replacements stitch them back into these
          # empty definition fields at build time.
          pipelines:
            investigations-ingest-http:
              name: investigations ingest (case/evidence envelopes)
              description: |
                Standing write lane: agents POST thin JSON envelopes
                (case open/update/close, evidence pin) to the accept_http
                listener; the homelab investigations mapping package
                validates the envelope and stamps the OCSF spine (case
                lifecycle as Incident Finding 2005, evidence pins as
                Datastore Activity 6005 Query with the ai_operation agent
                identity); ocsf_derive + ocsf_cast schema-validate; the
                attest operator stamps the record_integrity attestation
                over the stored shape — a SHA-256 fingerprint chained per
                case via prev_event, chain state in the investigations-
                chains context (the contexts block above; a node restart
                restarts the chains with a WARNING, the documented gap in
                the datalake README); the to_clickhouse leg INSERTs into
                investigations.records on the OCSF query store with the
                INSERT/SELECT-scoped investigations-writer user. The map
                call rides after the listener braces like the core node's
                http-ingest pipeline (not inside them): malformed POSTs
                drop with assert-WARNINGS in the node diagnostics while
                the request still completes with accept_http's default
                200 — write confirmation is the query-lane read-back, not
                the POST response. No archive rule and no local import:
                ClickHouse is the only durable copy, and the node lake
                stays empty by construction (the PVC carries node state,
                not records).
              definition: ""
              restart-on-error: 1 minute
            investigations-attest-verify:
              name: investigations attestation verify
              description: |
                Verification half of the record_integrity lane: reads
                every investigations.records row back via the catch-all
                reconstruction, recomputes each attestation's fingerprint
                over the canonical serialization, and walks the per-case
                prev_event chains. The walk is SCHEDULED hourly (the
                every wrapper, the loader-pipeline shape): the first
                walk fires at pipeline start, then every 1h re-walks the
                store. Each break's finding rides two legs: stdout
                (pod-log visibility) and, via ocsf_derive + ocsf_cast, an
                INSERT into ocsf.Detection_Finding with the tenzir user
                (INSERT/SELECT on ocsf.* — the same credential the core
                node's archive legs read, wired below as
                TENZIR_SECRETS__CLICKHOUSE_PASSWORD), landing inside the
                Grafana tenzir-findings rule's WHERE clauses (class 2004,
                severity 4), so case-store tamper evidence pages through
                the agent_invoke bridge. The package tests prove the walk
                (homelab package: investigations-ocsf-verify-clean /
                -tamper baselines, plus the detection-verify-finding
                shape proof both planes' findings share).
              definition: ""
              restart-on-error: 1 minute
              # Born-dead guard (operator-approved one-liner, design phase 2):
              # the first roll's walker came up completed-terminal with zero
              # walks ever (query_log-proven, 2026-10-21 — pipeline state
              # lies both directions). Unstoppable makes completion a failed
              # state, and restart-on-error above relaunches it: completion
              # -> failed -> relaunch, so the hourly walk can never silently
              # die in a "completed" state.
              unstoppable: true
            pipeline-metrics-to-mimir:
              name: pipeline metrics to mimir
              description: |
                Pushes the node's tenzir.metrics.pipeline events (per-pipeline
                ingress/egress event counts, emitted every 10s) to the Mimir
                remote-write endpoint kube-prometheus-stack remote-writes to;
                the mimir gateway injects the tenant header, so no auth here.
                Raw shape, not shape="prometheus" — that transform drops all
                non-health schemas, pipeline metrics included. Grafana reads
                the tenzir_pipeline_{ingress,egress}_events series; note this
                pipeline (and its siblings) also self-report in those series.
                The internal label carries the metric event's per-direction
                internal flag (ingress.internal / egress.internal), so
                bus-internal flow (publish, import, subscribe) is separable
                from external export in the series; the node label pins the
                pushing node — pipeline_ids are not node-qualified
                (live-verified 2026-10-17: the vendored docs'
                demo-node/m57-suricata example applies to platform pipelines,
                not node-config pipelines), and without it the same-named
                self-reports from this node and the siblings collide on one
                series (observed live: core and netflow interleaved samples
                on the shared pipeline-metrics-to-mimir series with Mimir's
                same-timestamp handling eating roughly half of them).
              definition: ""
              restart-on-error: 1 minute
            error-diagnostics-to-mimir:
              name: error diagnostics to mimir
              description: |
                Pushes a tenzir_pipeline_errors / tenzir_pipeline_warnings
                sample (value 1, pipeline labels, node label = investigations) to Mimir
                for every live error / warning diagnostic, so the dashboard can
                count both severities with sum_over_time. They otherwise live
                only in the diagnostics stream, not in metrics. Restored per-node (B1)
                with the central poller's retirement.
              definition: ""
              restart-on-error: 1 minute
            diagnostics-to-loki:
              name: diagnostics to loki
              description: |
                Ships every live, not-hidden pipeline diagnostic to Loki as
                job=tenzir-diagnostics entries (node label = investigations).
                to_fluent_bit resolves $pipeline_name and $severity per event
                and consumes both out of the shipped body (live-verified
                2026-10-17 probe); drop discards the ANSI escape-coded
                rendered field, so the line keeps the rest of the diagnostic
                record — pipeline_id, hidden, run, timestamp, message, notes,
                annotations — and the labels carry pipeline + severity. Hidden
                entries (platform-UI pipeline deprecation noise) stay out.
                Plain HTTP to loki-write, cluster-internal. live=true without
                retro: no store-backlog replay on start, so restarts never
                re-ship history (Loki has no dedup) — restored per-node (B1)
                with the central poller's retirement: every node ships its own
                pair now, so no cross-node consumer can ever blind against it.
              definition: ""
              restart-on-error: 1 minute

        # Web server options. Config-file layout (source-verified
        # v6.19.1, plugins/web/tenzir.yaml.example + the config loader):
        # plugin keys stay top-level in tenzir.yaml, so in values they
        # ride under tenzir.config.plugins, NOT under
        # tenzir.config.tenzir — the chart renders this block as the
        # top-level plugins: key.
        #
        # Query lane exposure (operator decision, investigations
        # design): IN-CLUSTER ONLY — no Gateway HTTPRoute; agents reach
        # tenzir-node-investigations.tenzir.svc:5160 directly, and the
        # chart NetworkPolicy scopes who may call. upstream mode is out
        # (source-verified v6.19.1: refuses non-localhost binds), and dev
        # mode is out (drops token auth) — server mode binds the pod
        # interface with TLS + token. Homelab posture: a prod cluster
        # would add mTLS and per-caller identities; here NetworkPolicy +
        # static token + INSERT/SELECT-scoped users is the boundary.
        plugins:
          web:
            mode: server
            bind: 0.0.0.0
            port: 5160
            # TLS pair (operator decision 2026-10-17: self-signed
            # ClusterIssuer): the cert-manager Certificate in
            # certificate.yaml issues Secret
            # tenzir-node-investigations-web-tls (SANs = the Service DNS
            # forms the chart renders), mounted read-only at /etc/tenzir/
            # tls via the web-tls extraVolume/extraVolumeMounts pair
            # below. Server mode sets require_tls and fails validation
            # without both certfile and keyfile (source-verified v6.19.1,
            # plugins/web/src/configuration.cpp: "either keyfile or
            # certfile argument is missing") — with the pair wired, `web
            # server` validates and the query lane binds TLS + token.
            # Agent callers skip CA verification: the X-Tenzir-Token is
            # the real auth and NetworkPolicy scopes the callers (homelab
            # posture; a prod cluster would verify against the issued CA
            # or run mTLS).
            certfile: /etc/tenzir/tls/tls.crt
            keyfile: /etc/tenzir/tls/tls.key

    # Sized with the docs' size-a-node formula at investigations volume
    # (near zero): 1 source (accept_http) + 1 destination (ClickHouse)
    # + normalization = 0.1+0.1+0.2 = 0.4 -> the formula's max(2, ·)
    # floor pins 2 cores; RAM floor 2 GB (catalog term ~0 at empty lake;
    # the same floor the formula gives the siblings). Requests stay
    # small: limits are caps, not reservations.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    # Secrets (vault items already materialized in this namespace by
    # ../secret.yaml — the tenzir-secrets and clickhouse-secrets
    # OnePasswordItems): the investigations ClickHouse users' passwords
    # ride the dedicated clickhouse-secrets item as NEW fields
    # (clickhouse-investigations-writer-password /
    # clickhouse-investigations-reader-password — the CHI users block in
    # clickhouse/cluster.yaml renders the users from them). Env
    # vars map to config keys tenzir.secrets.* (same env-var shape as
    # the siblings' TENZIR_SECRETS__CLICKHOUSE_PASSWORD): the ingest
    # pipeline's to_clickhouse leg reads
    # secret("investigations-writer-password"), API-launched
    # from_clickhouse pipelines read
    # secret("investigations-reader-password") node-side, and the
    # scheduled attest-verify pipeline's findings leg reads
    # secret("clickhouse-password") — the tenzir user (INSERT/SELECT on
    # ocsf.*, the shared lake writer; the findings INSERT into
    # ocsf.Detection_Finding rides the Grafana rails), the same
    # clickhouse-password field the core node's archive legs read,
    # rendered from the same item by this namespace's OnePasswordItem
    # (../secret.yaml). Agents never hold ClickHouse credentials, only
    # the node API token.
    extraEnv:
      - name: TENZIR_SECRETS__INVESTIGATIONS_WRITER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secrets
            key: clickhouse-investigations-writer-password
      - name: TENZIR_SECRETS__INVESTIGATIONS_READER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secrets
            key: clickhouse-investigations-reader-password
      - name: TENZIR_SECRETS__CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secrets
            key: clickhouse-password

    extraVolumes:
      - name: packages-homelab
        configMap:
          name: tenzir-packages-homelab
      - name: packages-homelab-investigations-map
        configMap:
          name: tenzir-packages-homelab-investigations-map
      - name: packages-homelab-investigations-attest
        configMap:
          name: tenzir-packages-homelab-investigations-attest
      - name: packages-homelab-investigations-verify
        configMap:
          name: tenzir-packages-homelab-investigations-verify
      - name: packages-homelab-record-integrity-attest
        configMap:
          name: tenzir-packages-homelab-record-integrity-attest
      - name: packages-homelab-record-integrity-verify
        configMap:
          name: tenzir-packages-homelab-record-integrity-verify
      # The web server's TLS pair, issued by the cert-manager
      # Certificate (certificate.yaml) via the self-signed ClusterIssuer.
      - name: web-tls
        secret:
          secretName: tenzir-node-investigations-web-tls
      # Writable target for the node's own file logger (file-verbosity
      # above): server.log opens at /var/log/tenzir on every boot, which
      # readOnlyRootFilesystem makes unwritable. This is the app's own
      # logger, not a pipeline write lane — to_file stays on the
      # denylist. emptyDir, same lifecycle as the tmp mount; the 10 MiB
      # rotation cap bounds the disk cost.
      - name: tenzir-logs
        emptyDir: {}

    extraVolumeMounts:
      # Same file-level subPath mounts as the sibling nodes (kubelet
      # ..data internals fail Tenzir's operator-path segment check in a
      # walked package tree). subPath does not live-propagate ConfigMap
      # updates — package changes need a pod roll.
      - name: packages-homelab
        mountPath: /etc/tenzir/packages/homelab/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-homelab-investigations-map
        mountPath: /etc/tenzir/packages/homelab/operators/investigations/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      # Same file-level subPath mounts as the map operator above: the
      # attest operator (ingest lane) and the verify operator (the
      # attest-verify pipeline below) are package siblings the map's
      # ConfigMap does not carry.
      - name: packages-homelab-investigations-attest
        mountPath: /etc/tenzir/packages/homelab/operators/investigations/ocsf/attest.tql
        subPath: attest.tql
        readOnly: true
      - name: packages-homelab-investigations-verify
        mountPath: /etc/tenzir/packages/homelab/operators/investigations/ocsf/verify.tql
        subPath: verify.tql
        readOnly: true # The shared record_integrity operators the investigations
      # wrappers call: attest.tql/verify.tql above are thin scope
      # bindings (chain_uid = the case spine, genesis = the case open,
      # the investigations finding dressing) over the generalized
      # homelab::record_integrity::attest/verify that own the stamping
      # and walk mechanics.
      - name: packages-homelab-record-integrity-attest
        mountPath: /etc/tenzir/packages/homelab/operators/record_integrity/attest.tql
        subPath: attest.tql
        readOnly: true
      - name: packages-homelab-record-integrity-verify
        mountPath: /etc/tenzir/packages/homelab/operators/record_integrity/verify.tql
        subPath: verify.tql
        readOnly: true
      # Web server TLS pair (plugins.web certfile/keyfile): directory
      # mount of the Certificate's Secret, no subPath. The web server
      # reads the pair only at its start, so renewals land on the next
      # pod roll — any config change re-checksums tenzir.yaml and rolls
      # the pod, well inside the 90d validity window.
      - name: web-tls
        mountPath: /etc/tenzir/tls
        readOnly: true
      # The file logger's home (tenzir-logs volume above).
      - name: tenzir-logs
        mountPath: /var/log/tenzir

    # Containment stack, part 4: chart NetworkPolicy. Ingress only (the
    # chart policy has no egress hook — open item: decide whether a
    # standalone egress NetworkPolicy locking node egress to ClickHouse
    # + the platform websocket is wanted; as rendered, egress is
    # default-allowed). Same-namespace covers probes and in-cluster debug
    # pods; the two agent lanes open to the known agent namespaces only
    # (the investigations design's in-cluster callers) — the future
    # investigator agent lands in one of them.
    networkPolicy:
      enabled: true
      allowSameNamespace: true
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kagent
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: hermes-agent
          ports:
            - port: 8080
              protocol: TCP
            - port: 5160
              protocol: TCP
