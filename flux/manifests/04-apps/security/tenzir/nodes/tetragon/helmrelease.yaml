---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-tetragon
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Core parity: the fresh tetragon node boots an empty partition catalog,
    # so the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  # Startup gate, grafted after render: tenzir-node 0.1.0 ships no
  # startupProbe hook (a values key renders nothing — verified against the
  # extracted chart), so the liveness probe alone owns boot and kills the
  # pod at 120s (initialDelay 30 + 3x30) against the multi-minute
  # partition-catalog load before :5158 accepts. The kustomize postRenderer
  # grafts a startupProbe onto the rendered StatefulSet instead: kubelet
  # holds readiness/liveness gated until it passes, trading the 120s kill
  # for a 10-minute boot budget (10s period x 60 failures) that matches
  # the 10m install/upgrade timeouts above. When upstream ships a
  # startupProbe values hook, this patch deletes and the block moves to
  # values.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: tenzir-node-tetragon
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: tenzir-node-tetragon
              spec:
                template:
                  spec:
                    containers:
                      - name: tenzir-node
                        startupProbe:
                          tcpSocket:
                            port: node
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 60
  values:
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-tetragon + entry tetragon would
    # double to tenzir-node-tetragon-tetragon. The override pins fullname
    # at tenzir-node so the entry renders tenzir-node-tetragon.
    fullnameOverride: tenzir-node
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.19.1

    # Registers into the same hosted Tenzir Platform workspace as the core
    # node; this node reads its own pre-provisioned token from the
    # tetragon-node-token field of the tenzir-secrets Secret. Platform tokens
    # are per-node, never shared.
    nodes:
      - name: tetragon
        token:
          existingSecret: tenzir-secrets
          key: tetragon-node-token
        extraPorts:
          - name: otlp-http
            containerPort: 4318

    persistence:
      # 20Gi stays a cap, not a capacity plan: at the 15-minute retention
      # horizon a flood window is ~42 MiB on disk (measured 2026-10-12
      # rate; sizing math in nodes/tetragon/README.md), and even the raw
      # worst-case slice of the current extreme drain (253 GB/day, 15
      # minutes ~ 2.6 GB) cannot OOM a 12Gi node. Longhorn volumes grow on
      # demand; a smaller request buys nothing.
      size: 20Gi

    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Server-log verbosity, same warning level as the core node: the
          # chart default (tenzir.file-verbosity: quiet) writes nothing to
          # server.log, so pipeline failures that point at the log for
          # their diagnostics surface blind (docs: file-verbosity levels
          # quiet, error, warning, info, verbose, debug, trace).
          file-verbosity: warning
          # Crash isolation for the flood: run pipelines in subprocesses so the
          # tetragon OCSF pipeline's memory blowups die alone instead of taking
          # the node process down (in-process mode shared fate). The
          # accept_otlp listener stays in-process by design.
          pipeline-subprocesses: true
          # Partition mint-rate control, same 60s as the core: this node
          # owns the flood that minted ~10-event partitions (50,747
          # process_activity partitions = 6.25GiB = 80% of the volume at
          # the 2026-10-12 ENOSPC); 60s cuts the mint rate 6x, and the
          # async background merge consolidates undersized partitions once
          # the node stays up. max-partition-size stays default.
          active-partition-timeout: 60s
          # Catalog load knobs, same shape as the core node: lazy-sketches
          # defers Bloom-filter sketches to query time in a memory-bounded
          # LRU, and load-concurrency caps the boot synopsis loader at 4
          # threads instead of the hardware-concurrency default (the host
          # resolves to 16). max-partition-size stays at its 4Mi default.
          index:
            lazy-sketches: true
            load-concurrency: 4
          start:
            # Corridor matched to the compaction space budgets below;
            # retune math in nodes/tetragon/README.md.
            disk-budget-high: 6GiB
            disk-budget-low: 4GiB
          # Node-resident enrichment state (contexts are per-node, shared
          # across this node's pipelines, and survive pipeline restarts;
          # creation arguments apply only at creation, so this block never
          # reconfigures an existing context — the geo-open-loader pipeline
          # is the refresh path). The geoip context is created empty at
          # boot and filled by context_load of CIRCL's free Geo Open
          # country+ASN MMDB (~80 MiB in node memory, trivial against the
          # 12 Gi flood ceiling); no GeoLite2/MaxMind route, so no
          # license-key secret rides this node (see geo-open-loader).
          contexts:
            geo-open:
              type: geoip
            # Chain state for this node's record_integrity lane (the
            # archive rule's attest leg + the tetragon-attest-verify
            # pipeline): one lookup-table entry (key = the node
            # identity constant tenzir-node-tetragon) holding the
            # per-node chain's cross-pass tail — the previous archive
            # pass's last record uid, type_uid, and fingerprint, which
            # the next pass's first record links to as prev_event (the
            # batch seam; the intra-batch links ride the attest
            # operator's internal lag — probed: context reads run
            # engine-batches ahead of the writes at batch rate, so the
            # context is the seam channel only, never the intra-batch
            # channel). Same shape as the core node's detection-chains
            # and the investigations node's investigations-chains. The
            # table is memory: a NODE restart loses it, and the next
            # pass's first record restarts the chain with prev_event
            # absent plus one WARNING diagnostic from attest (the epoch
            # marker; best-effort per node lifetime — the verify lane's
            # per-record fingerprint recompute still catches post-hoc
            # mutation across restarts, only the linkage gap around a
            # restart is lost, documented in the datalake README).
            tetragon-chains:
              type: lookup-table
          # Pipeline definitions live in pipelines/<id>.tql; this
          # kustomization's replacements stitch them back into these
          # empty definition fields at build time.
          pipelines:
            tetragon-ingest-http:
              name: tetragon ingest http
              description: |
                OTLP/HTTP listener for the tetragon alloy only. Parses tetragon
                export events onto tetragon.raw; OTLP streams without a parser
                are dropped.
              definition: ""
              restart-on-error: 1 minute
            tetragon-ocsf:
              name: tetragon ocsf
              description: |
                tetragon export events -> OCSF (Process/File/Network
                Activity per event kind), then derive + schema-validate and
                store in the node. Enrichment runs after the cast and
                before the store/publish legs, so the lake, the archive,
                and the node-local ocsf bus all see the enriched record:
                Network Activity — the only class whose events carry IP
                endpoints (the process/file arms map process identity and
                file paths, no IPs; grounded in the tetragon map) — gains
                geo country + ASN from the node-resident geo-open context
                (filled by geo-open-loader) and a reverse-DNS hostname
                from dns_lookup's TTL cache, mapped into OCSF endpoint
                fields (endpoint.location.country,
                network_endpoint.autonomous_system, endpoint.hostname).
                fork_merge's complementary where branches scope the
                enrichment to the class: a mixed-class stream cannot run
                the operators unconditionally, because a null-key
                context_enrich still writes its into-field and would grow
                src_endpoint shells on process/file events (probed on
                v6.19.1). Private addresses stay bare — Geo Open marks them
                not routed and the gated assignments filter those markers.
                The unmapped residue is a selected projection (pod
                identity + policy name), not the full raw record. No raw
                stream lands in Loki; the ClickHouse OCSF store is the
                record.
              definition: ""
              restart-on-error: 1 minute
            geo-open-loader:
              name: geo open loader
              description: |
                Builder pipeline for the geo-open geoip context (declared
                in the contexts block above): fetches CIRCL's free Geo
                Open country+ASN MMDB and atomically replaces the context
                state — the two-pipeline builder/consumer shape from the
                vendored add-enrichment-contexts tutorial. Geo Open over
                GeoLite2 on purpose: MaxMind needs a license account plus
                out-of-band download plumbing (tar.gz extract,
                initContainer or CronJob) for city/coords this lab's
                egress triage does not need; Geo Open answers country +
                ASN in one MMDB fetched in-band, no license, no extra
                volume, no secret. The read_all binary=true / write_all
                data round trip is not redundant: from_http requires a
                parser, so read_all wraps the ~80 MiB download into one
                event and write_all unwraps it to the byte stream
                context_load consumes. context_load replaces the whole
                state, so a failed fetch never half-updates — the context
                keeps serving the last good database and restart-on-error
                retries in a minute. every 24h fires its first run at
                pipeline start (fresh node: context filled seconds after
                boot; until then the OCSF pipeline passes network activity
                through unenriched with one warning, by design). CIRCL
                publishes a fresh snapshot daily, so 24h keeps lookups
                current without hammering the mirror. The loader is
                equally decoupled from the flood: a slow or failed MMDB
                fetch never stalls ingest (the context keeps serving
                the last good database).
              definition: ""
              restart-on-error: 1 minute
            pipeline-metrics-to-mimir:
              name: pipeline metrics to mimir
              description: |
                Pushes the node's tenzir.metrics.pipeline events (per-pipeline
                ingress/egress event counts, emitted every 10s) to the Mimir
                remote-write endpoint kube-prometheus-stack remote-writes to;
                the mimir gateway injects the tenant header, so no auth here.
                Raw shape, not shape="prometheus" — that transform drops all
                non-health schemas, pipeline metrics included. Grafana reads
                the tenzir_pipeline_{ingress,egress}_events series; note this
                pipeline (and its siblings) also self-report in those series.
                The internal label carries the metric event's per-direction
                internal flag (ingress.internal / egress.internal), so
                bus-internal flow (publish, import, subscribe) is separable
                from external export in the series; the node label pins the
                pushing node — pipeline_ids are not node-qualified
                (live-verified 2026-10-17: the vendored docs'
                demo-node/m57-suricata example applies to platform pipelines,
                not node-config pipelines), and without it the same-named
                self-reports from this node and the siblings collide on one
                series (observed live: core and netflow interleaved samples
                on the shared pipeline-metrics-to-mimir series with Mimir's
                same-timestamp handling eating roughly half of them).
              definition: ""
              restart-on-error: 1 minute
            tetragon-attest-verify:
              name: tetragon attestation verify
              description: |
                Verification half of this node's record_integrity lane:
                reads the last 24h of every tetragon ocsf class back
                (Process Activity, File System Activity, Network
                Activity via table-mode from_clickhouse — the vendor
                catch-all reconstruction — merged into one stream,
                because the per-node chain crosses classes),
                recomputes each attestation's fingerprint over the
                canonical serialization, and walks the per-node
                prev_event chain (chain_uid = tenzir-node-tetragon); a
                Detection Finding (2004) drops for every break —
                content tamper (fingerprint_mismatch), deletion
                (chain_link_mismatch), or splice — while the windowed
                walk tolerates its own edge (the first record's
                predecessor lives outside the 24h read). The walk is
                SCHEDULED hourly (the every wrapper, the loader-pipeline
                shape): the first walk fires at pipeline start, then
                every 1h re-walks the rolling 24h window. Each break's
                finding rides two legs: stdout (pod-log visibility)
                and, via ocsf_derive + ocsf_cast, an INSERT into
                ocsf.Detection_Finding with the tenzir user — landing
                inside the Grafana tenzir-findings rule's WHERE clauses
                (class 2004, severity 4), so tamper evidence pages
                through the agent_invoke bridge instead of waiting for
                a human to read pod logs. The package tests prove the
                walk and the finding shape (homelab package:
                tetragon-attest / tetragon-verify-clean /
                tetragon-verify-tamper baselines, and the 250k
                throughput harness pins the flood-scale stamping cost).
              definition: ""
              restart-on-error: 1 minute
        plugins:
          compaction:
            # Budget backstop, same weighted-age path as the core node:
            # every 30 minutes, erase oldest past 6GiB down to 4GiB. Sized
            # for the 15-minute window (retune math in
            # nodes/tetragon/README.md): a flood window is ~42 MiB on disk,
            # the worst-case extreme drain ~2.6 GB per 15 minutes, so the
            # corridor only exists for archive-rule failure windows and
            # holds several worst-case stalls on the 20Gi PVC.
            space:
              mode: weighted-age
              interval: 30 minutes
              disk-budget-high: 6GiB
              disk-budget-low: 4GiB
            # 15-minute local lake, same horizon as the core node, same
            # archive: the tetragon OCSF classes export to the ClickHouse
            # OCSF query store's per-class ocsf.<Class_Name> tables, then
            # expire locally (consume + export = archive-then-delete;
            # preserve-input stays off). The s3://tenzir/ocsf/ parquet
            # lane retired with the MR-5 teardown: the existing objects
            # stay untouched in the rustfs bucket as frozen, unqueried
            # history — deleting them is a separate operator call. The
            # Base Event fallback (unknown
            # export kinds) is NOT archived: it cannot name a class and
            # expires with the window on the weighted-age backstop. The
            # lake is a transit buffer between ingest and the archive, not
            # a query surface; ClickHouse is the OCSF record past the
            # window (no raw stream lands in Loki; export-stdout sidecar
            # dropped). The pass runs every
            # 5 minutes,
            # so the true window at pass boundaries is 15-20 minutes.
            time:
              interval: 5 minutes
              rules:
                # Type names from the tetragon map's OCSF dispatch:
                # Process Activity (1007), File System Activity (1001),
                # Network Activity (4001). ocsf.base_event is deliberately
                # absent (cannot map -> not archived).
                # ClickHouse is the archive (rollout MR-5 teardown, plan
                # D8 end state): the retired to_s3 tail and its fork
                # wrapper are gone, so to_clickhouse is the rule's sole,
                # terminal sink — a sink-only pipeline returns no
                # transformed events, so consume + export =
                # archive-then-delete semantics are unchanged.
                # mode="append" fails loudly when the MR-1 DDL is
                # missing (the second net for the Keeper first-boot
                # race), and max_batch_rows bounds the insert buffers
                # on the flood classes. The rule's pipeline
                # (pipelines/ocsf-archive.tql) stamps the
                # record_integrity attestation on every archived record
                # BEFORE the INSERT: a per-node SHA-256 fingerprint
                # chain (chain_uid = tenzir-node-tetragon) covering the
                # record exactly as stored — the detection plane's
                # attestation lane (docs/issues/
                # tenzir-record-integrity-attestations.md), measured at
                # ~12k records/s end to end on the 250k peak-drain
                # batch (the tetragon-throughput package test; the
                # honest cost math is in the clickhouse README's
                # attestation section).
                - after: 15 minutes
                  name: ocsf-archive
                  field: time
                  types:
                    [
                      "ocsf.process_activity",
                      "ocsf.file_system_activity",
                      "ocsf.network_activity",
                    ]
                  # Stitched from pipelines/ocsf-archive.tql at
                  # kustomize build time.
                  pipeline: ""

    # OOM armor: 12Gi is the live-verified working set of the flood
    # (12.1Gi at the ceiling on the combined node); 4 cores = 4x the
    # throttled drain rate that caused backpressure memory growth at the
    # 1-core limit. Requests small: talos-04 CPU requests are 92% committed.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 12Gi

    # The ClickHouse
    # writer password rides the dedicated clickhouse-secrets item (this
    # namespace materializes its own OnePasswordItem in ../secret.yaml):
    # the env var maps to config key tenzir.secrets.clickhouse-password,
    # so the to_clickhouse archive leg reads it as
    # secret("clickhouse-password") — kebab name, same env-var shape as
    # the core node's authentik token. The retired to_s3 tail's rustfs
    # AWS_* env entries are gone with the MR-5 teardown; the aws-* fields
    # stay on the tenzir-secrets item, unused, for the operator to
    # delete.
    extraEnv:
      - name: TENZIR_SECRETS__CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secrets
            key: clickhouse-password

    extraVolumes:
      - name: packages-homelab
        configMap:
          name: tenzir-packages-homelab
      - name: packages-homelab-tetragon-parse
        configMap:
          name: tenzir-packages-homelab-tetragon-parse
      - name: packages-homelab-tetragon-map
        configMap:
          name: tenzir-packages-homelab-tetragon-map
      - name: packages-homelab-tetragon-exec
        configMap:
          name: tenzir-packages-homelab-tetragon-exec
      - name: packages-homelab-tetragon-exit
        configMap:
          name: tenzir-packages-homelab-tetragon-exit
      - name: packages-homelab-tetragon-kprobe
        configMap:
          name: tenzir-packages-homelab-tetragon-kprobe
      # The shared record_integrity operators (generated at the root
      # kustomization, the same ConfigMaps the core node mounts): the
      # archive rule's attest leg and the tetragon-attest-verify
      # pipeline call them directly.
      - name: packages-homelab-record-integrity-attest
        configMap:
          name: tenzir-packages-homelab-record-integrity-attest
      - name: packages-homelab-record-integrity-verify
        configMap:
          name: tenzir-packages-homelab-record-integrity-verify
      # Writable target for the node's own file logger (file-verbosity
      # above): server.log opens at /var/log/tenzir on every boot, which
      # readOnlyRootFilesystem made unwritable — the 2026-10-17
      # crashloop. emptyDir, same lifecycle as the tmp mount; the 10 MiB
      # rotation cap bounds the disk cost.
      - name: tenzir-logs
        emptyDir: {}

    extraVolumeMounts:
      # Same file-level subPath mounts as the core node (kubelet ..data
      # internals fail Tenzir's operator-path segment check in a walked package
      # tree). subPath does not live-propagate ConfigMap updates — package
      # changes need a pod roll.
      - name: packages-homelab
        mountPath: /etc/tenzir/packages/homelab/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-homelab-tetragon-parse
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/parse.tql
        subPath: parse.tql
        readOnly: true
      - name: packages-homelab-tetragon-map
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-tetragon-exec
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_exec.tql
        subPath: process_exec.tql
        readOnly: true
      - name: packages-homelab-tetragon-exit
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_exit.tql
        subPath: process_exit.tql
        readOnly: true
      - name: packages-homelab-tetragon-kprobe
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_kprobe.tql
        subPath: process_kprobe.tql
        readOnly: true
      - name: packages-homelab-record-integrity-attest
        mountPath: /etc/tenzir/packages/homelab/operators/record_integrity/attest.tql
        subPath: attest.tql
        readOnly: true
      - name: packages-homelab-record-integrity-verify
        mountPath: /etc/tenzir/packages/homelab/operators/record_integrity/verify.tql
        subPath: verify.tql
        readOnly: true
      # The file logger's home (tenzir-logs volume above).
      - name: tenzir-logs
        mountPath: /var/log/tenzir
