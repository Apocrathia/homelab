---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-tetragon

resources:
  - helmrelease.yaml

# TQL definitions live as .tql files under pipelines/ (one per
# pipeline); the generator below packages them and the replacements
# stitch them into the HelmRelease at build time. The ocsf-archive.tql
# compaction-rule entry and the storage.yaml lake-PVC exclusion died
# with lap 2a-2 (the lake is gone; nothing imports).
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-tetragon-pipelines
    namespace: tenzir
    files:
      - tetragon-ingest-http.tql=pipelines/tetragon-ingest-http.tql
      - tetragon-ocsf.tql=pipelines/tetragon-ocsf.tql
      - geo-open-loader.tql=pipelines/geo-open-loader.tql
      - pipeline-metrics-to-mimir.tql=pipelines/pipeline-metrics-to-mimir.tql
      - error-diagnostics-to-mimir.tql=pipelines/error-diagnostics-to-mimir.tql
      - diagnostics-to-loki.tql=pipelines/diagnostics-to-loki.tql
      - tetragon-attest-verify.tql=pipelines/tetragon-attest-verify.tql

replacements:
  - source:
      kind: ConfigMap
      name: tenzir-tetragon-pipelines
      fieldPath: data.[tetragon-ingest-http.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-tetragon
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.tetragon-ingest-http.definition
  - source:
      kind: ConfigMap
      name: tenzir-tetragon-pipelines
      fieldPath: data.[tetragon-ocsf.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-tetragon
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.tetragon-ocsf.definition
  - source:
      kind: ConfigMap
      name: tenzir-tetragon-pipelines
      fieldPath: data.[geo-open-loader.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-tetragon
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.geo-open-loader.definition
  - source:
      kind: ConfigMap
      name: tenzir-tetragon-pipelines
      fieldPath: data.[pipeline-metrics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-tetragon
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.pipeline-metrics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-tetragon-pipelines
      fieldPath: data.[error-diagnostics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-tetragon
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.error-diagnostics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-tetragon-pipelines
      fieldPath: data.[diagnostics-to-loki.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-tetragon
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.diagnostics-to-loki.definition
  - source:
      kind: ConfigMap
      name: tenzir-tetragon-pipelines
      fieldPath: data.[tetragon-attest-verify.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-tetragon
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.tetragon-attest-verify.definition
