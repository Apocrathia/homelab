---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-core

resources:
  - helmrelease.yaml
  - storage.yaml

# TQL definitions live as .tql files under pipelines/ (one per
# pipeline, plus ocsf-archive.tql for the compaction rule where
# present); the generator below packages them and the replacements
# stitch them into the HelmRelease at build time.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-core-pipelines
    namespace: tenzir
    files:
      - k8s-audit-ingest-http.tql=pipelines/k8s-audit-ingest-http.tql
      - k8s-audit-ingest-grpc.tql=pipelines/k8s-audit-ingest-grpc.tql
      - k8s-audit-ocsf.tql=pipelines/k8s-audit-ocsf.tql
      - sigma-detect.tql=pipelines/sigma-detect.tql
      - http-ingest.tql=pipelines/http-ingest.tql
      - authentik-pull.tql=pipelines/authentik-pull.tql
      - authentik-ocsf.tql=pipelines/authentik-ocsf.tql
      - fleet-ocsf.tql=pipelines/fleet-ocsf.tql
      - trivy-ocsf.tql=pipelines/trivy-ocsf.tql
      - geo-open-loader.tql=pipelines/geo-open-loader.tql
      - opencti-osint-loader.tql=pipelines/opencti-osint-loader.tql
      - fleet-assets-loader.tql=pipelines/fleet-assets-loader.tql
      - pipeline-metrics-to-mimir.tql=pipelines/pipeline-metrics-to-mimir.tql
      - sigma-metrics-to-mimir.tql=pipelines/sigma-metrics-to-mimir.tql
      - error-diagnostics-to-mimir.tql=pipelines/error-diagnostics-to-mimir.tql
      - diagnostics-to-loki.tql=pipelines/diagnostics-to-loki.tql
      - ocsf-archive.tql=pipelines/ocsf-archive.tql
      - detection-attest-verify.tql=pipelines/detection-attest-verify.tql

replacements:
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[k8s-audit-ingest-http.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.k8s-audit-ingest-http.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[k8s-audit-ingest-grpc.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.k8s-audit-ingest-grpc.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[k8s-audit-ocsf.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.k8s-audit-ocsf.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[sigma-detect.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.sigma-detect.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[http-ingest.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.http-ingest.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[authentik-pull.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.authentik-pull.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[authentik-ocsf.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.authentik-ocsf.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[fleet-ocsf.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.fleet-ocsf.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[trivy-ocsf.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.trivy-ocsf.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[geo-open-loader.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.geo-open-loader.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[opencti-osint-loader.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.opencti-osint-loader.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[fleet-assets-loader.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.fleet-assets-loader.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[pipeline-metrics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.pipeline-metrics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[sigma-metrics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.sigma-metrics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[error-diagnostics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.error-diagnostics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[diagnostics-to-loki.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.diagnostics-to-loki.definition
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[ocsf-archive.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.plugins.compaction.time.rules.0.pipeline
  - source:
      kind: ConfigMap
      name: tenzir-core-pipelines
      fieldPath: data.[detection-attest-verify.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-core
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.detection-attest-verify.definition
