---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-core
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # The node boots through a multi-minute partition-catalog load before
    # the :5158 probe can pass; the 5m default races it and rolls back.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-core + entry core would
    # double to tenzir-node-core-core. The override pins fullname
    # at tenzir-node so the entry renders tenzir-node-core.
    fullnameOverride: tenzir-node
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.20.0

    # Startup gate for multi-minute partition-catalog loads (chart-native
    # since tenzir-node 0.2.0): 10s x 60 = 10-minute boot budget, matching
    # the install/upgrade timeouts above.
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60

    # Registers into the hosted Tenzir Platform workspace (app.tenzir.com):
    # the chart injects the TENZIR_TOKEN env from the tenzir-secrets Secret,
    # this node reading its own pre-provisioned node token from the
    # core-node-token field. Platform tokens are per-node, never shared.
    nodes:
      - name: core
        token:
          existingSecret: tenzir-secrets
          key: core-node-token
        # accept_otlp listeners: otlp-grpc 4317 + otlp-http 4318. The
        # kube-audit alloy and the shared alloy OTLP log fan-out push at
        # tenzir-node-core:4318 (the tetragon alloy moved to the tetragon
        # node); the fleet webhook and the trivy-report-reader POST to
        # http-ingest 8080. NetFlow 2055/UDP moved to the netflow node,
        # tenzir-ingest-lb selector flipped with it.
        extraPorts:
          - name: otlp-grpc
            containerPort: 4317
          - name: otlp-http
            containerPort: 4318
          - name: http-ingest
            containerPort: 8080

    # Stateless: every OCSF pipeline writes directly to ClickHouse with
    # in-stream attestation — no lake import, no archive rule. No PVC.
    # Context tables are all memory; platform registration is via the
    # Secret.
    persistence:
      # enabled false is load-bearing: the chart defaults to a 10Gi PVC
      # when the key is absent, and that default is what the
      # vct-immutable upgrade failures were. False renders the state
      # volume as an emptyDir; platform registration rides the
      # 1Password token at boot.
      enabled: false

    # Node configuration (renders to the tenzir-node-core-config ConfigMap
    # and rolls the pod on change). Nothing secret may live here: values land
    # in a ConfigMap in plaintext. Secrets arrive via extraEnv below.
    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Server-log verbosity: the chart's injected default
          # (tenzir.file-verbosity: quiet) writes nothing to server.log,
          # so pipeline failures that point at it — the 2026-10-17
          # class_uid compaction incident surfaced "partition transform:
          # pipeline failed; see server log for diagnostics" with an
          # empty log behind it — stay blind. warning puts the file at
          # the problem surface ([warning]/[error]/[critical], the lines
          # the docs' troubleshooting grep filters for) without the
          # info-level chatter. server.log lands at /var/log/tenzir (the
          # image's TENZIR_LOG_FILE=/var/log/tenzir/server.log) and
          # rotates at 10 MiB — readOnlyRootFilesystem made that path
          # unwritable, the 2026-10-17 crashloop, until the tenzir-logs
          # emptyDir (extraVolumes below) backed it.
          file-verbosity: warning
          # Node-resident enrichment state (contexts are per-node, shared
          # across this node's pipelines, and survive pipeline restarts;
          # creation arguments apply only at creation, so this block never
          # reconfigures an existing context — each context's loader
          # pipeline is the refresh path). The geoip context is created
          # empty at boot and filled by context_load of CIRCL's free Geo
          # Open country+ASN MMDB (~80 MiB in node memory, headroom the
          # 8Gi limit absorbs); no GeoLite2/MaxMind route, so no
          # license-key secret rides this node (see geo-open-loader).
          # The osint lookup table is the consumer half of the intel
          # node's factory row: opencti-osint-loader applies the
          # ocsf.OSINT_Inventory_Info table into it via
          # tenzir::osint::update_context, entries expiring 30d after
          # their last application (the operator's max_age); declared
          # empty at boot, same pattern as geo-open.
          # The fleet_assets lookup table (lap 2) is filled hourly by the
          # fleet-assets-loader pipeline below from the enrichment
          # node's ClickHouse output — the factory/loader split of the
          # vendored asset-inventory guide; contexts are per-node, so
          # this node's own loader owns its copy (the enrichment node
          # only writes the shared source table).
          contexts:
            geo-open:
              type: geoip
            ocsf-osint:
              type: lookup-table
            fleet_assets:
              type: lookup-table
            # Chain state for the detection-plane record_integrity lane
            # (the archive rule's attest leg + the verify pipeline): one
            # lookup-table entry (key = the node identity constant
            # tenzir-node-core) holding the per-node chain's cross-pass
            # tail — the previous archive pass's last record uid,
            # type_uid, and fingerprint, which the next pass's first
            # record links to as prev_event (the batch seam; the
            # intra-batch links ride the attest operator's internal
            # lag — probed: context reads run engine-batches ahead of
            # the writes at batch rate, so the context is the seam
            # channel only, never the intra-batch channel). Same shape
            # as the investigations node's investigations-chains. The
            # table is memory: a NODE restart loses it, and the next
            # pass's first record restarts the chain with prev_event
            # absent plus one WARNING diagnostic from attest (the
            # epoch marker; best-effort per node lifetime — the verify
            # lane's per-record fingerprint recompute still catches
            # post-hoc mutation across restarts, only the linkage gap
            # around a restart is lost, documented in the datalake
            # README).
            detection-chains:
              type: lookup-table
          # Pipeline definitions live in pipelines/<id>.tql; this
          # kustomization's replacements stitch them back into these
          # empty definition fields at build time.
          pipelines:
            k8s-audit-ingest-http:
              name: k8s-audit ingest http
              description: |
                OTLP/HTTP listener for the kube-audit alloy and the shared
                alloy OTLP log fan-out; unpacks audit JSON bodies onto
                k8s-audit.raw; OTLP streams without a parser are dropped.
              definition: ""
              restart-on-error: 1 minute
            k8s-audit-ingest-grpc:
              name: k8s-audit ingest grpc
              description: |
                OTLP/gRPC listener for future OTLP-native senders; unpacks
                audit JSON bodies onto k8s-audit.raw; OTLP streams without
                a parser are dropped.
              definition: ""
              restart-on-error: 1 minute
            k8s-audit-ocsf:
              name: k8s-audit ocsf
              description: |
                k8s audit -> OCSF API Activity (6003), then derive +
                schema-validate and store in the node. Enrichment runs
                after the cast and before the store/publish legs, so the
                lake, the archive, the sigma pass, and the unified OCSF
                bus all see the enriched record: the API caller's origin
                (src_endpoint.ip, sourceIPs[0] — a clean, always-present
                source-IP field in the audit fixtures) gains geo country +
                ASN from the node-resident geo-open context (filled by
                geo-open-loader), mapped into OCSF endpoint fields
                (endpoint.location.country,
                network_endpoint.autonomous_system). Unconditional
                operators are safe here: every event is API Activity with
                src_endpoint set by the map, and a null IP (empty
                sourceIPs) degrades to a bare endpoint via the gated
                assignments. sourceIPs[0] is dominantly cluster-internal
                (pod/service CIDRs) — Geo Open marks those not routed and
                the filters leave the endpoint bare, so only external
                API callers (operator kubectl, anything outside the
                cluster) actually geolocate. No dns_lookup: pod/service
                PTRs are NXDOMAIN noise in the homelab DNS and external
                callers already carry the provider in the ASN name.
                Publishes onto the unified OCSF bus every normalized feed
                shares.
              definition: ""
              restart-on-error: 1 minute
            sigma-detect:
              name: sigma detect
              description: |
                One sigma pass over the unified OCSF bus. mapping="auto"
                selects behavior per input schema: OCSF-shaped schemas get
                translated rules; a rule whose fields do not resolve for a
                schema is skipped with one warning per revision, never
                weakened. The homelab rules are written against OCSF field
                paths; the vendored SigmaHQ kubernetes corpus names raw
                audit fields and stays parked until upstream translates it
                (detections/README.md documents the skip). Matches become
                OCSF Detection Findings (2004) stamped with the stable uid
                (rule id + subject composite) and import into the node
                lake; the ocsf archive rule exports them to ClickHouse
                after the 15-minute horizon. Grafana owns alerting off
                the archive — there is no other egress.
              definition: ""
              restart-on-error: 1 minute
            http-ingest:
              name: http ingest
              description: |
                HTTP listener for push-based SIEM sources: the fleet osquery
                result webhook (rows envelope) and the trivy-report-reader
                (report files stamped with report_kind). Routes by payload
                shape onto per-source raw topics.
              definition: ""
              restart-on-error: 1 minute
            authentik-pull:
              name: authentik pull
              description: |
                Polls the authentik events API every 5 minutes (Bearer token
                via the authentik-events-token managed secret), walking the
                page-based pagination with a DjangoQL created-time window;
                deduplicate absorbs the 1-minute overlap on the event pk.
              definition: ""
              restart-on-error: 1 minute
            authentik-ocsf:
              name: authentik ocsf
              description: |
                authentik events -> OCSF: login/logout/login_failed map to
                Authentication, account mutations to Account Change, and
                every other action to the Base Event; derive + cast, store
                in the node, and publish onto the unified OCSF bus.
                Enrichment runs after the cast and before the
                store/publish legs, so the lake, the archive, the sigma
                pass, and the bus all see the enriched record: the login
                geo — src_endpoint.ip (client_ip) gains country + ASN from
                the node-resident geo-open context (filled by
                geo-open-loader), mapped into OCSF endpoint fields
                (endpoint.location.country,
                network_endpoint.autonomous_system). The fork_merge
                complementary-where gate covers both IAM classes, which
                all carry src_endpoint (login/logout/login_failed and the
                account mutations alike — geo answers "from where was this
                account changed", not just where the login happened);
                the Base Event arm has no endpoint and passes through
                untouched (a null-key context_enrich still writes its
                into-field, probed on v6.19.1, so the mixed-class stream
                cannot run the operators unconditionally). No dns_lookup:
                LAN clients have no PTRs in the homelab DNS and attacker
                PTRs are absent or ISP-generic — the ASN name already
                carries the provider, and a hostname would add no triage
                signal a failed-login hunt actually uses. Private
                addresses stay bare; Geo Open marks them not routed and
                the gated assignments filter those markers.
              definition: ""
              restart-on-error: 1 minute
            fleet-ocsf:
              name: fleet ocsf
              description: |
                Fleet osquery result rows -> OCSF Base Event (a row's
                meaning comes from its query; no scheduled query exists
                yet), derive + cast, store in the node, and publish onto
                the unified OCSF bus.
              definition: ""
              restart-on-error: 1 minute
            trivy-ocsf:
              name: trivy ocsf
              description: |
                trivy-operator report files (read by the trivy-report-reader
                off the alternate-report-storage PVC) -> OCSF:
                VulnerabilityReport -> Vulnerability Finding with the CVE
                list, ExposedSecretReport -> Detection Finding; derive +
                cast, stamp the Detection Findings with the same uid rule
                the sigma pipeline uses, store in the node, and publish
                onto the unified OCSF bus.
              definition: ""
              restart-on-error: 1 minute
            geo-open-loader:
              name: geo open loader
              description: |
                Builder pipeline for the geo-open geoip context (declared
                in the contexts block above): fetches CIRCL's free Geo
                Open country+ASN MMDB and atomically replaces the context
                state — the two-pipeline builder/consumer shape from the
                vendored add-enrichment-contexts tutorial. Geo Open over
                GeoLite2 on purpose: MaxMind needs a license account plus
                out-of-band download plumbing (tar.gz extract,
                initContainer or CronJob) for city/coords this lab's
                login-geo and API-caller triage does not need; Geo Open
                answers country + ASN in one MMDB fetched in-band, no
                license, no extra volume, no secret. The read_all
                binary=true / write_all data round trip is not redundant:
                from_http requires a parser, so read_all wraps the ~80 MiB
                download into one event and write_all unwraps it to the
                byte stream context_load consumes. context_load replaces
                the whole state, so a failed fetch never half-updates —
                the context keeps serving the last good database and
                restart-on-error retries in a minute. every 24h fires its
                first run at pipeline start (fresh node: context filled
                seconds after boot; until then the audit and authentik
                maps pass events through unenriched with one warning, by
                design). CIRCL publishes a fresh snapshot daily, so 24h
                keeps lookups current without hammering the mirror. The
                loader is decoupled from the detection plane: a slow or
                failed MMDB fetch never stalls the sigma pass or the
                bus (the context keeps serving the last good database).
              definition: ""
              restart-on-error: 1 minute
            opencti-osint-loader:
              name: opencti osint loader
              description: |
                Consumer half of the intel factory doctrine: reads the
                intel node's ocsf.OSINT_Inventory_Info ClickHouse
                table into this node's ocsf-osint lookup-table context
                (declared in the contexts block) through the vendored
                library `tenzir` package's update_context operator. The
                factory appends the collection's current state on every
                walk, so the loader applies updates in event-time order
                — the indicator's STIX modified time, ORDER BY
                server-side: per key the newest version lands last, and
                a revoked row (status Removed; STIX versioning bumps
                modified on revoke) erases the key after older active
                copies re-applied it; expired indicators erase
                regardless of order. The read rides SQL-mode
                projection, not table mode (6.19.1 table mode does not
                reconstruct catch-alls at all, and 6.20 table mode
                re-types IP-shaped indicator values — the vendored
                operators pin string keys): the projection re-types the
                osint array back to record shape with values coerced to
                strings, and rows without a joinable indicator value
                (compound/yara patterns) drop before the update. The
                round trip rebuilds the event fields but not the
                schema name, so the pipeline stamps @name back —
                update_context gates on it. max_age=30d is the upstream
                default: entries unseen by a walk for 30d age out.
                every 24h fires at pipeline start (fresh node:
                context filled seconds after boot, same shape as
                geo-open-loader), then daily — the factory's own walk
                is daily, so the context converges to the table state
                daily. In-stream enrichment of live events with this
                context stays at the category-4 (Network Activity)
                ingress nodes per the doctrine; no consumer of the
                context runs on this node yet.
              definition: ""
              restart-on-error: 1 minute
            fleet-assets-loader:
              name: fleet assets loader
              description: |
                Lap-2 consumer half of the fleet_assets factory: reads
                the enrichment node's ocsf.fleet_assets output from the
                ClickHouse query store and fills this node's
                fleet_assets lookup-table context (declared in the
                contexts block above; contexts are per-node, so this
                node needs its own loader — the enrichment node only
                writes the shared table). SELECT ... FINAL collapses
                each Fleet host uuid to its highest-last_seen row (the
                ReplacingMergeTree version column); ORDER BY last_seen
                ASC makes context_update's last-write-wins land the
                freshest host on any IP shared across hosts (DHCP
                reuse). Rows without a primary_ip cannot join events
                and are skipped in the SQL. every 1h fires at pipeline
                start, then hourly — authentik and k8s-audit events
                pass unenriched until the first successful load (the
                empty lookup table is a no-op miss, the geo-open
                boot-window precedent). restart-on-error retries a
                missing table on a fresh cluster until the CHI startup
                script lands the DDL.
              definition: ""
              restart-on-error: 1 minute
            pipeline-metrics-to-mimir:
              name: pipeline metrics to mimir
              description: |
                Pushes the node's tenzir.metrics.pipeline events (per-pipeline
                ingress/egress event counts, emitted every 10s) to the Mimir
                remote-write endpoint kube-prometheus-stack remote-writes to;
                the mimir gateway injects the tenant header, so no auth here.
                Raw shape, not shape="prometheus" — that transform drops all
                non-health schemas, pipeline metrics included. Grafana reads
                the tenzir_pipeline_{ingress,egress}_events series; note this
                pipeline (and its siblings) also self-report in those series.
                The internal label carries the metric event's per-direction
                internal flag (ingress.internal / egress.internal), so
                bus-internal flow (publish, import, subscribe) is separable
                from external export in the series; the node label pins the
                pushing node — pipeline_ids are not node-qualified
                (live-verified 2026-10-17: the vendored docs'
                demo-node/m57-suricata example applies to platform pipelines,
                not node-config pipelines), and without it the same-named
                self-reports from this node and the siblings collide on one
                series (observed live: core and netflow interleaved samples
                on the shared pipeline-metrics-to-mimir series with Mimir's
                same-timestamp handling eating roughly half of them).
              definition: ""
              restart-on-error: 1 minute
            sigma-metrics-to-mimir:
              name: sigma metrics to mimir
              description: |
                Pushes the tenzir.metrics.sigma events (rule evaluations and
                matches per input batch) to Mimir as tenzir_sigma_* series —
                matches are the findings volume the dashboard shows. No
                pipeline labels: the sigma metric schema documents only the
                count fields.
              definition: ""
              restart-on-error: 1 minute
            detection-attest-verify:
              name: detection attestation verify
              description: |
                Verification half of the detection-plane record_integrity
                lane: reads the last 24h of every core-node ocsf class back
                (the six per-class tables via table-mode from_clickhouse —
                the vendor catch-all reconstruction — merged into one
                stream, because the per-node chain crosses classes),
                recomputes each attestation's fingerprint over the
                canonical serialization, and walks the per-node prev_event
                chain (chain_uid = tenzir-node-core); a Detection Finding
                (2004) drops onto stdout for every break — content tamper
                (fingerprint_mismatch), deletion (chain_link_mismatch), or
                splice — while the windowed walk tolerates its own edge
                (the first record's predecessor lives outside the 24h
                read). The walk is SCHEDULED hourly (the every wrapper,
                the loader-pipeline shape): the first walk fires at
                pipeline start, then every 1h re-walks the rolling 24h
                window. Each break's finding rides two legs: stdout
                (pod-log visibility) and, via ocsf_derive + ocsf_cast, an
                INSERT into ocsf.Detection_Finding with the tenzir user —
                landing inside the Grafana tenzir-findings rule's WHERE
                clauses (class 2004, severity 4), so tamper evidence pages
                through the agent_invoke bridge instead of waiting for a
                human to read pod logs. The package tests prove the walk
                and the finding shape (homelab package:
                detection-verify-clean / -tamper / -finding baselines,
                and the 100k throughput harness pins the stamping
                cost).
              definition: ""
              restart-on-error: 1 minute
            error-diagnostics-to-mimir:
              name: error diagnostics to mimir
              description: |
                Pushes a tenzir_pipeline_errors / tenzir_pipeline_warnings
                sample (value 1, pipeline labels, node label = core) to Mimir
                for every live error / warning diagnostic, so the dashboard can
                count both severities with sum_over_time. They otherwise live
                only in the diagnostics stream, not in metrics. Restored per-node (B1)
                with the central poller's retirement.
              definition: ""
              restart-on-error: 1 minute
            diagnostics-to-loki:
              name: diagnostics to loki
              description: |
                Ships every live, not-hidden pipeline diagnostic to Loki as
                job=tenzir-diagnostics entries (node label = core).
                to_fluent_bit resolves $pipeline_name and $severity per event
                and consumes both out of the shipped body (live-verified
                2026-10-17 probe); drop discards the ANSI escape-coded
                rendered field, so the line keeps the rest of the diagnostic
                record — pipeline_id, hidden, run, timestamp, message, notes,
                annotations — and the labels carry pipeline + severity. Hidden
                entries (platform-UI pipeline deprecation noise) stay out.
                Plain HTTP to loki-write, cluster-internal. live=true without
                retro: no store-backlog replay on start, so restarts never
                re-ship history (Loki has no dedup) — restored per-node (B1)
                with the central poller's retirement: every node ships its own
                pair now, so no cross-node consumer can ever blind against it.
              definition: ""
              restart-on-error: 1 minute

    # Sized by the docs' formula for this node's shape (full math in
    # core/README.md): detection (+1), normalization on 4 sources (+0.8),
    # sources+destinations (+0.5) -> ceil(2.304) = 3 cores; the formula's
    # memory floor is 2 GB at the 15-minute horizon, but the boot catalog
    # load pulls 76k partition synopses into RAM and OOMKilled the node at
    # ~94% of load under the old 4Gi on every start (the tetragon sibling:
    # 4.7k synopses under 12Gi) — 8Gi clears the boot load with ingest and
    # import headroom. Requests stay small: talos-04 CPU requests are 92%
    # committed, and limits are caps, not reservations.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 8Gi

    # Secrets (1Password item tenzir-secrets): vault field labels are
    # kebab-case and the rendered Secret keys match them, so every
    # secretKeyRef.key below is the kebab vault label; env var names stay
    # UPPER. The authentik events API token rides as
    # `authentik-events-token` (TENZIR_SECRETS__ map; tofu mints the
    # token, the operator copies the key into the vault once). The
    # ClickHouse writer password rides the
    # same tenzir-secrets item (this namespace materializes its
    # OnePasswordItem in secret.yaml): the env var maps to config key
    # tenzir.secrets.clickhouse-password, so the to_clickhouse archive
    # legs read it as secret("clickhouse-password") — kebab name, the
    # same env-var shape as the authentik token. The retired to_s3 tail's
    # rustfs AWS_* env entries are gone with the MR-5 teardown; the
    # aws-* fields stay on the tenzir-secrets item, unused, for the
    # operator to delete.
    extraEnv:
      - name: TENZIR_SECRETS__AUTHENTIK_EVENTS_TOKEN
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: authentik-events-token
      - name: TENZIR_SECRETS__CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: clickhouse-password

    # Detection content: the homelab TQL mapping package (IaC-installed at
    # /etc/tenzir/packages/homelab) and the sigma rule directories, all
    # rendered by configMapGenerator in this kustomization. Package files
    # mount file-level (subPath; see extraVolumeMounts for why); sigma rule
    # dirs stay directory mounts and hot-reload every 30s. subPath does not
    # see ConfigMap updates, so mapping-package changes need a StatefulSet
    # bounce (nothing checksum-rolls these ConfigMaps either).
    extraVolumes:
      - name: packages-homelab
        configMap:
          name: tenzir-packages-homelab
      - name: packages-homelab-audit-parse
        configMap:
          name: tenzir-packages-homelab-audit-parse
      - name: packages-homelab-ocsf-map
        configMap:
          name: tenzir-packages-homelab-ocsf-map
      - name: packages-homelab-findings-stamp
        configMap:
          name: tenzir-packages-homelab-findings-stamp
      - name: packages-homelab-authentik-map
        configMap:
          name: tenzir-packages-homelab-authentik-map
      - name: packages-homelab-fleet-parse
        configMap:
          name: tenzir-packages-homelab-fleet-parse
      - name: packages-homelab-fleet-map
        configMap:
          name: tenzir-packages-homelab-fleet-map
      - name: packages-homelab-trivy-map
        configMap:
          name: tenzir-packages-homelab-trivy-map
      - name: packages-homelab-record-integrity-attest
        configMap:
          name: tenzir-packages-homelab-record-integrity-attest
      - name: packages-homelab-record-integrity-verify
        configMap:
          name: tenzir-packages-homelab-record-integrity-verify
      - name: sigma-homelab
        configMap:
          name: tenzir-sigma-homelab
      - name: sigma-sigmahq-kubernetes-audit
        configMap:
          name: tenzir-sigma-sigmahq-kubernetes-audit
      # Vendored library `tenzir` utilities package: the OSINT pair the
      # opencti-osint-loader pipeline calls (update_context) plus its
      # enrich sibling (unconsumed until a category-4 ingress node wires
      # in-stream enrichment). One ConfigMap per mounted file, generated
      # at the root kustomization.
      - name: packages-tenzir
        configMap:
          name: tenzir-packages-tenzir
      - name: packages-tenzir-osint-update-context
        configMap:
          name: tenzir-packages-tenzir-osint-update-context
      - name: packages-tenzir-osint-enrich
        configMap:
          name: tenzir-packages-tenzir-osint-enrich
      # Writable target for the node's own file logger (file-verbosity
      # above): server.log opens at /var/log/tenzir on every boot, which
      # readOnlyRootFilesystem made unwritable — the 2026-10-17
      # crashloop. emptyDir, same lifecycle as the tmp mount; the 10 MiB
      # rotation cap bounds the disk cost.
      - name: tenzir-logs
        emptyDir: {}

    extraVolumeMounts:
      # Package files mount file-level: kubelet's atomic ConfigMap writer
      # keeps ..data/..2026_* internals at every directory-mount root, and
      # inside the walked package tree they fail Tenzir's operator-path
      # segment check (SRE-20261010-001 crashloop). subPath binds the single
      # projected file; kubelet auto-creates parent dirs, and the walked tree
      # contains only the package files. subPath does not live-propagate
      # ConfigMap updates — package changes need a pod roll.
      - name: packages-homelab
        mountPath: /etc/tenzir/packages/homelab/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-homelab-audit-parse
        mountPath: /etc/tenzir/packages/homelab/operators/k8s/audit/parse.tql
        subPath: parse.tql
        readOnly: true
      - name: packages-homelab-ocsf-map
        mountPath: /etc/tenzir/packages/homelab/operators/k8s/audit/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-findings-stamp
        mountPath: /etc/tenzir/packages/homelab/operators/findings/stamp.tql
        subPath: stamp.tql
        readOnly: true
      - name: packages-homelab-authentik-map
        mountPath: /etc/tenzir/packages/homelab/operators/authentik/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-fleet-parse
        mountPath: /etc/tenzir/packages/homelab/operators/fleet/parse.tql
        subPath: parse.tql
        readOnly: true
      - name: packages-homelab-fleet-map
        mountPath: /etc/tenzir/packages/homelab/operators/fleet/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-trivy-map
        mountPath: /etc/tenzir/packages/homelab/operators/trivy/ocsf/map.tql
        subPath: map.tql
        readOnly: true # The shared record_integrity operators: the archive rule's attest
      # leg and the detection-attest-verify pipeline call them directly.
      - name: packages-homelab-record-integrity-attest
        mountPath: /etc/tenzir/packages/homelab/operators/record_integrity/attest.tql
        subPath: attest.tql
        readOnly: true
      - name: packages-homelab-record-integrity-verify
        mountPath: /etc/tenzir/packages/homelab/operators/record_integrity/verify.tql
        subPath: verify.tql
        readOnly: true
      - name: packages-tenzir
        mountPath: /etc/tenzir/packages/tenzir/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-tenzir-osint-update-context
        mountPath: /etc/tenzir/packages/tenzir/operators/osint/update_context.tql
        subPath: update_context.tql
        readOnly: true
      - name: packages-tenzir-osint-enrich
        mountPath: /etc/tenzir/packages/tenzir/operators/osint/enrich.tql
        subPath: enrich.tql
        readOnly: true
      # Sigma stays directory-mounted to keep the 30s rule hot-reload.
      - name: sigma-homelab
        mountPath: /etc/tenzir/sigma/homelab
        readOnly: true
      - name: sigma-sigmahq-kubernetes-audit
        mountPath: /etc/tenzir/sigma/sigmahq/kubernetes-audit
        readOnly: true
      # The file logger's home (tenzir-logs volume above).
      - name: tenzir-logs
        mountPath: /var/log/tenzir
