---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-intel

resources:
  - helmrelease.yaml

# TQL definitions live as .tql files under pipelines/ (one per
# pipeline); the generator below packages them and the replacements
# stitch them into the HelmRelease at build time.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-intel-pipelines
    namespace: tenzir
    files:
      - opencti-taxii-factory.tql=pipelines/opencti-taxii-factory.tql

replacements:
  - source:
      kind: ConfigMap
      name: tenzir-intel-pipelines
      fieldPath: data.[opencti-taxii-factory.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-intel
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.opencti-taxii-factory.definition
