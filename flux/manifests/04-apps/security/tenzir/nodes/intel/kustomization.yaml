---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-intel

resources:
  - helmrelease.yaml

# TQL definitions live as .tql files under pipelines/ (one per
# pipeline); the generator below packages them and the replacements
# stitch them into the HelmRelease at build time.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-intel-pipelines
    namespace: tenzir
    files:
      - opencti-taxii-factory-walk.tql=pipelines/opencti-taxii-factory-walk.tql
      - opencti-taxii-factory-poll.tql=pipelines/opencti-taxii-factory-poll.tql
      - error-diagnostics-to-mimir.tql=pipelines/error-diagnostics-to-mimir.tql
      - diagnostics-to-loki.tql=pipelines/diagnostics-to-loki.tql

replacements:
  - source:
      kind: ConfigMap
      name: tenzir-intel-pipelines
      fieldPath: data.[opencti-taxii-factory-walk.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-intel
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.opencti-taxii-factory-walk.definition
  - source:
      kind: ConfigMap
      name: tenzir-intel-pipelines
      fieldPath: data.[opencti-taxii-factory-poll.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-intel
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.opencti-taxii-factory-poll.definition
  - source:
      kind: ConfigMap
      name: tenzir-intel-pipelines
      fieldPath: data.[error-diagnostics-to-mimir.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-intel
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.error-diagnostics-to-mimir.definition
  - source:
      kind: ConfigMap
      name: tenzir-intel-pipelines
      fieldPath: data.[diagnostics-to-loki.tql]
    targets:
      - select:
          kind: HelmRelease
          name: tenzir-node-intel
        fieldPaths:
          - spec.values.tenzir.config.tenzir.pipelines.diagnostics-to-loki.definition
