---
# Custom Tenzir node dashboard (the node pushes tenzir_pipeline_* and
# tenzir_sigma_* series to Mimir via its metrics pipelines). JSON lives in
# ConfigMap tenzir-node-pipelines (generated from dashboard.json).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: tenzir-node-pipelines
  namespace: prometheus-system
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  configMapRef:
    name: tenzir-node-pipelines
    key: dashboard.json
  folder: Security
