---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir-grafana

resources:
  - grafana.yaml
  - ocsf-exploration.yaml
  - ocsf-findings.yaml
  - investigations-cases.yaml
  - investigations-case-detail.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenzir-node-pipelines
    namespace: prometheus-system
    files:
      - dashboard.json
  - name: tenzir-ocsf-exploration
    namespace: prometheus-system
    files:
      - ocsf-exploration.json
  - name: tenzir-ocsf-findings
    namespace: prometheus-system
    files:
      - ocsf-findings.json
  - name: tenzir-investigations-cases
    namespace: prometheus-system
    files:
      - investigations-cases.json
  - name: tenzir-investigations-case-detail
    namespace: prometheus-system
    files:
      - investigations-case-detail.json
