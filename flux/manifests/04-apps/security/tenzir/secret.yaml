---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
# Fields (1Password field label = rendered Secret key; vault labels are
# kebab-case, env var names stay UPPER):
#   aws-access-key-id      - rustfs bucket-scoped user for the `tenzir`
#                            bucket; the CHI cold tier reads it as
#                            CH_S3_ACCESS_KEY_ID (the clickhouse-namespace
#                            render of this item lives in
#                            clickhouse/secret.yaml)
#   aws-secret-access-key  - same, the bucket user's secret key
#                            (CH_S3_SECRET_ACCESS_KEY)
#   discord-webhook-url    - unused by the manifests (the zero-egress cut
#                            removed its consumer); the vault field stays
#                            for the operator's off-repo use
#   authentik-events-token - the ak-tenzir events token (tofu-minted by the
#                            tenzir-authentik Workspace; the operator copies
#                            the key into this field after the first apply)
#   core-node-token        - Tenzir Platform node token, core node
#   tetragon-node-token    - Tenzir Platform node token, tetragon node
#   netflow-node-token     - Tenzir Platform node token, netflow node
#                            (the operator provisions the node in the
#                            app.tenzir.com workspace and copies its
#                            tnz_... token into this field; token
#                            recipe step 2 in nodes/netflow/README.md)
#   investigations-node-token - Tenzir Platform node token, investigations
#                            node (nodes/investigations/)
#   enrichment-node-token  - Tenzir Platform node token, enrichment
#                            node (nodes/enrichment/)
#   introspection-node-token - Tenzir Platform node token, introspection
#                            node (nodes/introspection/)
#   intel-node-token       - Tenzir Platform node token, intel node
#                            (nodes/intel/; the operator provisions the
#                            node in the app.tenzir.com workspace and
#                            copies its tnz_... token into this field)
#   opencti-taxii-token     - OpenCTI TAXII 2.1 bearer token, written
#                            to the vault field by the opencti lane
#                            (docs/issues/opencti-deployment.md slice 7);
#                            the intel node reads it via
#                            TENZIR_SECRETS__OPENCTI_TAXII_TOKEN for its
#                            opencti-taxii-factory pipeline
#   investigations-api-token - the investigations node's web-server API
#                            token (operator-copied after a one-time
#                            `tenzir-ctl web generate-token` exec into the
#                            pod; the token itself persists as node
#                            state on the PVC — node README bootstrap)
# The chart injects TENZIR_TOKEN per node via nodes[].token (fields
# core-node-token / tetragon-node-token / netflow-node-token /
# investigations-node-token / enrichment-node-token /
# introspection-node-token / intel-node-token).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tenzir-secrets
  namespace: tenzir
spec:
  itemPath: "vaults/Secrets/items/tenzir-secrets"
---
# Tenzir-namespace materialization of the dedicated vault item
# clickhouse-secrets (clickhouse MR-3): the SAME item the clickhouse
# namespace renders from clickhouse/secret.yaml — one item, multiple
# OnePasswordItem CRs, the 1Password-operator pattern. Fields
# consumed here (1Password field label = rendered Secret key):
#   clickhouse-password - password of the ClickHouse `tenzir` user; each
#                        node HelmRelease reads it as
#                        TENZIR_SECRETS__CLICKHOUSE_PASSWORD for the
#                        to_clickhouse archive legs. Operator adds the
#                        value; git only names the field.
#   clickhouse-investigations-writer-password - password of the
#                        investigations-writer user (the investigations
#                        node's standing ingest pipeline to_clickhouse
#                        leg; rendered into users.d by the CHI users
#                        block in clickhouse/cluster.yaml).
#   clickhouse-investigations-reader-password - password of the
#                        investigations-reader user (the investigations
#                        node's API-launched from_clickhouse pipelines).
#                        Operator adds both values; git only names the
#                        fields.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clickhouse-secrets
  namespace: tenzir
spec:
  itemPath: "vaults/Secrets/items/clickhouse-secrets"
