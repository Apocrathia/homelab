---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
# ClickHouse-namespace materializations of two vault items, one file —
# "one item, multiple OnePasswordItem CRs", the 1Password-operator
# pattern (same shape as the tenzir namespace's renders in
# ../secret.yaml: the tenzir ns renders clickhouse-secrets, this ns
# renders tenzir-secrets).
#
# clickhouse-secrets fields consumed here (1Password field label =
# rendered Secret key):
#   clickhouse-password     - password of the ClickHouse `tenzir` user
#                             (CHI users block; the SAME vault field
#                             feeds the Tenzir nodes'
#                             TENZIR_SECRETS__CLICKHOUSE_PASSWORD)
#   clickhouse-grafana-password - password of the ClickHouse `grafana`
#                             user (SELECT-only datasource user)
#   clickhouse-investigations-writer-password - password of the
#                             investigations-writer user (standing
#                             investigations ingest pipeline)
#   clickhouse-investigations-reader-password - password of the
#                             investigations-reader user (API-launched
#                             from_clickhouse pipelines)
#   The aws-access-key-id / aws-secret-access-key fields (the rustfs
#   `clickhouse`-bucket user) became UNUSED when the cold tier moved to
#   the tenzir bucket with tenzir-secrets creds — the operator removes
#   them; git only stopped referencing them.
#
# tenzir-secrets fields consumed here:
#   aws-access-key-id      - rustfs bucket-scoped user for the `tenzir`
#                            bucket; the CHI pod env reads it as
#                            CH_S3_ACCESS_KEY_ID for the cold S3 disk
#                            (from_env in config/00-storage-tiered.xml).
#                            Same item the tenzir namespace renders
#                            (../secret.yaml) — this render is the
#                            clickhouse-namespace copy.
#   aws-secret-access-key  - same bucket user's secret key
#                            (CH_S3_SECRET_ACCESS_KEY).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clickhouse-secrets
  namespace: clickhouse
spec:
  itemPath: "vaults/Secrets/items/clickhouse-secrets"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tenzir-secrets
  namespace: clickhouse
spec:
  itemPath: "vaults/Secrets/items/tenzir-secrets"
