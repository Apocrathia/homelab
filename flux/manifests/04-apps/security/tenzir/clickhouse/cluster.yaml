---
# yaml-language-server: $schema=https://raw.githubusercontent.com/Altinity/clickhouse-operator/master/deploy/helm/clickhouse-operator/crds/CustomResourceDefinition-clickhouseinstallations.clickhouse.altinity.com.yaml
# ClickHouse OCSF query store. Altinity operator shape (operator decision
# 2026-10-17, supersedes the generic-app shape in the old plan draft):
# 1 shard x 3 replicas of clickhouse-server behind a Keeper ensemble
# (keeper.yaml) - ReplicatedMergeTree tables, replication for pod/PVC-loss
# resilience, rolling updates orchestrated by the operator.
#
# In-cluster endpoints (operator-created Services; pattern prefixes are
# fixed by the operator namer):
#   clickhouse-tenzir.tenzir.svc.cluster.local  - CR-level service,
#     load-balanced across all hosts, HTTP 8123 + native 9000
#   chi-tenzir-ocsf-<shard>-<replica>...                   - per-host services
#   The {cluster} macro value is "ocsf" (the single cluster below).
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: tenzir
  namespace: tenzir
spec:
  configuration:
    # Keeper reference: the operator resolves the per-replica endpoints of
    # the ClickHouseKeeperInstallation named tenzir (keeper.yaml) and
    # renders the zookeeper config itself; it also waits for keeper pods to
    # be Running before reconciling this CHI.
    zookeeper:
      keeper:
        name: tenzir

    # ClickHouse users, rendered by the operator into users.d
    # (chop-generated-users). Passwords arrive as env vars the operator
    # injects from the tenzir-secrets Secret (the same OnePasswordItem
    # the S3 env and the Tenzir nodes read) - no secret values in git,
    # ever.
    # The operator also merges in localhost networks + a host_regexp for the
    # CHI's own service FQDNs on every user; networks below add the cilium
    # pod CIDR so in-cluster writers/readers connect from their pod IPs.
    # grants are users.xml-level RBAC (ClickHouse <grants> config): with
    # grants present, access is exactly what is granted.
    users:
      # Live writer + backfill user (Tenzir to_clickhouse, MR-3/MR-5).
      # SELECT is required by to_clickhouse's table-description refresh
      # (DESCRIBE) and the live-leg validation queries.
      tenzir/password:
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: clickhouse-password
      tenzir/networks/ip:
        - 10.42.0.0/16
      tenzir/grants/query:
        - GRANT INSERT, SELECT ON ocsf.*
      # Grafana datasource user (MR-2), SELECT-only. ocsf.* serves the
      # OCSF dashboards; investigations.* (2026-10-19, P-2) extends the
      # operator's examine surface to the case store — the
      # investigations-cases / investigations-case-detail dashboards over
      # investigations.records. Read-only like everything this user holds.
      grafana/password:
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: clickhouse-grafana-password
      grafana/networks/ip:
        - 10.42.0.0/16
      grafana/grants/query:
        - GRANT SELECT ON ocsf.*
        - GRANT SELECT ON investigations.*
      # Investigations-plane users (tenzir/nodes/investigations/). The
      # standing ingest pipeline writes with investigations-writer;
      # API-launched from_clickhouse pipelines read with
      # investigations-reader. Neither user can ALTER, TRUNCATE, or DROP
      # anything - wipe is not a permitted operation on this database;
      # the residual risk floor is append-only pollution (visible,
      # attributed, recoverable), not destruction.
      investigations-writer/password:
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: clickhouse-investigations-writer-password
      investigations-writer/networks/ip:
        - 10.42.0.0/16
      # INSERT-only is the design intent, but SELECT rides along for the
      # same live-verified reason the tenzir user carries it above:
      # to_clickhouse's table-description refresh runs DESCRIBE on the
      # target table. The grant stays scoped to investigations.*, and no
      # read pipeline ever runs with this user - the query lane is the
      # reader.
      investigations-writer/grants/query:
        - GRANT INSERT, SELECT ON investigations.*
      investigations-reader/password:
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: clickhouse-investigations-reader-password
      investigations-reader/networks/ip:
        - 10.42.0.0/16
      # The agent query lane: read the case store AND the lake tables
      # (evidence hunts pivot into ocsf.*). GRANT-mode RBAC already yields
      # read-only behavior (with grants present, access is exactly what is
      # granted).
      investigations-reader/grants/query:
        - GRANT SELECT ON investigations.*
        - GRANT SELECT ON ocsf.*

    files:
      # Placeholder keys, stitched at kustomize build time (the
      # authentik.tf / chaos-mesh build-time stitch shape):
      # kustomization.yaml's configMapGenerator packages the XML files
      # in config/ and the replacements rules copy their bytes into
      # these fields - config/00-storage-tiered.xml and
      # config/10-startup-scripts.xml are the single sources of truth;
      # never render this directory outside kustomize.
      config.d/00-storage-tiered.xml: ""
      config.d/10-startup-scripts.xml: ""

    clusters:
      - name: ocsf
        layout:
          shardsCount: 1
          replicasCount: 3

  defaults:
    templates:
      podTemplate: clickhouse-pod
      dataVolumeClaimTemplate: data

  templates:
    podTemplates:
      - name: clickhouse-pod
        spec:
          # Replication covers data safety, but co-located replicas turn
          # a single node crash into a multi-replica loss; require spread
          # across hosts (3 replicas, 4 nodes).
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: clickhouse.altinity.com/app
                        operator: In
                        values:
                          - chop
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
          containers:
            - name: clickhouse
              # Official image (prototype-validated build: rustfs multipart,
              # tiered storage, JSON types, startup_scripts all verified on
              # 25.8.33.6). The operator's own default is the same repo at
              # :latest - pin instead, renovate bumps.
              # renovate: datasource=docker depName=clickhouse/clickhouse-server
              image: clickhouse/clickhouse-server:25.12.11.4@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
              ports:
                - name: http
                  containerPort: 8123
                - name: client
                  containerPort: 9000
                # interserver HTTP: part fetches between replicas
                - name: interserver
                  containerPort: 9009
              env:
                # rustfs creds for the cold S3 disk (from_env in
                # 00-storage-tiered.xml); tenzir-bucket-scoped keys from
                # the tenzir-secrets item, rendered in this (tenzir)
                # namespace by ../secret.yaml - the same render the
                # Tenzir nodes read (the CHI moved into the tenzir
                # namespace 2026-10-27; its old clickhouse-namespace
                # render of the item is gone - one render per item now).
                - name: CH_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: tenzir-secrets
                      key: aws-access-key-id
                - name: CH_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tenzir-secrets
                      key: aws-secret-access-key
              resources:
                # 2026-10-20 rightsize (was 2Gi/6Gi MR-1 strawman): the big
                # Process_Activity/API_Activity partition merges kept failing
                # MEMORY_LIMIT_EXCEEDED at the 0.9-ratio server cap (5.4GiB of
                # the old 6Gi limit), every ~35s, occasionally liveness-
                # killing the pod. 12Gi limit => 10.8GiB server cap, 2x the
                # failing cap; 4Gi requests cover the observed 1.4-1.9GiB
                # steady usage. ClickHouse 25.12 has no merge-spill setting
                # (external sort/group-by are query-level only), so the cap
                # is the fix.
                requests:
                  cpu: 500m
                  memory: 4Gi
                limits:
                  cpu: "2"
                  memory: 12Gi
              readinessProbe:
                httpGet:
                  path: /ping
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /ping
                  port: http
                initialDelaySeconds: 30
                periodSeconds: 20
                timeoutSeconds: 5

    volumeClaimTemplates:
      - name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              # Hot tier per replica (~7d): each replica holds a full copy
              # of the data (replication), so the cluster reserves 3x this
              # cap; Longhorn grows on demand, so this is a ceiling.
              # Steady state at the observed ~9.4 GiB/day per replica
              # (read live 2026-10-27) is ~66 GiB per 7d hot window -
              # fits on 100Gi with headroom. No resize.
              storage: 100Gi
