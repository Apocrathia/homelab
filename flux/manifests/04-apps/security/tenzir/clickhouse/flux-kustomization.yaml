---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-clickhouse-cluster
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/manifests/04-apps/security/tenzir/clickhouse
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  # clickhouse.altinity.com / clickhouse-keeper.altinity.com CRDs are
  # installed by the operator chart's pre-install hook; the CRs below must
  # not be applied before it (house pattern from services-tetragon-policies
  # / services-chaos-mesh-experiments / services-renovate-operator-config).
  dependsOn:
    - name: services-clickhouse
    # The CRs live in the tenzir namespace; apps-security owns the
    # namespace and renders the clickhouse-secrets / tenzir-secrets
    # OnePasswordItems the CHI consumes (tenzir/secret.yaml - the CR
    # layer's own secret.yaml is gone since the store relocated; one
    # render per item). apps-security gates on bootstrap-1password
    # itself.
    - name: apps-security
    # Both CRs provision Longhorn PVCs.
    - name: infrastructure-longhorn
