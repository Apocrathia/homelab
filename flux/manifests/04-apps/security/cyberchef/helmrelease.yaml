---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cyberchef
  namespace: cyberchef
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.88"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  values:
    app:
      name: cyberchef
      namespace: cyberchef
      # renovate: datasource=docker depName=ghcr.io/gchq/cyberchef
      image: ghcr.io/gchq/cyberchef:11.5.0@sha256:f04a39926344faf8e4cbbc8c92fb125d2b466f9be62db09aff23c7c406101a51
      container:
        name: cyberchef
        port: 8080
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      # nginx-unprivileged: nginx master + workers run as uid/gid 101; pid
      # file and temp dirs live under /tmp, so the root fs stays read-only
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      service:
        type: ClusterIP
        port: 8080
        targetPort: 8080
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
        # nginx writes its pid and temp dirs under /tmp; writable scratch
        # on a read-only rootfs
        emptyDir:
          - name: tmp
            mountPath: /tmp

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    secrets:
      enabled: false

    authentik:
      managedBy: terraform
      enabled: true
      mode: "proxy"
      shared: true
      category: "Security"
      displayName: "CyberChef"
      externalHost: "https://cyberchef.gateway.services.apocrathia.com"
      icon: "https://cdn.gateway.services.apocrathia.com/homelab/flux/manifests/04-apps/security/cyberchef/icon.svg"
      metaDescription: "Cyber security Swiss Army knife — encode, decode, analyse data in the browser"
      metaPublisher: "GCHQ"

    httproute:
      enabled: false

    # Tailnet sharing via chart values
    tailnet:
      enabled: true

    gatus:
      enabled: true
      group: security
      path: /
