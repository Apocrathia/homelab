---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: romm
  namespace: romm

resources:
  - namespace.yaml
  - postgres.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: romm-config-desired
    namespace: romm
    files:
      - config.yml
    options:
      disableNameSuffixHash: true
