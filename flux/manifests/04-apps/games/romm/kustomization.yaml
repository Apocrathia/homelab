---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: romm
  namespace: romm

resources:
  - namespace.yaml
  - postgres.yaml
  - helmrelease.yaml
  - rbac.yaml
  - cronjob.yaml
  - import-cronjob.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: romm-config-desired
    namespace: romm
    files:
      - config.yml
    options:
      disableNameSuffixHash: true
  - name: romm-scan-scripts
    namespace: romm
    files:
      - src/trigger.sh
      - src/enqueue-scan.py
      - src/import-trigger.sh
      - src/import-esde-media.py
      - src/import-segments.py
    options:
      disableNameSuffixHash: true
