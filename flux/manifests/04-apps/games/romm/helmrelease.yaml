---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
  namespace: romm
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.74"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: romm
      # renovate: datasource=docker depName=ghcr.io/rommapp/romm
      image: ghcr.io/rommapp/romm:5.1.0@sha256:ce9d86ab531e09fede45d00f426e3bf2d1f5dd14846f94d6360d77a92a413028
      container:
        name: romm
        port: 8080
        env:
          # ROMM Base Configuration
          - name: ROMM_BASE_URL
            value: "https://romm.gateway.services.apocrathia.com"
          - name: ROMM_BASE_PATH
            value: "/romm"
          - name: ROMM_HOST
            value: "0.0.0.0"
          - name: ROMM_PORT
            value: "8080"
          - name: ROMM_AUTH_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: auth-secret-key
          - name: TZ
            value: "America/Denver"

          # Database Configuration (PostgreSQL)
          - name: ROMM_DB_DRIVER
            value: "postgresql"
          - name: DB_HOST
            value: "romm-postgres-rw.romm.svc.cluster.local"
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: "romm"
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: username
          - name: DB_PASSWD
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: password

          # Authentication Configuration
          - name: OIDC_ENABLED
            value: "true"
          - name: OIDC_PROVIDER
            value: "authentik"
          - name: DISABLE_USERPASS_LOGIN
            value: "true"
          - name: OIDC_ALLOW_REGISTRATION
            value: "false"
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: oidc-client-id
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: oidc-client-secret
          - name: OIDC_REDIRECT_URI
            value: "https://romm.gateway.services.apocrathia.com/api/oauth/openid"
          - name: OIDC_SERVER_APPLICATION_URL
            value: "https://auth.gateway.services.apocrathia.com/application/o/romm"

          - name: IGDB_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: igdb-client-id
          - name: IGDB_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: igdb-client-secret
          - name: SCREENSCRAPER_USER
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: screenscraper-username
          - name: SCREENSCRAPER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: screenscraper-password
          # - name: MOBYGAMES_API_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: romm-secrets
          #       key: mobygames-api-key
          - name: STEAMGRIDDB_API_KEY
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: steamgriddb-api-key
          - name: RETROACHIEVEMENTS_API_KEY
            valueFrom:
              secretKeyRef:
                name: romm-secrets
                key: retroachievements-api-key

          # Toggle-based metadata providers (no API keys required)
          - name: HASHEOUS_API_ENABLED
            value: "true"
          - name: LAUNCHBOX_API_ENABLED
            value: "true"
          - name: PLAYMATCH_API_ENABLED
            value: "true"

          # Scheduled Task Configuration
          - name: ENABLE_SCHEDULED_RESCAN
            value: "true"
          - name: SCHEDULED_RESCAN_CRON
            value: "0 22 * * *" # Daily at 10 PM
          - name: ENABLE_RESCAN_ON_FILESYSTEM_CHANGE
            value: "true"
          - name: RESCAN_ON_FILESYSTEM_CHANGE_DELAY
            value: "5" # Minutes to wait before rescan after filesystem change
          - name: ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB
            value: "true"
          - name: SCHEDULED_UPDATE_SWITCH_TITLEDB_CRON
            value: "0 23 * * *" # Daily at 11 PM
          - name: ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA
            value: "true"
          - name: SCHEDULED_UPDATE_LAUNCHBOX_METADATA_CRON
            value: "0 0 * * *" # Daily at 12 AM
          - name: ENABLE_SCHEDULED_CONVERT_IMAGES_TO_WEBP
            value: "true"
          - name: SCHEDULED_CONVERT_IMAGES_TO_WEBP_CRON
            value: "0 1 * * *" # Daily at 1 AM
          - name: ENABLE_SCHEDULED_RETROACHIEVEMENTS_PROGRESS_SYNC
            value: "true"
          - name: SCHEDULED_RETROACHIEVEMENTS_PROGRESS_SYNC_CRON
            value: "0 2 * * *" # Daily at 2 AM

      replicas: 1

      service:
        port: 8080
        targetPort: 8080
        portName: http

      resources:
        requests:
          memory: "1Gi"
          cpu: "50m"
        limits:
          memory: "2Gi"
          cpu: "1000m"

      securityContext:
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        allowPrivilegeEscalation: false

      # Merge git-managed config.yml onto the PVC before RomM starts.
      # RomM may rewrite the file at runtime; this re-asserts desired keys on each boot.
      initContainers:
        - name: reconcile-config
          # renovate: datasource=docker depName=ghcr.io/trueforge-org/go-yq
          image: ghcr.io/trueforge-org/go-yq:4.53.3@sha256:e3a0e416c7c74853bc44bc4fd45236c474d56166a19faf3788c061ced84e5bcc
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              desired=/desired/config.yml
              runtime=/romm/config/config.yml

              if [ ! -f "$desired" ] || [ ! -s "$desired" ]; then
                echo "ERROR: desired config missing or empty at $desired"
                exit 1
              fi

              mkdir -p /romm/config

              if [ ! -f "$runtime" ] || [ ! -s "$runtime" ]; then
                echo "No/empty runtime config — seeding from desired state"
                cp "$desired" "$runtime"
              else
                echo "Reconciling desired config into runtime config"
                tmp=$(mktemp)
                yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                  "$runtime" "$desired" > "$tmp"
                yq eval '.' "$tmp" > /dev/null
                if [ ! -s "$tmp" ]; then
                  echo "ERROR: merge produced empty config — refusing to overwrite"
                  rm -f "$tmp"
                  exit 1
                fi
                mv "$tmp" "$runtime"
              fi

              echo "config.yml ready ($(wc -c < "$runtime") bytes)"
          volumeMounts:
            - name: config
              mountPath: /romm/config
          volumes:
            configMap:
              - name: desired-config
                mountPath: /desired
                configMapName: romm-config-desired
                readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false

      # Additional writable directories for ROMM
      volumes:
        emptyDir:
          - name: tmp
            mountPath: /tmp
          - name: cache
            mountPath: /romm/cache
          - name: logs
            mountPath: /romm/logs
          - name: nginx-config
            mountPath: /etc/nginx/conf.d
      volumeMounts:
        - name: resources
          mountPath: /romm/resources
        - name: library
          mountPath: /romm/library
        - name: assets
          mountPath: /romm/assets
        - name: config
          mountPath: /romm/config

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: assets
            capacity: 2Gi
          - name: config
            capacity: 1Gi
      smb:
        enabled: true
        volumes:
          - name: library
            source: "//storage.services.apocrathia.com/Games"
            subDir: "Emulation"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
          # Scraped covers/manuals/screenshots — lives on the Games share.
          - name: resources
            source: "//storage.services.apocrathia.com/Games"
            subDir: "Emulation/tools/romm/resources"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false
            createSubDir: "true"

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/romm-secrets"

    authentik:
      enabled: true
      mode: oidc
      displayName: "RomM"
      externalHost: "https://romm.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/games/romm/icon.svg"
      category: "Gaming"
      metaDescription: "Self-hosted ROM management platform for organizing, scanning, and playing retro games"
      metaPublisher: "RomM"
      oidc:
        tokenValidity: "days=30"
        scopes:
          - "openid"
          - "email"
          - "profile"
        customScopeMappings:
          - name: "romm-email-verified-mapping"
            scopeName: "email"
            description: "Email address with email_verified set to True for RomM"
            expression: |
              return {
                  "email": request.user.email,
                  "email_verified": True
              }
        redirectUris:
          - url: "https://romm.gateway.services.apocrathia.com/api/oauth/openid"
            matchingMode: "strict"

    httproute:
      enabled: true
      hostname: "romm.gateway.services.apocrathia.com"
