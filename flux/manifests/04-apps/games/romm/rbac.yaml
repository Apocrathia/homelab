---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: romm-scan-trigger
  namespace: romm
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: romm-scan-trigger
  namespace: romm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: romm-scan-trigger
  namespace: romm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: romm-scan-trigger
subjects:
  - kind: ServiceAccount
    name: romm-scan-trigger
    namespace: romm
