---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: romm-nightly-metadata-scan
  namespace: romm
  annotations:
    ignore-check.kube-linter.io/non-existent-service-account: "ServiceAccount is defined in rbac.yaml"
spec:
  # 0300 America/Denver — after built-in maintenance tasks finish
  schedule: "0 3 * * *"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: romm-scan-trigger
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger-scan
              # renovate: datasource=docker depName=docker.io/alpine/kubectl
              # registry.k8s.io/kubectl went distroless between v1.31 and
              # v1.37 (no /bin/sh); the triggers pipe scripts through a shell.
              # alpine/kubectl keeps busybox sh structurally at every bump.
              image: docker.io/alpine/kubectl:1.37.0@sha256:954b65dea0eb140219b440413ede17c2eca205866df350d3c1fbc84d28af14ae
              command:
                - /bin/sh
                - /scripts/trigger.sh
              env:
                - name: SCAN_TYPE
                  # unmatched = ROMs missing provider IDs; update = refresh matched metadata
                  value: "unmatched,update"
                - name: SCAN_METADATA_SOURCES
                  # gamelist: skyscraper's ES-DE gamelists (copied into
                  # roms/<platform>/gamelist.xml by skyscraper's scrape.sh)
                  # identify roms the external providers miss.
                  value: "igdb,ss,ra,launchbox,gamelist,hasheous,playmatch,sgdb"
                # Rotation: one job per platform, platforms id%7==weekday —
                # the whole 36k-rom library can never finish in one 4h job.
                # ~58 jobs/night drain on the serial SCAN_WORKERS=1 queue;
                # SKIP_PENDING skips a night while the backlog is that deep.
                - name: SCAN_ROTATION
                  value: "7"
                - name: SCAN_SKIP_PENDING
                  value: "40"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: romm-scan-scripts
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
