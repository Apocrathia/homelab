---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: romm-esde-media-import
  namespace: romm
spec:
  # Thursday 05:00 America/Denver — after esde-media-scraper (Wed 04:00+) has
  # refreshed ES-DE media on the Games share.
  schedule: "0 5 * * 4"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      template:
        spec:
          serviceAccountName: romm-scan-trigger
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: import-esde-media
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.37.0@sha256:5ed410ebac5dc976cc717098994dcdb29bbbd38f6bd65f582311f5be4ba719cf
              command:
                - /bin/sh
                - /scripts/import-trigger.sh
              env:
                - name: COVER_SOURCE
                  value: "miximages"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: romm-scan-scripts
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
