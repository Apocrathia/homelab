---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: esde-themes
  namespace: esde-themes

resources:
  - namespace.yaml
  - secret.yaml
  - smb-storage.yaml
  - cronjob.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: esde-themes-scripts
    namespace: esde-themes
    files:
      - sync-themes.sh=config/sync-themes.sh
