---
# Emulation library share (roms / dats / tools/rom-audit/systems.yaml)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rom-audit-emulation-pv
  labels:
    app.kubernetes.io/name: rom-audit
    app.kubernetes.io/component: storage
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - dir_mode=0755
    - file_mode=0644
    - uid=1000
    - gid=1000
    - noperm
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: rom-audit-emulation-pv
    volumeAttributes:
      source: "//storage.services.apocrathia.com/Games"
      subDir: "Emulation"
    nodeStageSecretRef:
      name: rom-audit-smb-credentials
      namespace: rom-audit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rom-audit-emulation
  namespace: rom-audit
  labels:
    app.kubernetes.io/name: rom-audit
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: rom-audit-emulation-pv
  resources:
    requests:
      storage: 10Ti
