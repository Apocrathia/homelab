---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: rom-audit
  namespace: rom-audit

resources:
  - namespace.yaml
  - secret.yaml
  - smb-storage.yaml
  - cronjob.yaml
  - grafana/

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: rom-audit-scripts
    namespace: rom-audit
    files:
      - __init__.py=src/rom_audit/__init__.py
      - __main__.py=src/rom_audit/__main__.py
      - dat.py=src/rom_audit/dat.py
      - hash.py=src/rom_audit/hash.py
      - scan.py=src/rom_audit/scan.py
      - emit.py=src/rom_audit/emit.py
      - pyproject.toml=src/pyproject.toml
      - uv.lock=src/uv.lock
      - systems-3do.yaml=systems-3do.yaml
