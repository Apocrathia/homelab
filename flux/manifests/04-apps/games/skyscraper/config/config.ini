; ES-DE scrape: metadata + gamelist.xml only (no media downloads).
; Resource cache on the Emulation share avoids re-hitting ScreenScraper for
; titles already scraped. Binary builds into ephemeral /cache emptyDir each run.
; ScreenScraper credentials are injected at runtime by scrape.sh.
[main]
frontend="esde"
inputFolder="/emulation/roms"
gameListFolder="/emulation/gamelists"
mediaFolder="/emulation/media"
cacheFolder="/emulation/tools/skyscraper/cache"
unattend="true"
gameListBackup="true"
brackets="false"
videos="false"
manuals="false"
fanarts="false"
cacheCovers="false"
cacheScreenshots="false"
cacheMarquees="false"
cacheWheels="false"
cacheTextures="false"
cacheRefresh="false"
verbosity="1"
region="us"
lang="en"

[esde]
gameListFolder="/emulation/gamelists"
mediaFolder="/emulation/media"

[screenscraper]
userCreds="PLACEHOLDER"
