---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: skyscraper
  namespace: skyscraper

resources:
  - namespace.yaml
  - secret.yaml
  - smb-storage.yaml
  - cronjob.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: skyscraper-config
    namespace: skyscraper
    files:
      - config.ini=config/config.ini
  - name: skyscraper-scripts
    namespace: skyscraper
    files:
      - ensure-binary.sh=config/ensure-binary.sh
      - scrape.sh=config/scrape.sh
