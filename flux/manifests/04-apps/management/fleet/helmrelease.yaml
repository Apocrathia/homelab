---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fleet
  namespace: fleet
spec:
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: fleet
      # renovate: datasource=helm depName=fleet registryUrl=https://fleetdm.github.io/fleet/charts
      version: "v7.0.14"
      sourceRef:
        kind: HelmRepository
        name: fleet
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Chart defaults environments.FLEET_SERVER_PRIVATE_KEY: "". Putting the same
  # key in envsFrom duplicates the env list and SSA rejects the apply. Flux also
  # strips YAML null from inline values, so we can't delete the chart default
  # that way. postRenderers replace the empty env with a secretKeyRef after
  # helm template (Deployment + dedicated vuln CronJob).
  postRenderers:
    - kustomize:
        patches:
          # Two patches: strategic-merge delete+add in one doc drops both under
          # the same env name merge key. Delete first, then add secretKeyRef.
          - target:
              version: v1
              kind: Deployment
              name: fleet
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: fleet
              spec:
                template:
                  spec:
                    containers:
                      - name: fleet
                        env:
                          - name: FLEET_SERVER_PRIVATE_KEY
                            $patch: delete
          - target:
              version: v1
              kind: Deployment
              name: fleet
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: fleet
              spec:
                template:
                  spec:
                    containers:
                      - name: fleet
                        env:
                          - name: FLEET_SERVER_PRIVATE_KEY
                            valueFrom:
                              secretKeyRef:
                                name: fleetdm-secrets
                                key: private-key
          - target:
              group: batch
              version: v1
              kind: CronJob
              name: fleet-vulnprocessing
            patch: |-
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: fleet-vulnprocessing
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: fleet-vulnprocessing
                            env:
                              - name: FLEET_SERVER_PRIVATE_KEY
                                $patch: delete
          - target:
              group: batch
              version: v1
              kind: CronJob
              name: fleet-vulnprocessing
            patch: |-
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: fleet-vulnprocessing
              spec:
                jobTemplate:
                  spec:
                    template:
                      spec:
                        containers:
                          - name: fleet-vulnprocessing
                            env:
                              - name: FLEET_SERVER_PRIVATE_KEY
                                valueFrom:
                                  secretKeyRef:
                                    name: fleetdm-secrets
                                    key: private-key
  values:
    hostName: fleet.gateway.services.apocrathia.com
    replicas: 1

    # renovate: datasource=docker depName=fleetdm/fleet
    imageTag: v4.90.0

    ingress:
      enabled: false

    fleet:
      listenPort: 8080
      # Gateway terminates TLS; Fleet serves plain HTTP in-cluster
      tls:
        enabled: false
      autoApplySQLMigrations: true
      license:
        secretName: fleetdm-secrets
        licenseKey: license-key

    # Allow SSO metadata_url / other integrations to RFC1918 (Authentik is
    # on the private gateway VIP). Loopback and link-local stay blocked.
    # Policy interval: chart has no policyUpdateInterval value (only label/
    # detail); set via env. Default is 1h.
    environments:
      FLEET_SERVER_ALLOW_PRIVATE_NETWORK_INTEGRATIONS: "true"
      FLEET_OSQUERY_POLICY_UPDATE_INTERVAL: "30m"

    # MDM needs FLEET_SERVER_PRIVATE_KEY — injected via postRenderers above
    # (openssl rand -base64 32). Global enroll secret seeds/overwrites the DB
    # secret on pod start — keep it identical to GitOps
    # $FLEET_GLOBAL_ENROLL_SECRET / default.yml.
    # Fields on OnePasswordItem fleetdm-secrets: private-key,
    # global-enroll-secret.
    envsFrom:
      - name: FLEET_PACKAGING_GLOBAL_ENROLL_SECRET
        valueFrom:
          secretKeyRef:
            name: fleetdm-secrets
            key: global-enroll-secret

    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 256Mi

    # Offload vuln DB work so the main pod does not need 4Gi
    vulnProcessing:
      dedicated: true
      schedule: "0 * * * *"
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 256Mi

    # stdout → Alloy scrapes container logs → Loki (filesystem and
    # emptyDir /logs never reach observability).
    # https://fleetdm.com/guides/log-destinations
    # label/detail intervals: chart defaults are already 30m; set explicitly.
    # Policy interval is environments.FLEET_OSQUERY_POLICY_UPDATE_INTERVAL.
    osquery:
      labelUpdateInterval: 30m
      detailUpdateInterval: 30m
      logging:
        statusPlugin: stdout
        resultPlugin: stdout

    database:
      secretName: fleetdm-secrets
      address: fleet-mysql:3306
      database: fleet
      username: fleet
      passwordKey: mysql-password

    cache:
      address: fleet-valkey:6379
      database: "0"
      usePassword: false

    # Chart MySQL subchart (dev/test). Passwords come from OnePasswordItem fleetdm-secrets.
    mysql:
      enabled: true
      auth:
        username: fleet
        database: fleet
        existingSecret: fleetdm-secrets
      primary:
        persistence:
          enabled: true
          size: 8Gi
          storageClass: longhorn

    # Chart Valkey subchart (redis.enabled is the condition key)
    redis:
      enabled: true

    valkey:
      replica:
        enabled: false
      auth:
        enabled: false
