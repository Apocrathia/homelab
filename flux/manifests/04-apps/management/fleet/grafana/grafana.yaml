---
# Custom Fleet dashboard (Alloy → Loki: {namespace="fleet",container="fleet"}).
# JSON lives in ConfigMap fleet-dm-dashboard (generated from dashboard.json).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fleet-dm
  namespace: prometheus-system
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  configMapRef:
    name: fleet-dm-dashboard
    key: dashboard.json
  folder: Security
