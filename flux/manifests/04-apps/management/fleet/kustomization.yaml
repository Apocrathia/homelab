apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: fleet

resources:
  - namespace.yaml
  - secret.yaml
  - helmrelease.yaml
  - httproute.yaml
  - grafana/
# The Fleet DM authentik objects (both SAML providers, the SCIM
# backchannel + custom mapping, both applications, admins bindings) are
# tofu-managed now — the pair lives in
# 03-services/authentik/system/fleetdm/ (the retired
# authentik-blueprint-fleetdm CM stopped rendering with this migration
# and the live objects survive for that Workspace to adopt).
