---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: fleet

resources:
  - namespace.yaml
  - secret.yaml
  - helmrelease.yaml
  - httproute.yaml
  - grafana/

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-fleetdm
    namespace: authentik
    files:
      - fleetdm.yaml=authentik-blueprint.yaml

labels:
  - includeSelectors: true
    pairs:
      authentik_blueprint: "true"
