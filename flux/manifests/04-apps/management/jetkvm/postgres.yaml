---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: jetkvm-postgres
  namespace: jetkvm
spec:
  # PostgreSQL version
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e

  # Number of instances
  instances: 1

  # Barman backups: rustfs S3 (bucket `cnpg`, policy scoped to bucket+objects).
  # WAL archiving is continuous; base backups are triggered by the scheduled
  # Backup resource in scheduled-backup.yaml.
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      destinationPath: s3://cnpg/jetkvm
      endpointURL: http://storage.services.apocrathia.com:9009
      serverName: jetkvm-postgres
      s3Credentials:
        accessKeyId:
          name: jetkvm-postgres-backup-secrets
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: jetkvm-postgres-backup-secrets
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: zstd
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: true

  # Storage configuration
  storage:
    storageClass: longhorn
    size: 10Gi

  # Resource limits to prevent OOM kills
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # PostgreSQL-specific configuration
  postgresql:
    parameters:
      max_connections: "100"
      track_io_timing: "on"
      track_functions: "all"
      log_statement: "ddl"
      log_min_duration_statement: "1000ms"
      log_min_messages: "INFO"

  # Affinity settings for better performance (CloudNativePG-specific)
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: "preferred"
    topologyKey: "kubernetes.io/hostname"

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: jetkvm
      owner: jetkvm
      secret:
        name: jetkvm-secrets
