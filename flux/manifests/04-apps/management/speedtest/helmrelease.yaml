---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest
  namespace: speedtest
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.88"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  values:
    app:
      name: speedtest
      namespace: speedtest
      # renovate: datasource=docker depName=ghcr.io/librespeed/speedtest
      image: ghcr.io/librespeed/speedtest:6.3.1@sha256:bc34bf69b6c102b23ab81b6e77beb7cce321fb0d3be33ec6e80edef3e9dd8bab
      container:
        name: speedtest
        port: 8080
        env:
          - name: TZ
            value: "America/Denver"
          # Default to the modern frontend (entrypoint rewrites config.json)
          - name: USE_NEW_DESIGN
            value: "true"
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      # php:8-apache image: entrypoint chowns /var/www/html and edits apache
      # config as root, then the master drops to www-data workers
      securityContext:
        runAsUser: "0"
        runAsGroup: "0"
        fsGroup: 33
        runAsNonRoot: "false"
        allowPrivilegeEscalation: "true"
        readOnlyRootFilesystem: "false"
        capabilities:
          add:
            - SETUID
            - SETGID
            - CHOWN
            - DAC_OVERRIDE
            - KILL
            - FOWNER
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      service:
        type: ClusterIP
        port: 80
        targetPort: 8080
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          enabled: true
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30

    secrets:
      enabled: false

    authentik:
      managedBy: terraform
      enabled: true
      shared: true
      category: "Productivity"
      displayName: "LibreSpeed"
      externalHost: "https://speedtest.gateway.services.apocrathia.com"
      icon: "https://cdn.gateway.services.apocrathia.com/homelab/flux/manifests/04-apps/management/speedtest/icon.svg"
      metaDescription: "Self-hosted HTML5 network speed test"
      metaPublisher: "LibreSpeed"

    httproute:
      enabled: false

    # Tailnet sharing via chart values
    tailnet:
      enabled: true
