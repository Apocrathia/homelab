---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kuber-ios-token-to-1password
  namespace: kuber-ios
  labels:
    app.kubernetes.io/name: kuber-ios
    app.kubernetes.io/part-of: management
spec:
  # 168h: ESO v2.12 PushSecret PUTs the item on every reconcile even when the
  # value is unchanged, bumping the item updatedAt in 1Password — the refresh
  # interval IS the bump frequency. Token rotation is rare; a stale vault
  # token fails closed at the app login and re-syncs on the next tick.
  refreshInterval: 168h
  deletionPolicy: None
  secretStoreRefs:
    - name: 1password-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: kuber-ios-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: homelab-kuber-ios-token
          property: token
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          vault: Secrets
          tags:
            - kubernetes
            - kuber-ios
            - mobile
