---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: uptime-robot-ip-sync
  namespace: unifi-scripts

resources:
  - secret.yaml
  - cronjob.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: uptime-robot-ip-sync-scripts
    namespace: unifi-scripts
    files:
      - src/sync_uptime_robot_firewall_groups.py
      - src/pyproject.toml
      - src/uv.lock
