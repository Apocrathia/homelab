---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 1h
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.68"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  values:
    app:
      name: n8n
      namespace: n8n
      # renovate: datasource=docker depName=n8nio/n8n
      image: n8nio/n8n:2.13.3
      container:
        name: n8n
        port: 5678
        env:
          - name: DB_TYPE
            value: "postgresdb"
          - name: DB_POSTGRESDB_HOST
            value: "n8n-postgres-rw.n8n.svc.cluster.local"
          - name: DB_POSTGRESDB_PORT
            value: "5432"
          - name: DB_POSTGRESDB_DATABASE
            value: "n8n"
          - name: DB_POSTGRESDB_USER
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: username
          - name: DB_POSTGRESDB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: password
          - name: N8N_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: n8n-secrets
                key: encryption-key
          - name: N8N_HOST
            value: "n8n.gateway.services.apocrathia.com"
          - name: N8N_PROTOCOL
            value: "http"
          - name: N8N_PORT
            value: "80"
          - name: WEBHOOK_URL
            value: "https://n8n.gateway.services.apocrathia.com/"
          - name: N8N_BASIC_AUTH_ACTIVE
            value: "false"
          - name: N8N_PROXY_HOPS
            value: "1"
      replicas: 1
      strategy: Recreate
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      securityContext:
        readOnlyRootFilesystem: true
      # n8n writes instance config under ~/.n8n; RO root requires a writable mount here
      volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
      service:
        port: 80
        targetPort: 5678
      volumes:
        emptyDir:
          - name: cache
            mountPath: /home/node/.cache

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/n8n-secrets"

    postgres:
      enabled: true
      imageName: ghcr.io/cloudnative-pg/postgresql:16
      instances: 1
      storage:
        storageClass: longhorn
        size: 10Gi
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      postgresql:
        parameters:
          max_connections: "100"
          track_io_timing: "on"
          track_functions: "all"
          log_statement: "ddl"
          log_min_duration_statement: "1000ms"
          log_min_messages: "INFO"
      affinity:
        enablePodAntiAffinity: true
        podAntiAffinityType: "preferred"
        topologyKey: "kubernetes.io/hostname"
      monitoring:
        enabled: true
      database: "n8n"
      owner: "n8n"

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 20Gi

    authentik:
      enabled: true
      mode: "proxy"
      displayName: "n8n"
      externalHost: "https://n8n.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/management/n8n/icon.svg"
      category: "AI & Automation"
      interceptHeaderAuth: true
      metaDescription: "n8n workflow automation platform"
      metaPublisher: "n8n"

    httproute:
      enabled: false
