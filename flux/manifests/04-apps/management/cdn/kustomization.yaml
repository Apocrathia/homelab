---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cdn
  namespace: cdn
  labels:
    app.kubernetes.io/name: cdn

resources:
  - namespace.yaml
  - helmrelease.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # nginx.conf mount for the serving container (demo-app pattern): stable
  # name so the HelmRelease can mount it; the file ships in this directory.
  - name: cdn-nginx-config
    namespace: cdn
    files:
      - nginx.conf
