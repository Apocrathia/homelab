---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: icons
  namespace: icons
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.86"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: icons
      # renovate: datasource=docker depName=public.ecr.aws/nginx/nginx
      image: public.ecr.aws/nginx/nginx:alpine@sha256:42f630b748ea564bfae750a1b170972e0d087fb57fdc7d03cc00bcbe02d1c465
      volumes:
        configMap:
          - name: icons-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
        # The emptyDir block auto-mounts all four in the main container
        # (chart template); the sidecars reference repo and html by name.
        emptyDir:
          # git-sync clone root, shared with the flatten sidecar
          - name: repo
            mountPath: /git
          # flat icon dir served by nginx, written by the flatten sidecar
          - name: html
            mountPath: /usr/share/nginx/html
          # nginx writable paths (read-only rootfs)
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /run
      sidecars:
        # Public repo, zero credentials, depth-1, 60s pull loop. Publishes
        # the synced worktree at /git/repo via an atomic symlink flip.
        - name: git-sync
          # renovate: datasource=docker depName=registry.k8s.io/git-sync/git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
          args:
            - --repo=https://gitlab.com/Apocrathia/homelab.git
            - --ref=main
            - --depth=1
            - --root=/git
            - --link=repo
            - --period=60s
            - --stale-worktree-timeout=90s
          volumeMounts:
            - name: repo
              mountPath: /git
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # Flattens the synced repo icons into the serve dir. Two rules:
        # <dir>/icon.{png,svg} -> <dirname>.<ext>, and every file in
        # blueprints/icons/ -> <basename>. Per-file staging + mv keeps nginx
        # from reading half-written files; the 30s loop heals any drift
        # (removed icons linger until pod restart - nothing references them).
        - name: flatten
          # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/busybox
          image: public.ecr.aws/docker/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              while :; do
                cd /git/repo 2>/dev/null || { sleep 30; continue; }
                find flux/manifests -type f \( -name icon.svg -o -name icon.png \) | while IFS= read -r f; do
                  d=$(dirname "$f")
                  flat="/usr/share/nginx/html/${d##*/}.${f##*.}"
                  cp "$f" "$flat.stage" && mv -f "$flat.stage" "$flat"
                done
                for f in flux/manifests/03-services/authentik/blueprints/icons/*; do
                  [ -f "$f" ] || continue
                  b=$(basename "$f")
                  cp "$f" "/usr/share/nginx/html/$b.stage" && mv -f "/usr/share/nginx/html/$b.stage" "/usr/share/nginx/html/$b"
                done
                sleep 30
              done
          volumeMounts:
            - name: repo
              mountPath: /git
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      # Liveness: nginx itself. Readiness: the full sync chain - the pod is
      # only routable once an icon actually serves (gate on a blueprint icon
      # that always exists upstream).
      healthChecks:
        livenessProbe:
          enabled: true
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          enabled: true
          httpGet:
            path: /gitlab.svg
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    # Public bytes only; no secrets.
    secrets:
      enabled: false

    # Browser <img> fetches happen outside authentik sessions - the host
    # must stay unauthenticated (icons are already public repo bytes).
    authentik:
      enabled: false

    # In-cluster uptime probe doubles as a sync-chain canary: 200 on
    # /gitlab.svg proves clone -> flatten -> serve end to end.
    gatus:
      enabled: true
      path: /gitlab.svg

    # Unauthenticated LAN route via the wildcard cert + external-dns
    # (gateway defaults: main-gateway / cilium-system / https).
    httproute:
      enabled: true
      hostname: icons.gateway.services.apocrathia.com
