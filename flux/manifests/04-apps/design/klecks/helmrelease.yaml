---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: klecks
  namespace: klecks
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.90"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: klecks
      # renovate: datasource=docker depName=public.ecr.aws/nginx/nginx
      image: public.ecr.aws/nginx/nginx:alpine@sha256:de2281d0074656735b2ba1bea6ab7a29ef1ecc6e05e4a86db9d1062994d83c86
      container:
        name: nginx
        port: 80
      replicas: 1
      podAntiAffinity:
        enabled: false
      initContainers:
        - name: build-klecks
          # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/node
          image: public.ecr.aws/docker/library/node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache git
              git clone --depth 1 --branch "${KLECKS_VERSION}" https://github.com/bitbof/klecks.git /tmp/klecks
              cd /tmp/klecks
              npm ci
              npm run icon:build
              npm run lang:build
              npm run build
              cp -a dist/. /usr/share/nginx/html/
              rm -rf /tmp/klecks
          env:
            # renovate: datasource=github-tags depName=bitbof/klecks
            - name: KLECKS_VERSION
              value: "main"
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          volumes:
            emptyDir:
              - name: tmp
                mountPath: /tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
      volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
      volumes:
        emptyDir:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /run
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: 1Gi

    secrets:
      enabled: false

    authentik:
      managedBy: terraform
      enabled: true
      category: "Design"
      displayName: "Klecks"
      externalHost: "https://klecks.gateway.services.apocrathia.com"
      icon: "https://cdn.gateway.services.apocrathia.com/homelab/flux/manifests/04-apps/design/klecks/icon.png"
      interceptHeaderAuth: false
      shared: true

    httproute:
      enabled: false

    tailnet:
      enabled: true
