---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vectorcraft
  namespace: vectorcraft
spec:
  interval: 15m
  chart:
    spec:
      chart: generic-app
      # renovate: datasource=docker depName=registry.gitlab.com/apocrathia/homelab/generic-app
      version: "0.0.91"
      sourceRef:
        kind: HelmRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: vectorcraft
      # renovate: datasource=docker depName=public.ecr.aws/nginx/nginx
      image: public.ecr.aws/nginx/nginx:alpine@sha256:de2281d0074656735b2ba1bea6ab7a29ef1ecc6e05e4a86db9d1062994d83c86
      container:
        name: nginx
        port: 80
      replicas: 1
      podAntiAffinity:
        enabled: false
      initContainers:
        - name: fetch-vectorcraft
          # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/alpine
          image: public.ecr.aws/docker/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl unzip
              url="https://github.com/storytold/vectorcraft/releases/download/v${VECTORCRAFT_VERSION}/vectorcraft-web-${VECTORCRAFT_VERSION}.zip"
              curl -fsSL -o /tmp/vectorcraft.zip "$url"
              unzip -q -o /tmp/vectorcraft.zip -d /tmp/extract
              rm -rf /usr/share/nginx/html/*
              cp -R "/tmp/extract/vectorcraft-web-${VECTORCRAFT_VERSION}/." /usr/share/nginx/html/
              rm -rf /tmp/vectorcraft.zip /tmp/extract
          env:
            # renovate: datasource=github-releases depName=storytold/vectorcraft versioning=semver
            - name: VECTORCRAFT_VERSION
              value: "0.24.1"
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          volumes:
            emptyDir:
              - name: tmp
                mountPath: /tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
      volumes:
        emptyDir:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /run
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: data
            capacity: "1Gi"

    secrets:
      enabled: false

    authentik:
      managedBy: terraform
      enabled: true
      category: "Design"
      displayName: "VectorCraft"
      externalHost: "https://vectorcraft.gateway.services.apocrathia.com"
      icon: "https://cdn.gateway.services.apocrathia.com/homelab/flux/manifests/04-apps/design/vectorcraft/icon.png"
      interceptHeaderAuth: false
      shared: true

    httproute:
      enabled: false

    tailnet:
      enabled: true
