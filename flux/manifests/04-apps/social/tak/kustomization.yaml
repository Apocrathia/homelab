---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tak
  namespace: tak

resources:
  - namespace.yaml
  - backup-secret.yaml
  - postgres.yaml
  - scheduled-backup.yaml
  - helmrelease.yaml
  - networkpolicy.yaml
  - tcproutes.yaml
  - crossplane.yaml
  - rbac.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Crossplane stitch: packages authentik.tf (the Workspace's HCL module)
  # so the replacements rule below can copy it into the Workspace at build
  # time. Data key is the literal filename (authentik.tf); the replacements
  # fieldPath bracket-escapes it: data.[authentik.tf]. The retired
  # authentik-blueprint-tak-ldap ConfigMap stopped rendering with this
  # migration — the blueprint CM prunes and the live LDAP objects survive
  # for this Workspace to adopt. Intentionally NOT labeled authentik_blueprint
  # (the blanket label died with the blueprint retirement): authentik ignores
  # this ConfigMap as a blueprint source.
  - name: tak-ldap-authentik-module
    namespace: tak
    files:
      - authentik.tf

  # nginx vhosts for the webui sidecar (literal values, no envsubst)
  - name: tak-nginx-conf
    namespace: tak
    files:
      - http-80.conf=config/nginx/http-80.conf
      - https-8443.conf=config/nginx/https-8443.conf
      - https-8446.conf=config/nginx/https-8446.conf
  # rabbitmq sidecar config (upstream compose parity)
  - name: tak-rabbitmq
    namespace: tak
    files:
      - enabled_plugins=config/rabbitmq/enabled_plugins
      - 99-opentakserver.conf=config/rabbitmq/99-opentakserver.conf
  # config.yml template for the render-config init container
  - name: tak-config-template
    namespace: tak
    files:
      - config.yml=config/config.yml

replacements:
  # Build-time stitch, house pattern from gitlab/runner: copy the generated
  # ConfigMap's authentik.tf data into the Workspace's module field.
  # authentik.tf stays the single source of truth for the HCL; the rendered
  # module must stay byte-identical to it (the Workspace adopts live
  # authentik objects — a drift here would fight the state).
  #
  # The intermediate ConfigMap cannot be dropped from the render: kustomize
  # applies patches and transformers before replacements, so a $patch:
  # delete would remove the source before this rule consumes it (verified
  # on kustomize v5.8.1; no deletions-transformer builtin exists). The
  # ConfigMap is harmless in-cluster (no authentik_blueprint label) and
  # keeps a stable name (disableNameSuffixHash), so authentik.tf edits
  # update it in place.
  - source:
      kind: ConfigMap
      name: tak-ldap-authentik-module
      fieldPath: data.[authentik.tf]
    targets:
      - select:
          kind: Workspace
          name: tak-ldap-authentik
        fieldPaths:
          - spec.forProvider.module
