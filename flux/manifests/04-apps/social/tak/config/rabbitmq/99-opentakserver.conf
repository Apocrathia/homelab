# RabbitMQ configuration for OpenTAKServer (upstream
# OpenTAKServer-Docker ots/configs/rabbitmq/99-opentakserver.conf, with the
# OTS API address rewritten to localhost - all containers share the pod
# network namespace).
deprecated_features.permit.transient_nonexcl_queues = true

mqtt.listeners.tcp.default = 1883

auth_backends.1 = internal
auth_backends.2 = http
auth_http.http_method   = post
auth_http.user_path     = http://localhost:8081/api/rabbitmq/auth
auth_http.vhost_path    = http://localhost:8081/api/rabbitmq/vhost
auth_http.resource_path = http://localhost:8081/api/rabbitmq/resource
auth_http.topic_path    = http://localhost:8081/api/rabbitmq/topic
