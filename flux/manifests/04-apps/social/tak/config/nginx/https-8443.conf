# Marti API, mTLS (ATAK presents client certificates signed by the OTS CA).
# Bypasses Authentik on purpose: ATAK speaks client certs, not SSO cookies.
# Adapted from upstream https-8443.conf.template (literal cert paths, no
# envsubst).
server {
    listen 8443 ssl;
    server_name tak.gateway.services.apocrathia.com;

    client_max_body_size 512M;

    # OpenTAKServer CA + server certificate (written by tak-api on first boot)
    ssl_client_certificate /app/ots/ca/ca.pem;
    ssl_certificate /app/ots/ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key /app/ots/ca/certs/opentakserver/opentakserver.nopass.key;

    # Require client certificate verification to access the Marti API
    ssl_verify_client on;

    # Certificate enrollment is served on 8446, not here
    location /Marti/api/tls {
        return 404;
    }

    location /Marti {
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://localhost:8081;
    }
}
