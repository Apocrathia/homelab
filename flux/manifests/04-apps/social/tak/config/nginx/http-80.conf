# OpenTAKServer WebUI + SPA, plain HTTP behind the Authentik proxy outpost.
# Adapted from upstream http-80.conf.template with three changes:
#   - no https-redirect (upstream redirects; the Authentik outpost proxies
#     plain HTTP to this port, so a 301 would loop)
#   - the SPA is served from this container (upstream proxies to a separate
#     opentakserver-webui container)
#   - MediaMTX / certbot locations dropped (not deployed)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 512M;

    # The SPA lazy-loads a JS chunk per tab (1MB+ each, content-hashed
    # names) through the Authentik proxy, which does not compress - gzip
    # here is what keeps tab switches fast over the wire.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Content-hashed assets never change; cache hard
    location /assets/ {
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # NGINX health (gatus probes this via the Service)
    location = /health {
        access_log off;
        add_header 'Content-Type' 'application/json';
        return 200 '{"status":"healthy"}';
    }

    # OTS API - the SPA authenticates with OTS session tokens, not Authentik
    # cookies (both paths are in the provider skip_path_regex)
    location /api {
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:8081;
    }

    # OTS websocket channel. The Origin header is stripped: flask-socketio
    # runs a same-origin CORS check when Origin is present, but the
    # Authentik proxy outpost rewrites Host to the internal service name,
    # so a browser's Origin (the public hostname) can never match - every
    # socket.io request from a browser 400s ("Not an accepted origin").
    # With no Origin header the check passes; the SPA is same-site anyway.
    location /socket.io {
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://localhost:8081/socket.io;
    }

    # index.html must always revalidate (heuristic caching otherwise
    # pins stale chunk references; content-hashed assets under /assets/
    # are the things safe to cache hard)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history-mode fallback
    location / {
        try_files $uri /index.html;
    }
}
