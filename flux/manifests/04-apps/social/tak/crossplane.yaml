---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: tak-ldap-authentik
  namespace: tak
spec:
  # Materializes the shared 1Password-item-backed Secret as a file in the
  # tofu workdir; authentik.tf's provider block reads it with
  # file("authentik-token"). The token itself never appears in a manifest.
  # Shares the SAME authentik-terraform-token Secret the chart's own tofu
  # workspace renders (authentik-tofu-workspace.yaml template, OnePasswordItem
  # in this namespace) — same 1Password item (crossplane-terraform-secrets)
  # every other authentik-consumer pair copies; no second item copy needed.
  credentials:
    - filename: authentik-token
      source: Secret
      secretRef:
        name: authentik-terraform-token
        namespace: tak
        key: authentik-terraform-token
  # Per-unit state args for the PARTIAL kubernetes backend in authentik.tf:
  # the provider writes this as crossplane.remote.tfbackend and passes it
  # via -backend-config at tofu init. The state Secret is
  # tfstate-tak-ldap-authentik-tak-ldap in ns tak — unique suffix
  # (the chart's WebUI workspace owns suffix "tak"; this LDAP stack is a
  # deliberately separate state), and separate from the CI tofu stack
  # (terraform/, GitLab HTTP backend). Two stacks, two states — here three.
  backendFile: |
    secret_suffix     = "tak-ldap"
    namespace         = "tak"
    in_cluster_config = true
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: tak-ldap-authentik
  namespace: tak
spec:
  # Prune guard — crossplane v2 removed deletionPolicy; without the Delete
  # action the provider releases the finalizer WITHOUT running tofu destroy,
  # so a GitOps prune of this object can NEVER destroy the live authentik
  # objects (v2-native Orphan). Deliberate decommission therefore requires
  # temporarily restoring ["*"] (or a manual tofu destroy) — the guard is
  # intentional. Doubly intentional here: this workspace owns the LDAP
  # provider + outpost that OTS's ATAK enrollment and WebUI logins bind
  # against; nothing may ever destroy them mid-flight.
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: tak-ldap-authentik
  forProvider:
    # Inline module, stitched at kustomize build time: kustomization.yaml's
    # configMapGenerator packages authentik.tf and the replacements rule
    # copies its bytes into this module field — crossplane.yaml +
    # authentik.tf are the canonical file pair, and the HCL file is the
    # single source of truth (never render this directory outside
    # kustomize). No varmap in git — ever: the LDAP values live in the
    # HCL, and the ADOPTION varmap (recipe §8, born-with-varmap) exists
    # only as a gate-time patch on the applied Workspace. The live objects
    # are blueprint-created and ride in tofu state only after the gate
    # imports them; the first reconcile of the unsuspended tree plans No
    # changes.
    source: Inline
    module: ""
