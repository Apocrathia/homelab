---
# Synapse homeserver.yaml template - rendered to /data/homeserver.yaml by
# the render-config init container in synapse-helmrelease.yaml. Only
# __SYNAPSE_DB_PASSWORD__ is substituted (from the matrix-secrets
# Secret); the MAS shared secret is NOT written into this file - synapse
# reads it from matrix_authentication_service.secret_path at startup, so
# the kopia-backed /data PVC never stores secret bytes.
#
# Auth is fully delegated to MAS (the stable post-1.136 integration).
# enable_registration and password_config stay off; Synapse enforces the
# rest of the SSO-only lockdown at startup when mas.enabled is true
# (synapse/config/mas.py check_config_conflicts).
server_name: "matrix.apocrathia.com"
public_baseurl: "https://matrix.apocrathia.com/"
# Federation is on: remote servers fetch /.well-known/matrix/server on
# 443 (routed to Synapse by the existing HTTPRoute) and send federation
# traffic to matrix.apocrathia.com:443 on the tailnet-gateway door. The
# host resolves for tailnet members via the tailnet split-DNS zone.
# Synapse also serves /.well-known/matrix/client with the MSC2965 MAS
# issuer block (OIDC discovery for Element X et al.)
serve_server_wellknown: true
# Deny-by-default: only the peer below may federate, both directions.
# Peer server_name verified live 2026-11-01: well-known self-delegates
# to :443, Synapse 1.164.1, public A 136.53.195.27.
federation_domain_whitelist:
  - matrix.ninefoot3.com
pid_file: /data/homeserver.pid
signing_key_path: /data/matrix.apocrathia.com.signing.key

listeners:
  # One client listener: client + federation resources behind the
  # gateway; x_forwarded for the X-Forwarded-For/Proto the Cilium Envoy
  # gateway appends. No TLS - the gateway terminates.
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client, federation]

database:
  name: psycopg2
  args:
    user: synapse
    # substituted by the render-config init container
    password: "__SYNAPSE_DB_PASSWORD__"
    dbname: synapse
    host: matrix-postgres-rw.matrix.svc.cluster.local
    port: 5432
    cp_min: 5
    cp_max: 10

enable_registration: false
password_config:
  enabled: false

matrix_authentication_service:
  enabled: true
  endpoint: http://mas.matrix.svc.cluster.local:8080
  secret_path: /run/secrets/matrix-secrets/shared-secret

max_upload_size: 50M
media_store_path: /data/media_store
report_stats: false
log_config: "/data/matrix.apocrathia.com.log.config"
