---
# Route 4 - Sable. Discord-like Matrix client (Rust + Svelte), native
# OIDC/SSO. Login follows the same MAS -> Authentik chain as Element
# (auto-redirect): the browser fetches auth_metadata from Synapse, then
# Sable fronts MAS. Static SPA on the wildcard doors, litellm pattern.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-sable
  namespace: matrix
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-system
      sectionName: https
    - name: tailnet-gateway
      namespace: cilium-system
      sectionName: https-gateway-services
  hostnames:
    - "sable.gateway.services.apocrathia.com"
  rules:
    - backendRefs:
        - name: sable
          port: 80
