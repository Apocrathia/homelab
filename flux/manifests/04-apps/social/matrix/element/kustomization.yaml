---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: matrix-element

resources:
  - helmrelease.yaml
  - httproute.yaml
  - crossplane.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Element Web config.json: default homeserver + oidc_static_clients
  # (public client id must byte-match the clients entry in
  # mas-config.yaml). Mounted over the image's sample config.json; the
  # image entrypoint copies it to the served config dir on every boot.
  - name: matrix-element-config
    namespace: matrix
    files:
      - config.json=config/element-config.json
  # Crossplane stitch: packages authentik.tf (the Workspace's HCL
  # module) so the replacements rule below can copy it into the
  # Workspace at build time. Data key is the literal filename
  # (authentik.tf); the replacements fieldPath bracket-escapes it:
  # data.[authentik.tf].
  - name: element-authentik-module
    namespace: matrix
    files:
      - authentik.tf

replacements:
  - source:
      kind: ConfigMap
      name: element-authentik-module
      fieldPath: data.[authentik.tf]
    targets:
      - select:
          kind: Workspace
          name: element-authentik
        fieldPaths:
          - spec.forProvider.module
