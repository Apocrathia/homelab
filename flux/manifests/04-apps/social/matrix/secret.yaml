---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: matrix-secrets
  namespace: matrix
spec:
  # One item shared by all three workloads: CNPG bootstrap (password +
  # init-mas.sql), the synapse render-config init container (password,
  # signing-key), and MAS (*_file paths). Field inventory: README.md.
  itemPath: "vaults/Secrets/items/matrix-secrets"
