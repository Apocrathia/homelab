# Stoat backend configuration (mounted at /Revolt.toml)
# Connection strings, credentials, and feature flags are env overrides
# (REVOLT__*) on each HelmRelease, not values in this file.
#
# Keep this file limited to non-secret, non-env-overridable structure.

[hosts]
app = "https://stoat.gateway.services.apocrathia.com"
api = "https://stoat.gateway.services.apocrathia.com/api"
events = "wss://stoat.gateway.services.apocrathia.com/ws"
autumn = "https://stoat.gateway.services.apocrathia.com/autumn"
january = "https://stoat.gateway.services.apocrathia.com/january"
gifbox = "https://stoat.gateway.services.apocrathia.com/gifbox"

# Voice (LiveKit) is not deployed yet; empty map keeps the config valid.
[hosts.livekit]

[api.registration]
invite_only = true
