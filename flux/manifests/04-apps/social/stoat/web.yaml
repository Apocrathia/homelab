---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stoat-web
  namespace: stoat
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    app:
      name: stoat-web
      namespace: stoat
      # renovate: datasource=docker depName=ghcr.io/stoatchat/for-web
      image: ghcr.io/stoatchat/for-web:0c31cf0@sha256:18423e92d574fd5d056928aecc88968c3b2dc1a04b36e941bf67ddc5f1442262
      container:
        name: web
        port: 5000
        env:
          - name: TZ
            value: "America/Denver"
          - name: VITE_API_URL
            value: "https://stoat.gateway.services.apocrathia.com/api"
          - name: VITE_WS_URL
            value: "wss://stoat.gateway.services.apocrathia.com/ws"
          - name: VITE_MEDIA_URL
            value: "https://stoat.gateway.services.apocrathia.com/autumn"
          - name: VITE_PROXY_URL
            value: "https://stoat.gateway.services.apocrathia.com/january"
          - name: VITE_GIFBOX_URL
            value: "https://stoat.gateway.services.apocrathia.com/gifbox"
      replicas: 1
      podAntiAffinity:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # Image entrypoint (inject.js) writes dist_injected next to the built
      # assets at container start, so the root filesystem stays writable and
      # the container runs as the image's default user.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      service:
        type: ClusterIP
        port: 5000
        targetPort: 5000
        portName: http
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    postgres:
      enabled: false

    secrets:
      enabled: false

    # Bookmark only — Stoat runs its own accounts/invites; proxy mode would
    # sit in front of the websocket and API for no real gain.
    authentik:
      enabled: true
      mode: "bookmark"
      displayName: "Stoat"
      externalHost: "https://stoat.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/social/stoat/icon.svg"
      category: "Social"
      metaDescription: "Self-hosted Stoat chat (Revolt fork)"
      metaPublisher: "Stoat"

    gatus:
      enabled: true

    httproute:
      enabled: false
