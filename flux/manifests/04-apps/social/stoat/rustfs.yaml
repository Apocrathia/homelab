---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stoat-rustfs
  namespace: stoat
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    app:
      name: stoat-rustfs
      namespace: stoat
      # renovate: datasource=docker depName=rustfs/rustfs
      image: rustfs/rustfs:1.0.0-rc.3@sha256:800cf3f352a0a27e3275ca854a51f0027975d7acc7a0d52089a35bcc9fcbf0b5
      container:
        name: rustfs
        port: 9000
        env:
          - name: TZ
            value: "America/Denver"
          - name: RUSTFS_VOLUMES
            value: "/data"
          - name: RUSTFS_ADDRESS
            value: ":9000"
          - name: RUSTFS_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: stoat-secrets
                key: rustfs-access-key
          - name: RUSTFS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: stoat-secrets
                key: rustfs-secret-key
      replicas: 1
      podAntiAffinity:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      service:
        type: ClusterIP
        port: 9000
        targetPort: 9000
        portName: s3
      healthChecks:
        livenessProbe:
          enabled: true
          tcpSocket:
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          enabled: true
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      volumeMounts:
        - name: rustfs
          mountPath: /data

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: rustfs
            capacity: 10Gi
      smb:
        enabled: false

    postgres:
      enabled: false

    secrets:
      enabled: false

    authentik:
      enabled: false

    gatus:
      enabled: false

    httproute:
      enabled: false
