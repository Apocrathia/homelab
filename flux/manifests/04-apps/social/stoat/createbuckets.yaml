---
apiVersion: batch/v1
kind: Job
metadata:
  name: stoat-createbuckets
  namespace: stoat
spec:
  # Flux re-applies every 10m; the Job is idempotent (mc mb --ignore-existing),
  # so TTL-driven recreation just re-verifies the bucket exists.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 10
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # renovate: datasource=docker depName=minio/mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set stoat http://stoat-rustfs:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"; do
                echo "Waiting for rustfs..." && sleep 2;
              done
              mc mb --ignore-existing stoat/revolt-uploads
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stoat-secrets
                  key: rustfs-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stoat-secrets
                  key: rustfs-secret-key
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: mc-config
              mountPath: /.mc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mc-config
          emptyDir: {}
