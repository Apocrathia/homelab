---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stoat-valkey
  namespace: stoat
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    app:
      name: stoat-valkey
      namespace: stoat
      # renovate: datasource=docker depName=valkey/valkey
      image: valkey/valkey:9-alpine@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a
      args:
        - valkey-server
        - --save
        - ""
        - --appendonly
        - "no"
      container:
        name: valkey
        port: 6379
        env:
          - name: TZ
            value: "America/Denver"
      replicas: 1
      podAntiAffinity:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      healthChecks:
        livenessProbe:
          enabled: true
          exec:
            command:
              - valkey-cli
              - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          enabled: true
          exec:
            command:
              - valkey-cli
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
      service:
        type: ClusterIP
        port: 6379
        targetPort: 6379
        portName: valkey

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    postgres:
      enabled: false

    secrets:
      enabled: false

    authentik:
      enabled: false

    gatus:
      enabled: false

    httproute:
      enabled: false
