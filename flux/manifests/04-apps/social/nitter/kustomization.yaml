---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: nitter
  namespace: nitter

resources:
  - namespace.yaml
  - valkey.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: nitter-config
    namespace: nitter
    files:
      - nitter.conf
    options:
      disableNameSuffixHash: true
