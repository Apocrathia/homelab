---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lemmy
  namespace: lemmy
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.59"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: lemmy
      # renovate: datasource=docker depName=dessalines/lemmy-ui
      image: dessalines/lemmy-ui:0.19.15
      container:
        name: lemmy-ui
        port: 1234
        env:
          - name: TZ
            value: "America/Denver"
          - name: LEMMY_UI_LEMMY_INTERNAL_HOST
            value: "lemmy.ml"
          - name: LEMMY_UI_LEMMY_EXTERNAL_HOST
            value: "lemmy.ml"
          - name: LEMMY_UI_HTTPS
            value: "true"
      replicas: 1
      podAntiAffinity:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      service:
        type: ClusterIP
        port: 80
        targetPort: 1234
        portName: http

    secrets:
      enabled: false

    authentik:
      enabled: true
      category: "Social"
      displayName: "Lemmy"
      externalHost: "https://lemmy.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/social/lemmy/icon.svg"

    httproute:
      enabled: false
