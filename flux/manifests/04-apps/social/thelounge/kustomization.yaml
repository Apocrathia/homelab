---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: thelounge

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: thelounge-config
    namespace: thelounge
    files:
      - config.js
    options:
      disableNameSuffixHash: true
