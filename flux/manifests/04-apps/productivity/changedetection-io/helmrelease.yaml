---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection-io
  namespace: changedetection-io
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
  values:
    app:
      name: changedetection-io
      namespace: changedetection-io
      # renovate: datasource=docker depName=lscr.io/linuxserver/changedetection.io versioning=semver-coerced
      image: lscr.io/linuxserver/changedetection.io:0.55.8@sha256:282b13c7ec1c774ced5e255a2c93397809fe93e0fa1ecb4a2044cc75b2ae6805
      container:
        name: changedetection-io
        port: 5000
        env:
          - name: TZ
            value: "America/Denver"
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: BASE_URL
            value: "https://changedetection.gateway.services.apocrathia.com"
          - name: PLAYWRIGHT_DRIVER_URL
            value: "ws://localhost:3000/?--disable-gpu&--disable-gpu-sandbox&--disable-software-rasterizer"
          - name: PLAYWRIGHT_BROWSER_TYPE
            value: "chromium"
          - name: PLAYWRIGHT_SERVICE_WORKERS
            value: "allow"
          # Keep at or below sockpuppet MAX_CONCURRENT_CHROME_PROCESSES.
          # Oversubscription wedges the CDP endpoint (connect_over_cdp timeouts).
          - name: FETCH_WORKERS
            value: "5"
          - name: MINIMUM_SECONDS_RECHECK_TIME
            value: "3"
          - name: USE_X_SETTINGS
            value: "1"
          - name: HIDE_REFERER
            value: "true"
          - name: LOGGER_LEVEL
            value: "INFO"
          - name: DISABLE_VERSION_CHECK
            value: "1"
          - name: DEFAULT_FETCH_BACKEND
            value: "playwright"
          - name: PYTHONIOENCODING
            value: "utf-8"
          - name: LC_ALL
            value: "C.UTF-8"
          - name: LANG
            value: "C.UTF-8"
          # Allow LLM API base URLs that resolve to private/cluster IPs (e.g. in-cluster LiteLLM).
          # changedetection.io blocks IANA-restricted addresses by default as SSRF protection.
          - name: ALLOW_IANA_RESTRICTED_ADDRESSES
            value: "true"
      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      dnsConfig:
        options:
          - name: ndots
            value: "1"

      securityContext:
        runAsUser: "0"
        runAsGroup: "0"
        fsGroup: 1000
        runAsNonRoot: "false"
        allowPrivilegeEscalation: "true"
        readOnlyRootFilesystem: "false"
        capabilities:
          add:
            - SETUID
            - SETGID
            - CHOWN
            - DAC_OVERRIDE
            - KILL
            - FOWNER

      # Sockpuppet browser sidecar for JavaScript support
      sidecars:
        - name: sockpuppet
          # renovate: datasource=docker depName=dgtlmoon/sockpuppetbrowser
          image: dgtlmoon/sockpuppetbrowser:0.0.3@sha256:23a7be698216407648b6c78fc55de0411bde550635edc30347373c86a5176fad
          ports:
            - containerPort: 3000
              name: sockpuppet
            - containerPort: 8080
              name: sockpuppet-stats
          env:
            - name: SCREEN_WIDTH
              value: "1920"
            - name: SCREEN_HEIGHT
              value: "1024"
            - name: SCREEN_DEPTH
              value: "16"
            - name: MAX_CONCURRENT_CHROME_PROCESSES
              value: "5"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          volumes:
            emptyDir:
              - name: temp
                mountPath: /tmp
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
          # Stats HTTP on :8080 (CDP WS on :3000 still accepts TCP when wedged).
          healthChecks:
            livenessProbe:
              enabled: true
              httpGet:
                path: /stats
                port: 8080
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi

      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 2Gi

      service:
        type: ClusterIP
        port: 5000
        targetPort: 5000
        portName: http

      volumeMounts:
        - name: config
          mountPath: /config

      volumes:
        emptyDir:
          - name: temp
            mountPath: /tmp
          - name: shm
            medium: Memory
            mountPath: /dev/shm
            sizeLimit: "2Gi"

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: config
            capacity: 5Gi
      smb:
        enabled: false

    secrets:
      enabled: false

    authentik:
      enabled: true
      category: "Productivity"
      displayName: "Change Detection"
      externalHost: "https://changedetection.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/productivity/changedetection-io/icon.svg"

    httproute:
      enabled: false
