---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: cryptpad
  namespace: cryptpad

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: cryptpad-config
    namespace: cryptpad
    files:
      - config.js
    options:
      disableNameSuffixHash: true
