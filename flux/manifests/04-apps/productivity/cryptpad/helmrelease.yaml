---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cryptpad
  namespace: cryptpad
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.83"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  # OIDC client credentials (Secret cryptpad-secrets, synced by the
  # OnePasswordItem in this kustomization) feed the Authentik provider
  # blueprint so the app and IdP share one credential source.
  valuesFrom:
    - kind: Secret
      name: cryptpad-secrets
      valuesKey: oidc-client-id
      targetPath: authentik.oidc.clientId
    - kind: Secret
      name: cryptpad-secrets
      valuesKey: oidc-client-secret
      targetPath: authentik.oidc.clientSecret
  values:
    app:
      name: cryptpad
      # renovate: datasource=docker depName=cryptpad/cryptpad versioning=regex:^version-(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
      image: cryptpad/cryptpad:version-2026.5.1@sha256:1f89dcdd28c1375f675e47b1d0cf07a51f3e9a07a79dc93c8cddb3295b98a34d
      container:
        name: cryptpad
        port: 3000
        extraPorts:
          - name: websocket
            containerPort: 3003
            protocol: TCP
        env:
          - name: CPAD_CONF
            value: "/cryptpad/config/config.js"
          # SSO plugin reads these at require time (config/sso.js)
          - name: OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: cryptpad-secrets
                key: oidc-client-id
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: cryptpad-secrets
                key: oidc-client-secret
      replicas: 1
      podAntiAffinity:
        enabled: false
      # Official SSO plugin (github.com/cryptpad/sso) — version must pair with
      # the CryptPad image tag (0.6.0 <-> 2026.5.1); fetched into an emptyDir
      # the entrypoint's npm build picks up on every start.
      initContainers:
        - name: install-sso-plugin
          # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/alpine
          image: public.ecr.aws/docker/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # renovate: datasource=github-releases depName=cryptpad/sso
              SSO_PLUGIN_VERSION="0.6.0"
              wget -qO- "https://codeload.github.com/cryptpad/sso/tar.gz/refs/tags/${SSO_PLUGIN_VERSION}" \
                | tar xz -C /plugins --strip-components=1
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: sso-plugin
              mountPath: /plugins
      # CryptPad container runs as user/group 4001
      securityContext:
        runAsUser: 4001
        runAsGroup: 4001
        fsGroup: 4001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          enabled: true
          httpGet:
            path: /
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
        targetPort: 3000
        portName: http
      volumes:
        configMap:
          - name: config
            mountPath: /cryptpad/config/config.js
            subPath: config.js
            configMapName: cryptpad-config
          - name: sso-config
            mountPath: /cryptpad/config/sso.js
            subPath: sso.js
            configMapName: cryptpad-sso-config
        emptyDir:
          - name: sso-plugin
            mountPath: /cryptpad/lib/plugins/sso
      volumeMounts:
        - name: data
          mountPath: /data

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: true
        volumes:
          - name: data
            source: "//storage.services.apocrathia.com/Library"
            subDir: "CryptPad"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false

    # Secret sync happens via the plain OnePasswordItem in this kustomization
    # (must exist before the HelmRelease valuesFrom above can resolve).
    secrets:
      enabled: false

    # Native OIDC via the SSO plugin; Authentik provider + app come from the
    # chart blueprint, access from the admins + users group bindings.
    authentik:
      enabled: true
      mode: "oidc"
      shared: true
      displayName: "CryptPad"
      externalHost: "https://cryptpad.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/productivity/cryptpad/icon.svg"
      category: "Productivity"
      oidc:
        redirectUris:
          # Hard-coded by the plugin: httpUnsafeOrigin + /ssoauth
          - url: "https://cryptpad.gateway.services.apocrathia.com/ssoauth"
            matchingMode: "strict"

    # Main domain route (sandbox gets its own hand-written route for the
    # second hostname; the chart template takes exactly one).
    httproute:
      enabled: true
      hostname: cryptpad.gateway.services.apocrathia.com

    # Friends tier: adds the tailnet-gateway parentRef to the chart route.
    tailnet:
      enabled: true
