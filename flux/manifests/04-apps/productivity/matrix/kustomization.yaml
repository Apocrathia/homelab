---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: matrix
  namespace: matrix

resources:
  - namespace.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: element-config
    namespace: matrix
    files:
      - config.json
    options:
      disableNameSuffixHash: true
