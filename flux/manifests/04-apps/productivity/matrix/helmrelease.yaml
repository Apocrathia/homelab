---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: element-web
  namespace: matrix
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.72"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: element-web
      namespace: matrix
      # renovate: datasource=docker depName=ghcr.io/element-hq/element-web
      image: ghcr.io/element-hq/element-web:v1.12.18
      container:
        name: element-web
        port: 80
        env:
          - name: ELEMENT_WEB_PORT
            value: "80"
      replicas: 1
      podAntiAffinity:
        enabled: false
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      # nginx-unprivileged runs as UID 101 (nginx user)
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      service:
        type: ClusterIP
        port: 80
        targetPort: 80
        portName: http
      volumes:
        configMap:
          - name: config
            mountPath: /app/config.json
            subPath: config.json
            configMapName: element-config
        emptyDir:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /var/run
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d
          - name: tmp
            mountPath: /tmp

    storage:
      longhorn:
        enabled: false

    secrets:
      enabled: false

    authentik:
      enabled: true
      category: "Productivity"
      displayName: "Matrix"
      externalHost: "https://matrix.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/productivity/matrix/icon.svg"
      interceptHeaderAuth: false

    httproute:
      enabled: false
