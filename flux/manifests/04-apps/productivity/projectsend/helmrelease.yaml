---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: projectsend
  namespace: projectsend
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.85"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: projectsend
      # renovate: datasource=docker depName=projectsend/projectsend
      image: projectsend/projectsend:2@sha256:a82aac028f430cae165a1fc88ce5418bcb049be478e6307ef758306e6e65a99d
      container:
        name: projectsend
        port: 80
        env:
          - name: TZ
            value: "America/Denver"
          - name: APP_URL
            value: "https://projectsend.gateway.services.apocrathia.com"
          - name: APP_ENV
            value: "production"
          - name: APP_DEBUG
            value: "false"
          # MySQL via the in-namespace projectsend-mysql release
          - name: DB_CONNECTION
            value: "mysql"
          - name: DB_HOST
            value: "projectsend-mysql.projectsend.svc.cluster.local"
          - name: DB_PORT
            value: "3306"
          - name: DB_DATABASE
            value: "projectsend"
          - name: DB_USERNAME
            value: "projectsend"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: projectsend-secrets
                key: database-password
          # Valkey via the in-namespace projectsend-valkey release
          - name: REDIS_HOST
            value: "projectsend-valkey"
          - name: CACHE_STORE
            value: "redis"
          - name: SESSION_DRIVER
            value: "redis"
          - name: QUEUE_CONNECTION
            value: "redis"
          # Only the Authentik outpost and node sources can reach the pod;
          # trust X-Forwarded-* from the cluster CIDR so rate limits and the
          # download log record real client IPs.
          - name: TRUSTED_PROXIES
            value: "10.42.0.0/16"
      # The entrypoint chowns storage/ recursively (set -e); CIFS cannot
      # chown, so the SMB share cannot be storage/ itself. Mount it at
      # /uploads and symlink the Laravel files-disk root onto it — busybox
      # chown -R does not traverse symlinks, so the share is never chowned,
      # while Laravel (storage/app/files) and nginx (X-Accel alias) both
      # resolve through the symlink to the share.
      initContainers:
        - name: link-uploads
          image: projectsend/projectsend:2@sha256:3e3972b8cd37702bedfa1d6f6804dfe4ae78c61dfe290a9fc06b29691dc057f8
          command:
            - sh
            - -c
            - mkdir -p /var/www/html/storage/app && ln -sfn /uploads /var/www/html/storage/app/files
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: uploads
              mountPath: /uploads

      replicas: 1
      podAntiAffinity:
        enabled: false # Single replica, no need for anti-affinity
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      # Upstream-supported runtime: supervisord as root (pidfile in /run,
      # nginx binds :80, workers su-exec down to www-data=1000). Minimal
      # capability set for exactly those needs.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN # entrypoint chowns storage to www-data
            - FOWNER
            - SETUID # su-exec drops to www-data
            - SETGID
            - NET_BIND_SERVICE # nginx binds :80
            - DAC_OVERRIDE # /var/www/html and nginx state dirs are
            # www-data-owned; root without DAC_OVERRIDE cannot create
            # the .env symlink or write nginx temp files
      service:
        type: ClusterIP
        port: 80
        targetPort: 80
        portName: http
      healthChecks:
        # First boot waits for MySQL and runs migrations — slow start is normal
        startupProbe:
          enabled: true
          httpGet:
            path: /up
            port: 80
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          enabled: true
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          enabled: true
          httpGet:
            path: /up
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
        - name: uploads
          mountPath: /uploads

    storage:
      # storage/ (framework cache, .env + APP_KEY) on local disk: the
      # entrypoint chown would fail on CIFS. Uploads live on the share via
      # the /uploads symlink.
      longhorn:
        enabled: true
        numberOfReplicas: 2
        volumes:
          - name: storage
            capacity: 1Gi
      smb:
        enabled: true
        volumes:
          # Same Uploads share as copyparty; ProjectSend's uploads land under
          # the ProjectSend subDir, isolated from copyparty's /u tree.
          - name: uploads
            source: "//storage.services.apocrathia.com/Uploads"
            subDir: "ProjectSend"
            capacity: "500Gi"
            credentialsPath: "vaults/Secrets/items/smb-credentials"
            readOnly: false

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/projectsend-secrets"

    postgres:
      enabled: false

    # OIDC mode: native social-login provider (Settings > Social Login >
    # OpenID Connect in the app UI); Authentik is upstream-supported via
    # OIDC discovery. Friends signing in with no local account are
    # auto-provisioned as clients, never staff.
    authentik:
      enabled: true
      mode: "oidc"
      shared: true
      displayName: "ProjectSend"
      externalHost: "https://projectsend.gateway.services.apocrathia.com"
      ssoLaunchUrl: "https://projectsend.gateway.services.apocrathia.com/auth/oidc/redirect"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/productivity/projectsend/icon.svg"
      category: "Productivity"
      metaDescription: "Client file sharing with per-client portals"
      metaPublisher: "ProjectSend"
      oidc:
        redirectUris:
          - url: "https://projectsend.gateway.services.apocrathia.com/auth/oidc/callback"
            matchingMode: "strict"
        scopes:
          - "openid"
          - "email"
          - "profile"
        clientType: "confidential"
        subMode: "user_username"

    gatus:
      enabled: true
      path: "/up"

    # Direct HTTPRoute (OIDC mode has no outpost); tailnet dual-parents it.
    httproute:
      enabled: true
      hostname: projectsend.gateway.services.apocrathia.com

    # Tailnet sharing (friends) on the same hostname.
    tailnet:
      enabled: true
