---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ideon
  namespace: ideon
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.65"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  values:
    app:
      name: ideon
      # renovate: datasource=docker depName=ghcr.io/3xpyth0n/ideon
      image: ghcr.io/3xpyth0n/ideon:0.7.1
      container:
        name: ideon
        port: 3000
        env:
          # Database Configuration
          - name: DB_HOST
            value: "ideon-postgres-rw.ideon.svc.cluster.local"
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: "ideon"
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: ideon-secrets
                key: username
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: ideon-secrets
                key: password
          # Application Configuration
          - name: APP_PORT
            value: "3000"
          - name: APP_URL
            value: "https://ideon.gateway.services.apocrathia.com"
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: ideon-secrets
                key: secret-key
          - name: TZ
            value: "America/Chicago"
      service:
        port: 80
        targetPort: 3000
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
      volumeMounts:
        - name: storage
          mountPath: /app/storage

    storage:
      longhorn:
        enabled: true
        numberOfReplicas: 1
        volumes:
          - name: storage
            capacity: 5Gi

    secrets:
      enabled: true
      itemPath: "vaults/Secrets/items/ideon-secrets"

    postgres:
      enabled: true
      imageName: ghcr.io/cloudnative-pg/postgresql:17
      instances: 1
      storage:
        storageClass: longhorn
        size: 5Gi

    authentik:
      enabled: true
      mode: "oidc"
      category: "Productivity"
      displayName: "Ideon"
      externalHost: "https://ideon.gateway.services.apocrathia.com"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/04-apps/productivity/ideon/icon.png"
      metaDescription: "Visual hub for project management with real-time collaboration"
      metaPublisher: "Ideon"
      oidc:
        redirectUris:
          - url: "https://ideon.gateway.services.apocrathia.com/api/auth/callback/oidc"
            matchingMode: "regex"

    httproute:
      enabled: true
      hostname: "ideon.gateway.services.apocrathia.com"
