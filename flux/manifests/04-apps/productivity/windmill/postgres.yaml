---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: windmill-postgres
  namespace: windmill
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  instances: 1
  storage:
    size: 20Gi
    storageClass: longhorn

  # Resource limits to prevent OOM kills
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  bootstrap:
    initdb:
      database: windmill
      owner: windmill
      secret:
        name: windmill-secrets
      # Windmill requires these roles for RLS-based permissions
      # See: https://github.com/windmill-labs/windmill/blob/main/init-db-as-superuser.sql
      postInitApplicationSQL:
        - CREATE ROLE windmill_user
        - GRANT ALL ON ALL TABLES IN SCHEMA public TO windmill_user
        - GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO windmill_user
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO windmill_user
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO windmill_user
        - CREATE ROLE windmill_admin WITH BYPASSRLS
        - GRANT windmill_user TO windmill_admin
        - GRANT windmill_admin TO windmill
        - GRANT CREATE ON DATABASE windmill TO windmill_admin
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "64MB"
      track_io_timing: "on"
      track_functions: "all"
