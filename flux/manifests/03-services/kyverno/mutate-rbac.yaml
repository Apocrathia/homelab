---
# RBAC for the kyverno background controller to stamp the reload annotation
# on Deployments for mutate-existing rules (reload-crossview-on-configmap-change).
# Kyverno's policy admission check does not honor resourceNames, so verbs stay
# unscoped — same intentional tradeoff as generate-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:mutate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
# Read-only mirror for the admission controller's pre-validation of the same
# mutate rules (it checks get/list only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-mutate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
