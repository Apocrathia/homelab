---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      # renovate: datasource=helm registryUrl=https://kyverno.github.io/kyverno depName=kyverno
      version: "3.8.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      install: true
    extraArgs:
      - --leaderElectionLeaseDuration=60s
      - --leaderElectionRenewDeadline=45s
      - --leaderElectionRetryPeriod=10s
      - --clientRateLimitQPS=300
      - --clientRateLimitBurst=300
      - --eventsRateLimitQPS=300
      - --eventsRateLimitBurst=300
      - --webhookTimeout=15
      - --forceFailurePolicyIgnore=true
    config:
      # Remove ReplicaSet filters to allow cleanup policies to work
      resourceFiltersExclude:
        - "[ReplicaSet,*,*]"
        - "[ReplicaSet/?*,*,*]"
        # system-upgrade: tuppr jobs and upgrade CR status patches; exclude so ops don't depend on webhook connectivity
        - "[Job,system-upgrade,*]"
        - "[TalosUpgrade,*,*]"
        - "[KubernetesUpgrade,*,*]"
    global:
      image:
        registry: ghcr.io
    rbac:
      extraResources: &commonResources # Read access to all resources
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["get", "list", "watch"]
        # Allow to modify cert-manager ClusterIssuers
        - apiGroups: ["cert-manager.io"]
          resources: ["ClusterIssuer"]
          verbs: ["get", "list", "watch", "update", "patch"]
      clusterRole:
        extraResources: *commonResources
      admissionController:
        clusterRole:
          extraResources: *commonResources
      backgroundController:
        clusterRole:
          extraResources: *commonResources
      reportsController:
        clusterRole:
          extraResources: *commonResources
      cleanupController:
        clusterRole:
          extraResources: *commonResources
    admissionController:
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      startupProbe:
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 24
      readinessProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 6
      livenessProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 3
    cleanupController:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      startupProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 30
      readinessProbe:
        initialDelaySeconds: 30
        periodSeconds: 20
        timeoutSeconds: 15
        failureThreshold: 12
      livenessProbe:
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 15
        failureThreshold: 6
