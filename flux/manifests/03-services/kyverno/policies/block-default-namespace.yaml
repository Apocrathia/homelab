---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-default-namespace
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
          - replicasets
          - daemonsets
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - jobs
          - cronjobs
  validations:
    - expression: 'object.metadata.namespace != "default"'
      message: "Deployments to the default namespace are not allowed. Please use a dedicated namespace."
