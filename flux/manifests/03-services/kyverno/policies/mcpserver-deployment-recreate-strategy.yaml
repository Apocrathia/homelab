---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mcpserver-deployment-recreate-strategy
  annotations:
    policies.kyverno.io/title: MCPServer Deployments use Recreate strategy
    policies.kyverno.io/category: Availability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/description: >-
      The kagent kmcp controller renders MCPServer Deployments with the default
      RollingUpdate strategy and exposes no field to override it. MCPServers that
      mount RWO Longhorn PVCs then deadlock on upgrade: the new ReplicaSet pod is
      created before the old one terminates, and the volume stays attached to the
      node running the old pod, so the new pod sits in ContainerCreating until the
      rollout hits ProgressDeadlineExceeded. This policy patches any Deployment
      owned by an MCPServer CR to use the Recreate strategy, trading a short
      downtime window (acceptable in a homelab) for rollouts that actually
      complete. Remove this once upstream kmcp exposes spec.deployment.strategy.
spec:
  # The CEL failurePolicy replaces the legacy webhook failurePolicy; Fail is
  # also the kyverno default, kept explicit to match the upstream conformance
  # tests' shape for this pattern.
  failurePolicy: Fail
  # Only Deployments owned by a kagent MCPServer CR. ownerReferences is the
  # stable signal — names/labels vary across MCPServer instances.
  # Nil-safe: most Deployments carry no ownerReferences; without the
  # `?...orValue([])` fallback, exists() errors, and with failurePolicy Fail
  # that would deny every Deployment write cluster-wide.
  matchConditions:
    - name: owned-by-mcpserver
      expression: >-
        object.metadata.?ownerReferences.orValue([]).exists(ref, ref.kind == "MCPServer")
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
  mutations:
    # The legacy patchStrategicMerge set strategy.type=Recreate and nulled
    # rollingUpdate in one shot. ApplyConfiguration can only set fields, it
    # cannot remove them, so this is a JSONPatch: add type, plus a remove of
    # rollingUpdate guarded by has() — a JSONPatch remove on a missing path
    # fails, and with type=Recreate the API rejects a spec that still carries
    # rollingUpdate params. The strategy-absent branch covers Deployment
    # submissions that reach the webhook without spec.strategy set.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.strategy) && has(object.spec.strategy.rollingUpdate)
            ? [JSONPatch{op: "add", path: "/spec/strategy/type", value: "Recreate"},
               JSONPatch{op: "remove", path: "/spec/strategy/rollingUpdate"}]
            : has(object.spec.strategy)
              ? [JSONPatch{op: "add", path: "/spec/strategy/type", value: "Recreate"}]
              : [JSONPatch{op: "add", path: "/spec/strategy", value: Object.spec.strategy{type: "Recreate"}}]
