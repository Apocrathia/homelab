---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: reload-crossview-on-configmap-change
  annotations:
    policies.kyverno.io/title: Reload Crossview on ConfigMap change
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, ConfigMap
    policies.kyverno.io/description: >-
      The crossview chart ships app config in a ConfigMap but carries no
      checksum annotation on the Deployment pod template, so ConfigMap-only
      changes never roll the pod — env vars from ConfigMaps resolve at pod
      start (a CORS-origin fix once sat applied but inert until a manual
      restart). When crossview-config is written, stamp a changing annotation
      on the crossview Deployment pod template to trigger a rolling restart.
      Copy this file for other apps with the same chart gap.
spec:
  failurePolicy: Fail
  # Fires when the ConfigMap is written (admission); the mutate-existing
  # target patch itself is applied asynchronously by the background
  # controller (RBAC already granted in kyverno/mutate-rbac.yaml).
  evaluation:
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - configmaps
        resourceNames:
          - crossview-config
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: crossplane-system
  # Resolve the target by API read instead of the legacy static
  # mutate.targets entry: the CEL API can resolve targets from trigger
  # variables, so the legacy "target must be static" caveat (kyverno#5546)
  # no longer applies. Kept a fixed name/namespace anyway — there is exactly
  # one crossview Deployment. A missing Deployment resolves to null (no
  # targets), which skips the mutation instead of failing the ConfigMap
  # write.
  targetMatchConstraints:
    expression: 'resource.Get("apps/v1", "deployments", "crossplane-system", "crossview")'
  # Trigger context reaches mutation expressions only through variables.
  variables:
    - name: reloadedFrom
      expression: 'request.object.metadata.name + "@" + request.object.metadata.resourceVersion'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                metadata: Object.spec.template.metadata{
                  annotations: {"apocrathia.com/reloaded-from": variables.reloadedFrom}
                }
              }
            }
          }
