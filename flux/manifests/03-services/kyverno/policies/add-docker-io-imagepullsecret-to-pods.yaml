---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-docker-io-imagepullsecret-to-pods
  annotations:
    policies.kyverno.io/title: Add Docker Hub imagePullSecret to Pods
    policies.kyverno.io/category: Image Pull
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods created in namespaces labeled with `images/dockerhub=true` are
      mutated to reference the `docker-io-imagepullsecret` Secret, lifting
      the unauthenticated Docker Hub pull rate limit for any container that
      happens to pull from Docker Hub. Pods that do not pull from Docker Hub
      are unaffected — Kubernetes ignores imagePullSecrets that aren't
      relevant to an image's registry. Sibling of
      clone-docker-io-imagepullsecret (the Secret-sync half of the former
      sync-docker-io-imagepullsecret ClusterPolicy).
spec:
  failurePolicy: Fail
  # Pod-controller autogen is disabled to keep the legacy scope: bare Pods
  # only. The old ClusterPolicy's mutate rule matched Pod without generating
  # controller variants, and controller-created Pods still pass through Pod
  # admission, so coverage is unchanged.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        # Restrict to CREATE so the rule does not run on pod UPDATEs.
        # Mutating on UPDATE injects nothing new (pod spec is immutable
        # post-creation) but the webhook still runs validation, which
        # rejects unrelated metadata patches (e.g. clearing finalizers
        # on stuck pods during a Longhorn CSI upgrade).
        operations:
          - CREATE
        resources:
          - pods
    namespaceSelector:
      matchLabels:
        images/dockerhub: "true"
  mutations:
    # JSONPatch mirrors the official kyverno/policies add-imagepullsecrets
    # pattern: idempotence needs the explicit not-already-present check that
    # patchStrategicMerge's merge-by-name gave us for free.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.imagePullSecrets) && object.spec.imagePullSecrets.exists(s, s.name == "docker-io-imagepullsecret")
            ? []
            : has(object.spec.imagePullSecrets)
              ? [JSONPatch{op: "add", path: "/spec/imagePullSecrets/0", value: {"name": "docker-io-imagepullsecret"}}]
              : [JSONPatch{op: "add", path: "/spec/imagePullSecrets", value: [{"name": "docker-io-imagepullsecret"}]}]
