---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: reload-deployment-on-configmap-change
  annotations:
    policies.kyverno.io/title: Reload Deployment on ConfigMap change
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, ConfigMap
    policies.kyverno.io/description: >-
      Charts that ship app config in a ConfigMap but carry no checksum
      annotation on the Deployment pod template never roll pods when only the
      ConfigMap content changes — env vars from ConfigMaps resolve at pod start
      (crossview 4.6.0 is the current example; a CORS-origin fix sat applied
      but inert until a manual rollout restart). Opt in per app by labeling
      the ConfigMap with apocrathia.com/reload-deployment: <deployment-name>;
      on any write to that ConfigMap this policy stamps a changing annotation
      on the named Deployment pod template, which triggers a rolling restart.
spec:
  mutating: true
  # Admission-time only: mutateExisting targets are live objects, there is
  # nothing useful to do on old reports.
  background: false
  rules:
    - name: stamp-reload-annotation
      match:
        any:
          - resources:
              kinds:
                - ConfigMap
      # Nil-safe: ConfigMaps without the label are skipped (the fallback empty
      # string must not error the webhook).
      preconditions:
        all:
          - key: '{{ request.object.metadata.labels."apocrathia.com/reload-deployment" || `` }}'
            operator: NotEquals
            value: ""
      mutate:
        mutateExistingOnPolicyUpdate: false
        targets:
          - apiVersion: apps/v1
            kind: Deployment
            namespace: "{{ request.object.metadata.namespace }}"
            name: '{{ request.object.metadata.labels."apocrathia.com/reload-deployment" }}'
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  apocrathia.com/reloaded-from: "{{ request.object.metadata.name }}@{{ request.object.metadata.resourceVersion }}"
