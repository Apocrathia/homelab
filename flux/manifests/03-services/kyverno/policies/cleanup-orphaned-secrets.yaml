---
apiVersion: kyverno.io/v2
kind: ClusterCleanupPolicy
metadata:
  name: cleanup-orphaned-secrets
  annotations:
    policies.kyverno.io/title: Cleanup Orphaned Secrets
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    kyverno.io/kyverno-version: 1.11.1
    policies.kyverno.io/minversion: 1.9.0
    kyverno.io/kubernetes-version: "1.27"
    policies.kyverno.io/description: >-
      Cleans up Secrets without owner references that are older than 30 days
      to prevent etcd bloat. Only targets Secrets that have NO management
      indicators (no owner refs, no Helm labels, no Flux labels, not system
      types). Excludes critical system namespaces and TLS/cert secrets.
spec:
  match:
    any:
      - resources:
          kinds:
            - Secret
  exclude:
    any:
      # Exclude critical system namespaces
      - resources:
          namespaces:
            - kube-system
            - kyverno
            - flux-system
            - cert-manager
            - longhorn-system
            - cilium-system
            - kube-prometheus-stack
            - cnpg-system
            - external-secrets
            - authentik
      # Exclude Helm release secrets
      - resources:
          selector:
            matchLabels:
              owner: helm
      # Exclude Helm-managed (app.kubernetes.io/managed-by label)
      - resources:
          selector:
            matchLabels:
              app.kubernetes.io/managed-by: Helm
      # Exclude Helm-managed (helm.sh/chart label)
      - resources:
          selector:
            matchExpressions:
              - key: helm.sh/chart
                operator: Exists
      # Exclude Flux-managed resources
      - resources:
          selector:
            matchExpressions:
              - key: kustomize.toolkit.fluxcd.io/name
                operator: Exists
      # Exclude resources with app.kubernetes.io/name (typically managed)
      - resources:
          selector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: Exists
  conditions:
    all:
      # Must be older than 30 days
      - key: "{{ time_diff(target.metadata.creationTimestamp, time_now_utc()) }}"
        operator: GreaterThan
        value: "720h0m0s"
      # Must have no owner references
      - key: "{{ target.metadata.ownerReferences[] || `[]` }}"
        operator: Equals
        value: []
      # Exclude service account token secrets
      - key: "{{ target.type }}"
        operator: NotEquals
        value: "kubernetes.io/service-account-token"
      # Exclude TLS secrets (often created by cert-manager)
      - key: "{{ target.type }}"
        operator: NotEquals
        value: "kubernetes.io/tls"
      # Exclude dockerconfigjson secrets
      - key: "{{ target.type }}"
        operator: NotEquals
        value: "kubernetes.io/dockerconfigjson"
      # Must not have Helm release annotation
      - key: '{{ target.metadata.annotations."meta.helm.sh/release-name" || '''' }}'
        operator: Equals
        value: ""
      # Must not have cert-manager annotation
      - key: '{{ target.metadata.annotations."cert-manager.io/certificate-name" || '''' }}'
        operator: Equals
        value: ""
  schedule: "0 9 * * *" # 0200 America/Denver (UTC-7)
