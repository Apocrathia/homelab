---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: clone-docker-io-imagepullsecret
  annotations:
    policies.kyverno.io/title: Clone Docker Hub imagePullSecret to opted-in namespaces
    policies.kyverno.io/category: Image Pull
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret, Namespace
    policies.kyverno.io/description: >-
      Namespaces labeled with `images/dockerhub=true` receive a clone of
      the `docker-io-imagepullsecret` Secret from the `kube-system`
      namespace, kept synchronized with the source. Sibling of
      add-docker-io-imagepullsecret-to-pods (the pod mutation half of the
      former sync-docker-io-imagepullsecret ClusterPolicy).
spec:
  evaluation:
    # Downstream clones track the source Secret: source updates propagate,
    # manual downstream edits are reverted, source deletion removes clones.
    synchronize:
      enabled: true
    # generateExisting is needed so the clone rule runs against existing
    # labeled namespaces at policy-install time (not only on namespace
    # CREATE/UPDATE events).
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
    # The trigger is the Namespace itself, so objectSelector matches the
    # namespace's own labels.
    objectSelector:
      matchLabels:
        images/dockerhub: "true"
  variables:
    - name: sourceSecret
      expression: 'resource.Get("v1", "secrets", "kube-system", "docker-io-imagepullsecret")'
  generate:
    - expression: "generator.Apply(object.metadata.name, [variables.sourceSecret])"
