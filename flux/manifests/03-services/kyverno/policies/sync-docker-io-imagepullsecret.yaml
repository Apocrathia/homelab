---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-docker-io-imagepullsecret
  annotations:
    policies.kyverno.io/title: Sync Docker Hub imagePullSecret to opted-in namespaces
    policies.kyverno.io/category: Image Pull
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret, Pod
    policies.kyverno.io/description: >-
      Namespaces labeled with `images/dockerhub=true` receive a clone of
      the `docker-io-imagepullsecret` Secret from the `kube-system`
      namespace. Pods created in those namespaces are mutated to reference
      the secret, lifting the unauthenticated Docker Hub pull rate limit
      for any container that happens to pull from Docker Hub. Pods that do
      not pull from Docker Hub are unaffected — Kubernetes ignores
      imagePullSecrets that aren't relevant to an image's registry.
spec:
  # background: true is needed so the generate rule runs against existing
  # namespaces at policy-install time (not only on namespace CREATE events).
  background: true
  generateExisting: true
  rules:
    - name: clone-docker-io-imagepullsecret
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  images/dockerhub: "true"
      generate:
        apiVersion: v1
        kind: Secret
        name: docker-io-imagepullsecret
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: kube-system
          name: docker-io-imagepullsecret

    - name: add-docker-io-imagepullsecret-to-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              # Restrict to CREATE so the rule does not run on pod UPDATEs.
              # Mutating on UPDATE injects nothing new (pod spec is immutable
              # post-creation) but the webhook still runs validation, which
              # rejects unrelated metadata patches (e.g. clearing finalizers
              # on stuck pods during a Longhorn CSI upgrade).
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  images/dockerhub: "true"
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: docker-io-imagepullsecret
