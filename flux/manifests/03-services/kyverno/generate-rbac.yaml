---
# RBAC for the kyverno background controller to clone the
# docker-io-imagepullsecret Secret across namespaces. Kyverno's generate
# policy admission dry-run checks get/update/delete on Secrets without
# honoring resourceNames, so these verbs stay unscoped. Intentional Secret
# manage is documented in .trivyignore.yaml (AVD-KSV-0041 / generate-rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:generate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# RBAC for the kyverno admission controller to perform pre-validation of
# generate rules. When a ClusterPolicy has a generate rule that clones a
# resource, Kyverno's admission webhook checks that the admission
# controller itself has sufficient permissions on the target kind in the
# target namespace — otherwise it rejects the policy at create/update
# time. That check does not honor resourceNames, so get/list stay unscoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-generate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
