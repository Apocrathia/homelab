---
# RBAC for the kyverno background controller to clone the
# docker-io-imagepullsecret Secret across namespaces. Secret creation and
# discovery cannot be restricted by resource name; subsequent access is
# restricted to the generated Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:generate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["docker-io-imagepullsecret"]
    verbs: ["get", "update", "patch", "delete"]
---
# RBAC for the kyverno admission controller to perform pre-validation of
# generate rules. When a ClusterPolicy has a generate rule that clones a
# resource, Kyverno's admission webhook checks that the admission
# controller itself has sufficient permissions on the target kind in the
# target namespace — otherwise it rejects the policy at create time. The
# default admission-controller ClusterRole does not grant any verbs on
# Secrets, so we aggregate list plus name-scoped get for Secrets here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-generate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["docker-io-imagepullsecret"]
    verbs: ["get"]
