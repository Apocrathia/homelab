---
# RBAC for the kyverno background controller to clone Secrets across
# namespaces. The default kyverno:background-controller ClusterRole does
# not grant create/update/delete on secrets — it only reads configmaps and
# events. Aggregating this ClusterRole adds those verbs so the
# `sync-docker-io-imagepullsecret` ClusterPolicy can generate and keep in
# sync the docker-io-imagepullsecret Secret in labeled namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:generate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# RBAC for the kyverno admission controller to perform pre-validation of
# generate rules. When a ClusterPolicy has a generate rule that clones a
# resource, Kyverno's admission webhook checks that the admission
# controller itself has sufficient permissions on the target kind in the
# target namespace — otherwise it rejects the policy at create time. The
# default admission-controller ClusterRole does not grant any verbs on
# Secrets, so we aggregate get/list for Secrets here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-generate-extra-permissions
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
