---
# Reads and writes to credential-bearing paths. Adapted from the upstream
# quickstart file-monitoring policy (security_file_permission only; the mmap
# probe is trimmed). matchActions are authored so the graduation to
# enforcement is a mode flip (spec.options policy-mode -> enforcement), not a
# rewrite; while in monitoring mode they only tag events.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: secret-file-access
spec:
  options:
    - name: policy-mode
      value: monitoring
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file # struct file * -> path
        - index: 1
          type: int # 0x04 MAY_READ, 0x02 MAY_WRITE
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/shadow
                - /etc/gshadow
                - /root/.ssh
                - .ssh/id_
                - /etc/sudoers
                - /etc/pam.d
            - index: 1
              operator: Equal
              values:
                - "4" # MAY_READ
          matchActions:
            - action: Sigkill
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /root/.ssh # writes to credential paths
                - /etc/shadow
                - /etc/sudoers
                - /etc/pam.d
                - /bin
                - /usr/bin
                - /usr/sbin
                - /usr/lib
                - /boot
            - index: 1
              operator: Equal
              values:
                - "2" # MAY_WRITE
          matchActions:
            - action: Sigkill
