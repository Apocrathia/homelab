---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-tetragon-policies
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/manifests/03-services/tetragon/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    # cilium.io TracingPolicy CRDs are installed by the tetragon-operator
    # (crds.installMethod: operator) only after the HelmRelease runs; the
    # TracingPolicies below must not be applied before it.
    - name: services-tetragon
