---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tenzir-ocsf
  namespace: prometheus-system
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  # The plugin only offers jsonData.initSql (no secureJsonData for S3 keys), so
  # the rustfs credentials ride in initSql. The operator controller applies
  # each valuesFrom entry as a strings.ReplaceAll on the jsonData.initSql node,
  # which is why both entries share one targetPath: first the access key is
  # substituted into the SQL, then the secret key into the result. Git only ever
  # holds the ${...} placeholder names, never values (grafana-secrets fields
  # from 1Password item vaults/Secrets/items/grafana-secrets).
  valuesFrom:
    - targetPath: "jsonData.initSql"
      valueFrom:
        secretKeyRef:
          name: "grafana-secrets"
          key: "tenzir-s3-access-key-id"
    - targetPath: "jsonData.initSql"
      valueFrom:
        secretKeyRef:
          name: "grafana-secrets"
          key: "tenzir-s3-secret-access-key"
  datasource:
    name: Tenzir OCSF
    type: motherduck-duckdb-datasource
    uid: tenzir-ocsf
    access: proxy
    isDefault: false
    jsonData:
      # In-memory DuckDB; the S3 secret is created per-process by initSql.
      maxOpenConns: 4
      # Layout contract (tenzir restructure): the archive is one class_uid
      # hive-partitioned dataset (s3://tenzir/ocsf/class_uid=<NNNN>/...); the
      # flat ocsf/ form and per-feed prefixes are retired. Dashboards query
      # the `ocsf` view, not raw globs.
      initSql: |
        INSTALL 'httpfs'; LOAD 'httpfs';
        CREATE SECRET tenzir_s3 (
          TYPE S3,
          KEY_ID '${tenzir-s3-access-key-id}',
          SECRET '${tenzir-s3-secret-access-key}',
          ENDPOINT 'storage.services.apocrathia.com:9009',
          URL_STYLE 'path',
          USE_SSL false
        );
        SET memory_limit = '512MB';
        CREATE OR REPLACE VIEW ocsf AS
          SELECT * FROM read_parquet(
            's3://tenzir/ocsf/class_uid=*/**',
            hive_partitioning = true,
            union_by_name = true
          );
