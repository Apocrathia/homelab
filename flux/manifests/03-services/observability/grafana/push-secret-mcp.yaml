---
# Mirrors the grafana-operator-managed mcp-server service-account token
# (Secret mcp-server-token, ns prometheus-system) into the 1Password item
# grafana-mcp-service-account (vault Secrets, field token), so the vault copy
# heals automatically when grafana-operator rotates the token. The item is
# pre-created as API_CREDENTIAL (the PushSecret create path would hardcode
# SERVER; the update path preserves the existing category). deletionPolicy
# None: removing this PushSecret never deletes the operator's vault item.
# 168h: ESO v2.12 PushSecret PUTs the item on every reconcile even when the
# value is unchanged, bumping the item updatedAt in 1Password — the refresh
# interval IS the bump frequency until upstream adds change-gating (issue
# draft pending). Token rotation is rare; a stale vault token 401s in gcx
# and re-syncs on the next tick.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-mcp-token-to-1password
  namespace: prometheus-system
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 168h
  deletionPolicy: None
  secretStoreRefs:
    - name: 1password-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: mcp-server-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: grafana-mcp-service-account
          property: token
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          vault: Secrets
          tags:
            - kubernetes
            - grafana
            - gcx
