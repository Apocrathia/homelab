---
# Dedicated Grafana service account for gcx (Grafana CLI) consumers —
# decoupled from the mcp-server SA so retiring the Grafana MCP server never
# strands gcx-based agents. Mirrors mcp-service-account.yaml: grafana-operator
# provisions the SA on the kube-prometheus-stack instance and writes its token
# to Secret gcx-token (ns prometheus-system). PushSecret
# push-secret-gcx.yaml mirrors that secret into the 1Password item
# homelab-gcx-token (vault Secrets, field token).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: gcx
  namespace: prometheus-system
spec:
  name: gcx
  instanceName: kube-prometheus-stack-grafana
  role: Admin
  isDisabled: false
  tokens:
    - name: gcx-token
      secretName: gcx-token
