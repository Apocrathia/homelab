---
# Dedicated Grafana service account for gcx (Grafana CLI) consumers —
# decoupled from the mcp-server SA so retiring the Grafana MCP server never
# strands gcx-based agents. grafana-operator provisions the SA on the
# kube-prometheus-stack instance and writes its token to Secret gcx-token
# (ns prometheus-system). PushSecret push-secret-gcx.yaml mirrors that secret
# into the 1Password item homelab-gcx-token (vault Secrets, field token).
#
# Editor, NOT Admin (mcp-server keeps Admin): gcx needs dashboard/folder
# creation, alert-rule writes, and datasource queries — all Editor-scoped.
# Org/datasource/user management stays out of scope for an agent credential
# (least privilege; OSS Grafana fixed roles only — no custom RBAC without
# Enterprise). If a specific gcx workflow hits 403s, escalate deliberately,
# not by default.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: gcx
  namespace: prometheus-system
spec:
  name: gcx
  instanceName: kube-prometheus-stack-grafana
  role: Editor
  isDisabled: false
  tokens:
    - name: gcx-token
      secretName: gcx-token
