---
# Mirrors the gcx service-account token (grafana-operator-managed Secret
# gcx-token, ns prometheus-system) into the 1Password item homelab-gcx-token
# (vault Secrets, field token). The item is PRE-CREATED as API_CREDENTIAL (the
# PushSecret create path would hardcode SERVER; the update path preserves the
# existing category). deletionPolicy None: removing this PushSecret never
# deletes the vault item.
# 168h refresh: ESO v2.12 PushSecret PUTs the item on every reconcile even
# when the value is unchanged, which bumps the item updatedAt in 1Password and
# floats idle tokens to the top of the vault list — so the refresh interval IS
# the bump frequency until upstream adds change-gating (issue draft pending).
# Token rotation is rare (grafana-operator re-mints on SA change), so the
# <=7d convergence window is acceptable; a stale vault token 401s in gcx and
# re-syncs on the next tick.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gcx-token-to-1password
  namespace: prometheus-system
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  refreshInterval: 168h
  deletionPolicy: None
  secretStoreRefs:
    - name: 1password-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: gcx-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: homelab-gcx-token
          property: token
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          vault: Secrets
          tags:
            - kubernetes
            - grafana
            - gcx
