---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
# The 1Password item's field labels become the Secret keys. The tailscale2otel
# chart injects the whole Secret via envFrom, so the item must contain ONLY the
# TS2OTEL_* fields listed in README.md — nothing else.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tailscale2otel-secrets
  namespace: tailscale2otel
spec:
  itemPath: "vaults/Secrets/items/tailscale2otel-secrets"
