---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-snmp-exporter
  namespace: prometheus-system
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-snmp-exporter
      # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts depName=prometheus-snmp-exporter
      version: "9.13.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: snmp-exporter
    serviceMonitor:
      enabled: true
    selfMonitor:
      enabled: true
    # Mount auth config from 1Password secret
    extraSecretMounts:
      - name: snmp-auth
        mountPath: /etc/snmp_exporter/auth
        secretName: snmp-secrets
        readOnly: true
    # Mount custom SNMP modules from ConfigMap
    extraConfigmapMounts:
      - name: snmp-modules
        mountPath: /etc/snmp_exporter/modules
        configMap: snmp-modules
        readOnly: true
    # Load configs: default modules, custom modules, and auth
    extraArgs:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/modules/snmp.yml
      - --config.file=/etc/snmp_exporter/auth/config
