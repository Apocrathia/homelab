---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-snmp-exporter
  namespace: prometheus-system
spec:
  interval: 15m
  chart:
    spec:
      chart: ./helm/generic-app
      # renovate: datasource=git-tags depName=https://gitlab.com/Apocrathia/homelab.git
      version: "0.0.77"
      sourceRef:
        kind: GitRepository
        name: homelab
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    app:
      name: snmp-exporter
      namespace: prometheus-system
      replicas: 1
      # renovate: datasource=docker depName=quay.io/prometheus/snmp-exporter
      image: quay.io/prometheus/snmp-exporter:v0.30.1@sha256:b14e51528c2f429eb72127de33986f6f9f86f32cbf981635b028d9f7440e4bee
      args:
        - --config.file=/etc/snmp_exporter/snmp.yml
        - --config.file=/etc/snmp_exporter/modules/snmp.yml
        - --config.file=/etc/snmp_exporter/auth/config
      container:
        name: snmp-exporter
        port: 9116
      service:
        type: ClusterIP
        port: 9116
        targetPort: 9116
        portName: http
      volumes:
        configMap:
          - name: snmp-modules
            mountPath: /etc/snmp_exporter/modules
            configMapName: snmp-modules
            readOnly: true
        secret:
          - name: snmp-auth
            mountPath: /etc/snmp_exporter/auth
            secretName: snmp-secrets
            readOnly: true
      healthChecks:
        livenessProbe:
          enabled: true
          httpGet:
            path: /-/healthy
            port: 9116
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          enabled: true
          httpGet:
            path: /-/healthy
            port: 9116
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      podSecurityContext:
        fsGroup: 1000

    authentik:
      enabled: false

    secrets:
      enabled: false

    storage:
      longhorn:
        enabled: false
      smb:
        enabled: false

    gatus:
      enabled: false

    tcproute:
      enabled: false
    loadbalancer:
      enabled: false
