---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: snmp-ups-01
  namespace: prometheus-system
  labels:
    release: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        - ups-01.iot.apocrathia.com
      labels:
        job: snmp
        module: apc_ups
        device_type: ups
  scrapeInterval: 60s
  scrapeTimeout: 30s
  metricsPath: /snmp
  params:
    module:
      - apc_ups
    auth:
      - snmpv3
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter.prometheus-system.svc:9116
