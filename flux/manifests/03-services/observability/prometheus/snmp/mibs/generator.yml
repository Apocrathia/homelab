---
# Generator config for SNMP modules
# Run with: ./generate.sh
#
# Modules are split by device type to keep ConfigMaps under 1MB

modules:
  # APC UPS - Smart-UPS, Symmetra, etc.
  apc_ups:
    walk:
      - 1.3.6.1.4.1.318.1.1.1 # ups - UPS objects

  # APC PDU - Rack PDU (older models)
  apc_pdu:
    walk:
      - 1.3.6.1.4.1.318.1.1.12 # rPDU - Rack PDU

  # APC PDU2 - Rack PDU (newer models)
  apc_pdu2:
    walk:
      - 1.3.6.1.4.1.318.1.1.26 # rPDU2 - Rack PDU Gen2

  # Ubiquiti UniFi - switches, APs, routers
  unifi:
    walk:
      - 1.3.6.1.4.1.41112 # Ubiquiti enterprise OID

  # Synology NAS - system, disks, RAID, storage I/O, services, etc.
  # Commented out - using default chart synology module instead
  # synology:
  #   walk:
  #     - 1.3.6.1.4.1.6574 # Synology enterprise OID

  # TrueNAS - ZFS pools, zvols, ARC, L2ARC, ZIL, temps, alerts
  truenas:
    walk:
      - 1.3.6.1.4.1.50536 # iXsystems/TrueNAS enterprise OID

  # Brother Printer - status, toner, page counts, jams
  # Full OID is huge, targeting the most useful sections
  brother:
    walk:
      - 1.3.6.1.4.1.2435.2.3.9.1 # net-peripheral (printer/MFP status)
      - 1.3.6.1.4.1.2435.2.3.9.4 # netPML (device/engine info)
