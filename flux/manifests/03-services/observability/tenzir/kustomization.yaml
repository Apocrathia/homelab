---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: tenzir
  namespace: tenzir

resources:
  - namespace.yaml
  - secret.yaml
  - crossplane.yaml
  - nodes/core
  - nodes/tetragon
  - nodes/netflow
  - nodes/investigations
  - nodes/enrichment
  - grafana/

generatorOptions:
  disableNameSuffixHash: true

# Detection content rendered as ConfigMaps so the node can load it as a
# filesystem tree (IaC packages at /etc/tenzir/packages, sigma rules at
# /etc/tenzir/sigma). One ConfigMap per mounted directory level; keys are
# the on-disk file names.
configMapGenerator:
  - name: tenzir-packages-homelab
    namespace: tenzir
    files:
      - package.yaml=packages/homelab/package.yaml
  - name: tenzir-packages-homelab-audit-parse
    namespace: tenzir
    files:
      - parse.tql=packages/homelab/operators/k8s/audit/parse.tql
  - name: tenzir-packages-homelab-ocsf-map
    namespace: tenzir
    files:
      - map.tql=packages/homelab/operators/k8s/audit/ocsf/map.tql
  - name: tenzir-packages-homelab-findings-stamp
    namespace: tenzir
    files:
      - stamp.tql=packages/homelab/operators/findings/stamp.tql
  - name: tenzir-packages-homelab-tetragon-parse
    namespace: tenzir
    files:
      - parse.tql=packages/homelab/operators/tetragon/parse.tql
  - name: tenzir-packages-homelab-tetragon-map
    namespace: tenzir
    files:
      - map.tql=packages/homelab/operators/tetragon/ocsf/map.tql
  - name: tenzir-packages-homelab-tetragon-exec
    namespace: tenzir
    files:
      - process_exec.tql=packages/homelab/operators/tetragon/ocsf/events/process_exec.tql
  - name: tenzir-packages-homelab-tetragon-exit
    namespace: tenzir
    files:
      - process_exit.tql=packages/homelab/operators/tetragon/ocsf/events/process_exit.tql
  - name: tenzir-packages-homelab-tetragon-kprobe
    namespace: tenzir
    files:
      - process_kprobe.tql=packages/homelab/operators/tetragon/ocsf/events/process_kprobe.tql
  - name: tenzir-packages-homelab-authentik-map
    namespace: tenzir
    files:
      - map.tql=packages/homelab/operators/authentik/ocsf/map.tql
  - name: tenzir-packages-homelab-fleet-parse
    namespace: tenzir
    files:
      - parse.tql=packages/homelab/operators/fleet/parse.tql
  - name: tenzir-packages-homelab-fleet-map
    namespace: tenzir
    files:
      - map.tql=packages/homelab/operators/fleet/ocsf/map.tql
  - name: tenzir-packages-homelab-trivy-map
    namespace: tenzir
    files:
      - map.tql=packages/homelab/operators/trivy/ocsf/map.tql
  - name: tenzir-packages-netflow
    namespace: tenzir
    files:
      - package.yaml=packages/netflow/package.yaml
  - name: tenzir-packages-netflow-ocsf-base
    namespace: tenzir
    files:
      - base.tql=packages/netflow/operators/ocsf/base.tql
  - name: tenzir-packages-netflow-ocsf-normalize
    namespace: tenzir
    files:
      - normalize.tql=packages/netflow/operators/ocsf/normalize.tql
  - name: tenzir-packages-netflow-ocsf-map
    namespace: tenzir
    files:
      - map.tql=packages/netflow/operators/ocsf/map.tql
  - name: tenzir-packages-netflow-ocsf-events-network-activity
    namespace: tenzir
    files:
      - network_activity.tql=packages/netflow/operators/ocsf/events/network_activity.tql
  - name: tenzir-packages-homelab-investigations-map
    namespace: tenzir
    files:
      - map.tql=packages/homelab/operators/investigations/ocsf/map.tql
  # Crossplane stitch: packages authentik.tf (the Workspace's HCL module)
  # so the replacements rule below can copy it into the Workspace at build
  # time. Data key is the literal filename (authentik.tf); the replacements
  # fieldPath bracket-escapes it: data.[authentik.tf]. No authentik_blueprint
  # label lands on this ConfigMap — the tofu lane replaced the blueprint
  # sidecar pattern.
  - name: tenzir-authentik-module
    namespace: tenzir
    files:
      - authentik.tf
  - name: tenzir-sigma-homelab
    namespace: tenzir
    files:
      - k8s-audit-secret-created.yml=detections/sigma/homelab/k8s-audit-secret-created.yml
      - k8s-audit-pod-portforward.yml=detections/sigma/homelab/k8s-audit-pod-portforward.yml
  - name: tenzir-sigma-sigmahq-kubernetes-audit
    namespace: tenzir
    files:
      - kubernetes_audit_change_admission_controller.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_change_admission_controller.yml
      - kubernetes_audit_cronjob_modification.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_cronjob_modification.yml
      - kubernetes_audit_deployment_deleted.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_deployment_deleted.yml
      - kubernetes_audit_events_deleted.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_events_deleted.yml
      - kubernetes_audit_exec_into_container.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_exec_into_container.yml
      - kubernetes_audit_hostpath_mount.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_hostpath_mount.yml
      - kubernetes_audit_pod_in_system_namespace.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_pod_in_system_namespace.yml
      - kubernetes_audit_potential_enumeration_activity.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_potential_enumeration_activity.yml
      - kubernetes_audit_privileged_pod_creation.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_privileged_pod_creation.yml
      - kubernetes_audit_rbac_permisions_listing.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_rbac_permisions_listing.yml
      - kubernetes_audit_rolebinding_modification.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_rolebinding_modification.yml
      - kubernetes_audit_secrets_enumeration.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_secrets_enumeration.yml
      - kubernetes_audit_secrets_modified_or_deleted.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_secrets_modified_or_deleted.yml
      - kubernetes_audit_serviceaccount_creation.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_serviceaccount_creation.yml
      - kubernetes_audit_sidecar_injection.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_sidecar_injection.yml
      - kubernetes_audit_unauthorized_unauthenticated_actions.yml=detections/sigma/sigmahq/kubernetes-audit/kubernetes_audit_unauthorized_unauthenticated_actions.yml

replacements:
  # Build-time stitch, chaos-mesh shape: copy the generated ConfigMap's
  # authentik.tf data into the Workspace's module field. authentik.tf is
  # the single source of truth for the HCL; the rendered module must stay
  # byte-identical to it.
  #
  # The intermediate ConfigMap cannot be dropped from the render: kustomize
  # applies patches and transformers before replacements, so a $patch:
  # delete would remove the source before this rule consumes it (verified
  # on kustomize v5.8.1; no deletions-transformer builtin exists). The
  # ConfigMap is harmless in-cluster (no authentik_blueprint label) and
  # keeps a stable name (disableNameSuffixHash), so authentik.tf edits
  # update it in place.
  - source:
      kind: ConfigMap
      name: tenzir-authentik-module
      fieldPath: data.[authentik.tf]
    targets:
      - select:
          kind: Workspace
          name: tenzir-authentik
        fieldPaths:
          - spec.forProvider.module
