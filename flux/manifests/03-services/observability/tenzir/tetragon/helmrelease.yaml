---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-tetragon
  namespace: tenzir-system
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Core parity: the fresh tetragon node boots an empty partition catalog,
    # so the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.19.1

    nodes:
      - name: default
        token:
          existingSecret: tenzir-node-tetragon-token
        extraPorts:
          - name: otlp-http
            containerPort: 4318

    persistence:
      size: 20Gi

    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Crash isolation for the flood: run pipelines in subprocesses so the
          # tetragon OCSF pipeline's memory blowups die alone instead of taking
          # the node process down (in-process mode shared fate). The
          # accept_otlp listener stays in-process by design.
          pipeline-subprocesses: true
          # Partition mint-rate control, same 60s as the core: this node
          # owns the flood that minted ~10-event partitions (50,747
          # process_activity partitions = 6.25GiB = 80% of the volume at
          # the 2026-10-12 ENOSPC); 60s cuts the mint rate 6x, and the
          # async background merge consolidates undersized partitions once
          # the node stays up. max-partition-size stays default.
          active-partition-timeout: 60s
          start:
            disk-budget-high: 18GiB
            disk-budget-low: 16GiB
          pipelines:
            tetragon-ingest-http:
              name: tetragon ingest (otlp/http)
              description: |
                OTLP/HTTP listener for the tetragon-tailer only. Parses tetragon
                export events onto tetragon.raw; OTLP streams without a parser
                are dropped.
              definition: |
                accept_otlp "0.0.0.0:4318", transport="http", schema="record", signals=["logs"]
                homelab::tetragon::parse
                publish "tetragon.raw"
              restart-on-error: 1 minute
            tetragon-ocsf:
              name: tetragon ocsf mapping
              description: |
                tetragon export events -> OCSF (Process/File/Network
                Activity per event kind), then derive + schema-validate and
                store in the node. The raw stream keeps flowing to Loki via
                the tetragon pods' export-stdout sidecar.
              definition: |
                subscribe "tetragon.raw"
                this = {tetragon: this}
                homelab::tetragon::ocsf::map tetragon, ocsf
                this = move ocsf
                ocsf_derive
                ocsf_cast
                fork { import }
                publish "ocsf.tetragon"
              restart-on-error: 1 minute
        plugins:
          compaction:
            # Budget-enforcing deletion only (no archive rule for tetragon yet
            # — deliberate: tetragon OCSF is the 14d detection horizon, not a
            # record; Loki keeps the raw stream). Same weighted-age path as the
            # core node, sized for this node's own 20Gi PVC.
            space:
              mode: weighted-age
              interval: 30 minutes
              disk-budget-high: 18GiB
              disk-budget-low: 16GiB

    # OOM armor: 12Gi is the live-verified working set of the flood
    # (12.1Gi at the ceiling on the combined node); 4 cores = 4x the
    # throttled drain rate that caused backpressure memory growth at the
    # 1-core limit. Requests small: talos-04 CPU requests are 92% committed.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 12Gi

    extraVolumes:
      - name: packages-homelab
        configMap:
          name: tenzir-packages-homelab
      - name: packages-homelab-tetragon-parse
        configMap:
          name: tenzir-packages-homelab-tetragon-parse
      - name: packages-homelab-tetragon-map
        configMap:
          name: tenzir-packages-homelab-tetragon-map
      - name: packages-homelab-tetragon-exec
        configMap:
          name: tenzir-packages-homelab-tetragon-exec
      - name: packages-homelab-tetragon-exit
        configMap:
          name: tenzir-packages-homelab-tetragon-exit
      - name: packages-homelab-tetragon-kprobe
        configMap:
          name: tenzir-packages-homelab-tetragon-kprobe

    extraVolumeMounts:
      # Same file-level subPath mounts as the core node (kubelet ..data
      # internals fail Tenzir's operator-path segment check in a walked package
      # tree). subPath does not live-propagate ConfigMap updates — package
      # changes need a pod roll.
      - name: packages-homelab
        mountPath: /etc/tenzir/packages/homelab/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-homelab-tetragon-parse
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/parse.tql
        subPath: parse.tql
        readOnly: true
      - name: packages-homelab-tetragon-map
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-tetragon-exec
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_exec.tql
        subPath: process_exec.tql
        readOnly: true
      - name: packages-homelab-tetragon-exit
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_exit.tql
        subPath: process_exit.tql
        readOnly: true
      - name: packages-homelab-tetragon-kprobe
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_kprobe.tql
        subPath: process_kprobe.tql
        readOnly: true
