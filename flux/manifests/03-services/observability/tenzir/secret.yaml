---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
# Fields (1Password field label = Secret key):
#   AWS_ACCESS_KEY_ID     - rustfs bucket-scoped user for the `tenzir` bucket
#   AWS_SECRET_ACCESS_KEY - rustfs bucket-scoped user secret
#   DISCORD_WEBHOOK_URL   - Discord webhook bound to the security channel
#   AUTHENTIK_EVENTS_TOKEN - the authentik ak-tenzir token (blueprint
#                            authentik-blueprint.yaml; copied once by the
#                            operator post-import)
# The chart injects AWS_* via the default AWS credential chain (to_s3) and
# the webhook via TENZIR_SECRETS__DISCORD_WEBHOOK_URL (managed secret lookup).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tenzir-secrets
  namespace: tenzir-system
spec:
  itemPath: "vaults/Secrets/items/tenzir-secrets"
