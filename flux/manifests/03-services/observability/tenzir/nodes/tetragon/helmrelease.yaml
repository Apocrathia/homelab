---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-tetragon
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Core parity: the fresh tetragon node boots an empty partition catalog,
    # so the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-tetragon + entry tetragon would
    # double to tenzir-node-tetragon-tetragon. The override pins fullname
    # at tenzir-node so the entry renders tenzir-node-tetragon.
    fullnameOverride: tenzir-node
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.19.1

    # Registers into the same hosted Tenzir Platform workspace as the core
    # node; this node reads its own pre-provisioned token from the
    # tetragon-token field of the tenzir-secrets Secret. Platform tokens
    # are per-node, never shared.
    nodes:
      - name: tetragon
        token:
          existingSecret: tenzir-secrets
          key: tetragon-token
        extraPorts:
          - name: otlp-http
            containerPort: 4318

    persistence:
      # 20Gi stays a cap, not a capacity plan: at the 15-minute retention
      # horizon a flood window is ~42 MiB on disk (measured 2026-10-12
      # rate; sizing math in nodes/tetragon/README.md), and even the raw
      # worst-case slice of the current extreme drain (253 GB/day, 15
      # minutes ~ 2.6 GB) cannot OOM a 12Gi node. Longhorn volumes grow on
      # demand; a smaller request buys nothing.
      size: 20Gi

    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Server-log verbosity, same warning level as the core node: the
          # chart default (tenzir.file-verbosity: quiet) writes nothing to
          # server.log, so pipeline failures that point at the log for
          # their diagnostics surface blind (docs: file-verbosity levels
          # quiet, error, warning, info, verbose, debug, trace).
          file-verbosity: warning
          # Crash isolation for the flood: run pipelines in subprocesses so the
          # tetragon OCSF pipeline's memory blowups die alone instead of taking
          # the node process down (in-process mode shared fate). The
          # accept_otlp listener stays in-process by design.
          pipeline-subprocesses: true
          # Partition mint-rate control, same 60s as the core: this node
          # owns the flood that minted ~10-event partitions (50,747
          # process_activity partitions = 6.25GiB = 80% of the volume at
          # the 2026-10-12 ENOSPC); 60s cuts the mint rate 6x, and the
          # async background merge consolidates undersized partitions once
          # the node stays up. max-partition-size stays default.
          active-partition-timeout: 60s
          # Catalog load knobs, same shape as the core node: lazy-sketches
          # defers Bloom-filter sketches to query time in a memory-bounded
          # LRU, and load-concurrency caps the boot synopsis loader at 4
          # threads instead of the hardware-concurrency default (the host
          # resolves to 16). max-partition-size stays at its 4Mi default.
          index:
            lazy-sketches: true
            load-concurrency: 4
          start:
            # Corridor matched to the compaction space budgets below;
            # retune math in nodes/tetragon/README.md.
            disk-budget-high: 6GiB
            disk-budget-low: 4GiB
          # Pipeline definitions live in pipelines/<id>.tql; this
          # kustomization's replacements stitch them back into these
          # empty definition fields at build time.
          pipelines:
            tetragon-ingest-http:
              name: tetragon ingest http
              description: |
                OTLP/HTTP listener for the tetragon alloy only. Parses tetragon
                export events onto tetragon.raw; OTLP streams without a parser
                are dropped.
              definition: ""
              restart-on-error: 1 minute
            tetragon-ocsf:
              name: tetragon ocsf
              description: |
                tetragon export events -> OCSF (Process/File/Network
                Activity per event kind), then derive + schema-validate and
                store in the node. The unmapped residue is a selected
                projection (pod identity + policy name), not the full raw
                record. No raw stream lands in Loki; the ClickHouse OCSF
                store is the record.
              definition: ""
              restart-on-error: 1 minute
            error-diagnostics-to-mimir:
              name: error diagnostics to mimir
              description: |
                Pushes a tenzir_pipeline_errors / tenzir_pipeline_warnings
                sample (value 1, pipeline labels) to Mimir for every live
                error / warning diagnostic, so the dashboard can count both
                severities with sum_over_time. They otherwise live only in
                the diagnostics stream, not in metrics. This node previously
                shipped no metrics arms at all (the netflow lap's noted
                deviation); the dashboard lap adds this diagnostics pair on
                every node — tetragon still ships no pipeline-metrics arm,
                so its ingest/egress/heartbeat lanes stay absent by design.
              definition: ""
              restart-on-error: 1 minute
            diagnostics-to-loki:
              name: diagnostics to loki
              description: |
                Ships every live, not-hidden pipeline diagnostic to Loki as
                job=tenzir-diagnostics entries (node label = tetragon) — the
                flood isolate's parse warnings (UNCLOSED_STRING and friends)
                become filterable log lines. to_fluent_bit resolves
                $pipeline_name and $severity per event and consumes both
                out of the shipped body (live-verified 2026-10-17 probe);
                drop discards the ANSI escape-coded rendered field, so
                the line keeps the rest of the diagnostic record —
                pipeline_id, hidden, run, timestamp, message, notes,
                annotations — and the labels carry pipeline + severity. Hidden entries
                (platform-UI pipeline deprecation noise) stay out. Plain
                HTTP to loki-write, cluster-internal. live=true without
                retro: no store-backlog replay on start, so restarts never
                re-ship history (Loki has no dedup) — the pre-landing
                backlog stays visible from the draft shipper lane
                (job=tenzir-diagnostics-draft), and the dashboard's
                job=~"tenzir-diagnostics.*" matcher spans both.
              definition: ""
              restart-on-error: 1 minute
        plugins:
          compaction:
            # Budget backstop, same weighted-age path as the core node:
            # every 30 minutes, erase oldest past 6GiB down to 4GiB. Sized
            # for the 15-minute window (retune math in
            # nodes/tetragon/README.md): a flood window is ~42 MiB on disk,
            # the worst-case extreme drain ~2.6 GB per 15 minutes, so the
            # corridor only exists for archive-rule failure windows and
            # holds several worst-case stalls on the 20Gi PVC.
            space:
              mode: weighted-age
              interval: 30 minutes
              disk-budget-high: 6GiB
              disk-budget-low: 4GiB
            # 15-minute local lake, same horizon as the core node, same
            # archive: the tetragon OCSF classes export to the ClickHouse
            # OCSF query store's per-class ocsf.<Class_Name> tables, then
            # expire locally (consume + export = archive-then-delete;
            # preserve-input stays off). The s3://tenzir/ocsf/ parquet
            # lane retired with the MR-5 teardown: the existing objects
            # stay untouched in the rustfs bucket as frozen, unqueried
            # history — deleting them is a separate operator call. The
            # Base Event fallback (unknown
            # export kinds) is NOT archived: it cannot name a class and
            # expires with the window on the weighted-age backstop. The
            # lake is a transit buffer between ingest and the archive, not
            # a query surface; ClickHouse is the OCSF record past the
            # window (no raw stream lands in Loki; export-stdout sidecar
            # dropped). The pass runs every
            # 5 minutes,
            # so the true window at pass boundaries is 15-20 minutes.
            time:
              interval: 5 minutes
              rules:
                # Type names from the tetragon map's OCSF dispatch:
                # Process Activity (1007), File System Activity (1001),
                # Network Activity (4001). ocsf.base_event is deliberately
                # absent (cannot map -> not archived).
                # ClickHouse is the archive (rollout MR-5 teardown, plan
                # D8 end state): the retired to_s3 tail and its fork
                # wrapper are gone, so to_clickhouse is the rule's sole,
                # terminal sink — a sink-only pipeline returns no
                # transformed events, so consume + export =
                # archive-then-delete semantics are unchanged.
                # mode="append" fails loudly when the MR-1 DDL is
                # missing (the second net for the Keeper first-boot
                # race), and max_batch_rows bounds the insert buffers on
                # the flood classes.
                - after: 15 minutes
                  name: ocsf-archive
                  field: time
                  types:
                    [
                      "ocsf.process_activity",
                      "ocsf.file_system_activity",
                      "ocsf.network_activity",
                    ]
                  # Stitched from pipelines/ocsf-archive.tql at
                  # kustomize build time.
                  pipeline: ""

    # OOM armor: 12Gi is the live-verified working set of the flood
    # (12.1Gi at the ceiling on the combined node); 4 cores = 4x the
    # throttled drain rate that caused backpressure memory growth at the
    # 1-core limit. Requests small: talos-04 CPU requests are 92% committed.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 12Gi

    # The ClickHouse
    # writer password rides the dedicated clickhouse-secrets item (this
    # namespace materializes its own OnePasswordItem in ../secret.yaml):
    # the env var maps to config key tenzir.secrets.clickhouse-password,
    # so the to_clickhouse archive leg reads it as
    # secret("clickhouse-password") — kebab name, same env-var shape as
    # the core node's authentik token. The retired to_s3 tail's rustfs
    # AWS_* env entries are gone with the MR-5 teardown; the aws-* fields
    # stay on the tenzir-secrets item, unused, for the operator to
    # delete.
    extraEnv:
      - name: TENZIR_SECRETS__CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secrets
            key: clickhouse-password

    extraVolumes:
      - name: packages-homelab
        configMap:
          name: tenzir-packages-homelab
      - name: packages-homelab-tetragon-parse
        configMap:
          name: tenzir-packages-homelab-tetragon-parse
      - name: packages-homelab-tetragon-map
        configMap:
          name: tenzir-packages-homelab-tetragon-map
      - name: packages-homelab-tetragon-exec
        configMap:
          name: tenzir-packages-homelab-tetragon-exec
      - name: packages-homelab-tetragon-exit
        configMap:
          name: tenzir-packages-homelab-tetragon-exit
      - name: packages-homelab-tetragon-kprobe
        configMap:
          name: tenzir-packages-homelab-tetragon-kprobe

    extraVolumeMounts:
      # Same file-level subPath mounts as the core node (kubelet ..data
      # internals fail Tenzir's operator-path segment check in a walked package
      # tree). subPath does not live-propagate ConfigMap updates — package
      # changes need a pod roll.
      - name: packages-homelab
        mountPath: /etc/tenzir/packages/homelab/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-homelab-tetragon-parse
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/parse.tql
        subPath: parse.tql
        readOnly: true
      - name: packages-homelab-tetragon-map
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-tetragon-exec
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_exec.tql
        subPath: process_exec.tql
        readOnly: true
      - name: packages-homelab-tetragon-exit
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_exit.tql
        subPath: process_exit.tql
        readOnly: true
      - name: packages-homelab-tetragon-kprobe
        mountPath: /etc/tenzir/packages/homelab/operators/tetragon/ocsf/events/process_kprobe.tql
        subPath: process_kprobe.tql
        readOnly: true
