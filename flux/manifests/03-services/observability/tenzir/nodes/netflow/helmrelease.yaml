---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node-netflow
  namespace: tenzir
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # Sibling parity: the fresh netflow node boots an empty partition
    # catalog, so the 10m timeout is headroom, not a race workaround.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Node naming: every node resource renders as <fullname>-<entry.name>,
    # and fullname defaults to the release name while it contains
    # "tenzir-node" — release tenzir-node-netflow + entry netflow would
    # double to tenzir-node-netflow-netflow. The override pins fullname
    # at tenzir-node so the entry renders tenzir-node-netflow.
    fullnameOverride: tenzir-node
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.19.1

    # Registers into the same hosted Tenzir Platform workspace as the core
    # and tetragon nodes; this node reads its own pre-provisioned token from
    # the netflow-token field of the tenzir-secrets Secret. Platform tokens
    # are per-node, never shared.
    nodes:
      - name: netflow
        token:
          existingSecret: tenzir-secrets
          key: netflow-token
        # The collector listener: UniFi exporters send NetFlow v5/v9/IPFIX
        # datagrams here via the tenzir-ingest-lb pool IP (10.100.1.96).
        extraPorts:
          - name: netflow
            containerPort: 2055
            protocol: UDP

    persistence:
      # 20Gi stays a cap, not a capacity plan: netflow measures ~0.15 GB/day
      # raw (~15% of the core node's ~1 GB/day), so the 15-minute window is
      # ~150 KB on disk — the PVC buys headroom for archive-rule failure
      # windows and the day the UniFi vendor renderer fix lands and real
      # exporter traffic shows up. Longhorn volumes grow on demand; a smaller
      # request buys nothing (both siblings' exact argument).
      size: 20Gi

    # Node configuration (renders to the tenzir-node-netflow-config ConfigMap
    # and rolls the pod on change). Nothing secret may live here: values land
    # in a ConfigMap in plaintext. Secrets arrive via extraEnv below.
    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Partition mint-rate control, same 60s as the siblings: this node
          # runs a low-volume collector, and 60s caps the partition count the
          # 15-minute window mints; the async background merge consolidates
          # undersized partitions. max-partition-size stays at its 4Mi
          # default.
          active-partition-timeout: 60s
          # Catalog knobs, sibling shape (recipe step 6): on a ~150 KB lake
          # lazy-sketches and load-concurrency 4 are harmless consistency
          # with core and tetragon, not load-driven tuning. max-partition-
          # size stays default.
          index:
            lazy-sketches: true
            load-concurrency: 4
          start:
            # Corridor matched to the compaction space budgets below,
            # identical math to the siblings (backstop only).
            disk-budget-high: 6GiB
            disk-budget-low: 4GiB
          pipelines:
            netflow-collector:
              name: netflow collector
              description: |
                NetFlow v5/v9/IPFIX from the UniFi exporters behind
                tenzir-ingest-lb (:2055/UDP). Flow records map to OCSF
                Network Activity (4001, Traffic) through the official
                `netflow` library package (vendored at packages/netflow/
                from github.com/tenzir/library); options records are
                dropped. This dedicated node owns the collector, moved off
                the core detection node: the pipeline stores into this
                node's lake and publishes onto its node-local `ocsf`
                topic, feeding this node's own archive rule — no sigma
                pass sees the flow stream (no homelab rule targets
                netflow fields). Start ordering matters: the collector
                must be up before v9/IPFIX template datagrams arrive.
              definition: |
                accept_udp "0.0.0.0:2055", binary=true
                read_netflow
                where netflow.record_type == "flow"
                netflow::ocsf::normalize
                ocsf_derive
                ocsf_cast
                fork { import }
                publish "ocsf"
              restart-on-error: 1 minute
            # A dead UDP collector is a silent black hole: the Node
            # Pipelines dashboard heartbeat panel is this node's only
            # liveness view, so the metrics pipelines come over from
            # the core node (tetragon ships no pipeline-metrics arm —
            # deliberate; the dashboard lap gives it the diagnostics
            # pair instead). Series-collision CORRECTION
            # (live-verified 2026-10-17): pipeline_ids are NOT
            # node-qualified — the vendored docs' demo-node/m57-suricata
            # example applies to platform pipelines, not node-config
            # pipelines — so netflow and core pushed the SAME
            # pipeline-metrics-to-mimir series, interleaving samples
            # (values 2 vs 9) with Mimir's same-timestamp handling
            # eating roughly half. The node label added below (with the
            # per-direction internal flag) pins each node's series;
            # the dashboard's `{{pipeline_name}}` legend still shows
            # both nodes under one name — split on node when it
            # matters.
            # sigma-metrics-to-mimir stays core-only: no sigma here.
            pipeline-metrics-to-mimir:
              name: pipeline metrics to mimir
              description: |
                Pushes the node's tenzir.metrics.pipeline events (per-pipeline
                ingress/egress event counts, emitted every 10s) to the Mimir
                remote-write endpoint kube-prometheus-stack remote-writes to;
                the mimir gateway injects the tenant header, so no auth here.
                Raw shape, not shape="prometheus" — that transform drops all
                non-health schemas, pipeline metrics included. Grafana reads
                the tenzir_pipeline_{ingress,egress}_events series; note this
                pipeline (and its siblings) also self-report in those series.
                The internal label carries the metric event's per-direction
                internal flag (ingress.internal / egress.internal), so
                bus-internal flow (publish, import, subscribe) is separable
                from external export in the series; the node label pins the
                pushing node — pipeline_ids are not node-qualified
                (live-verified 2026-10-17: the vendored docs'
                demo-node/m57-suricata example applies to platform pipelines,
                not node-config pipelines), and without it this node's
                self-reports collide with the core node's same-named series
                (observed live: interleaved values with Mimir's
                same-timestamp handling eating roughly half the samples).
              definition: |
                metrics "pipeline", live=true
                fork {
                  to_prometheus "http://mimir-gateway.mimir-system.svc:80/api/v1/push",
                    name="tenzir_pipeline_ingress_events",
                    value=ingress.events,
                    timestamp=timestamp,
                    labels={pipeline_id: pipeline_id, pipeline_name: pipeline_name, node: "netflow", internal: ingress.internal}
                }
                to_prometheus "http://mimir-gateway.mimir-system.svc:80/api/v1/push",
                  name="tenzir_pipeline_egress_events",
                  value=egress.events,
                  timestamp=timestamp,
                  labels={pipeline_id: pipeline_id, pipeline_name: pipeline_name, node: "netflow", internal: egress.internal}
              restart-on-error: 1 minute
            error-diagnostics-to-mimir:
              name: error diagnostics to mimir
              description: |
                Pushes a tenzir_pipeline_errors / tenzir_pipeline_warnings
                sample (value 1, pipeline labels) to Mimir for every live
                error / warning diagnostic, so the dashboard can count both
                severities with sum_over_time. They otherwise live only in
                the diagnostics stream, not in metrics.
              definition: |
                diagnostics live=true
                fork {
                  where severity == "error"
                  to_prometheus "http://mimir-gateway.mimir-system.svc:80/api/v1/push",
                    name="tenzir_pipeline_errors",
                    value=1,
                    timestamp=timestamp,
                    labels={pipeline_id: pipeline_id, pipeline_name: pipeline_name}
                }
                where severity == "warning"
                to_prometheus "http://mimir-gateway.mimir-system.svc:80/api/v1/push",
                  name="tenzir_pipeline_warnings",
                  value=1,
                  timestamp=timestamp,
                  labels={pipeline_id: pipeline_id, pipeline_name: pipeline_name}
              restart-on-error: 1 minute
            diagnostics-to-loki:
              name: diagnostics to loki
              description: |
                Ships every live, not-hidden pipeline diagnostic to Loki as
                job=tenzir-diagnostics entries (node label = netflow) — the
                collector node's own pipeline warnings (UNCLOSED_STRING
                parse noise and friends) become filterable log lines.
                to_fluent_bit resolves $pipeline_name and $severity per
                event and consumes both out of the shipped body
                (live-verified 2026-10-17 probe), so the line keeps the
                rest of the diagnostic record verbatim — timestamp,
                message, notes, annotations — and the labels carry
                pipeline + severity. Hidden entries (platform-UI pipeline
                deprecation noise) stay out. Plain HTTP to loki-write,
                cluster-internal. live=true without retro: no
                store-backlog replay on start, so restarts never re-ship
                history (Loki has no dedup) — the pre-landing backlog
                stays visible from the draft shipper lane
                (job=tenzir-diagnostics-draft), and the dashboard's
                job=~"tenzir-diagnostics.*" matcher spans both.
              definition: |
                diagnostics live=true
                where not hidden
                to_fluent_bit "loki", options={host: "loki-write.loki-system.svc", port: "3100", labels: "job=tenzir-diagnostics,namespace=tenzir,node=netflow,pipeline=$pipeline_name,severity=$severity"}
              restart-on-error: 1 minute
        plugins:
          compaction:
            # Budget backstop, same weighted-age path as the siblings: every
            # 30 minutes, erase oldest past 6GiB down to 4GiB. Sized for the
            # 15-minute window (sizing math in nodes/netflow/README.md): the
            # netflow lake peaks near ~150 KB on disk, so the corridor only
            # exists for archive-rule failure windows and holds days of the
            # worst stall on the 20Gi PVC.
            space:
              mode: weighted-age
              interval: 30 minutes
              disk-budget-high: 6GiB
              disk-budget-low: 4GiB
            # 15-minute local lake, same horizon and same archive as the
            # siblings: the netflow OCSF class exports to the ClickHouse
            # OCSF query store's per-class ocsf.<Class_Name> tables, then
            # expires locally (consume + export = archive-then-delete;
            # preserve-input stays off). The s3://tenzir/ocsf/ parquet
            # lane retired with the MR-5 teardown: the existing objects
            # stay untouched in the rustfs bucket as frozen, unqueried
            # history — deleting them is a separate operator call. The
            # lake is a transit buffer between ingest and the archive,
            # not a query surface; ClickHouse is the OCSF record past
            # the window. The pass runs every 5 minutes, so the true
            # window at pass boundaries is 15-20 minutes.
            time:
              interval: 5 minutes
              rules:
                # The one OCSF class this node stores: Network Activity
                # (4001) from the vendored netflow package's dispatch.
                # ClickHouse is the archive (rollout MR-5 teardown, plan
                # D8 end state): the retired to_s3 tail and its fork
                # wrapper are gone, so to_clickhouse is the rule's sole,
                # terminal sink — a sink-only pipeline returns no
                # transformed events, so consume + export =
                # archive-then-delete semantics are unchanged.
                # mode="append" fails loudly when the MR-1 DDL is
                # missing (the second net for the Keeper first-boot
                # race), and max_batch_rows bounds the insert buffers.
                - after: 15 minutes
                  name: ocsf-archive
                  field: time
                  types: ["ocsf.network_activity"]
                  pipeline: |
                    to_clickhouse table=f"ocsf.{class_name.replace(" ", "_")}",
                      host="clickhouse-tenzir.clickhouse.svc.cluster.local",
                      port=9000,
                      user="tenzir",
                      password=secret("clickhouse-password"),
                      tls=false,
                      mode="append",
                      max_batch_rows=65536

    # Sized by the docs' size-a-node formula for this node's shape (full
    # math in nodes/netflow/README.md): CPU = max(2, ceil(0.15/250 ingest
    # + 1*0.1 source + 1*0.1 destination (clickhouse)
    # + 1*0.2 normalization)) = 2 (the formula's 2-core floor binds); the
    # formula's RAM floor is 2 GB and a fresh tiny lake carries none of
    # core's 76k-synopsis boot history, so 4Gi is the floor plus 2x
    # headroom. Detection is off: no sigma pipeline. Requests small:
    # talos-04 CPU requests are 92% committed, and limits are caps, not
    # reservations.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    # The ClickHouse writer password rides the dedicated clickhouse-secrets
    # item (this namespace materializes its own OnePasswordItem in
    # ../secret.yaml): the env var maps to config key
    # tenzir.secrets.clickhouse-password, so the to_clickhouse archive leg
    # reads it as secret("clickhouse-password") — same env-var shape as the
    # siblings. No authentik token: no authentik pipeline runs here. The
    # retired to_s3 tail's rustfs AWS_* env entries are gone with the MR-5
    # teardown; the aws-* fields stay on the tenzir-secrets item, unused,
    # for the operator to delete.
    extraEnv:
      - name: TENZIR_SECRETS__CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secrets
            key: clickhouse-password

    extraVolumes:
      - name: packages-netflow
        configMap:
          name: tenzir-packages-netflow
      - name: packages-netflow-ocsf-base
        configMap:
          name: tenzir-packages-netflow-ocsf-base
      - name: packages-netflow-ocsf-normalize
        configMap:
          name: tenzir-packages-netflow-ocsf-normalize
      - name: packages-netflow-ocsf-map
        configMap:
          name: tenzir-packages-netflow-ocsf-map
      - name: packages-netflow-ocsf-events-network-activity
        configMap:
          name: tenzir-packages-netflow-ocsf-events-network-activity

    extraVolumeMounts:
      # Same file-level subPath mounts as the siblings (kubelet ..data
      # internals fail Tenzir's operator-path segment check in a walked package
      # tree). subPath does not live-propagate ConfigMap updates — package
      # changes need a pod roll. Generator entries stay at the root
      # kustomization: the source files never move, only the mount side
      # moved here from the core node.
      - name: packages-netflow
        mountPath: /etc/tenzir/packages/netflow/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-netflow-ocsf-base
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/base.tql
        subPath: base.tql
        readOnly: true
      - name: packages-netflow-ocsf-normalize
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/normalize.tql
        subPath: normalize.tql
        readOnly: true
      - name: packages-netflow-ocsf-map
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-netflow-ocsf-events-network-activity
        mountPath: /etc/tenzir/packages/netflow/operators/ocsf/events/network_activity.tql
        subPath: network_activity.tql
        readOnly: true
