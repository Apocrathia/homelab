---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenzir-node
  namespace: tenzir-system
spec:
  interval: 1h
  chart:
    spec:
      chart: tenzir-node
      # renovate: datasource=docker depName=ghcr.io/tenzir/charts/tenzir-node
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: tenzir
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    # The node boots through a multi-minute partition-catalog load before
    # the :5158 probe can pass; the 5m default races it and rolls back.
    timeout: 10m
  upgrade:
    remediation:
      retries: 3
    timeout: 10m
  values:
    image:
      registry: docker.io
      repository: tenzir/tenzir
      # renovate: datasource=docker depName=docker.io/tenzir/tenzir
      tag: v6.19.1

    # Registers into the hosted Tenzir Platform workspace (app.tenzir.com):
    # the chart injects the TENZIR_TOKEN env from the tenzir-secrets Secret,
    # this node reading its own pre-provisioned node token from the
    # core-token field. Platform tokens are per-node, never shared.
    nodes:
      - name: core
        token:
          existingSecret: tenzir-secrets
          key: core-token
        # accept_otlp listeners: otlp-grpc 4317 + otlp-http 4318. The
        # kube-audit alloy and the shared alloy OTLP log fan-out push at
        # tenzir-node-core:4318 (the tetragon alloy moved to the
        # tetragon node); the fleet webhook and the trivy-report-reader
        # POST to http-ingest 8080; netflow 2055/UDP sits behind the
        # tenzir-ingest-lb pool IP.
        extraPorts:
          - name: otlp-grpc
            containerPort: 4317
          - name: otlp-http
            containerPort: 4318
          - name: http-ingest
            containerPort: 8080
          - name: netflow
            containerPort: 2055
            protocol: UDP

    persistence:
      # 20Gi stays a cap, not a capacity plan: at the 24h retention horizon
      # the core lake peaks near 100 MB (sizing math in core/README.md), so
      # the PVC buys headroom for archive-rule failure windows and future
      # horizon changes. Longhorn volumes grow on demand; a smaller request
      # buys nothing.
      size: 20Gi

    # Node configuration (renders to the tenzir-node-core-config ConfigMap
    # and rolls the pod on change). Nothing secret may live here: values land
    # in a ConfigMap in plaintext. Secrets arrive via extraEnv below.
    tenzir:
      config:
        tenzir:
          package-dirs:
            - /etc/tenzir/packages
          # Partition mint-rate control (docs, "Control the partition size"):
          # "once reached, Tenzir considers the partition as complete,
          # regardless of the number of records" — the core feeds are
          # low-volume and timeout-capped, so the 60s timeout bounds the
          # partition count the 24h window mints. max-partition-size stays
          # at its 4Mi default: the record cap never binds on a
          # timeout-capped stream.
          active-partition-timeout: 60s
          # Catalog load knobs (docs, tune-performance: the catalog "keeps
          # state that grows linear in the number of partitions" and "Tenzir
          # keeps all sketches in memory"). lazy-sketches defers
          # Bloom-filter sketches to query time in a memory-bounded LRU
          # (index.sketch-cache-bytes, default 1GiB) — the direct lever
          # against boot OOMs on partition-heavy lakes. load-concurrency
          # caps the boot synopsis loader at 4 threads instead of the
          # hardware-concurrency default (a boot log once showed 16 loader
          # threads inside a 1-core cgroup); 4 keeps I/O overlap within
          # the CPU budget on Longhorn block storage.
          index:
            lazy-sketches: true
            load-concurrency: 4
          start:
            # Hard quota on the 20Gi PVC, belt-and-braces alongside
            # plugins.compaction.space below: at the 24h horizon it never
            # binds — it exists for archive-rule failure windows and any
            # future horizon change.
            disk-budget-high: 18GiB
            disk-budget-low: 16GiB
          pipelines:
            k8s-audit-ingest-http:
              name: k8s-audit ingest (otlp/http)
              description: |
                OTLP/HTTP listener for the kube-audit alloy and the shared
                alloy OTLP log fan-out; unpacks audit JSON bodies onto
                k8s-audit.raw; OTLP streams without a parser are dropped.
              definition: |
                accept_otlp "0.0.0.0:4318", transport="http", schema="record", signals=["logs"]
                homelab::k8s::audit::parse
                publish "k8s-audit.raw"
              restart-on-error: 1 minute
            k8s-audit-ingest-grpc:
              name: k8s-audit ingest (otlp/grpc)
              description: |
                OTLP/gRPC listener for future OTLP-native senders; unpacks
                audit JSON bodies onto k8s-audit.raw; OTLP streams without
                a parser are dropped.
              definition: |
                accept_otlp "0.0.0.0:4317", transport="grpc", schema="record", signals=["logs"]
                homelab::k8s::audit::parse
                publish "k8s-audit.raw"
              restart-on-error: 1 minute
            k8s-audit-ocsf:
              name: k8s-audit ocsf mapping
              description: |
                k8s audit -> OCSF API Activity (6003) with Loki provenance,
                then derive + schema-validate and store in the node.
              definition: |
                subscribe "k8s-audit.raw"
                homelab::k8s::audit::ocsf::map
                ocsf_derive
                ocsf_cast
                fork { import }
                publish "ocsf.k8s-audit"
              restart-on-error: 1 minute
            k8s-audit-sigma:
              name: k8s-audit sigma detection
              description: |
                SigmaHQ kubernetes/audit rules + homelab starters, evaluated with
                direct field matching on the raw audit schema (the SigmaHQ
                kubernetes corpus names raw audit fields; it is not in the
                OCSF projection catalog). Hot-reloads every 30s. Matches
                persist in the node lake as immutable OCSF Detection Finding
                (2004) records via the import fork — the record store half of
                the two-store findings contract; the findings archive rule
                exports them to rustfs after the 24h horizon.
              definition: |
                subscribe "k8s-audit.raw"
                sigma path=["/etc/tenzir/sigma/sigmahq/kubernetes-audit", "/etc/tenzir/sigma/homelab"], mapping="direct", refresh_interval=30s
                fork { import }
                publish "detections.sigma"
              restart-on-error: 1 minute
            netflow-collector:
              name: netflow collector
              description: |
                NetFlow v5/v9/IPFIX from the UniFi exporters behind
                tenzir-ingest-lb (:2055/UDP). Exporter identity rides in
                the peer metadata; flows store in the node and publish for
                future detections. Start ordering matters: the collector
                must be up before v9/IPFIX template datagrams arrive.
              definition: |
                accept_udp "0.0.0.0:2055", binary=true
                read_netflow
                fork { import }
                publish "netflow"
              restart-on-error: 1 minute
            http-ingest:
              name: http ingest (fleet webhook + trivy reader)
              description: |
                HTTP listener for push-based SIEM sources: the fleet osquery
                result webhook (rows envelope) and the trivy-report-reader
                (report files stamped with report_kind). Routes by payload
                shape onto per-source raw topics.
              definition: |
                accept_http "0.0.0.0:8080" {
                  read_json
                }
                fork {
                  where report_kind? != null
                  publish "trivy.raw"
                }
                where details? != null
                homelab::fleet::parse
                publish "fleet.raw"
              restart-on-error: 1 minute
            authentik-events:
              name: authentik events pull
              description: |
                Polls the authentik events API every 5 minutes (Bearer token
                via the authentik-events-token managed secret), walking the
                page-based pagination with a DjangoQL created-time window;
                deduplicate absorbs the 1-minute overlap on the event pk.
              definition: |
                cron "0 */5 * * * *" {
                  let $since = (now() - 6m).format_time("%Y-%m-%dT%H:%M:%SZ")
                  let $base = "https://auth.gateway.services.apocrathia.com/api/v3/events/events/"
                  let $query = f"page_size=100&search=created%20%3E%20%22{$since}%22"
                  from_http f"{$base}?{$query}",
                    headers={Authorization: f"Bearer {secret("authentik-events-token")}"},
                    paginate=(x => f"{$base}?page={x.pagination?.next?}&{$query}" if x.pagination?.next? > 0) {
                    read_json
                  }
                  unroll results
                  this = results
                }
                deduplicate pk, create_timeout=1h
                publish "authentik.raw"
              restart-on-error: 1 minute
            authentik-ocsf:
              name: authentik ocsf mapping
              description: |
                authentik events -> OCSF: login/logout/login_failed map to
                Authentication, account mutations to Account Change, and
                every other action to the Base Event; derive + cast, store
                in the node, and publish for future detections.
              definition: |
                subscribe "authentik.raw"
                homelab::authentik::ocsf::map
                ocsf_derive
                ocsf_cast
                fork { import }
                publish "ocsf.authentik"
              restart-on-error: 1 minute
            fleet-ocsf:
              name: fleet ocsf mapping
              description: |
                Fleet osquery result rows -> OCSF Base Event (a row's
                meaning comes from its query; no scheduled query exists
                yet), derive + cast, store in the node, and publish for
                future detections.
              definition: |
                subscribe "fleet.raw"
                homelab::fleet::ocsf::map
                ocsf_derive
                ocsf_cast
                fork { import }
                publish "ocsf.fleet"
              restart-on-error: 1 minute
            trivy-ocsf:
              name: trivy ocsf mapping
              description: |
                trivy-operator report files (read by the trivy-report-reader
                off the alternate-report-storage PVC) -> OCSF:
                VulnerabilityReport -> Vulnerability Finding with the CVE
                list, ExposedSecretReport -> Detection Finding; derive +
                cast, store in the node, and publish for future detections.
              definition: |
                subscribe "trivy.raw"
                homelab::trivy::ocsf::map
                ocsf_derive
                ocsf_cast
                fork { import }
                publish "ocsf.trivy"
              restart-on-error: 1 minute
            findings-discord:
              name: findings to discord
              description: |
                CRITICAL OCSF Detection Findings (2004) -> Discord embed, one
                POST per finding, with the raw-Loki evidence pivot. Push stays
                a doorbell: severity_id 5 (sigma level critical) only — the
                full findings stream is the Loki projection the sibling
                triage agent pulls; a daily digest of the rest is a separate
                lap, not built here.
              definition: |
                subscribe "detections.sigma"
                where severity_id == 5
                each {
                  from $this
                  homelab::k8s::audit::findings::discord
                  to_http secret("discord-webhook-url"), buffer_all=true { write_json }
                }
              restart-on-error: 1 minute
            findings-loki:
              name: findings projection to loki
              description: |
                OCSF Detection Findings (2004) -> flat, query-optimized
                projection, shipped one NDJSON line per emit to the shared
                alloy webhook receiver (the arm that already carries the
                trivy reports), where a marker route lands them as their own
                Loki stream (source=tenzir-findings). No new relay service:
                this is the BOTH-steer one-way projection over update 5's
                relay ban — tenzir keeps the immutable record, Loki gets the
                searchable surface, the uid joins them.
                Noise control: deduplicate suppresses repeats of the same
                rule+subject fingerprint for 1h (near-real-time first
                occurrences), and a 1h summarize window emits one count-up
                line per active uid carrying the exact repeat_count. The
                context-counter sketch was dropped: its fork-armed
                read-modify-write races under bursts and undercounts (live
                verified); summarize counts the same stream deterministically.
              definition: |
                subscribe "detections.sigma"
                homelab::findings::project "k8s-audit"
                fork {
                  deduplicate uid, create_timeout=1h
                  each {
                    from $this
                    to_http "http://alloy.alloy-system.svc.cluster.local:8080/loki/api/v1/raw", buffer_all=true { write_ndjson }
                  }
                }
                summarize uid, rule_id, repeat_count=count(), options={emit: 1h, mode: "reset"}
                where repeat_count >= 2
                ingest_stream = "tenzir-findings"
                pipeline = "k8s-audit"
                time = now()
                each {
                  from $this
                  to_http "http://alloy.alloy-system.svc.cluster.local:8080/loki/api/v1/raw", buffer_all=true { write_ndjson }
                }
              restart-on-error: 1 minute
        plugins:
          compaction:
            # Budget backstop: the compaction plugin owns the storage policy
            # (node log: "catalog takes its storage policy from the
            # compaction plugin"), and the space section is the docs'
            # spatial-compaction path (weighted-age; default weight 1 =
            # oldest events first, and with no pipeline the plugin deletes
            # matching events): every 30 minutes, erase oldest past 18GiB
            # down to 16GiB. At the 24h horizon this never binds — it
            # catches archive-rule failure windows and anything unruly
            # (netflow has no archive rule yet; its stored schema name is
            # unconfirmed, so it rides this backstop at ~330 MB/month).
            space:
              mode: weighted-age
              interval: 30 minutes
              disk-budget-high: 18GiB
              disk-budget-low: 16GiB
            # 24-hour local lake: every stored type archives to the rustfs
            # `tenzir` bucket as parquet and expires locally. A compaction
            # rule consumes its input, and a sink-only pipeline returns no
            # transformed events, so consume + export = archive-then-delete
            # (preserve-input stays off: keeping the local copy would
            # defeat the 24h expiry). The parquet is the record — the local
            # lake is the hot window, and from_s3 replays the history.
            time:
              interval: 1 day
              rules:
                # OCSF API Activity from the k8s-audit map.
                - after: 1 day
                  name: k8s-audit-archive
                  field: time
                  types: ["ocsf.api_activity"]
                  pipeline: |
                    to_s3 "s3://tenzir/ocsf/{uuid}.parquet?endpoint_override=storage.services.apocrathia.com:9009&scheme=http" {
                      write_parquet
                    }
                # Sigma Detection Findings (2004); the type also catches
                # trivy ExposedSecretReport findings, so those ride this
                # prefix.
                - after: 1 day
                  name: findings-archive
                  field: time
                  types: ["ocsf.detection_finding"]
                  pipeline: |
                    to_s3 "s3://tenzir/findings/{uuid}.parquet?endpoint_override=storage.services.apocrathia.com:9009&scheme=http" {
                      write_parquet
                    }
                # authentik map classes: Authentication / Account Change.
                - after: 1 day
                  name: authentik-archive
                  field: time
                  types: ["ocsf.authentication", "ocsf.account_change"]
                  pipeline: |
                    to_s3 "s3://tenzir/authentik/{uuid}.parquet?endpoint_override=storage.services.apocrathia.com:9009&scheme=http" {
                      write_parquet
                    }
                # Fallback prefix, named for the type: fleet rows map to
                # Base Event and authentik's every-other-action arm lands
                # here too — two sources share ocsf.base_event.
                - after: 1 day
                  name: base-event-archive
                  field: time
                  types: ["ocsf.base_event"]
                  pipeline: |
                    to_s3 "s3://tenzir/base-event/{uuid}.parquet?endpoint_override=storage.services.apocrathia.com:9009&scheme=http" {
                      write_parquet
                    }
                # trivy VulnerabilityReport findings.
                - after: 1 day
                  name: trivy-archive
                  field: time
                  types: ["ocsf.vulnerability_finding"]
                  pipeline: |
                    to_s3 "s3://tenzir/trivy/{uuid}.parquet?endpoint_override=storage.services.apocrathia.com:9009&scheme=http" {
                      write_parquet
                    }

    # Sized by the docs' formula for this node's shape (full math in
    # core/README.md): detection (+1), normalization on 5 sources (+1.0),
    # sources+destinations (+0.8) -> ceil(2.8) = 3 cores; the formula's
    # memory floor is 2 GB at the 24h horizon, and 4Gi doubles it as burst
    # and import-buffer headroom (ingest spikes, the daily archive and
    # compaction cycles, max-buffered-events import ceilings). Requests
    # stay small: talos-04 CPU requests are 92% committed, and limits are
    # caps, not reservations.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 4Gi

    # Secrets (1Password item tenzir-secrets): vault field labels are
    # kebab-case and the rendered Secret keys match them, so every
    # secretKeyRef.key below is the kebab vault label; env var names stay
    # UPPER. rustfs S3 credentials for the default AWS chain used by to_s3,
    # the Discord webhook as a Tenzir managed secret named
    # `discord-webhook-url`, and the authentik events API token as
    # `authentik-events-token` (TENZIR_SECRETS__ map; tofu mints the token,
    # the operator copies the key into the vault once).
    extraEnv:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: aws-access-key-id
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: aws-secret-access-key
      - name: TENZIR_SECRETS__DISCORD_WEBHOOK_URL
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: discord-webhook-url
      - name: TENZIR_SECRETS__AUTHENTIK_EVENTS_TOKEN
        valueFrom:
          secretKeyRef:
            name: tenzir-secrets
            key: authentik-events-token

    # Detection content: the homelab TQL mapping package (IaC-installed at
    # /etc/tenzir/packages/homelab) and the sigma rule directories, all
    # rendered by configMapGenerator in this kustomization. Package files
    # mount file-level (subPath; see extraVolumeMounts for why); sigma rule
    # dirs stay directory mounts and hot-reload every 30s. subPath does not
    # see ConfigMap updates, so mapping-package changes need a StatefulSet
    # bounce (nothing checksum-rolls these ConfigMaps either).
    extraVolumes:
      - name: packages-homelab
        configMap:
          name: tenzir-packages-homelab
      - name: packages-homelab-audit-parse
        configMap:
          name: tenzir-packages-homelab-audit-parse
      - name: packages-homelab-ocsf-map
        configMap:
          name: tenzir-packages-homelab-ocsf-map
      - name: packages-homelab-findings-discord
        configMap:
          name: tenzir-packages-homelab-findings-discord
      - name: packages-homelab-findings-project
        configMap:
          name: tenzir-packages-homelab-findings-project
      - name: packages-homelab-authentik-map
        configMap:
          name: tenzir-packages-homelab-authentik-map
      - name: packages-homelab-fleet-parse
        configMap:
          name: tenzir-packages-homelab-fleet-parse
      - name: packages-homelab-fleet-map
        configMap:
          name: tenzir-packages-homelab-fleet-map
      - name: packages-homelab-trivy-map
        configMap:
          name: tenzir-packages-homelab-trivy-map
      - name: sigma-homelab
        configMap:
          name: tenzir-sigma-homelab
      - name: sigma-sigmahq-kubernetes-audit
        configMap:
          name: tenzir-sigma-sigmahq-kubernetes-audit

    extraVolumeMounts:
      # Package files mount file-level: kubelet's atomic ConfigMap writer
      # keeps ..data/..2026_* internals at every directory-mount root, and
      # inside the walked package tree they fail Tenzir's operator-path
      # segment check (SRE-20261010-001 crashloop). subPath binds the single
      # projected file; kubelet auto-creates parent dirs, and the walked tree
      # contains only the package files. subPath does not live-propagate
      # ConfigMap updates — package changes need a pod roll.
      - name: packages-homelab
        mountPath: /etc/tenzir/packages/homelab/package.yaml
        subPath: package.yaml
        readOnly: true
      - name: packages-homelab-audit-parse
        mountPath: /etc/tenzir/packages/homelab/operators/k8s/audit/parse.tql
        subPath: parse.tql
        readOnly: true
      - name: packages-homelab-ocsf-map
        mountPath: /etc/tenzir/packages/homelab/operators/k8s/audit/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-findings-discord
        mountPath: /etc/tenzir/packages/homelab/operators/k8s/audit/findings/discord.tql
        subPath: discord.tql
        readOnly: true
      - name: packages-homelab-findings-project
        mountPath: /etc/tenzir/packages/homelab/operators/findings/project.tql
        subPath: project.tql
        readOnly: true
      - name: packages-homelab-authentik-map
        mountPath: /etc/tenzir/packages/homelab/operators/authentik/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-fleet-parse
        mountPath: /etc/tenzir/packages/homelab/operators/fleet/parse.tql
        subPath: parse.tql
        readOnly: true
      - name: packages-homelab-fleet-map
        mountPath: /etc/tenzir/packages/homelab/operators/fleet/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      - name: packages-homelab-trivy-map
        mountPath: /etc/tenzir/packages/homelab/operators/trivy/ocsf/map.tql
        subPath: map.tql
        readOnly: true
      # Sigma stays directory-mounted to keep the 30s rule hot-reload.
      - name: sigma-homelab
        mountPath: /etc/tenzir/sigma/homelab
        readOnly: true
      - name: sigma-sigmahq-kubernetes-audit
        mountPath: /etc/tenzir/sigma/sigmahq/kubernetes-audit
        readOnly: true
