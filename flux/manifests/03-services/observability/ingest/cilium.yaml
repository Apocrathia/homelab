---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: ingest-pool
  namespace: cilium-system
spec:
  blocks:
    - cidr: "10.100.1.96/32"
  serviceSelector:
    matchLabels:
      apocrathia.com/ingest: "true"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: ingest-l2-policy
  namespace: cilium-system
spec:
  interfaces:
    - eth0
  serviceSelector:
    matchLabels:
      apocrathia.com/ingest: "true"
  loadBalancerIPs: true
