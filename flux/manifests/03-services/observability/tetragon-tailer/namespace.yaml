---
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon-tailer-system
  labels:
    app.kubernetes.io/name: tetragon-tailer
    # Legitimate privileged DaemonSet: root, read-only hostPath on the tetragon
    # export dir (same precedent as trivy-system; default admission enforces baseline).
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
