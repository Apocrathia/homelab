---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
data:
  config.yaml: |
    # Base Gatus config. Endpoint definitions are generated by gatus-sidecar
    # into /config/gatus-sidecar.yaml on the shared volume.
    web:
      port: ${GATUS_WEB_PORT}
    metrics: true
    storage:
      type: postgres
      path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gatus-postgres-rw:5432/gatus?sslmode=require"
      caching: true
    endpoints: []
