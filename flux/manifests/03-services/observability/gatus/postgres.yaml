---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gatus-postgres
  namespace: gatus
spec:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e

  instances: 1

  # Barman backups: rustfs S3 (bucket `cnpg`, policy scoped to bucket+objects).
  # WAL archiving is continuous; base backups are triggered by the scheduled
  # Backup resource in scheduled-backup.yaml.
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      destinationPath: s3://cnpg/gatus
      endpointURL: http://storage.services.apocrathia.com:9009
      serverName: gatus-postgres
      s3Credentials:
        accessKeyId:
          name: gatus-postgres-backup-secrets
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: gatus-postgres-backup-secrets
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: zstd
      data:
        compression: gzip
        jobs: 2
        immediateCheckpoint: true

  storage:
    size: 5Gi
    storageClass: longhorn

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  bootstrap:
    initdb:
      database: gatus
      owner: gatus
      secret:
        name: gatus-secrets

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "64MB"
      effective_cache_size: "128MB"
      maintenance_work_mem: "32MB"
