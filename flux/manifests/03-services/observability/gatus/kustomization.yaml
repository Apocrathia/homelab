---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: gatus
  namespace: gatus

resources:
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - configmap.yaml
  - helmrelease.yaml
  - grafana.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-gatus
    namespace: gatus
    files:
      - gatus.yaml=authentik-blueprint.yaml

labels:
  - includeSelectors: true
    pairs:
      authentik_blueprint: "true"
