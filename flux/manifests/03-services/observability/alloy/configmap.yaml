---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: alloy-system
data:
  config.alloy: |
    logging {
      level    = "warn"
      format   = "json"
      write_to = [loki.write.default.receiver]
    }

    // discovery.kubernetes allows you to find scrape targets from Kubernetes resources.
    // It watches cluster state and ensures targets are continually synced with what is currently running in your cluster
    discovery.kubernetes "pod" {
      role = "pod"
    }

    discovery.kubernetes "service" {
      role = "service"
    }

    // discovery.relabel rewrites the label set of the input targets by applying one or more relabeling rules.
    // If no rules are defined, then the input targets are exported as-is.
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pod.targets

      // Label creation - "namespace" field from "__meta_kubernetes_namespace"
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action = "replace"
        target_label = "namespace"
      }

      // Label creation - "pod" field from "__meta_kubernetes_pod_name"
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        action = "replace"
        target_label = "pod"
      }

      // Label creation - "container" field from "__meta_kubernetes_pod_container_name"
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action = "replace"
        target_label = "container"
      }

      // Label creation -  "app" field from "__meta_kubernetes_pod_label_app_kubernetes_io_name"
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action = "replace"
        target_label = "app"
      }

      // Label creation -  "job" field from "__meta_kubernetes_namespace" and "__meta_kubernetes_pod_container_name"
      // Concatenate values __meta_kubernetes_namespace/__meta_kubernetes_pod_container_name
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        action = "replace"
        target_label = "job"
        separator = "/"
        replacement = "$1"
      }

      // Label creation -  "container_runtime" field from "__meta_kubernetes_pod_container_id"
      rule {
        source_labels = ["__meta_kubernetes_pod_container_id"]
        action = "replace"
        target_label = "container_runtime"
        regex = "^(\\S+):\\/\\/.+$"
        replacement = "$1"
      }
    }

    // loki.source.kubernetes tails logs from Kubernetes containers using the Kubernetes API.
    // This approach avoids hostPath mounts and Pod Security Standard violations
    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
    }

    // loki.process receives log entries from other Loki components, applies one or more processing stages,
    // and forwards the results to the list of receivers in the component's arguments.
    loki.process "pod_logs" {
      // Add static labels for better organization
      stage.static_labels {
          values = {
            cluster = "kubernetes",
            component = "alloy",
          }
      }

      // Filter out extremely long log lines that might be garbage
      stage.match {
        selector = "{__path__=~\".*\"}"
        stage.drop {
          source = "log"
          expression = "len(__entry__) > 10000"
        }
      }

      // Extract useful metadata from log entries
      stage.match {
        selector = "{__path__=~\".*\"}"
        stage.json {
          expressions = {
            level = "level",
            msg = "message",
            timestamp = "timestamp",
          }
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    // loki.source.kubernetes_events tails events from the Kubernetes API and converts them
    // into log lines to forward to other Loki components.
    loki.source.kubernetes_events "cluster_events" {
      job_name   = "integrations/kubernetes/eventhandler"
      log_format = "logfmt"
      forward_to = [
        loki.process.cluster_events.receiver,
      ]
    }

    // loki.process receives log entries from other loki components, applies one or more processing stages,
    // and forwards the results to the list of receivers in the component's arguments.
    loki.process "cluster_events" {
      forward_to = [loki.write.default.receiver]

      stage.static_labels {
        values = {
          cluster = "kubernetes",
        }
      }

      stage.labels {
        values = {
          kubernetes_cluster_events = "job",
        }
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://loki-write.loki-system.svc:3100/loki/api/v1/push"
      }
    }

    // ==========================================================================
    // Trivy Webhook Receiver
    // Receives vulnerability and security reports from Trivy operator via webhook
    // ==========================================================================

    loki.source.api "trivy_webhook" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 8080
      }
      labels = {
        source = "trivy",
        job    = "trivy-operator",
      }
      forward_to = [loki.process.trivy_reports.receiver]
    }

    loki.process "trivy_reports" {
      // Extract top-level fields from Trivy webhook payload
      stage.json {
        expressions = {
          verb = "Verb",
        }
      }

      // Add verb as label (update/delete)
      stage.labels {
        values = {
          verb = "",
        }
      }

      // Extract metadata from the OperatorObject (nested JSON extraction)
      stage.json {
        expressions = {
          kind       = "OperatorObject.kind",
          apiVersion = "OperatorObject.apiVersion",
          name       = "OperatorObject.metadata.name",
          namespace  = "OperatorObject.metadata.namespace",
        }
      }

      // Add report metadata as labels for efficient querying
      stage.labels {
        values = {
          report_kind = "kind",
          report_name = "name",
          namespace   = "namespace",
        }
      }

      // Add static labels for organization
      stage.static_labels {
        values = {
          cluster   = "kubernetes",
          component = "security",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    // ==========================================================================
    // OpenTelemetry Trace Collection
    // Receives OTLP traces from applications (e.g., LiteLLM) and forwards to Tempo
    // ==========================================================================

    // OTLP receiver for gRPC (port 4317) and HTTP (port 4318)
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces = [otelcol.processor.batch.default.input]
      }
    }

    // Batch processor to improve efficiency
    otelcol.processor.batch "default" {
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // Export traces to Tempo
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo-distributor.tempo-system.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // ==========================================================================
    // Standard Syslog Collection (RFC3164/5424)
    // Receives syslog messages from generic network devices and Linux hosts
    // ==========================================================================

    loki.source.syslog "syslog_tcp" {
      listener {
        address       = "0.0.0.0:6514"
        protocol      = "tcp"
        syslog_format = "rfc3164"
        labels        = {
          job       = "syslog",
          transport = "tcp",
        }
      }
      forward_to = [loki.process.syslog.receiver]
    }

    loki.source.syslog "syslog_udp" {
      listener {
        address       = "0.0.0.0:5140"
        protocol      = "udp"
        syslog_format = "rfc3164"
        labels        = {
          job       = "syslog",
          transport = "udp",
        }
      }
      forward_to = [loki.process.syslog.receiver]
    }

    loki.process "syslog" {
      stage.static_labels {
        values = {
          cluster   = "kubernetes",
          component = "syslog",
        }
      }

      // Preserve syslog metadata as labels
      stage.labels {
        values = {
          severity = "",
          facility = "",
          hostname = "",
          app_name = "",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    // ==========================================================================
    // CEF Collection (UniFi Devices)
    // Receives CEF-formatted logs from UniFi devices over TCP on port 1514
    // ==========================================================================

    // Raw TCP receiver for CEF messages (no syslog protocol parsing)
    otelcol.receiver.tcplog "cef_tcp" {
      listen_address = "0.0.0.0:1514"
      add_attributes = true
      output {
        logs = [otelcol.processor.transform.cef_parse.input]
      }
    }

    // Transform processor to extract CEF fields
    otelcol.processor.transform "cef_parse" {
      error_mode = "ignore"

      log_statements {
        context = "log"
        statements = [
          // Extract CEF header fields using regex
          // Format: CEF:Version|Vendor|Product|DeviceVersion|EventClassID|Name|Severity|Extension
          `set(attributes["cef_version"], ExtractPatterns(body, "^CEF:(?P<version>\\d+)\\|")["version"])`,
          `set(attributes["device_vendor"], ExtractPatterns(body, "^CEF:\\d+\\|(?P<vendor>[^|]+)\\|")["vendor"])`,
          `set(attributes["device_product"], ExtractPatterns(body, "^CEF:\\d+\\|[^|]+\\|(?P<product>[^|]+)\\|")["product"])`,
          `set(attributes["event_class_id"], ExtractPatterns(body, "^CEF:\\d+\\|[^|]+\\|[^|]+\\|[^|]+\\|(?P<id>[^|]+)\\|")["id"])`,
          `set(attributes["event_name"], ExtractPatterns(body, "^CEF:\\d+\\|[^|]+\\|[^|]+\\|[^|]+\\|[^|]+\\|(?P<name>[^|]+)\\|")["name"])`,
          `set(attributes["severity"], ExtractPatterns(body, "^CEF:\\d+\\|[^|]+\\|[^|]+\\|[^|]+\\|[^|]+\\|[^|]+\\|(?P<sev>[^|]+)\\|")["sev"])`,
          // Extract common UniFi extension fields
          `set(attributes["unifi_category"], ExtractPatterns(body, "UNIFIcategory=(?P<cat>[^ ]+)")["cat"])`,
          `set(attributes["unifi_subcategory"], ExtractPatterns(body, "UNIFIsubCategory=(?P<sub>[^ ]+)")["sub"])`,
          `set(attributes["unifi_host"], ExtractPatterns(body, "UNIFIhost=(?P<host>[^ ]+)")["host"])`,
          `set(attributes["client_mac"], ExtractPatterns(body, "UNIFIclientMac=(?P<mac>[^ ]+)")["mac"])`,
          `set(attributes["client_ip"], ExtractPatterns(body, "UNIFIclientIp=(?P<ip>[^ ]+)")["ip"])`,
          // Extract message field
          `set(attributes["message"], ExtractPatterns(body, "msg=(?P<msg>.+)$")["msg"])`,
        ]
      }

      output {
        logs = [otelcol.exporter.loki.cef.input]
      }
    }

    // Export to Loki
    otelcol.exporter.loki "cef" {
      forward_to = [loki.process.cef.receiver]
    }

    // Final Loki processing
    loki.process "cef" {
      // Add static labels
      stage.static_labels {
        values = {
          cluster   = "kubernetes",
          component = "cef",
          job       = "syslog",
          source    = "unifi",
        }
      }

      // Map OTEL attributes to Loki labels
      stage.labels {
        values = {
          device_vendor = "",
          device_product = "",
          event_name = "",
          severity = "",
          unifi_category = "",
        }
      }

      forward_to = [loki.write.default.receiver]
    }
