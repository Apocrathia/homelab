---
# LoadBalancer service for external syslog and CEF ingestion
# Uses shared ingest IP pool from flux/manifests/03-services/observability/ingest/
apiVersion: v1
kind: Service
metadata:
  name: alloy-ingest-lb
  namespace: alloy-system
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: ingest
    apocrathia.com/ingest: "true"
  annotations:
    lbipam.cilium.io/ips: "10.100.1.96"
    lbipam.cilium.io/sharing-key: "ingest"
    # NetFlow ingest moved to the Tenzir namespace (SIEM lap C: goflow2
    # removed, Tenzir read_netflow owns :2055 UDP). The tenzir-ingest-lb
    # Service (tenzir-system, 2055/UDP) shares this pool IP.
    lbipam.cilium.io/sharing-cross-namespace: "tenzir-system"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ports:
    # Standard syslog (RFC3164/5424)
    - name: syslog-tcp
      port: 6514
      protocol: TCP
      targetPort: 6514
    - name: syslog-udp
      port: 514
      protocol: UDP
      targetPort: 5140
    # CEF (UniFi devices)
    - name: cef-tcp
      port: 1514
      protocol: TCP
      targetPort: 1514
  selector:
    app.kubernetes.io/name: alloy
