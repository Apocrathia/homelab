---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: alloy-system
spec:
  interval: 5m
  chart:
    spec:
      chart: alloy
      # renovate: datasource=helm registryUrl=https://grafana.github.io/helm-charts depName=alloy
      version: "1.8.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Alloy configuration for log collection
    alloy:
      # Enable experimental components (required for otelcol.receiver.tcplog CEF receiver)
      # Ref: https://grafana.com/docs/alloy/latest/reference/components/otelcol/otelcol.receiver.tcplog/
      # TODO: Change back to "stable" (or remove this value) once otelcol.receiver.tcplog graduates from experimental
      stabilityLevel: experimental

      configMap:
        create: false
        name: alloy-config
        key: config.alloy

      # Resources
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      # Container security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

      # Extra ports for webhook receivers, OTLP ingestion, and syslog/CEF collection
      extraPorts:
        - name: trivy-webhook
          port: 8080
          targetPort: 8080
          protocol: TCP
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
        # Syslog collection (RFC3164/5424)
        - name: syslog-tcp
          port: 6514
          targetPort: 6514
          protocol: TCP
        - name: syslog-udp
          port: 5140
          targetPort: 5140
          protocol: UDP
        # CEF collection (UniFi devices)
        - name: cef-tcp
          port: 1514
          targetPort: 1514
          protocol: TCP

      # Extra volume mounts for WAL storage
      mounts:
        extra:
          - name: alloy-wal
            mountPath: /tmp/alloy

    # RBAC configuration - permissions for log collection, metrics scraping, and node discovery
    rbac:
      create: true
      rules:
        - apiGroups: [""]
          resources: ["pods", "pods/log"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["namespaces"]
          verbs: ["get", "list"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["services"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]

    # Service account configuration
    serviceAccount:
      create: true
      annotations: {}

    # Global pod security context
    global:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001

    # Node selector for all nodes
    nodeSelector: {}

    # Tolerations for all nodes
    tolerations: []

    # Affinity for all nodes
    affinity: {}

    # Controller configuration
    controller:
      # Extra volumes for WAL storage (emptyDir for temporary data)
      volumes:
        extra:
          - name: alloy-wal
            emptyDir: {}
