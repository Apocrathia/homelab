---
# yaml-language-server: $schema=https://raw.githubusercontent.com/1Password/onepassword-operator/main/config/crd/bases/onepassword.com_onepassworditems.yaml
# ClickHouse materialization of the EXISTING vault item tenzir-secrets
# (same item as the tenzir-system Secret, second OnePasswordItem CR on one
# item). Fields consumed here (1Password field label = rendered Secret key):
#   aws-access-key-id       - rustfs `tenzir` bucket user (cold tier,
#                             existing value; the prototype validated this
#                             user against rustfs S3, multipart included)
#   aws-secret-access-key   - rustfs `tenzir` bucket user secret
#   clickhouse-password     - password of the ClickHouse `tenzir` user; the
#                             SAME vault field feeds the Tenzir nodes'
#                             TENZIR_SECRETS__CLICKHOUSE_PASSWORD (MR-3).
#                             Operator adds the value.
#   clickhouse-grafana-password - password of the ClickHouse `grafana`
#                             user (SELECT-only datasource user; the same
#                             value rides on grafana-secrets as
#                             clickhouse-grafana-key in MR-2). Operator
#                             adds the value.
# The materialization carries all tenzir-secrets fields (platform node tokens
# included); the accepted tradeoff is recorded in the rollout plan (D6).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clickhouse-secrets
  namespace: clickhouse
spec:
  itemPath: "vaults/Secrets/items/tenzir-secrets"
