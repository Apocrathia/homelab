---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-tailnet-dns
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/manifests/03-services/tailnet-dns
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    # Service exposure (tailscale.com/expose) and the tailnet-gateway this
    # stack's records point at both come from the operator release.
    - name: services-tailscale
