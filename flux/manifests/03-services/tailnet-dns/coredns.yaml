---
# Corefile for the tailnet DNS resolver. Serves only the split-DNS zone
# gateway.services.apocrathia.com from etcd (records written by the
# external-dns-tailnet release in this namespace). Queries for any other
# zone are refused - this instance is not a general resolver.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailnet-dns-corefile
  namespace: tailnet-dns
  labels:
    app.kubernetes.io/name: tailnet-dns
    app.kubernetes.io/component: coredns
data:
  Corefile: |
    gateway.services.apocrathia.com:53 {
        errors
        health :8080
        ready :8181
        etcd gateway.services.apocrathia.com {
            path /skydns
            endpoint http://etcd.tailnet-dns.svc.cluster.local:2379
            # no fallthrough: unknown names in the zone return NXDOMAIN
            # (matching the UDM), not SERVFAIL from an exhausted chain
        }
        cache 30
        loadbalance
        reload
    }
---
# The tailscale operator turns this Service into a tailnet device
# (tailnet-dns.taila8ef8c.ts.net) via `tailscale.com/expose`. The operator
# DNATs all traffic to the proxy's tailnet IP to this Service's ClusterIP,
# and only Service-declared ports are reachable through the ClusterIP, so
# exactly TCP/UDP 53 is exposed. The device IP for the split-DNS
# nameserver shows up in this Service's status (`kubectl get svc -n
# tailnet-dns tailnet-dns` EXTERNAL-IP) once the proxy authenticates.
apiVersion: v1
kind: Service
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
  labels:
    app.kubernetes.io/name: tailnet-dns
    app.kubernetes.io/component: coredns
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "tailnet-dns"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tailnet-dns
    app.kubernetes.io/component: coredns
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: tailnet-dns
  labels:
    app.kubernetes.io/name: tailnet-dns
    app.kubernetes.io/component: coredns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-dns
      app.kubernetes.io/component: coredns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet-dns
        app.kubernetes.io/component: coredns
    spec:
      automountServiceAccountToken: false
      # ClusterFirst: this CoreDNS is a cluster CLIENT of etcd — it must
      # resolve etcd.tailnet-dns.svc.cluster.local through the cluster
      # resolver. dnsPolicy Default (node resolv.conf -> node-local DNS)
      # fails to resolve the Service name from this pod and every zone
      # query times out against a dead upstream.
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coredns
          # Same image as the kube-dns CoreDNS (02-infrastructure/coredns)
          # renovate: datasource=docker depName=registry.k8s.io/coredns/coredns
          image: registry.k8s.io/coredns/coredns:v1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tailnet-dns-corefile
            items:
              - key: Corefile
                path: Corefile
