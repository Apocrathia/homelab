---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_envoyproxies.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway-proxy-config
  namespace: envoy-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # One proxy per node, matching Cilium's per-node Envoy DaemonSet.
      envoyDaemonSet: {}
      envoyService:
        type: LoadBalancer
        # Cluster (not Local): TAK TCPRoute listeners are plain L4: the
        # backend pod is the only service backend, so with Local every node
        # not hosting the pod refuses connections. Preserves the original
        # Cilium Gateway behavior.
        externalTrafficPolicy: Cluster
        # Cilium LB IPAM + L2 announcements: select the same label the IP
        # pool and L2 policy match on, and pin the IP + loadbalancer mode
        # the old Cilium Gateway carried.
        labels:
          io.cilium.gateway/owning-gateway: main-gateway
        annotations:
          io.cilium/lb-ipam-ips: "10.100.1.99"
          service.cilium.io/loadbalancer-mode: "hybrid"
