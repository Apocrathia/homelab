---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_envoyextensionpolicies.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: coraza-waf
  namespace: envoy-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
  wasm:
    - name: coraza-waf
      rootID: coraza-waf
      code:
        type: Image
        image:
          # renovate: datasource=docker depName=ghcr.io/corazawaf/coraza-proxy-wasm
          url: ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
      # CRS v4 rules are embedded in the WASM binary.
      # DetectionOnly — log WAF hits but don't block. Flip to On after tuning.
      # Body limits: coraza defaults reject non-file request bodies over 128KB
      # (SecRequestBodyNoFilesLimit) with 413 — large JSON POSTs (agent/LLM
      # conversations, Fleet osquery batches) die at the WAF. Raised to 32Mi
      # to match the request-timeout BTP requestBuffer limit.
      config:
        {
          "default_directives": "recommended",
          "directives_map":
            {
              "recommended":
                [
                  "Include @recommended-conf",
                  "SecRuleEngine DetectionOnly",
                  "SecRequestBodyAccess On",
                  "SecRequestBodyLimit 33554432",
                  "SecRequestBodyNoFilesLimit 33554432",
                  "SecResponseBodyAccess Off",
                  "Include @crs-setup-conf",
                  "Include @owasp_crs/*.conf",
                ],
            },
        }
      failOpen: true
