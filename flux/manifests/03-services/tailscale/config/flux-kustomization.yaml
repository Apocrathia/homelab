---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-tailscale-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/manifests/03-services/tailscale/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  # ProxyGroup CRDs are installed by the operator Helm chart; these CRs must
  # not be applied before the chart's CRDs exist (dry-run deadlock otherwise).
  dependsOn:
    - name: services-tailscale
