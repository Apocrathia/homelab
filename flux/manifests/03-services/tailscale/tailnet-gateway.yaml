---
# yaml-language-server: $schema=https://raw.githubusercontent.com/imroc/kubeschemas/main/cilium.io/ciliumgatewayclassconfig_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: tailscale-gateway-config
  namespace: cilium-system
spec:
  service:
    type: LoadBalancer
    loadBalancerClass: tailscale
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/heads/main/config/crd/experimental/gateway.networking.k8s.io_gatewayclasses.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-tailscale
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: tailscale-gateway-config
    namespace: cilium-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/heads/main/config/crd/experimental/gateway.networking.k8s.io_gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tailnet-gateway
  namespace: cilium-system
spec:
  gatewayClassName: cilium-tailscale
  # Device name shown in the Tailscale admin console / MagicDNS for the
  # operator proxy device backing this Gateway. Cilium copies
  # spec.infrastructure.annotations onto the generated LoadBalancer Service;
  # the tailscale operator uses tailscale.com/hostname as the device hostname
  # instead of the default <namespace>-<service-name>.
  infrastructure:
    annotations:
      tailscale.com/hostname: "tailnet-gateway"
  listeners:
    # HTTPS listener so friends reach the same
    # *.gateway.services.apocrathia.com hostnames the LAN uses (tailnet
    # split DNS resolves them to this gateway). Reuses the main-gateway's
    # wildcard cert secret - the ReferenceGrant `cert-manager-secrets` in
    # 03-services/gateway/gateway.yaml already admits Gateways in
    # cilium-system to that Secret, so no new grant or certificate is
    # needed.
    - name: https-gateway-services
      protocol: HTTPS
      port: 443
      hostname: "*.gateway.services.apocrathia.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-services-apocrathia-com-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
