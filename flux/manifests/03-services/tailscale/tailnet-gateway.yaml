---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_envoyproxies.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: tailnet-gateway-config
  namespace: envoy-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        # Tailscale operator provisions a proxy device for LoadBalancer
        # Services with this class.
        loadBalancerClass: tailscale
        annotations:
          # Device name in the Tailscale admin console / MagicDNS.
          tailscale.com/hostname: "tailnet-gateway"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/refs/heads/main/config/crd/experimental/gateway.networking.k8s.io_gateways.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tailnet-gateway
  namespace: envoy-system
spec:
  gatewayClassName: envoy
  # Dedicated EnvoyProxy (not the shared GatewayClass parametersRef): this
  # gateway needs loadBalancerClass: tailscale + the tailnet device
  # hostname, unlike the LAN main-gateway.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: tailnet-gateway-config
      namespace: envoy-system
  listeners:
    # HTTPS listener so friends reach the same
    # *.gateway.services.apocrathia.com hostnames the LAN uses (tailnet
    # split DNS resolves them to this gateway). Reuses the main-gateway's
    # wildcard cert secret - the ReferenceGrant `cert-manager-secrets` in
    # 03-services/gateway/gateway.yaml already admits envoy-system Gateways
    # to that Secret, so no new grant or certificate is needed.
    - name: https-gateway-services
      protocol: HTTPS
      port: 443
      hostname: "*.gateway.services.apocrathia.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-services-apocrathia-com-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # Tailnet door for matrix.apocrathia.com (Synapse server_name
    # host): https-gateway-services is hostname- and cert-scoped to
    # *.gateway.services.apocrathia.com, so this host needs its own
    # listener with the matrix-namespace cert; matrix/referencegrant.yaml
    # admits envoy-system Gateways to it.
    - name: https-matrix
      protocol: HTTPS
      port: 443
      hostname: "matrix.apocrathia.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: matrix-apocrathia-com-tls
            namespace: matrix
      allowedRoutes:
        namespaces:
          from: All
    - name: tak-8088
      protocol: TCP
      port: 8088
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: tak
    - name: tak-8089
      protocol: TCP
      port: 8089
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: tak
    - name: tak-8443
      protocol: TCP
      port: 8443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: tak
    # Gateway-terminated TLS: TAK clients on iOS reject the OTS server
    # certificate (hardcoded CN, no SAN) as a hostname mismatch with no
    # prompt, so enrollment is only reachable with a certificate matching
    # the zone. Client-certificate mTLS stays on the opaque TCP listeners.
    - name: tak-8446
      protocol: HTTPS
      port: 8446
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gateway-services-apocrathia-com-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: tak
