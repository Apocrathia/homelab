---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: homelab
  namespace: renovate-operator
spec:
  schedule: "0 */4 * * *"
  discoveryFilters:
    - "Apocrathia/*"
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  image: ghcr.io/renovatebot/renovate:44.255.2@sha256:220e3d5fef67369d6c3c20676a62095d097002e0ca10a97396c24b8800b0ee20
  secretRef: renovate-operator-secret
  provider:
    name: gitlab
    # endpoint omitted: defaults to https://gitlab.com/api/v4
  # Registry credentials for detectHostRulesFromEnv: Docker Hub access token
  # (rate limits) and GHCR via GitHub PAT (read:packages). Keys live on the
  # renovate-operator-secret OnePasswordItem. Carried over from Mend CE.
  extraEnv:
    - name: DOCKER_DOCKER_IO_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: dockerhub-username
    - name: DOCKER_DOCKER_IO_PASSWORD
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: dockerhub-token
    - name: DOCKER_GHCR_IO_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: github-username
    - name: DOCKER_GHCR_IO_PASSWORD
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: github-token
    - name: GITHUB_COM_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: GITHUB_COM_TOKEN
    - name: DOCKER_REGISTRY_GITLAB_COM_USERNAME
      valueFrom:
        secretKeyRef:
          name: gitlab-registry-deploy-token
          key: username
    - name: DOCKER_REGISTRY_GITLAB_COM_PASSWORD
      valueFrom:
        secretKeyRef:
          name: gitlab-registry-deploy-token
          key: password
  parallelism: 1
  renovateConfig:
    inline: |
      module.exports = {
        binarySource: "global",
        onboarding: false,
        requireConfig: "optional",
        detectHostRulesFromEnv: true,
      }
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi
