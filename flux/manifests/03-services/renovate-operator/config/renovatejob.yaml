---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: homelab
  namespace: renovate-operator
spec:
  schedule: "0 * * * *"
  discoveryFilters:
    - "Apocrathia/*"
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  image: ghcr.io/renovatebot/renovate:44.93.5@sha256:a813dd2b59451b4fc6f3d1679dcf92af6a6f045d354301d061d18c177a6f32a2
  secretRef: renovate-operator-secret
  provider:
    name: gitlab
    # endpoint omitted: defaults to https://gitlab.com/api/v4
  # Registry credentials for detectHostRulesFromEnv: Docker Hub access token
  # (rate limits) and GHCR via GitHub PAT (read:packages). Keys live on the
  # renovate-operator-secret OnePasswordItem. Carried over from Mend CE.
  extraEnv:
    - name: DOCKER_DOCKER_IO_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: dockerhub-username
    - name: DOCKER_DOCKER_IO_PASSWORD
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: dockerhub-token
    - name: DOCKER_GHCR_IO_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: github-username
    - name: DOCKER_GHCR_IO_PASSWORD
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: github-token
  parallelism: 1
  renovateConfig:
    inline: |
      module.exports = {
        binarySource: "global",
        onboarding: false,
        requireConfig: "optional",
        detectHostRulesFromEnv: true,
      }
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
