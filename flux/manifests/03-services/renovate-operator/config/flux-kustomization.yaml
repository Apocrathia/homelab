---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-renovate-operator-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/manifests/03-services/renovate-operator/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  # The RenovateJob CRD is installed by the operator Helm chart; this CR must
  # not be applied before the chart's CRD hook completes.
  dependsOn:
    - name: services-renovate-operator
