---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: renovate
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # OIDC Provider for the renovate web UI (native OIDC, not proxy)
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "renovate-oidc-provider"
    attrs:
      name: "renovate-oidc-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
      sub_mode: "user_email"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://renovate.gateway.services.apocrathia.com/auth/callback"
          matching_mode: "strict"
      # Authentik 2026.5+: empty grant_types rejects authorization_code (invalid_grant).
      grant_types:
        - authorization_code
        - refresh_token
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      token_validity: "days=30"
      client_type: "confidential"

  # Application entry (launchpad bookmark; auth is native OIDC above)
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "renovate"
    attrs:
      name: "Renovate"
      slug: "renovate"
      group: "Platform"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "renovate-oidc-provider"]]
      meta_launch_url: "https://renovate.gateway.services.apocrathia.com"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/03-services/renovate/icon.svg"
      meta_description: "Dependency update automation - Renovate as Kubernetes Jobs"
      meta_publisher: "mogenius"
