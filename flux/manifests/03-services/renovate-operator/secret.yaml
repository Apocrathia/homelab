---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: renovate-operator-secret
  namespace: renovate-operator
spec:
  # Reuses the existing renovate-secrets vault item. The operator reads token
  # keys in preference order: RENOVATE_TOKEN, GITHUB_COM_TOKEN, GITLAB_TOKEN.
  # The item needs RENOVATE_TOKEN (same value as gitlab-token) and
  # GITHUB_COM_TOKEN (same value as github-token) added as fields.
  itemPath: "vaults/Secrets/items/renovate-secrets"
