---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: kubernetes
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Group for Kubernetes cluster admins
  - model: authentik_core.group
    state: present
    identifiers:
      name: "kubernetes-admins"
    attrs:
      name: "kubernetes-admins"

  # Group for Kubernetes cluster operators
  - model: authentik_core.group
    state: present
    identifiers:
      name: "kubernetes-operators"
    attrs:
      name: "kubernetes-operators"

  # Group for Kubernetes cluster viewers
  - model: authentik_core.group
    state: present
    identifiers:
      name: "kubernetes-viewers"
    attrs:
      name: "kubernetes-viewers"

  # Custom email scope mapping that always returns email_verified: true
  # Required because the K8s API server rejects tokens with email_verified: false
  # Authentik does not support email verification, so we need to add it manually.
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: "Kubernetes Email"
    attrs:
      name: "Kubernetes Email"
      scope_name: "email"
      description: "Email claim with verified status for Kubernetes OIDC"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  # Scope mapping for groups claim
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      scope_name: "groups"
    attrs:
      name: "Kubernetes Groups"
      scope_name: "groups"
      description: "Include user groups in the token for Kubernetes RBAC"
      expression: |
        return {
            "groups": [group.name for group in user.ak_groups.all()],
        }

  # OIDC Provider for Kubernetes
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "kubernetes-oidc-provider"
    attrs:
      name: "kubernetes-oidc-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "Kubernetes Email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
      sub_mode: "user_email"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "http://localhost:8000"
          matching_mode: "strict"
        - url: "http://localhost:18000"
          matching_mode: "strict"
        - url: "http://127.0.0.1:8000"
          matching_mode: "strict"
        - url: "https://headlamp.gateway.services.apocrathia.com/oidc-callback"
          matching_mode: "strict"
      client_id: "kubernetes"
      client_type: "public"
      access_code_validity: "minutes=1"
      access_token_validity: "hours=1"
      refresh_token_validity: "days=30"

  # Application for Kubernetes
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "kubernetes"
    attrs:
      name: "Kubernetes Cluster"
      slug: "kubernetes"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "kubernetes-oidc-provider"]]
      group: "Platform"
      # Hidden from library - Headlamp is the user-facing entry
      meta_launch_url: "blank://blank"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/03-services/authentik/kube-auth/icon.svg"
      meta_description: "Kubernetes cluster authentication via OIDC"
      meta_publisher: "Kubernetes"
