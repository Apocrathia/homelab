---
# Kubernetes RBAC for Authentik OIDC Groups
# These bindings map Authentik groups to Kubernetes roles
# Group names are prefixed with "oidc:" based on API server config

# =============================================================================
# Cluster Admins - Full cluster-admin access
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-cluster-admins
  labels:
    app.kubernetes.io/name: authentik-kube-auth
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: "oidc:kubernetes-admins"
    apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# Cluster Operators - Edit access across namespaces
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-cluster-operators
  labels:
    app.kubernetes.io/name: authentik-kube-auth
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: Group
    name: "oidc:kubernetes-operators"
    apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# Cluster Viewers - Read-only access across namespaces
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-cluster-viewers
  labels:
    app.kubernetes.io/name: authentik-kube-auth
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: "oidc:kubernetes-viewers"
    apiGroup: rbac.authorization.k8s.io
