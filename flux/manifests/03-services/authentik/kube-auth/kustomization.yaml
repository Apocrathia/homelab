---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: authentik-kube-auth

resources:
  - rbac.yaml

generatorOptions:
  disableNameSuffixHash: true

# Blueprint ConfigMap for Authentik sidecar
configMapGenerator:
  - name: authentik-blueprint-kubernetes
    namespace: authentik
    files:
      - kubernetes.yaml=authentik-blueprint.yaml

labels:
  - includeSelectors: true
    pairs:
      authentik_blueprint: "true"
