---
# Nightly base backup for authentik-postgres (barman object store).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-postgres-backup
  namespace: authentik
spec:
  schedule: "0 5 * * *" # 0500 UTC = 2300 MST, after the kopia 0200 UTC window
  backupOwnerReference: self
  cluster:
    name: authentik-postgres
