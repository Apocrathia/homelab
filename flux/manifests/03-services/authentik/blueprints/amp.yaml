---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: amp
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Group mapping Authentik -> AMP roles. AMP maps OIDC groups to roles by
  # prefix (Login.OIDCRoleNamePrefix=AMP_): "AMP_Super Admins" grants the AMP
  # "Super Admins" role. AMP guide:
  # https://discourse.cubecoders.com/t/using-oidc-authentication-with-authentik/26618
  - model: authentik_core.group
    state: present
    identifiers:
      name: "AMP_Super Admins"
    attrs:
      name: "AMP_Super Admins"

  # AMP requests the standard "groups" scope (verified against community
  # Authelia/Keycloak setups) and maps prefixed group names to AMP roles.
  # Reuse the existing groups scope mapping (kube-auth blueprint) rather
  # than defining a second one — Authentik matches scope_name, not name.

  # OIDC Provider for AMP (external host pattern; see proxmox.yaml)
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "amp-oidc-provider"
    attrs:
      name: "amp-oidc-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
      sub_mode: "user_username"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://game.apocrathia.com/"
          matching_mode: "strict"
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      token_validity: "days=30"
      client_type: "confidential"

  # Application for AMP
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "amp"
    attrs:
      name: "AMP Server Management"
      slug: "amp"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "amp-oidc-provider"]]
      launch_url: "https://game.apocrathia.com"
      group: "Gaming"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/03-services/authentik/blueprints/icons/amp.png"
      meta_description: "Server management and hosting solution for game servers"
      meta_publisher: "CubeCoders"

  # Admins group binding (app access) — web UI is admins-only.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "amp"]]
      group: !Find [authentik_core.group, [name, "admins"]]
    attrs:
      order: 10
