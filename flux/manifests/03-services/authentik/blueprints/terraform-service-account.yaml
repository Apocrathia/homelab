---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Service account + API token for the Crossplane provider-opentofu workspaces
# (goauthentik Terraform provider). Authentik generates the token key on
# import — never committed here. Copy it once from Authentik
# (Directory -> Users -> ak-terraform -> Tokens) into the 1Password item
# crossplane-terraform-secrets (field authentik-terraform-token); the
# headlamp and chaos-mesh ProviderConfigs read it from there.
version: 1
metadata:
  name: terraform-service-account
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Least privilege for workspace-managed Authentik config: application +
  # policy-binding CRUD and group read (the goauthentik provider's
  # data.authentik_group), plus the proxy-provider stack the chaos-mesh
  # workspace owns: proxy provider CRUD, outpost CRUD (the workspace creates
  # and destroys outposts now — the attachment resource is retired), service
  # connection read (the data.authentik_service_connection_kubernetes source
  # lists the outposts/service_connections/kubernetes API), and flow read
  # (the data.authentik_flow sources). Service accounts follow RBAC in
  # 2026.8.2 — verified there is no bypass — so the role is required.
  - model: authentik_rbac.role
    state: present
    identifiers:
      name: "terraform-workspace-manager"
    attrs:
      name: "terraform-workspace-manager"
      permissions:
        - "authentik_core.view_application"
        - "authentik_core.add_application"
        - "authentik_core.change_application"
        - "authentik_core.delete_application"
        - "authentik_policies.view_policybinding"
        - "authentik_policies.add_policybinding"
        - "authentik_policies.change_policybinding"
        - "authentik_policies.delete_policybinding"
        - "authentik_core.view_group"
        # Proxy-provider scope for the chaos-mesh workspace. Provider apps
        # use full app labels — authentik_providers_proxy, NOT
        # authentik_providers (verified against the 2026.8.2 auth_permission
        # table; same shape as the tak-ldap-search role's
        # authentik_providers_ldap.search_full_directory).
        - "authentik_providers_proxy.view_proxyprovider"
        - "authentik_providers_proxy.add_proxyprovider"
        - "authentik_providers_proxy.change_proxyprovider"
        - "authentik_providers_proxy.delete_proxyprovider"
        - "authentik_outposts.view_outpost"
        - "authentik_outposts.change_outpost"
        - "authentik_outposts.add_outpost"
        - "authentik_outposts.delete_outpost"
        - "authentik_outposts.view_kubernetesserviceconnection"
        - "authentik_flows.view_flow"
        # OIDC tier (komga pilot onward): the goauthentik provider manages
        # oauth2 providers AND the per-app custom scope mappings. Scope
        # mappings are PROXY models with their OWN codenames in the oauth2
        # app — the API ViewSet checks scopemapping, NOT the
        # authentik_core.propertymapping base (both verified against the
        # 2026.8 auth_permission table; the base-model grants 403).
        - "authentik_providers_oauth2.view_oauth2provider"
        - "authentik_providers_oauth2.add_oauth2provider"
        - "authentik_providers_oauth2.change_oauth2provider"
        - "authentik_providers_oauth2.delete_oauth2provider"
        - "authentik_providers_oauth2.view_scopemapping"
        - "authentik_providers_oauth2.add_scopemapping"
        - "authentik_providers_oauth2.change_scopemapping"
        - "authentik_providers_oauth2.delete_scopemapping"
        # The module's oidc signing-key lookup reads certificate key pairs;
        # the provider's cert fetch uses the granular action permission
        # (view_certificatekeypair_certificate — the plain view covers only
        # the CRUD viewset). Key-material view (view_certificatekeypair_key)
        # deliberately NOT granted: least privilege.
        - "authentik_crypto.view_certificatekeypair"
        - "authentik_crypto.view_certificatekeypair_certificate"

  # Same shape as the tak-ldap-bind service account: the blueprint cannot
  # hold a secret value; the operator sets it after import.
  - model: authentik_core.user
    state: present
    identifiers:
      username: "ak-terraform"
    attrs:
      username: "ak-terraform"
      name: "Terraform workspaces"
      type: "service_account"
      is_active: true
      roles:
        - !Find [authentik_rbac.role, [name, "terraform-workspace-manager"]]

  # API token. key is deliberately omitted: in blueprint context the
  # serializer exposes it as optional (authentik/core/api/tokens.py) and
  # authentik generates a random one; re-imports never touch it because key
  # is not in attrs. intent must be "api" (TokenIntents.INTENT_API) — user
  # and intent are required attrs in blueprint context.
  - model: authentik_core.token
    state: present
    identifiers:
      identifier: "terraform-workspace-manager"
    attrs:
      identifier: "terraform-workspace-manager"
      user: !Find [authentik_core.user, [username, "ak-terraform"]]
      intent: "api"
      expiring: false
      description: "goauthentik TF provider token for provider-opentofu workspaces"
