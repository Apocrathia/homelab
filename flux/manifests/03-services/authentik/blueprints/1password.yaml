---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: 1password
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Application for 1Password (Bookmark)
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "1password"
    attrs:
      name: "1Password"
      slug: "1password"
      group: "Platform"
      meta_launch_url: "https://apocrathia.1password.com"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/03-services/authentik/blueprints/icons/1password.svg"
      meta_description: "1Password management interface"
      meta_publisher: "AgileBits Inc."

  # Admins group binding (app access)
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "1password"]]
      group: !Find [authentik_core.group, [name, "admins"]]
    attrs:
      order: 10
