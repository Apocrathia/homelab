---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: authentik-blueprints

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-okta
    namespace: authentik
    files:
      - okta.yaml
  - name: authentik-blueprint-webauthn-mfa
    namespace: authentik
    files:
      - webauthn-mfa.yaml
  - name: authentik-blueprint-app-access
    namespace: authentik
    files:
      - app-access.yaml
  - name: authentik-blueprint-terraform-service-account
    namespace: authentik
    files:
      - terraform-service-account.yaml

labels:
  - includeSelectors: true
    pairs:
      authentik_blueprint: "true"
