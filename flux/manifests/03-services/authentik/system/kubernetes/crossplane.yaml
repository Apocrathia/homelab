---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: kubernetes-authentik
  namespace: authentik
spec:
  # Materializes the shared 1Password-item-backed Secret as a file in the
  # tofu workdir; authentik.tf's provider block reads it with
  # file("authentik-token"). The token itself never appears in a
  # manifest.
  #
  # The system units have no app namespace of their own (they manage
  # authentik-internal state, not app tiles), so all tofu objects ride ns
  # authentik and share the ONE ns-authentik authentik-terraform-token
  # Secret rendered by tiles/authentik-terraform-token.yaml — same
  # 1Password item (crossplane-terraform-secrets) every other
  # authentik-consumer pair copies. That Secret must outlive any single
  # unit; it is the tier's shared substrate.
  credentials:
    - filename: authentik-token
      source: Secret
      secretRef:
        name: authentik-terraform-token
        namespace: authentik
        key: authentik-terraform-token
  # Per-unit state args for the PARTIAL kubernetes backend in authentik.tf:
  # the provider writes this as crossplane.remote.tfbackend and passes it
  # via -backend-config at tofu init. The state Secret is
  # tfstate-kubernetes-authentik-terraform-service-account
  # in ns authentik — unique suffix per unit, deliberately separate from
  # the CI tofu stack (terraform/, GitLab HTTP backend). Two stacks, two
  # states.
  backendFile: |
    secret_suffix     = "kubernetes"
    namespace         = "authentik"
    in_cluster_config = true
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: kubernetes-authentik
  namespace: authentik
spec:
  # Prune guard — crossplane v2 removed deletionPolicy; without the Delete
  # action the provider releases the finalizer WITHOUT running tofu
  # destroy, so a GitOps prune of this object can NEVER destroy the live
  # authentik objects (v2-native Orphan). Deliberate decommission
  # therefore requires temporarily restoring ["*"] (or a manual tofu
  # destroy) — the guard is intentional. DOUBLY intentional here: this
  # workspace owns the kube-apiserver's OIDC issuer — destroying it is a
  # cluster-auth outage (delete/recreate windows break token validation,
  # live tokens last 1h).
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: kubernetes-authentik
  forProvider:
    # Inline module, stitched at kustomize build time: kustomization.yaml's
    # configMapGenerator packages authentik.tf and the replacements rule
    # copies its bytes into this module field — crossplane.yaml +
    # authentik.tf are the canonical file pair, and the HCL file is the
    # single source of truth (never render this directory outside
    # kustomize). No varmap in git — ever: the ADOPTION varmap (recipe
    # §8, born-with-varmap) exists only as a gate-time patch on the
    # applied Workspace. The live role + user + token are
    # blueprint-created and ride in tofu state only after the gate
    # imports them; the first reconcile of the unsuspended tree plans No
    # changes.
    source: Inline
    module: ""
