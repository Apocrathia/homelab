---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: authentik-brand
  namespace: authentik

resources:
  - crossplane.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-brand-authentik-module
    namespace: authentik
    files:
      - authentik.tf

replacements:
  - source:
      kind: ConfigMap
      name: authentik-brand-authentik-module
      version: v1
    targets:
      - select:
          kind: Workspace
          name: authentik-brand-authentik
        fieldPaths:
          - spec.forProvider.module
