---
# Pushes the dashboard's long-lived service-account token into 1Password so
# the operator can paste it into the dashboard's internal RBAC login
# (securityMode: true, unchanged). The token rotates with the SA token
# controller; this PushSecret refreshes the 1Password item every 168h.
#
# 1Password item mirrors the kuber-ios precedent exactly (live 179d):
# title `homelab-chaos-mesh-token` (vault `Secrets`), field `token`.
# The Sep-2025 flow used a different title and field; this restore does
# NOT resume the old item — archive it if it still exists.
# external-secrets.io/v1alpha1 is the only apiVersion the PushSecret CRD
# serves today (live-verified), matching kuber-ios's PushSecret.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: chaos-mesh-dashboard-token-to-1password
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/part-of: services
spec:
  # 168h: ESO v2.12 PushSecret PUTs the item on every reconcile even when the
  # value is unchanged, bumping the item updatedAt in 1Password — the refresh
  # interval IS the bump frequency. Token rotation is rare; a stale vault
  # token fails closed at the dashboard login and re-syncs on the next tick.
  refreshInterval: 168h
  deletionPolicy: None
  secretStoreRefs:
    - name: 1password-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: chaos-mesh-dashboard-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: homelab-chaos-mesh-token
          property: token
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          vault: Secrets
          tags:
            - kubernetes
            - chaos-mesh
            - readonly
