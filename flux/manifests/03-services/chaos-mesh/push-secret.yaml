---
# Pushes the dashboard's long-lived service-account token into 1Password so
# the operator can paste it into the dashboard's internal RBAC login
# (securityMode: true, unchanged). The token rotates with the SA token
# controller; this PushSecret refreshes the 1Password item every 24h.
#
# 1Password item mirrors the kuber-ios precedent exactly:
# title `homelab-chaos-mesh-token` (vault `Secrets`), field `token`,
# category API Credential. The Sep-2025 flow used a different title and
# field; this restore does NOT resume the old item — archive it if it
# still exists.
#
# Item category is the one shape element this manifest CANNOT set: the ESO
# 1Password provider hardcodes `Category: onepassword.Server` when it
# CREATES an item (providers/v1/onepassword/onepassword.go, createItem —
# identical at chart 2.2.0 and 2.11.0) and its PushSecretMetadata exposes
# only `tags` + `vault`. Its UPDATE path, however, preserves an existing
# item's category: it fetches the item by title and rewrites only fields
# and tags. So the item is pre-created out-of-band as an API Credential
# once (README "1Password item category bootstrap"); every 24h refresh
# keeps that category, exactly like `homelab-kuber-ios-token` (live since
# 2026-03-27). If ESO ever creates the item fresh it lands SERVER, and the
# bootstrap must be redone.
# external-secrets.io/v1alpha1 is the only apiVersion the PushSecret CRD
# serves today (live-verified), matching kuber-ios's PushSecret.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: chaos-mesh-dashboard-token-to-1password
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/part-of: services
spec:
  refreshInterval: 24h
  deletionPolicy: None
  secretStoreRefs:
    - name: 1password-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: chaos-mesh-dashboard-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: homelab-chaos-mesh-token
          property: token
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          vault: Secrets
          tags:
            - kubernetes
            - chaos-mesh
            - readonly
