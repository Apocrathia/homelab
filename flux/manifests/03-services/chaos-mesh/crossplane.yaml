---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: authentik-terraform-token
  namespace: chaos-mesh
spec:
  # Scoped Authentik service-account token. Never a bare managed Secret —
  # the operator creates the 1Password item crossplane-terraform-secrets
  # (vault "Secrets", field authentik-terraform-token), and the OnePassword
  # Connect operator syncs it as the authentik-terraform-token Secret
  # consumed by the ProviderConfig in this file. Same item as headlamp's
  # copy; the namespace differs.
  itemPath: "vaults/Secrets/items/crossplane-terraform-secrets"
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: chaos-mesh-authentik
  namespace: chaos-mesh
spec:
  # Materializes the OnePasswordItem-backed Secret as a file in the tofu
  # workdir; the module's provider block reads it with file("authentik-token").
  # The token itself never appears in a manifest.
  credentials:
    - filename: authentik-token
      source: Secret
      secretRef:
        name: authentik-terraform-token
        namespace: chaos-mesh
        key: authentik-terraform-token
  # Per-app state args for the module's PARTIAL kubernetes backend: the
  # provider writes this as crossplane.remote.tfbackend and passes it via
  # -backend-config at tofu init. The state Secret is
  # tfstate-<workspace>-chaos-mesh in this namespace — deliberately
  # separate from the CI tofu stack (terraform/, GitLab HTTP backend).
  # Two stacks, two states.
  backendFile: |
    secret_suffix     = "chaos-mesh"
    namespace         = "chaos-mesh"
    in_cluster_config = true
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: chaos-mesh-authentik
  namespace: chaos-mesh
spec:
  # Prune guard — crossplane v2 removed deletionPolicy; without the Delete
  # action the provider releases the finalizer WITHOUT running tofu destroy,
  # so a GitOps prune of this object can NEVER destroy the live authentik
  # stack (v2-native Orphan). Deliberate decommission therefore requires
  # temporarily restoring ["*"] (or a manual tofu destroy) — the guard is
  # intentional.
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: chaos-mesh-authentik
  forProvider:
    source: Remote
    # The shared module is the root config (import blocks are root-only).
    # Pinned to the generic-app chart release tag — generic-app-0.0.84
    # already exists (the module landed on main with it), so the first
    # reconcile resolves the module immediately; a later chart tag means
    # bumping this pin by hand (no renovate manager matches a git:: ref).
    module: "git::https://gitlab.com/Apocrathia/homelab.git//terraform/modules/authentik-app?ref=generic-app-0.0.84"
    # Pull once per URL; a tag move changes the ref and re-pulls. The
    # admission default (Always) would re-clone the repo on every poll.
    remotePullPolicy: IfNotPresent
    # Module inputs — no chart composer here, so the varmap carries the
    # full input set (variable contract: terraform/modules/authentik-app/
    # variables.tf). SAME STATE, no recreate: the migration gate renames
    # this app's inline-era tofu state addresses to the module's addresses
    # via tofu state mv (workspace paused + guarded, Flux suspended), so
    # the first plan reads No changes — no wipe, no import ids, uuids
    # intact. Three live-vs-default overrides (verified in the authentik
    # DB 2026-09-25): internal_host points at the dashboard service, not
    # the app-name pattern the chart would compose; intercept_header_auth
    # TRUE (module default false — chart parity); access_token_validity
    # minutes=10 (the TF default written at blip time; the module proxy
    # default is hours=1). NOT shared: live has only the admins binding
    # (no users binding, no tailnet parentRef).
    varmap:
      app_name: "chaos-mesh-dashboard"
      display_name: "Chaos Mesh"
      external_host: "https://chaos.gateway.services.apocrathia.com"
      mode: "proxy"
      shared: false
      sso_launch_url: ""
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/03-services/chaos-mesh/icon.svg"
      category: "Platform"
      authorization_flow: "default-provider-authorization-implicit-consent"
      invalidation_flow: "default-invalidation-flow"
      authentication_flow: "default-authentication-flow"
      internal_host: "http://chaos-dashboard.chaos-mesh.svc.cluster.local:2333"
      intercept_header_auth: true
      skip_path_regex: []
      access_token_validity: "minutes=10"
      meta_description: "Chaos engineering platform for Kubernetes"
      meta_publisher: "Chaos Mesh"
