---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
resources:
  - namespace.yaml
  - helmrelease.yaml
  - crossplane.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Crossplane stitch: packages terraform.tf (the Workspace's HCL module) so
  # the replacements rule below can copy it into the Workspace at build
  # time. Data key is the literal filename (terraform.tf); the replacements
  # fieldPath bracket-escapes it: data.[terraform.tf]. The ConfigMap carries
  # no authentik_blueprint label (the blueprint generator is retired and no
  # blanket label block remains), so the Authentik blueprint sidecar ignores
  # it.
  - name: chaos-mesh-authentik-module
    namespace: chaos-mesh
    files:
      - terraform.tf

replacements:
  # Build-time stitch, house pattern from gitlab/runner: copy the generated
  # ConfigMap's terraform.tf data into the Workspace's module field.
  # terraform.tf stays the single source of truth for the HCL; the rendered
  # module must stay byte-identical to it.
  #
  # The intermediate ConfigMap cannot be dropped from the render: builtin
  # patches run before replacements, so a `patches:` $patch: delete removes
  # the source before this rule consumes it (verified on kustomize v5.8.1;
  # no deletions-transformer builtin exists). An external `transformers:`
  # entry would run after replacements, but kube-linter's embedded kustomize
  # cannot load builtin plugin configs (v0.8.3: "unknown plugin loader
  # behavior: PatchTransformer.builtin"), silently skipping this directory.
  # The ConfigMap is harmless in-cluster (no authentik_blueprint label) and
  # keeps a stable name (disableNameSuffixHash), so terraform.tf edits update
  # it in place.
  - source:
      kind: ConfigMap
      name: chaos-mesh-authentik-module
      fieldPath: data.[terraform.tf]
    targets:
      - select:
          kind: Workspace
          name: chaos-mesh-authentik
        fieldPaths:
          - spec.forProvider.module
