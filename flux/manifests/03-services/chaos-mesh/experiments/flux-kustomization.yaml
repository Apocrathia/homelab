---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-chaos-mesh-experiments
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/manifests/03-services/chaos-mesh/experiments
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    # chaos-mesh.org CRDs ship with the chaos-mesh Helm chart; the Schedule CRs
    # below must not be applied before it.
    - name: services-chaos-mesh
    # The target namespaces (with their chaos-mesh.org/inject=enabled opt-in)
    # are applied by these app Kustomizations; ordering keeps a Schedule from
    # landing in a namespace before the annotation exists.
    - name: apps-demo
    - name: apps-ai
    - name: apps-productivity
