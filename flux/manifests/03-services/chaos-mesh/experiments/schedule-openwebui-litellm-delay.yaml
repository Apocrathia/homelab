---
# Daily 100ms HTTP request delay on openwebui: egress requests to the litellm
# proxy (litellm.litellm.svc.cluster.local:4000) are held for an extra 100ms
# for 60s. Mimics a slow LLM backend. openwebui has no gatus endpoint (the
# open-webui chart is outside generic-app's auto-discovery), so validate this
# experiment via the chaos object's status / dashboard events, not gatus.
# HTTPChaos tproxy injection is bridge-based, so it works on this cluster's
# Cilium eBPF datapath, where NetworkChaos (legacy iptables in the pod netns)
# structurally cannot.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: openwebui-litellm-delay
  namespace: openwebui
spec:
  # Local time matches the repo cron convention (America/Denver).
  schedule: "CRON_TZ=America/Denver 15 4 * * *"
  type: HTTPChaos
  historyLimit: 1
  concurrencyPolicy: Forbid
  httpChaos:
    mode: all
    target: Request
    port: 4000
    delay: "100ms"
    duration: "60s"
    selector:
      namespaces:
        - openwebui
      labelSelectors:
        app: open-webui
