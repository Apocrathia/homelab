---
# Dashboard login identity for the internal RBAC token flow (securityMode:
# true, unchanged). The token Secret below is synced to 1Password by
# push-secret.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: chaos-mesh
  name: chaos-mesh-dashboard
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/part-of: services
---
# Read-only viewer scope: the dashboard can read pods/namespaces and all
# chaos-mesh.org resources. Creating experiments from the dashboard would
# require extending this ClusterRole with write verbs (not enabled; the
# intended scope is read-only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-mesh-dashboard-viewer
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "watch", "list"]
  # Enumerated from the cluster's installed chaos-mesh.org CRDs (chart 2.8.4,
  # `kubectl api-resources --api-group=chaos-mesh.org`) instead of a
  # resources: ["*"] wildcard — keeps Trivy KSV-0046 clean with no ignorefile
  # entry. UPDATE THIS LIST on chart upgrades: a new CRD the dashboard cannot
  # see is silent breakage.
  - apiGroups: ["chaos-mesh.org"]
    resources:
      [
        "awschaos",
        "azurechaos",
        "blockchaos",
        "dnschaos",
        "gcpchaos",
        "httpchaos",
        "iochaos",
        "jvmchaos",
        "kernelchaos",
        "networkchaos",
        "physicalmachinechaos",
        "physicalmachines",
        "podchaos",
        "podhttpchaos",
        "podiochaos",
        "podnetworkchaos",
        "remoteclusters",
        "schedules",
        "statuschecks",
        "stresschaos",
        "timechaos",
        "workflownodes",
        "workflows",
      ]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-mesh-dashboard-viewer
subjects:
  - kind: ServiceAccount
    name: chaos-mesh-dashboard
    namespace: chaos-mesh
roleRef:
  kind: ClusterRole
  name: chaos-mesh-dashboard-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Long-lived token for the dashboard's internal RBAC login. The SA token
# controller (kube-controller-manager) populates the `token` key from the
# type + annotation below; the token rotates with that controller and the
# PushSecret re-pushes the current value to 1Password on its 24h interval.
apiVersion: v1
kind: Secret
metadata:
  name: chaos-mesh-dashboard-token
  namespace: chaos-mesh
  annotations:
    kubernetes.io/service-account.name: chaos-mesh-dashboard
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/part-of: services
type: kubernetes.io/service-account-token
