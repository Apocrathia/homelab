---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: chaos-mesh-dashboard
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  # Outpost for Chaos Mesh Dashboard. The proxy provider, application, and
  # admins binding moved to the Crossplane provider-opentofu Workspace
  # (opentofu-workspace.yaml); the outpost <-> provider m2m is the
  # Workspace's authentik_outpost_provider_attachment resource, so no
  # !Find couples the two sides here. The outpost keeps infra ownership:
  # kubernetes service connection, replica count, and the HTTPRoute on
  # main-gateway (the route gains the chaos host only once the Workspace
  # attaches the provider).
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: "chaos-mesh-dashboard-outpost"
    attrs:
      name: "chaos-mesh-dashboard-outpost"
      type: "proxy"
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, "Local Kubernetes Cluster"]]
      config:
        authentik_host: "https://auth.gateway.services.apocrathia.com"
        authentik_host_insecure: true
        authentik_host_browser: ""
        log_level: "info"
        object_naming_template: "ak-outpost-%(name)s"
        kubernetes_replicas: 1
        kubernetes_namespace: "authentik"
        kubernetes_httproute_parent_refs:
          - name: main-gateway
            namespace: cilium-system
            sectionName: https
        kubernetes_json_patches:
          deployment:
            - op: add
              path: /spec/template/spec/automountServiceAccountToken
              value: false
