---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: gateway-envoy

resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - gatewayclass.yaml
  - admin-service.yaml
  - envoyproxy.yaml
  - envoyextensionpolicy.yaml
  - crossplane.yaml

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: envoy-authentik-module
      fieldPath: data.[authentik.tf]
    targets:
      - select:
          kind: Workspace
          name: envoy-admin-authentik
        fieldPaths:
          - spec.forProvider.module

configMapGenerator:
  - name: envoy-authentik-module
    namespace: envoy-gateway-system
    files:
      - authentik.tf
