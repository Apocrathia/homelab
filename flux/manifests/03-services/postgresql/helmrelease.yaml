---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-operator
  namespace: postgres-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      # renovate: datasource=helm registryUrl=https://cloudnative-pg.github.io/charts depName=cloudnative-pg
      version: "0.27.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  values:
    # Enable monitoring with PodMonitor
    monitoring:
      podMonitorEnabled: true

    # Security settings - override default security context
    podSecurityContext:
      runAsNonRoot: true

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Reduce concurrent reconciles to reduce API server load and prevent timeouts
    config:
      maxConcurrentReconciles: 5

    # Increase leader election timeouts to handle slow API server responses
    # Defaults are too short (15s lease, 10s renew) causing frequent leader loss
    controller:
      manager:
        args:
          - controller
          - --leader-elect
          - --leader-election-lease-duration=60s
          - --leader-election-renew-deadline=40s
          - --leader-election-retry-period=10s
          - --max-concurrent-reconciles=5
          - --config-map-name=cnpg-controller-manager-config
          - --webhook-port=9443
