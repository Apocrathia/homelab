---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: renovate-postgres
  namespace: renovate
spec:
  # PostgreSQL version
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18@sha256:2b124b4c9e9710a449b868fc72ae59bcb2907386d48ddb3e7a7f82491ac0d1e1

  # Number of instances
  instances: 1

  # Storage configuration
  storage:
    size: 10Gi
    storageClass: longhorn

  # Resource limits to prevent OOM kills
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Bootstrap configuration
  bootstrap:
    initdb:
      database: renovate
      owner: renovate
      secret:
        name: renovate-secrets

  # PostgreSQL-specific configuration
  postgresql:
    # PostgreSQL configuration parameters
    parameters:
      max_connections: "100"
      track_io_timing: "on"
      track_functions: "all"
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      maintenance_work_mem: "32MB"
