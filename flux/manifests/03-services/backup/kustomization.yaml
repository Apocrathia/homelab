---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: backup
resources:
  - secret.yaml
  - clusterrepository.yaml
  - networkpolicy.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-kopia
    namespace: kopiur-system
    files:
      - kopia.yaml=authentik-blueprint.yaml

labels:
  # metadata-labels only: includeSelectors would inject authentik_blueprint into
  # networkpolicy.yaml's podSelector and the policy would select zero live pods
  - includeSelectors: false
    pairs:
      authentik_blueprint: "true"
