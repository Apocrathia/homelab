---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: gitlab-commit-status
  namespace: flux-system
spec:
  type: gitlab
  address: https://gitlab.com/67295640
  secretRef:
    name: gitlab-token
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: gitlab-deployments
  namespace: flux-system
spec:
  providerRef:
    name: gitlab-commit-status
  eventSources:
    # Kustomization events only — one per app subtree, they already carry
    # deployment status. HelmRelease events were removed entirely: they posted
    # redundant per-object statuses (pure gitlab.com API noise) and a curated
    # namespace allow-list would rot. No HelmRelease sources to maintain.
    - kind: Kustomization
      name: "*"
