---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 5m
  chart:
    spec:
      chart: headlamp
      # renovate: datasource=helm depName=headlamp registryUrl=https://kubernetes-sigs.github.io/headlamp/
      version: "0.43.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      inCluster: true
      inClusterContextName: "home"
      enableHelm: true
      watchPlugins: true
      extraArgs:
        # Prometheus ships in the Headlamp image under static-plugins; load it
        # without putting it in pluginsManager's managed plugins-dir.
        - "-user-plugins-dir=/headlamp/user-plugins"
      oidc:
        secret:
          create: true
          name: headlamp-oidc
        clientID: "kubernetes"
        issuerURL: "https://auth.gateway.services.apocrathia.com/application/o/kubernetes/"
        scopes: "openid email profile groups"
        callbackURL: "https://headlamp.gateway.services.apocrathia.com/oidc-callback"
        usePKCE: true
    image:
      # renovate: datasource=docker depName=ghcr.io/headlamp-k8s/headlamp
      tag: v0.43.0
    pluginsManager:
      enabled: true
      # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/node
      baseImage: public.ecr.aws/docker/library/node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
      version: "0.1.1"
      configContent: |
        plugins:
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.6.0
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1
          - name: trivy
            source: https://artifacthub.io/packages/headlamp/headlamp-trivy/headlamp_trivy
            version: 0.3.2
          - name: ai-assistant
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_ai_assistant
            version: 0.2.0-alpha
          - name: helm
            source: https://artifacthub.io/packages/headlamp/helm-plugin/helm-plugin
            version: 0.1.0
        installOptions:
          parallel: true
          maxConcurrent: 3
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
    initContainers:
      - name: user-plugins-init
        # renovate: datasource=docker depName=ghcr.io/headlamp-k8s/headlamp
        image: ghcr.io/headlamp-k8s/headlamp:v0.43.0@sha256:5d03caa26df7a715079405df2949907160518750b9b62b6bf4de8d1a6142c541
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /headlamp/user-plugins
            if [ -d /headlamp/static-plugins/prometheus ]; then
              cp -r /headlamp/static-plugins/prometheus /headlamp/user-plugins/
            fi
        volumeMounts:
          - name: user-plugins
            mountPath: /headlamp/user-plugins
      - name: catalog-plugins-init
        # renovate: datasource=docker registryUrl=https://public.ecr.aws depName=docker/library/alpine
        image: public.ecr.aws/docker/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            apk add --no-cache curl tar
            curl -fsSL -o /tmp/app-catalog.tar.gz \
              https://github.com/headlamp-k8s/plugins/releases/download/app-catalog-0.9.0/app-catalog-0.9.0.tar.gz
            tar xzf /tmp/app-catalog.tar.gz -C /headlamp/user-plugins
            curl -fsSL -o /tmp/plugin-catalog.tar.gz \
              https://github.com/headlamp-k8s/plugins/releases/download/plugin-catalog-0.4.4/headlamp-k8s-plugin-catalog-0.4.4.tar.gz
            tar xzf /tmp/plugin-catalog.tar.gz -C /headlamp/user-plugins
        volumeMounts:
          - name: user-plugins
            mountPath: /headlamp/user-plugins
      - name: user-plugins-perms
        # renovate: datasource=docker depName=ghcr.io/headlamp-k8s/headlamp
        image: ghcr.io/headlamp-k8s/headlamp:v0.43.0@sha256:5d03caa26df7a715079405df2949907160518750b9b62b6bf4de8d1a6142c541
        command: ["/bin/sh", "-c"]
        args:
          - chown -R 100:101 /headlamp/user-plugins
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: user-plugins
            mountPath: /headlamp/user-plugins
    volumeMounts:
      - name: user-plugins
        mountPath: /headlamp/user-plugins
    volumes:
      - name: user-plugins
        emptyDir: {}
    # Gateway API routing
    httpRoute:
      enabled: true
      parentRefs:
        - name: main-gateway
          namespace: cilium-system
          sectionName: https
      hostnames:
        - headlamp.gateway.services.apocrathia.com
    # Headlamp's SA needs read access for API discovery
    clusterRoleBinding:
      create: true
      clusterRoleName: view
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
