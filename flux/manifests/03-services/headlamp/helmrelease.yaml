---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 5m
  chart:
    spec:
      chart: headlamp
      # renovate: datasource=helm depName=headlamp registryUrl=https://kubernetes-sigs.github.io/headlamp/
      version: "0.40.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      inCluster: true
      inClusterContextName: "home"
      enableHelm: true
      oidc:
        secret:
          create: true
          name: headlamp-oidc
        clientID: "kubernetes"
        issuerURL: "https://auth.gateway.services.apocrathia.com/application/o/kubernetes/"
        scopes: "openid email profile groups"
        callbackURL: "https://headlamp.gateway.services.apocrathia.com/oidc-callback"
        usePKCE: true
    # Gateway API routing
    httpRoute:
      enabled: true
      parentRefs:
        - name: main-gateway
          namespace: cilium-system
          sectionName: https
      hostnames:
        - headlamp.gateway.services.apocrathia.com
    # Headlamp's SA needs read access for API discovery
    clusterRoleBinding:
      create: true
      clusterRoleName: view
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
