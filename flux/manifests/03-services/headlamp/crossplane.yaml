---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: authentik-terraform-token
  namespace: headlamp
spec:
  # Scoped Authentik service-account token. Never a bare managed Secret —
  # the operator creates the 1Password item crossplane-terraform-secrets
  # (vault "Secrets", field authentik-terraform-token), and the OnePassword
  # Connect operator syncs it as the authentik-terraform-token Secret
  # consumed by the ProviderConfig in this file.
  itemPath: "vaults/Secrets/items/crossplane-terraform-secrets"
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: headlamp-authentik
  namespace: headlamp
spec:
  # Materializes the OnePasswordItem-backed Secret as a file in the tofu
  # workdir; the module's provider block reads it with file("authentik-token").
  # The token itself never appears in a manifest.
  credentials:
    - filename: authentik-token
      source: Secret
      secretRef:
        name: authentik-terraform-token
        namespace: headlamp
        key: authentik-terraform-token
  # Per-app state args for the module's PARTIAL kubernetes backend: the
  # provider writes this as crossplane.remote.tfbackend and passes it via
  # -backend-config at tofu init. The state Secret is
  # tfstate-<workspace>-headlamp in this namespace — deliberately separate
  # from the CI tofu stack (terraform/, GitLab HTTP backend). Two stacks,
  # two states.
  backendFile: |
    secret_suffix     = "headlamp"
    namespace         = "headlamp"
    in_cluster_config = true
---
apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: headlamp-authentik
  namespace: headlamp
spec:
  # Prune guard — crossplane v2 removed deletionPolicy; without the Delete
  # action the provider releases the finalizer WITHOUT running tofu destroy,
  # so a GitOps prune of this object can NEVER destroy the live authentik
  # stack (v2-native Orphan). Deliberate decommission therefore requires
  # temporarily restoring ["*"] (or a manual tofu destroy) — the guard is
  # intentional.
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: headlamp-authentik
  forProvider:
    # Inline module, stitched at kustomize build time: kustomization.yaml's
    # configMapGenerator packages authentik.tf and the replacements rule
    # copies its bytes into this module field — crossplane.yaml +
    # authentik.tf are the canonical file pair, and the HCL file is the
    # single source of truth (never render this directory outside
    # kustomize). No varmap: the app values live in the HCL now.
    # ADDRESS PARITY: authentik.tf mirrors terraform/modules/authentik-app
    # exactly, so the live tfstate Secret
    # (tfstate-headlamp-authentik-headlamp) keeps its module-era addresses
    # and the first plan after this layout swap reads No changes — no
    # state-mv gate, no recreate, no import ids. If the state Secret is
    # ever lost, re-adopt via manual tofu import (no import blocks live in
    # git).
    source: Inline
    module: ""
