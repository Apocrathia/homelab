---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: authentik-terraform-token
  namespace: headlamp
spec:
  # Scoped Authentik service-account token (field: token). Never a bare
  # managed Secret — the operator creates the 1Password item, the
  # OnePassword Connect operator syncs it as the authentik-terraform-token
  # Secret consumed by opentofu-providerconfig.yaml.
  itemPath: "vaults/Secrets/items/authentik-terraform-token"
