---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: headlamp
  namespace: headlamp

resources:
  - namespace.yaml
  - helmrelease.yaml
  - crossplane.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # One-shot state: absent companion: deletes the blueprint-era Authentik
  # objects so the provider-opentofu Workspace can take over. Keep forever.
  - name: authentik-blueprint-headlamp-cleanup
    namespace: headlamp
    files:
      - headlamp-cleanup.yaml=authentik-blueprint-cleanup.yaml
    options:
      labels:
        authentik_blueprint: "true"
  # Crossplane stitch: packages terraform.tf (the Workspace's HCL module) so
  # the replacements rule below can copy it into the Workspace at build
  # time. Data key is the literal filename (terraform.tf); the replacements
  # fieldPath bracket-escapes it: data.[terraform.tf]. Intentionally NOT
  # labeled authentik_blueprint: authentik ignores it as a blueprint source.
  - name: headlamp-authentik-module
    namespace: headlamp
    files:
      - terraform.tf

replacements:
  # Build-time stitch, house pattern from gitlab/runner: copy the generated
  # ConfigMap's terraform.tf data into the Workspace's module field.
  # terraform.tf stays the single source of truth for the HCL; the rendered
  # module must stay byte-identical to it (the Workspace is live and synced).
  #
  # The intermediate ConfigMap cannot be dropped from the render: kustomize
  # applies patches and transformers before replacements, so a $patch: delete
  # would remove the source before this rule consumes it (verified on
  # kustomize v5.8.1; no deletions-transformer builtin exists). The ConfigMap
  # is harmless in-cluster (no authentik_blueprint label) and keeps a stable
  # name (disableNameSuffixHash), so terraform.tf edits update it in place.
  - source:
      kind: ConfigMap
      name: headlamp-authentik-module
      fieldPath: data.[terraform.tf]
    targets:
      - select:
          kind: Workspace
          name: headlamp-authentik
        fieldPaths:
          - spec.forProvider.module
