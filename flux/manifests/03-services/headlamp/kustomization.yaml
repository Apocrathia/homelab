---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: headlamp
  namespace: headlamp

resources:
  - namespace.yaml
  - helmrelease.yaml
  - secret.yaml
  - opentofu-providerconfig.yaml
  - opentofu-workspace.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # One-shot state: absent companion: deletes the blueprint-era Authentik
  # objects so the provider-opentofu Workspace can take over. Keep forever.
  - name: authentik-blueprint-headlamp-cleanup
    namespace: headlamp
    files:
      - headlamp-cleanup.yaml=authentik-blueprint-cleanup.yaml
    options:
      labels:
        authentik_blueprint: "true"
