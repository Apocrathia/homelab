# This manifest was generated by flux. DO NOT EDIT.
# Cutover safety: prune off + Orphan so commenting out gotk-components
# (or losing this KS) does not cascade-delete controllers / inventory.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@gitlab.com/apocrathia/homelab
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/manifests/01-bootstrap
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: flux-system
