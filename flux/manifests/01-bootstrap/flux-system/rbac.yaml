---
# Maps Authentik group flux-admins to Flux Status UI admin role.
# Group name matches the OIDC groups claim (no oidc: prefix — that is for
# API-server kube-auth only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admins
  labels:
    app.kubernetes.io/name: flux-operator
    app.kubernetes.io/component: web-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-admin
subjects:
  - kind: Group
    name: flux-admins
    apiGroup: rbac.authorization.k8s.io
