---
# Syncs vault item → Secret flux-operator-secrets.
# Field labels become Secret keys 1:1. Expected labels:
#   oidc-client-id / oidc-client-secret — Flux Status UI OIDC (HelmRelease valuesFrom)
#   identity / known_hosts — GitLab SSH deploy key for FluxInstance.spec.sync
#     (Flux requires the underscore form known_hosts — not known-hosts)
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: flux-operator-secrets
  namespace: flux-system
spec:
  itemPath: "vaults/Secrets/items/flux-operator-secrets"
