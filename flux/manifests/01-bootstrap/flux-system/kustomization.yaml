---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # --- Operator cutover toggles (comment/uncomment; do not dual-own controllers) ---
  # 1. Soften root KS prune/Orphan in gotk-sync.yaml (live object) first.
  # 2. Comment gotk-components.yaml — controllers stay in-cluster until adopted.
  # 3. Uncomment flux-instance.yaml — operator adopts via SSA.
  # 4. Comment gotk-sync.yaml — sync owned by FluxInstance.
  # - gotk-components.yaml
  - gotk-sync.yaml
  # - flux-instance.yaml
  - namespace.yaml
  - manifests.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - secret.yaml
  - rbac.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-flux-operator
    namespace: flux-system
    files:
      - flux-operator.yaml=authentik-blueprint.yaml
    options:
      labels:
        authentik_blueprint: "true"
