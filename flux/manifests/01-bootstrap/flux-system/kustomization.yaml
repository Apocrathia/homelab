---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # --- Flux Operator owns controllers and Git sync ---
  # FluxInstance is active; gotk components and sync are held out to avoid dual ownership.
  # - gotk-components.yaml
  # - gotk-sync.yaml
  - flux-instance.yaml
  - namespace.yaml
  - manifests.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - secret.yaml
  - rbac.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-flux-operator
    namespace: flux-system
    files:
      - flux-operator.yaml=authentik-blueprint.yaml
    options:
      labels:
        authentik_blueprint: "true"
