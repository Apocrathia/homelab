---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - manifests.yaml

helmCharts:
  - name: flux-operator
    repo: oci://ghcr.io/controlplaneio-fluxcd/charts
    # renovate: datasource=github-releases depName=controlplaneio-fluxcd/flux-operator
    version: 0.57.0
    releaseName: flux-operator
    namespace: flux-system
    includeCRDs: true
    valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-flux-operator
    namespace: flux-system
    files:
      - flux-operator.yaml=authentik-blueprint.yaml

labels:
  - includeSelectors: false
    pairs:
      authentik_blueprint: "true"
