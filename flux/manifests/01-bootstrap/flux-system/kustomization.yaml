---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - manifests.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - secret.yaml
  - rbac.yaml

# Labels merge onto the Namespace already defined in gotk-components.yaml
# (listing a second Namespace resource would fail kustomize accumulate).
patches:
  - path: namespace.yaml
    target:
      kind: Namespace
      name: flux-system

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: authentik-blueprint-flux-operator
    namespace: flux-system
    files:
      - flux-operator.yaml=authentik-blueprint.yaml
    options:
      labels:
        authentik_blueprint: "true"
