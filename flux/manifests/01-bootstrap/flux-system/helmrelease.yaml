---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: flux-operator
      # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
      version: 0.57.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  maxHistory: 2
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: flux-operator-secrets
      valuesKey: oidc-client-id
      targetPath: web.config.authentication.oauth2.clientID
    - kind: Secret
      name: flux-operator-secrets
      valuesKey: oidc-client-secret
      targetPath: web.config.authentication.oauth2.clientSecret
  values:
    nameOverride: ""
    fullnameOverride: ""

    # Enable multitenancy lockdown for the ResourceSet APIs.
    # https://fluxoperator.dev/docs/crd/resourceset/#role-based-access-control
    multitenancy:
      enabled: false
      enabledForWorkloadIdentity: false
      defaultServiceAccount: "flux-operator"
      defaultWorkloadIdentityServiceAccount: "flux-operator"

    # Flux reporting settings.
    # https://fluxoperator.dev/docs/crd/fluxreport/
    reporting:
      interval: 5m

    web:
      # Enable the Flux Status web server on port 9080.
      # https://fluxoperator.dev/web-ui/
      enabled: true
      # Web Config API — OIDC SSO + K8s impersonation.
      # https://fluxoperator.dev/docs/web-ui/web-config-api/
      # clientID / clientSecret injected via valuesFrom from flux-operator-secrets.
      config:
        baseURL: "https://flux.gateway.services.apocrathia.com"
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            issuerURL: "https://auth.gateway.services.apocrathia.com/application/o/flux-operator-oidc/"
            # groups claim is included by Authentik's profile scope mapping
            scopes:
              - openid
              - email
              - profile
            validations:
              - expression: "'flux-admins' in claims.groups"
                message: "user must be a member of flux-admins"
            impersonation:
              username: "claims.email"
              groups: "claims.groups"
      configSecretName: ""
      userActions:
        # Impersonated (default) or FineGrained.
        access: Impersonated
      networkPolicy:
        create: true
      # Standard roles for user access management.
      # https://fluxoperator.dev/docs/web-ui/user-management/
      rbac:
        createRoles: true
        createAggregation: false
      # Standalone web deployment (requires a dedicated Helm release).
      serverOnly: false
      serverReplicas: 1
      ingress:
        enabled: false
        className: ""
        annotations: {}
        hosts: []
        tls: []
      # HTTPRoute owned by Authentik outpost instead; keep chart route off.
      httpRoute:
        enabled: false
        annotations: {}
        parentRefs: []
        hostnames: []

    installCRDs: true

    commonAnnotations: {}
    commonLabels: {}

    image:
      repository: ghcr.io/controlplaneio-fluxcd/flux-operator
      # renovate: datasource=docker imageName=ghcr.io/controlplaneio-fluxcd/flux-operator
      tag: "v0.57.0@sha256:7baa2697d3c4d81007c02302c55a8601f02ad2052df5952b95f8a6708c7be131"
      pullSecrets: []
      imagePullPolicy: IfNotPresent

    priorityClassName: "system-cluster-critical"

    # Kubernetes API priority and fairness.
    # https://kubernetes.io/docs/concepts/cluster-administration/flow-control/
    apiPriority:
      enabled: false
      level: workload-high
      extraServiceAccounts: []

    resources:
      limits:
        cpu: 2000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi

    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15
      periodSeconds: 20

    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10

    serviceAccount:
      create: true
      automount: true
      name: ""

    rbac:
      # cluster-admin on the operator SA (required for Flux Instance deployment).
      create: true
      # Grant view/edit/admin aggregation access to ResourceSet APIs.
      createAggregation: true

    podSecurityContext: {}

    # Compliant with the pod security restricted profile.
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: "RuntimeDefault"

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/os
                  operator: In
                  values:
                    - linux

    tolerations: []
    nodeSelector: {}
    strategy: {}
    hostNetwork: false
    extraVolumes: []
    extraEnvs: []
    extraArgs: []
    extraVolumeMounts: []
    logLevel: "info"

    serviceMonitor:
      create: false
      interval: 60s
      scrapeTimeout: 30s
      labels: {}

    service:
      ipFamilyPolicy: ""

    marketplace:
      type: ""
      license: ""
      account: ""
