---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: flux-operator
  labels:
    blueprints.goauthentik.io/instantiate: "true"
context: {}
entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: "flux-admins"
    attrs:
      name: "flux-admins"

  # Outer gate — Authentik proxy (Longhorn / Grafana pattern)
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: "flux-operator-proxy-provider"
    attrs:
      name: "flux-operator-proxy-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      authentication_flow: !Find [authentik_flows.flow, [slug, "default-authentication-flow"]]
      mode: "proxy"
      intercept_header_auth: false
      internal_host: "http://flux-operator.flux-system.svc.cluster.local:9080"
      external_host: "https://flux.gateway.services.apocrathia.com"

  - model: authentik_core.application
    state: present
    identifiers:
      slug: "flux-operator"
    attrs:
      name: "Flux"
      slug: "flux-operator"
      group: "Platform"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "flux-operator-proxy-provider"]]
      launch_url: "https://flux.gateway.services.apocrathia.com"
      open_in_new_tab: true
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/01-bootstrap/flux-system/icon.svg"
      meta_description: "Flux Operator Status web UI"
      meta_publisher: "ControlPlane"

  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: "flux-operator-outpost"
    attrs:
      name: "flux-operator-outpost"
      type: "proxy"
      service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, "Local Kubernetes Cluster"]]
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, "flux-operator-proxy-provider"]]
      config:
        authentik_host: "https://auth.gateway.services.apocrathia.com"
        authentik_host_insecure: true
        authentik_host_browser: ""
        log_level: "info"
        object_naming_template: "ak-outpost-%(name)s"
        kubernetes_replicas: 1
        kubernetes_namespace: "authentik"
        kubernetes_httproute_parent_refs:
          - name: main-gateway
            namespace: cilium-system
            sectionName: https
        kubernetes_json_patches:
          deployment:
            - op: add
              path: /spec/template/spec/automountServiceAccountToken
              value: false

  # Inner gate — native OIDC client (Immich provider shape + kube-auth library hide)
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "flux-operator-oidc-provider"
    attrs:
      name: "flux-operator-oidc-provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-invalidation-flow"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
      sub_mode: "user_email"
      include_claims_in_id_token: true
      issuer_mode: "per_provider"
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://flux.gateway.services.apocrathia.com/oauth2/callback"
          matching_mode: "strict"
      access_code_validity: "minutes=1"
      access_token_validity: "minutes=5"
      refresh_token_validity: "days=30"
      token_validity: "days=30"
      client_type: "confidential"

  - model: authentik_core.application
    state: present
    identifiers:
      slug: "flux-operator-oidc"
    attrs:
      name: "Flux Operator OIDC"
      slug: "flux-operator-oidc"
      group: "Platform"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "flux-operator-oidc-provider"]]
      # Hidden from library — proxy app is the launch tile (same as kube-auth / Headlamp split)
      meta_launch_url: "blank://blank"
      icon: "https://gitlab.com/Apocrathia/homelab/-/raw/main/flux/manifests/01-bootstrap/flux-system/icon.svg"
      meta_description: "OIDC client for Flux Status SSO"
      meta_publisher: "ControlPlane"
