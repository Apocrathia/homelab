---
# Vault item → Secret gitlab-registry-deploy-token (flux-system).
# Auth for the private OCI HelmRepository "homelab"
# (registry.gitlab.com/apocrathia/homelab). Field labels are the Secret
# keys: username (gitlab+deploy-token-N) and password (deploy token,
# read_registry scope). The operator creates the deploy token and the
# gitlab-registry-deploy-token 1Password item (vault "Secrets").
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: gitlab-registry-deploy-token
  namespace: flux-system
spec:
  itemPath: "vaults/Secrets/items/gitlab-registry-deploy-token"
