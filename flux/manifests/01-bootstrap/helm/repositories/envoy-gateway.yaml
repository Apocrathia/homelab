---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  # renovate: datasource=docker depName=envoyproxy/gateway-helm
  url: oci://docker.io/envoyproxy/gateway-helm
  secretRef:
    name: docker-io-imagepullsecret
