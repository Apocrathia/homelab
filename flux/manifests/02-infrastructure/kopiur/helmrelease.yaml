---
# yaml-language-server: $schema=https://json.schemastore.org/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kopiur-system
  chart:
    spec:
      chart: kopiur
      # renovate: datasource=docker depName=ghcr.io/home-operations/charts/kopiur
      version: "0.10.8"
      sourceRef:
        kind: HelmRepository
        name: home-operations
        namespace: flux-system
  maxHistory: 2
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # kopiur CRDs live in the chart crds/ dir (install-only under plain Helm);
    # CreateReplace keeps the alpha v1alpha1 surface current across upgrades
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Each flag grants the operator cluster-wide secrets create/patch/delete
    # RBAC (Kubernetes cannot scope `create` to a Secret name):
    # - credentialProjection: shared ClusterRepository projects its credential
    #   Secret into mover namespaces (consumers opt in per policy)
    # - kopiaUi: mints the web-UI login Secret for spec.server repositories
    features:
      credentialProjection:
        enabled: true
      kopiaUi:
        enabled: true
