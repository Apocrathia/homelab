---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      # renovate: datasource=helm registryUrl=https://charts.longhorn.io depName=longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  maxHistory: 2
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: 2000m
                    memory: 2Gi
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultBackupStore:
      # NAS rustfs (S3-compatible) — same box that served CIFS, S3 protocol.
      # Longhorn URL syntax: s3://<bucket>@<region>/ (trailing slash
      # required); the real endpoint rides in AWS_ENDPOINTS on the credential
      # secret. See README.md ("CIFS -> S3 migration") for the tradeoff:
      # CIFS-era backups become invisible in longhorn and stay on the NAS.
      backupTarget: s3://longhorn@us-east-1/
      backupTargetCredentialSecret: longhorn-backup-target-secret
      # BackupVolume sync cadence (seconds). v1.13.0 syncs every BackupVolume
      # against the target per pass (backup head + listing per volume). Under
      # CIFS each probe did a full SMB mount/ls/umount subprocess chain and a
      # pass over the whole CR set could not drain inside 300s, so the gate
      # re-opened immediately and the sync loop livelocked — the dominant
      # continuous longhorn-manager process churn (62-88% of node export bytes
      # during the 2026-10 flood). 1800s gives each pass room to finish even
      # if the CR set grows back; cron-driven backups are unaffected.
      # See README.md ("Backup store sync livelock").
      pollInterval: 1800
    defaultSettings:
      # Backup and restore settings
      restoreVolumeRecurringJobs: true
      backupCompressionMethod: gzip
      deletingConfirmationFlag: true

      # Reliability and stability settings
      autoSalvage: true # Automatically fix corrupted volumes
      autoDeletePodWhenVolumeDetachedUnexpectedly: true # Auto-delete pods when volumes detach unexpectedly
      # Rebuild replicas while volume is detached (needed when volumes are faulted / engines stopped)
      offlineReplicaRebuilding: true

      # Cluster default 2 replicas for HA; requires healthy schedulable disks on multiple nodes.
      defaultReplicaCount: "2"
      replicaSoftAntiAffinity: true # Allow scheduling on nodes with healthy replicas
      replicaAutoBalance: "best-effort"

      # Timeout and cleanup settings
      staleReplicaTimeout: 300 # 5 minutes
      failedBackupTTL: "1440" # 24 hours
      backupExecutionTimeout: "30" # 30 minutes (increased to allow large volume backups to complete)
      backupConcurrentLimit: "10" # Increased to match recurring job concurrency (75 volumes need higher throughput)

      # Storage settings — explicit Longhorn chart defaults (questions.yaml / values.yaml comments)
      # 2026-10-17: booked (storageScheduled) capacity saturated the replica-scheduling
      # precheck on all four nodes (~2.6 TiB booked vs ~530 GiB actual data) and blocked
      # all new replica scheduling, including rebuilds. 200% halves booked-weight (thin
      # provisioning); the real-space guard is storageMinimalAvailablePercentage below,
      # and kubelet image-GC (50/40) caps the containerd side.
      storageOverProvisioningPercentage: "200"
      storageMinimalAvailablePercentage: "25"
      storageReservedPercentageForDefaultDisk: "25"
      defaultDataLocality: "best-effort"

      # Engine and replica settings
      concurrentAutomaticEngineUpgradePerNodeLimit: "0"
      engineReplicaTimeout: "30" # 30 seconds timeout
      concurrentReplicaRebuildPerNodeLimit: "3" # Limit concurrent rebuilds
      concurrentVolumeBackupRestorePerNodeLimit: "1" # Limit concurrent restores
      rebuildConcurrentSyncLimit: "2" # Limit concurrent syncs

      # Data integrity and recovery
      snapshotDataIntegrity: "fast-check" # Enable fast integrity checking
      fastReplicaRebuildEnabled: "true" # Enable fast rebuild using checksums

      # Cleanup settings
      autoCleanupSystemGeneratedSnapshot: true
      autoCleanupRecurringJobBackupSnapshot: true # Auto-delete backup snapshots after backup completes
      removeSnapshotsDuringFilesystemTrim: true
      snapshotMaxCount: "5" # Limit snapshots per volume (default 250 is too high, prevents accumulation)

      # Node and disk settings
      disableSchedulingOnCordonedNode: true # Don't schedule on cordoned nodes
      replicaZoneSoftAntiAffinity: true # Prefer same zone for replicas
      replicaDiskSoftAntiAffinity: true # Allow same disk for replicas
      # Instance-manager CPU request = % of node allocatable. Default 12% = ~1.9c
      # per node against 0.07-0.26c observed usage; 4% (~0.64c) frees ~1.3c/node
      # of CPU request headroom for scheduling.
      guaranteedInstanceManagerCPU: 4

      # Volume creation settings
      allowVolumeCreationWithDegradedAvailability: true # Allow creation without all replicas
      allowRecurringJobWhileVolumeDetached: true # Allow jobs on detached volumes

      # Orphaned resource cleanup
      # Valid values: replica-data, instance, or replica-data;instance (semicolon-separated)
      orphanResourceAutoDeletion: "replica-data;instance" # Auto-delete orphaned replicas and instances
      orphanResourceAutoDeletionGracePeriod: "600" # 10 minutes

    # Persistence settings for better reliability
    persistence:
      defaultClass: true
      defaultFsType: ext4
      defaultClassReplicaCount: 2 # Match defaultReplicaCount (CSI default StorageClass)
      defaultDataLocality: "best-effort"
      reclaimPolicy: Delete
      volumeBindingMode: "Immediate"
      migratable: false
      disableRevisionCounter: "true"
      unmapMarkSnapChainRemoved: ignored
      dataEngine: v1
      # Configure recurring job selector to automatically label all new volumes with the default group
      # This ensures new volumes receive all recurring jobs (backup, snapshot-delete, etc.) from the default group
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"default","isGroup":true}]'

    longhornUI:
      replicas: 1

    ingress:
      enabled: false

    # CSI settings for better reliability
    csi:
      attacherReplicaCount: 2 # Reduce from default 3
      provisionerReplicaCount: 2 # Reduce from default 3
      resizerReplicaCount: 2 # Reduce from default 3
      snapshotterReplicaCount: 2 # Reduce from default 3

    #  For Kubernetes < v1.25, if your cluster enables Pod Security Policy admission controller,
    #  set this to `true` to ship longhorn-psp which allow privileged Longhorn pods to start
    enablePSP: false

    ## Specify override namespace, specifically this is useful for using longhorn as sub-chart
    ## and its release namespace is not the `longhorn-system`
    namespaceOverride: ""

    # Annotations to add to the Longhorn Manager DaemonSet Pods. Optional.
    annotations: {}

    serviceAccount:
      # Annotations to add to the service account
      annotations: {}

    metrics:
      serviceMonitor:
        enabled: true
        interval: "30s"
        scrapeTimeout: "10s"
        additionalLabels:
          app: longhorn
          component: storage
        annotations:
          prometheus.io/scrape: "true"
