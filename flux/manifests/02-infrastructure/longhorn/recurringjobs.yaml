---
# Longhorn recurring jobs — tiered backup groups.
#
# Tier policy + volume classification: see README.md ("Backup tier policy").
# Group mechanics (longhorn v1.13.0): a volume labeled
# recurring-job-group.longhorn.io/<group>=enabled gets exactly that group's
# jobs. A volume with NO recurring-job label is auto-labeled into the default
# group (datastore.FixupRecurringJob), so new/unclassified volumes always
# land in daily-backup. Classify volumes with
# scripts/longhorn/apply-backup-tier-labels.sh.
#
# All times are UTC (cluster timezone). MST = UTC-7.
---
# Daily backup — catch-all for unclassified volumes (tier: default).
# Everything in a named tier is out of this group; only new, not-yet-
# classified volumes ride here until they are tiered.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 7 * * *" # 0000 MST = 0700 UTC
  task: "backup"
  groups:
    - default
  retain: 3
  concurrency: 10
---
# Daily backup — critical tier (databases, identity, SIEM/tenzir state,
# agent harness state, loss-intolerant PKI). 34 volumes.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup-critical
  namespace: longhorn-system
spec:
  cron: "0 7 * * *" # 0000 MST = 0700 UTC (same window; backup-concurrent-limit 10 caps the cluster)
  task: "backup"
  groups:
    - critical
  retain: 3
  concurrency: 10
---
# Weekly backup — stateful tier (app data, configs, media metadata,
# uploads, libraries). 67 volumes.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup-stateful
  namespace: longhorn-system
spec:
  cron: "0 7 * * 1" # 0000 MST Monday = 0700 UTC Monday
  task: "backup"
  groups:
    - stateful
  retain: 4 # ~1 month of weekly restore points
  concurrency: 10
---
# Weekly filesystem trim — all tiers (trim reclaims space on caches too)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-trim
  namespace: longhorn-system
spec:
  cron: "0 8 * * 0" # 0100 MST Sunday = 0800 UTC Sunday
  task: "filesystem-trim"
  groups:
    - default
    - critical
    - stateful
    - cache
  retain: 3
  concurrency: 2
---
# Daily snapshot cleanup to remove system-generated snapshots
# This prevents accumulation of snapshots that weren't cleaned up automatically
# Runs at 2300 MST (before backups at 0000)
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "0 6 * * *" # 2300 MST = 0600 UTC
  task: "snapshot-cleanup"
  groups:
    - default
    - critical
    - stateful
    - cache
  concurrency: 2
---
# Snapshot deletion - removes ALL local snapshots
# Since backups are stored on the NAS, we don't need local snapshots
# Runs after backup completes to clean up the pre-backup snapshots
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-delete
  namespace: longhorn-system
spec:
  cron: "0 9 * * *" # 0200 MST = 0900 UTC (after backup completes ~0730)
  task: "snapshot-delete"
  groups:
    - default
    - critical
    - stateful
    - cache
  retain: 0 # Keep ZERO local snapshots - backups are on NAS
  concurrency: 5
