---
# Flux GitOps controllers (01-bootstrap)
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: flux
spec:
  priorityLevelConfiguration:
    name: bootstrap
  matchingPrecedence: 350
  distinguisherMethod:
    type: ByUser
  rules:
    - subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: helm-controller
            namespace: flux-system
        - kind: ServiceAccount
          serviceAccount:
            name: kustomize-controller
            namespace: flux-system
        - kind: ServiceAccount
          serviceAccount:
            name: source-controller
            namespace: flux-system
        - kind: ServiceAccount
          serviceAccount:
            name: notification-controller
            namespace: flux-system
      resourceRules:
        - verbs: ["*"]
          apiGroups: ["*"]
          resources: ["*"]
          clusterScope: true
          namespaces: ["*"]
