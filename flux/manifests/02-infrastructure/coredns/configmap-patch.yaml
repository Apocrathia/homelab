---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    apocrathia.com:53 {
        errors
        log . {
            class error
        }
        forward . 10.100.1.1
        cache 30
    }
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 45.90.28.214 45.90.30.214 {
            max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
